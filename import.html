<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能题库与刷题系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root { --primary: #d03f3f; --success: #67c23a; --fail: #f56c6c; --text: #303133; --gray: #999; --bg: #f2f3f5; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.container{max-width:800px;margin:0 auto;padding:20px 16px 40px}
.page-header{text-align:center;margin-bottom:24px;padding-top:10px}
.page-header h2{font-size:22px;color:var(--primary);font-weight:700}
.page-header p{font-size:12px;color:var(--gray);margin-top:6px}
.rules-card{background:#fff;border:1px solid #ffecec;border-radius:12px;padding:18px;margin-bottom:20px}
.rules-card h4{color:var(--primary);font-size:14px;margin-bottom:10px}
.rules-card ul{list-style:none;padding-left:16px}
.rules-card li{padding:3px 0;color:#606266;line-height:1.6;font-size:13px}
.input-name{width:100%;padding:12px 16px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;outline:none;background:#fff;margin-bottom:20px}
.input-name:focus{border-color:var(--primary)}
.import-tabs{display:flex;gap:14px;margin-bottom:20px}
.import-tabs button{flex:1;padding:12px 0;border:1.5px solid var(--primary);border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;transition:all .25s;background:#fff;color:var(--primary)}
.import-tabs button.active{background:var(--primary);color:#fff}
.file-zone{border:2px dashed #fcdada;border-radius:12px;background:#fff;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.file-zone:hover{background:#fffafb;border-color:var(--primary)}
.file-zone .icon{font-size:36px;margin-bottom:12px;opacity:.6}
.file-zone .text{font-size:13px;color:var(--gray)}
.file-zone .file-name{color:var(--primary);font-weight:600;margin-top:10px}
.file-input-wrap{position:relative;width:100%;height:100%;margin-top:16px}
.file-input-wrap input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.paste-area{width:100%;height:220px;padding:14px;border:1px solid #dcdfe6;border-radius:8px;font-size:13px;resize:vertical;outline:none;background:#fff;font-family:monospace}
.paste-area:focus{border-color:var(--primary)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:16px}
.btn{flex:1;padding:14px 0;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.btn.parse{background:#fff;border:1.5px solid #dcdfe6;color:#606266}
.btn.confirm{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(208,63,63,.2)}
.result-box{margin-top:28px;display:none}
.stat-line{display:flex;gap:20px;font-size:15px;font-weight:600;margin-top:12px}
.stat-line .ok{color:var(--success)}.stat-line .fail{color:var(--fail)}
.fail-list{background:#fff;border:1px solid #fef0f0;border-radius:8px;padding:16px;max-height:200px;overflow-y:auto;font-size:12px;color:var(--fail);line-height:1.8;margin-top:12px}
.success-demo{margin-top:16px}
.demo-card{background:#fff;border:1px solid #ebeef5;border-radius:8px;padding:16px;margin-top:14px}
.demo-card .tag{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:10px}
.demo-card .tag.s{background:#ecf5ff;color:#409eff}.demo-card .tag.m{background:#fdf6ec;color:#e6a23c}
.demo-card .tag.j{background:#f0f9eb;color:var(--success)}.demo-card .tag.f{background:#f4f4f5;color:#909399}
.demo-card .tag.w{background:#ecf5ff;color:#409eff}
.demo-card .stem{font-weight:600;font-size:15px;margin-bottom:12px;line-height:1.6}
.demo-card .opts{list-style:none}
.demo-card .opts li{padding:6px 0;font-size:14px;color:#606266;border-bottom:1px dashed #f2f6fc}
.demo-card .opts li:last-child{border-bottom:none}
.demo-card .opts li.correct{color:var(--success);font-weight:600}
#quizPage{display:none;padding-bottom:80px}
.quiz-header{background:#fff;padding:16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.quiz-header h2{font-size:18px;color:var(--primary)}
.quiz-header button{padding:6px 14px;border:1px solid #dcdfe6;border-radius:6px;background:#fff;font-size:12px;cursor:pointer}
.q-card{background:#fff;margin:12px;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.q-card .q-stem{font-size:15px;line-height:1.6;margin-bottom:16px;font-weight:500}
.q-card .q-opts{list-style:none}
.q-card .q-opts li{padding:10px 12px;border:1px solid #ebeef5;border-radius:8px;margin-bottom:10px;font-size:14px;cursor:pointer;transition:all .15s}
.q-card .q-opts li.active{border-color:var(--primary);background:#fff5f5;color:var(--primary)}
.q-card .q-opts li.right{background:#f0f9eb;border-color:#c2e7b0;color:var(--success)}
.q-card .q-opts li.wrong{background:#fef0f0;border-color:#fbc4c4;color:var(--fail)}
.q-card .blank-inputs{display:flex;flex-direction:column;gap:10px}
.q-card .blank-inputs input{padding:10px 12px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;outline:none}
.q-card .blank-inputs input:focus{border-color:var(--primary)}
.q-card .blank-inputs input.right{background:#f0f9eb;border-color:#c2e7b0;color:var(--success)}
.q-card .blank-inputs input.wrong{background:#fef0f0;border-color:#fbc4c4;color:var(--fail)}
.q-card .essay-area{width:100%;min-height:120px;padding:12px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;resize:vertical;outline:none;font-family:inherit}
.q-card .essay-area:focus{border-color:var(--primary)}
.q-card .essay-area:disabled{background:#f5f7fa;color:#606266}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.bottom-bar .score{font-weight:700;font-size:15px}
.bottom-bar .score span{color:var(--primary)}
.bottom-bar button{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.bottom-bar .btn-mistake{background:#fff;border:1px solid var(--primary);color:var(--primary);margin-right:10px}
.bottom-bar .btn-submit{background:var(--primary);color:#fff}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #ebeef5;padding:12px 24px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:2000;font-size:13px;display:none;white-space:nowrap;max-width:80%;text-align:center}
</style>
</head>
<body>

<!-- 🎯 导入页面 -->
<div id="importPage" class="container">
  <div class="page-header">
    <h2>📥 智能题库导入</h2>
    <p>支持 Excel / 文本粘贴，自动识别单选/多选/判断/填空/简答/论述</p>
  </div>
  <div class="rules-card">
    <h4>💡 支持的格式说明</h4>
    <ul>
      <li>📁 上传 Excel 文件（.xlsx / .xls / .csv）或 粘贴文本</li>
      <li>🔠 支持所有题型：单选、多选、判断、填空、简答、论述</li>
      <li>✅ 答案格式兼容：A,B,C / A+B / 正确 / × / N / Y / 填空文本等</li>
    </ul>
  </div>
  <input class="input-name" id="libName" placeholder="请输入题库名称（如：高铁线路专业题库）">
  <div class="import-tabs">
    <button class="active" id="btnModeFile" onclick="switchMode('file')">📁 选择文件</button>
    <button id="btnModeText" onclick="switchMode('text')">📋 粘贴文本</button>
  </div>
  <label class="file-zone" id="paneFile" for="fileInput">
    <div class="icon">📄</div>
    <div class="text">点击此处选择 Excel 文件</div>
    <div class="file-input-wrap">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="onFileChange(this.files[0])">
    </div>
    <div id="fileNameDisplay" class="file-name"></div>
  </label>
  <div id="paneText" style="display:none">
    <textarea class="paste-area" id="textArea" placeholder="请从 Excel 中框选数据区域（含表头），Ctrl+C 复制后，Ctrl+V 粘贴到这里..."></textarea>
  </div>
  <div class="actions">
    <button class="btn parse" onclick="startParse()">解析并校验题库</button>
    <button class="btn confirm" onclick="confirmImport()">确认导入并刷题</button>
  </div>
  <div id="resultBox" class="result-box">
    <span class="stat-line">
      <span class="ok" id="sucCount">成功 0 条</span>
      <span class="fail" id="failCount">失败 0 条</span>
    </span>
    <div id="failList" class="fail-list" style="display:none"></div>
    <div id="successDemo" class="success-demo"></div>
  </div>
</div>

<!-- 🎯 刷题主程序页面 -->
<div id="quizPage">
  <div class="quiz-header">
    <h2 id="libTitle">📚 智能题库</h2>
    <button onclick="goBack()">返回导入</button>
  </div>
  <div id="questionList"></div>
  <div class="bottom-bar" id="bottomBar" style="display:none">
    <div class="score">客观题得分：<span id="scoreDisplay">0</span></div>
    <div style="display:flex">
      <button class="btn-mistake" onclick="loadMistakes()">🔴 错题重练</button>
      <button class="btn-submit" onclick="submitQuiz()">交卷判分</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
let appState = { mode: 'file', tempRawRecords: [], finalParsedData: [], failErrors: [] };
let quizState = { questions: [], mistakes: [] };

/* 🎯 核心解析引擎 */
const CoreParser = {
  parseGrid: (grid) => {
    if (!grid || grid.length === 0) return [];
    const cleanCell = c => String(c == null ? '' : c).trim();
    let startIndex = 0;
    for (let i = 0; i < Math.min(5, grid.length); i++) {
      const rowStr = grid[i].map(cleanCell).join('').toLowerCase();
      if (rowStr.includes('题型') || rowStr.includes('题目') || rowStr.includes('选项a')) {
        startIndex = i + 1; break;
      }
    }
    const records = [];
    for (let i = startIndex; i < grid.length; i++) {
      const row = grid[i].map(cleanCell);
      if (!row.some(Boolean)) continue;
      let ansCol = 10, anaCol = 11;
      if (startIndex > 0) {
        const headerRow = grid[startIndex - 1].map(cleanCell);
        headerRow.forEach((cell, idx) => {
          const c = cell.toLowerCase();
          if (c === '答案' || c === 'answer') ansCol = idx;
          if (c === '解析' || c === 'analysis') anaCol = idx;
        });
      }
      const type = row[2] || '', stem = row[3] || '';
      if (!stem) continue;
      let optionsStr = [];
      for (let j = 4; j <= 9 && j < row.length; j++) {
        const val = row[j];
        if (val && val !== '-' && val !== '--' && val !== '无') {
          optionsStr.push(`${String.fromCharCode(65 + (j - 4))}.${val}`);
        }
      }
      records.push({ type, stem, options: optionsStr.join(';'), answer: row[ansCol] || '', analysis: row[anaCol] || '' });
    }
    return records;
  },
  parseItem: (raw) => {
    try {
      const t = (raw.type || '').toLowerCase();
      const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let options = [], answer = [];

      if (t.includes('单')) {
        let rawOpts = String(raw.options || '').split(/[;；|]/).filter(Boolean);
        options = rawOpts.map((txt, i) => ({ k: LETTERS[i], t: txt.trim().replace(/^[A-Z]\s*[.、．]\s*/, '') }));
        if (options.length < 2) return { error: '单选题选项不足2个' };
        let ans = String(raw.answer || '').toUpperCase().trim().replace(/[^A-Z]/g, ' ');
        let matches = [...new Set(ans.split(/\s+/).filter(Boolean))];
        answer = matches.filter(a => LETTERS.includes(a) && options.find(o => o.k === a));
        if (!answer.length) return { error: `单选题答案 "${raw.answer}" 无法识别` };
        return { id: Date.now() + Math.random()*10000, type: 'single', stem: raw.stem, options, answer: [answer[0]], analysis: raw.analysis || '' };
      }
      if (t.includes('多')) {
        let rawOpts = String(raw.options || '').split(/[;；|]/).filter(Boolean);
        options = rawOpts.map((txt, i) => ({ k: LETTERS[i], t: txt.trim().replace(/^[A-Z]\s*[.、．]\s*/, '') }));
        if (options.length < 2) return { error: '多选题选项不足2个' };
        let ans = String(raw.answer || '').toUpperCase().trim().replace(/[^A-Z]/g, ' ');
        let matches = [...new Set(ans.split(/\s+/).filter(Boolean))];
        answer = matches.filter(a => LETTERS.includes(a) && options.find(o => o.k === a));
        if (!answer.length) return { error: `多选题答案 "${raw.answer}" 无法识别` };
        return { id: Date.now() + Math.random()*10000, type: 'multi', stem: raw.stem, options, answer, analysis: raw.analysis || '' };
      }
      if (t.includes('判')) {
        options = [{k:'A',t:'正确'},{k:'B',t:'错误'}];
        let a = String(raw.answer || '').trim().replace(/[.,，。;；:：\s]+$/g, '').toUpperCase();
        if (['正确','对','√','✔','Y','YES','1','是','A','TRUE'].includes(a)) answer = ['A'];
        else if (['错误','错','×','✗','N','NO','0','否','B','FALSE'].includes(a)) answer = ['B'];
        else return { error: `判断题答案 "${raw.answer}" 无法识别` };
        return { id: Date.now() + Math.random()*10000, type: 'judge', stem: raw.stem, options, answer, analysis: raw.analysis || '' };
      }
      if (t.includes('填')) {
        let rawAns = String(raw.answer || '').trim();
        if (!rawAns) return { error: '填空题答案为空' };
        answer = rawAns.split(/[;；、]/).map(a => a.trim()).filter(Boolean);
        return { id: Date.now() + Math.random()*10000, type: 'fill', stem: raw.stem, options: [], answer, analysis: raw.analysis || '' };
      }
      if (t.includes('简') || t.includes('论')) {
        let rawAns = String(raw.answer || '').trim();
        if (!rawAns) return { error: '简答/论述题答案为空' };
        return { id: Date.now() + Math.random()*10000, type: 'essay', stem: raw.stem, options: [], answer: [rawAns], analysis: raw.analysis || '' };
      }
      return { error: `题型 "${raw.type}" 无法识别` };
    } catch(e) { return { error: '解析异常' }; }
  }
};

/* 🎯 导入页逻辑 */
function showToast(msg) {
  const d = document.getElementById('toast');
  d.textContent = msg;
  d.style.display = 'block';
  d.style.borderLeft = `4px solid ${msg.includes('失败') || msg.includes('请先') ? '#f56c6c' : '#67c23a'}`;
  clearTimeout(d._h);
  d._h = setTimeout(() => d.style.display = 'none', 3000);
}

function escapeHtml(str) { return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":"&#39;",'"':'&quot;'}[c])); }

window.switchMode = function(mode) {
  appState.mode = mode;
  document.getElementById('btnModeFile').className = mode === 'file' ? 'active' : '';
  document.getElementById('btnModeText').className = mode === 'text' ? 'active' : '';
  document.getElementById('paneFile').style.display = mode === 'file' ? 'block' : 'none';
  document.getElementById('paneText').style.display = mode === 'text' ? 'block' : 'none';
};

window.onFileChange = function(file) {
  if (!file) return;
  document.getElementById('fileNameDisplay').textContent = `✅ 已选：${file.name}`;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:false, defval:''});
      appState.tempRawRecords = CoreParser.parseGrid(rows);
      showToast(`成功读取 ${appState.tempRawRecords.length} 条数据，请点击解析`);
    } catch(err) { showToast('文件读取失败'); }
  };
  reader.readAsArrayBuffer(file);
};

window.startParse = function() {
  appState.finalParsedData = [];
  appState.failErrors = [];
  let data = [];
  if (appState.mode === 'file') {
    if (!appState.tempRawRecords.length) return showToast('请先选择文件');
    data = appState.tempRawRecords;
  } else {
    const text = document.getElementById('textArea').value.trim();
    if (!text) return showToast('请先粘贴数据');
    data = CoreParser.parseGrid(text.split(/\r?\n/).map(l => l.split('\t')));
  }
  data.forEach((raw, i) => {
    const res = CoreParser.parseItem(raw);
    if (res && !res.error) appState.finalParsedData.push(res);
    else appState.failErrors.push({line: `第${i+1}行`, msg: res?.error || '未知错误'});
  });
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('sucCount').textContent = `成功 ${appState.finalParsedData.length} 条`;
  document.getElementById('failCount').textContent = `失败 ${appState.failErrors.length} 条`;
  document.getElementById('failList').style.display = appState.failErrors.length ? 'block' : 'none';
  document.getElementById('failList').innerHTML = appState.failErrors.map(e => `${e.line}：${e.msg}`).join('<br>');
  const demoDiv = document.getElementById('successDemo');
  if (appState.finalParsedData.length) {
    let html = '<div style="font-size:12px;color:#999;margin-bottom:8px;margin-top:16px">解析示例：</div>';
    appState.finalParsedData.slice(0, 3).forEach(q => {
      const tags = {single:'s',multi:'m',judge:'j',fill:'f',essay:'w'};
      const names = {single:'单选题',multi:'多选题',judge:'判断题',fill:'填空题',essay:'简答/论述题'};
      html += `<div class="demo-card"><span class="tag ${tags[q.type]}">${names[q.type]}</span><div class="stem">${escapeHtml(q.stem)}</div>`;
      if (q.options.length) {
        html += `<ul class="opts">${q.options.map(o => `<li class="${q.answer.includes(o.k)?'correct':''}">${o.k}. ${escapeHtml(o.t)}</li>`).join('')}</ul>`;
      } else {
        html += `<div style="font-size:13px;color:var(--success)">参考答案：${escapeHtml(q.answer.join('、'))}</div>`;
      }
      html += `</div>`;
    });
    demoDiv.innerHTML = html;
  }
};

window.confirmImport = function() {
  if (!appState.finalParsedData.length) return showToast('请先解析数据');
  localStorage.setItem('question_bank_data', JSON.stringify(appState.finalParsedData));
  const libName = document.getElementById('libName').value.trim() || '未命名题库';
  showToast(`✅ 成功导入 ${appState.finalParsedData.length} 题，正在进入刷题程序...`);
  setTimeout(() => {
    document.getElementById('importPage').style.display = 'none';
    document.getElementById('quizPage').style.display = 'block';
    document.getElementById('bottomBar').style.display = 'flex';
    document.getElementById('libTitle').textContent = `📚 ${libName} (${appState.finalParsedData.length}题)`;
    initQuiz();
  }, 800);
};

/* 🎯 刷题主程序逻辑 */
function initQuiz() {
  quizState.questions = JSON.parse(localStorage.getItem('question_bank_data') || '[]');
  quizState.mistakes = [];
  renderQuizQuestions();
  document.getElementById('scoreDisplay').textContent = '0';
}

window.goBack = function() {
  document.getElementById('quizPage').style.display = 'none';
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('importPage').style.display = 'block';
};

function renderQuizQuestions() {
  const data = quizState.questions;
  const list = document.getElementById('questionList');
  if (!data.length) { list.innerHTML = '<div style="padding:60px;text-align:center;color:#999">暂无题目</div>'; return; }
  list.innerHTML = data.map((q, index) => {
    const tags = {single:'s',multi:'m',judge:'j',fill:'f',essay:'w'};
    const names = {single:'单选题',multi:'多选题',judge:'判断题',fill:'填空题',essay:'简答/论述题'};
    let inputHtml = '';
    if (['single', 'multi', 'judge'].includes(q.type)) {
      inputHtml = `<ul class="q-opts">${q.options.map(o => `<li data-key="${o.k}" onclick="selectOption(this, '${index}')">${o.k}. ${escapeHtml(o.t)}</li>`).join('')}</ul>`;
    } else if (q.type === 'fill') {
      let blankCount = q.answer.length;
      let matches = q.stem.match(/_{2,}|\(\s*\)/g);
      if (matches && matches.length > 0) blankCount = Math.max(blankCount, matches.length);
      if (blankCount === 0) blankCount = 1;
      let inputs = '';
      for(let i=0; i<blankCount; i++) inputs += `<input type="text" placeholder="请输入第${i+1}空答案">`;
      inputHtml = `<div class="blank-inputs">${inputs}</div>`;
    } else if (q.type === 'essay') {
      inputHtml = `<textarea class="essay-area" placeholder="请输入您的答案..."></textarea>`;
    }
    return `<div class="q-card" data-id="${q.id}">
      <span class="tag ${tags[q.type]}">${index+1}. ${names[q.type]}</span>
      <div class="q-stem">${escapeHtml(q.stem)}</div>
      ${inputHtml}
      <div style="display:none;margin-top:10px;font-size:12px;color:#606266;background:#f9f9f9;padding:10px;border-radius:6px" class="ans-res">
        <b>正确答案/参考答案：</b>${escapeHtml(q.answer.join('、'))}${q.analysis ? `<br><b>解析：</b>${escapeHtml(q.analysis)}` : ''}
      </div>
    </div>`;
  }).join('');
}

window.selectOption = function(el, index) {
  const card = el.closest('.q-card');
  if (card.classList.contains('submitted')) return;
  const isMulti = quizState.questions[index].type === 'multi';
  el.classList.toggle('active');
  if (!isMulti) {
    card.querySelectorAll('.q-opts li').forEach(li => {
      if (li !== el) li.classList.remove('active');
    });
  }
};

window.submitQuiz = function() {
  const cards = document.querySelectorAll('.q-card');
  let correctObjCount = 0, totalObjCount = 0, mistakeCount = 0;
  quizState.mistakes = [];
  cards.forEach((card, index) => {
    const q = quizState.questions[index];
    card.classList.add('submitted');
    card.querySelector('.ans-res').style.display = 'block';
    if (['single', 'multi', 'judge'].includes(q.type)) {
      totalObjCount++;
      const selected = Array.from(card.querySelectorAll('.q-opts li.active')).map(li => li.dataset.key);
      const isCorrect = selected.length === q.answer.length && selected.every(s => q.answer.includes(s));
      card.querySelectorAll('.q-opts li').forEach(li => {
        if (q.answer.includes(li.dataset.key)) li.classList.add('right');
        if (selected.includes(li.dataset.key) && !q.answer.includes(li.dataset.key)) li.classList.add('wrong');
      });
      if (isCorrect) correctObjCount++;
      else { mistakeCount++; quizState.mistakes.push(q); }
    } else if (q.type === 'fill') {
      totalObjCount++;
      const inputs = card.querySelectorAll('.blank-inputs input');
      let correctCount = 0;
      inputs.forEach((inp, i) => {
        if (inp.value.trim().toLowerCase() === (q.answer[i] || '').trim().toLowerCase()) {
          inp.classList.add('right'); correctCount++;
        } else { inp.classList.add('wrong'); }
      });
      if (correctCount === q.answer.length) correctObjCount++;
      else { mistakeCount++; quizState.mistakes.push(q); }
    } else if (q.type === 'essay') {
      card.querySelector('.essay-area').disabled = true;
    }
  });
  const score = totalObjCount > 0 ? Math.round((correctObjCount / totalObjCount) * 100) : 0;
  document.getElementById('scoreDisplay').textContent = score;
  showToast(`交卷成功！客观题得分：${score} 分，错题 ${mistakeCount} 道（主观题请对照答案自查）`);
};

window.loadMistakes = function() {
  if (quizState.mistakes.length === 0) return showToast('太棒了，当前没有错题！');
  quizState.questions = [...quizState.mistakes];
  renderQuizQuestions();
  showToast(`已载入 ${quizState.mistakes.length} 道错题，请重新练习`);
  document.getElementById('scoreDisplay').textContent = '0';
};
</script>
</body>
