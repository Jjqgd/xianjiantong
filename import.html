<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>导入新题库 - 铁途学练</title>
<link rel="icon" href="logo.png">

<!-- 🔒 最强防盗锁 -->
<script>
  (function() {
    var allowedDomains = ["jjqgd.github.io", "localhost", "127.0.0.1"];
    var host = window.location.hostname;
    var isAllowed = false;
    for (var i = 0; i < allowedDomains.length; i++) {
      if (host === allowedDomains[i] || host.endsWith("." + allowedDomains[i])) { isAllowed = true; break; }
    }
    if (!isAllowed) {
      document.documentElement.innerHTML = '';
      var warn = document.createElement('div');
      warn.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;';
      warn.innerHTML = '<div style="font-size:60px;margin-bottom:20px;">🛑</div><h2 style="color:#d32f2f;font-size:24px;font-weight:bold;">未经授权，禁止盗用</h2><p style="color:#666;font-size:14px;">此系统受版权保护。</p>';
      document.body.appendChild(warn);
      setInterval(function(){}, 99999); 
      throw new Error("Unauthorized Domain Access");
    }
  })();
</script>

<script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  body { background-color: #f0f4f8; color: #1e293b; padding: 10px; -webkit-tap-highlight-color: transparent; }
  .nav { background: #fff; padding: 10px 15px; border-bottom: 2px solid #b71c1c; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; margin-bottom: 10px; }
  .nav-logo { font-size: 1.2rem; font-weight: bold; color: #b71c1c; display: flex; align-items: center; gap: 8px; }
  .nav-logo img { width: 30px; height: 30px; object-fit: contain; }
  .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .btn { border: none; border-radius: 8px; padding: 12px 15px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: #0d47a1; color: #fff; }
  .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
  .footer { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: 20px; padding-bottom: 20px; }
  
  input[type="file"] {
    display: block !important;
    width: 100%;
    padding: 20px 10px;
    border: 2px dashed #0d47a1;
    border-radius: 8px;
    background-color: #eff6ff;
    color: #0d47a1;
    font-size: 1rem;
    font-weight: bold;
    outline: none;
    cursor: pointer;
  }

  .modal-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: #fff; border-radius: 12px; width: 100%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { padding: 15px; background: #ffebee; color: #b71c1c; font-weight: bold; border-bottom: 1px solid #ffcdd2; }
  .modal-body { padding: 15px; overflow-y: auto; font-size: 0.85rem; line-height: 1.6; color: #333; }
  .error-item { border-bottom: 1px dashed #eee; padding: 8px 0; }
  .error-item strong { color: #d32f2f; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">
    <img src="logo.png" onerror="this.style.display='none'"> 导入新题库
  </div>
</div>

<div class="card" style="text-align:center; padding:40px 15px;">
  <h2 style="color:#b71c1c;margin-bottom:15px;">📥 上传文件</h2>
  <p style="color:#64748b;font-size:0.9rem;margin-bottom:20px;line-height:1.6;">
    最严格的强制对齐解析。<br>有任何格式错位，系统会直接拦截并告知。
  </p>
  
  <input type="file" id="fileUpload" accept=".xlsx,.xls,.csv" onchange="handleFileSelect(event)">
  
  <div id="loadingText" style="display:none; margin-top:20px; color:#0d47a1; font-weight:bold;">正在解析并校验数据，请稍候...</div>

  <button class="btn btn-outline" onclick="window.location.href='index.html'" style="margin-top:20px;">取消并返回首页</button>
</div>
<div class="footer">技术支持：秦十三郎</div>

<div id="errorModal" class="modal-mask" style="display:none;">
  <div class="modal-box">
    <div class="modal-header" id="modalTitle">⚠️ 部分题目导入失败</div>
    <div class="modal-body" id="modalBody"></div>
    <div style="padding: 15px; text-align: center; border-top: 1px solid #eee;">
      <button class="btn btn-primary" onclick="closeErrorModal()" style="width: 100%;">我知道了，继续</button>
    </div>
  </div>
</div>

<script>
var pendingQuestions = []; 
var pendingName = "";

function handleFileSelect(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('loadingText').style.display = 'block';
  
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var data = new Uint8Array(evt.target.result);
      var wb = XLSX.read(data, {type: 'array'});
      var result = parseExcel(wb);
      
      var parsed = result.data;
      var errors = result.errors;

      if (parsed.length === 0 && errors.length === 0) {
        throw new Error('未能找到任何有效题目，请检查表格列名。');
      }
      
      if (parsed.length === 0) {
        showErrorModal(errors);
        document.getElementById('loadingText').style.display = 'none';
        return;
      }

      pendingQuestions = parsed;
      pendingName = file.name.replace(/\.[^/.]+$/, "");

      if (errors.length > 0) {
        showErrorModal(errors);
      } else {
        finishImport(parsed, pendingName);
      }
      
    } catch(err) {
      alert('解析失败：' + (err.message || '请检查表格格式'));
      document.getElementById('loadingText').style.display = 'none';
    }
  };
  reader.readAsArrayBuffer(file);
}

function finishImport(parsed, defaultName) {
  var bankName = prompt('解析成功，共抓取 ' + parsed.length + ' 道题！\n请为题库命名：', defaultName);
  if (bankName === null || bankName.trim() === '') {
    bankName = defaultName;
  }
  
  var newId = 'bank_' + Date.now();
  localStorage.setItem('xjt_new_import', JSON.stringify({
    id: newId,
    name: bankName,
    questions: parsed
  }));
  
  window.location.href = 'index.html';
}

function showErrorModal(errors) {
  document.getElementById('modalTitle').innerText = `⚠️ 成功抓取 ${pendingQuestions.length} 题，拦截 ${errors.length} 道异常题`;
  var html = `<div style="margin-bottom:10px; color:#666;">以下题目因为格式不规范未被导入，建议修改 Excel 后重新导入：</div>`;
  errors.forEach(function(err) {
    html += `<div class="error-item"><strong>${err.pos}</strong>：${err.msg}</div>`;
  });
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('errorModal').style.display = 'flex';
}

function closeErrorModal() {
  document.getElementById('errorModal').style.display = 'none';
  if (pendingQuestions.length > 0) {
    finishImport(pendingQuestions, pendingName);
  }
}

// ================= 最严丝合缝版（拒绝乱猜，绝对对齐） =================
function parseExcel(wb) {
  var allParsed = [];
  var errorList = []; 
  
  wb.SheetNames.forEach(function(sheetName) {
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: false });
    if (!rows || rows.length < 2) return;

    var colQ = -1, colAns = -1, colAna = -1, colType = -1;
    var optCols = [];
    var headerRowIndex = -1;

    // 1. 扫描前20行，死磕表头（严格按顺序对齐）
    for (var r = 0; r < Math.min(rows.length, 20); r++) {
      var row = rows[r];
      if (!row || row.length === 0) continue;
      
      var tempQ = -1, tempAns = -1, tempAna = -1, tempType = -1;
      var tempOpts = [];

      for (var c = 0; c < row.length; c++) {
        var h = String(row[c] || '').trim().toLowerCase();
        if (!h) continue;

        if (tempQ === -1 && (h.indexOf('题目') > -1 || h.indexOf('题干') > -1 || h.indexOf('试题') > -1 || h.indexOf('问题') > -1 || h === 'question')) tempQ = c;
        else if (tempAns === -1 && (h.indexOf('答案') > -1 || h.indexOf('answer') > -1)) tempAns = c;
        else if (tempAna === -1 && (h.indexOf('解析') > -1 || h.indexOf('说明') > -1 || h.indexOf('备注') > -1 || h.indexOf('出处') > -1 || h.indexOf('分析') > -1)) tempAna = c;
        else if (tempType === -1 && (h.indexOf('题型') > -1 || h.indexOf('类型') > -1 || h === 'type')) tempType = c;
        else if (h.indexOf('选项') > -1 || /^[a-g]$/i.test(h) || /^[a-g]选项$/i.test(h)) tempOpts.push(c);
      }

      if (tempQ !== -1 && tempAns !== -1) {
        colQ = tempQ; colAns = tempAns; colAna = tempAna; colType = tempType;
        optCols = tempOpts; headerRowIndex = r;
        break;
      }
    }

    if (headerRowIndex === -1) return; 

    // 2. 严格提取数据
    for (var r = headerRowIndex + 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row || row.length === 0) continue;

      var qText = String(row[colQ] || '').trim();
      if (!qText) continue;

      var opts = [];
      for (var o = 0; o < optCols.length; o++) {
        var val = String(row[optCols[o]] || '').trim();
        if (val) opts.push(val);
      }

      var ansRaw = String(row[colAns] || '').trim().toUpperCase();
      var anaText = colAna !== -1 ? String(row[colAna] || '').trim() : '';
      var typeStr = colType !== -1 ? String(row[colType] || '').trim().toLowerCase() : '';
      var excelRow = r + 1; 

      // 拦截规则：答案必须存在
      if (!ansRaw) {
        errorList.push({ pos: `工作表[${sheetName}] 第 ${excelRow} 行`, msg: `题目【${qText.substring(0,10)}...】缺少答案` });
        continue;
      }

      ansRaw = ansRaw.replace(/[，、\s]/g, ',');
      var type = 'single';
      var ansIndices = [];
      
      var judgeT = ['正确','对','T','TRUE','Y','YES','√','V','是','A'];
      var judgeF = ['错误','错','不对','F','FALSE','N','NO','×','X','否','B'];

      // 判断题型
      if (typeStr.indexOf('判') > -1 || judgeT.indexOf(ansRaw) > -1 || judgeF.indexOf(ansRaw) > -1) {
        type = 'judge';
        opts = ['正确', '错误']; 
        if (judgeT.indexOf(ansRaw) > -1) ansIndices = [0];
        else if (judgeF.indexOf(ansRaw) > -1) ansIndices = [1];
      } 
      
      if (ansIndices.length === 0) {
        if (ansRaw.indexOf(',') > -1 || ansRaw.length > 1) {
          type = 'multiple';
        }
        var letters = ansRaw.match(/[A-G]/g) || [];
        for (var l = 0; l < letters.length; l++) {
          var idx = letters[l].charCodeAt(0) - 65;
          if (ansIndices.indexOf(idx) === -1) ansIndices.push(idx);
        }
        ansIndices.sort();
      }

      // 拦截规则：答案必须有字母
      if (ansIndices.length === 0) {
        errorList.push({ pos: `工作表[${sheetName}] 第 ${excelRow} 行`, msg: `题目【${qText.substring(0,10)}...】的答案【${ansRaw}】无法解析为字母` });
        continue;
      }

      // 拦截规则：答案字母必须和选项数量匹配
      var maxAns = Math.max.apply(null, ansIndices);
      if (opts.length <= maxAns && type !== 'judge') {
         errorList.push({ pos: `工作表[${sheetName}] 第 ${excelRow} 行`, msg: `题目【${qText.substring(0,10)}...】答案选了 ${String.fromCharCode(65+maxAns)}，但表格里这一行没有该选项` });
         continue;
      }

      allParsed.push({
        id: 'q_' + r + '_' + Date.now() + Math.floor(Math.random()*1000),
        question: qText,
        type: type,
        options: opts.length > 1 ? opts : ['正确', '错误'], 
        answer: ansIndices,
        analysis: anaText, 
        streak: 0
      });
    }
  });

  return { data: allParsed, errors: errorList };
}
</script>
</body>
</html>
