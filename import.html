<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2d3d;font-size:14px}
header{background:#fff;border-bottom:1px solid #e4e7ed;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;font-weight:600}
header .stat{color:#909399;font-size:13px}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.spacer{flex:1}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;background:#fff;border:1px solid #dcdfe6;color:#606266}
.btn:hover{border-color:#c0c4cc}
.btn-primary{background:#d03f3f;border-color:#d03f3f;color:#fff}
.btn-primary:hover{background:#e65c5c}
.btn-danger{background:#f56c6c;border-color:#f56c6c;color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:#d03f3f}
.card{background:#fff;border:1px solid #ebeef5;border-radius:8px;padding:16px;margin-bottom:12px}
.card .meta{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:4px;font-size:12px;background:#ecf5ff;color:#409eff}
.tag.multi{background:#fdf6ec;color:#e6a23c}
.tag.judge{background:#f0f9eb;color:#67c23a}
.card .stem{font-weight:600;line-height:1.6;margin-bottom:10px}
.opts{list-style:none;margin-bottom:10px}
.opts li{padding:4px 0;color:#606266;line-height:1.6}
.opts li.right{color:#67c23a;font-weight:600}
.ans{background:#f8f9fb;border-radius:6px;padding:10px;line-height:1.7}
.ans b{color:#409eff}
.empty{text-align:center;color:#909399;padding:40px 0}

/* ===== 导入弹窗 —— 铁途风格 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-mask.on{display:flex}
.modal{background:#fff;border-radius:10px;width:680px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal.wide{width:860px}
.modal-header{padding:16px 20px;border-bottom:1px solid #ebeef5;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:600;color:#d03f3f}
.modal-header .close{cursor:pointer;color:#909399;font-size:22px;line-height:1;border:none;background:none}
.modal-body{padding:20px;overflow-y:auto}
.modal-footer{padding:14px 20px;border-top:1px solid #ebeef5;display:flex;justify-content:flex-end;gap:10px}

/* 顶部红色标题区 */
.import-hero{text-align:center;padding:10px 0 16px;border-bottom:2px solid #fce4ec;margin-bottom:16px}
.import-hero h2{font-size:22px;color:#d03f3f;margin-bottom:4px}
.import-hero .sub{color:#909399;font-size:13px}

/* 左侧规则面板 */
.rules-panel{background:linear-gradient(135deg,#fff5f5,#ffffff);border:1px solid #ffd4d4;border-radius:8px;padding:16px;margin-bottom:16px}
.rules-panel h4{color:#d03f3f;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rules-panel ul{list-style:none;padding:0}
.rules-panel li{padding:5px 0;padding-left:16px;position:relative;color:#555;line-height:1.7;font-size:13px}
.rules-panel li::before{content:'';position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:#d03f3f}
.rules-panel .section-title{font-weight:600;color:#d03f3f;margin-top:12px;margin-bottom:4px;font-size:13px}
.rules-panel .tip-box{background:#fff;border-left:3px solid #d03f3f;padding:10px 12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:12px;color:#888;line-height:1.6}
.rules-panel code{background:#ffe8e8;padding:1px 5px;border-radius:3px;font-size:12px;color:#d03f3f}

/* 题库名称输入 */
.name-input{width:100%;padding:10px 14px;border:2px solid #d03f3f;border-radius:8px;font-size:14px;outline:none;margin-bottom:14px}
.name-input::placeholder{color:#bbb}
.name-input:focus{box-shadow:0 0 0 3px rgba(208,63,63,.12)}

/* 标签切换：文件在左，粘贴在右 */
.import-tabs{display:flex;gap:8px;margin-bottom:14px}
.import-tabs button{flex:1;padding:10px;border:2px solid #d03f3f;background:#fff;border-radius:8px;cursor:pointer;color:#d03f3f;font-size:14px;font-weight:500;transition:all .2s}
.import-tabs button:hover{background:#fff5f5}
.import-tabs button.on{background:#d03f3f;color:#fff}

/* 粘贴文本区 */
.paste-box{width:100%;min-height:160px;padding:12px;border:2px solid #e4e7ed;border-radius:8px;font-size:13px;font-family:monospace;resize:vertical;outline:none;line-height:1.6}
.paste-box:focus{border-color:#d03f3f}
.paste-box::placeholder{color:#bbb}

/* 文件选择区 */
.file-box{border:2px dashed #d03f3f;border-radius:8px;padding:24px 16px;text-align:center;background:#fffbfb}
.file-box .icon{font-size:36px;margin-bottom:8px}
.file-box .desc{color:#666;font-size:13px;margin-bottom:10px}
.file-box input[type=file]{margin:8px 0}
.file-box .name{color:#d03f3f;font-size:13px;margin-top:8px;font-weight:500}

/* 预览区 */
.preview-wrap{margin-top:16px}
.preview-wrap h4{font-size:14px;color:#333;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.preview-wrap .stat-line{display:flex;gap:16px;margin-bottom:12px;font-size:13px}
.preview-wrap .stat-line .ok{color:#67c23a;font-weight:600}
.preview-wrap .stat-line .fail{color:#f56c6c;font-weight:600}
.preview-card{background:#fafafa;border:1px solid #e4e7ed;border-radius:8px;padding:14px;margin-bottom:10px}
.preview-card .ptype{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;margin-bottom:8px}
.preview-card .ptype.single{background:#ecf5ff;color:#409eff}
.preview-card .ptype.multi{background:#fdf6ec;color:#e6a23c}
.preview-card .ptype.judge{background:#f0f9eb;color:#67c23a}
.preview-card .stem{font-weight:600;margin-bottom:8px;line-height:1.6}
.preview-card .opts{list-style:none;margin-bottom:8px}
.preview-card .opts li{padding:3px 0;font-size:13px;color:#555}
.preview-card .opts li.right{color:#67c23a;font-weight:600}
.preview-card .ans-line{font-size:13px;color:#d03f3f}
.preview-card .ans-line b{color:#d03f3f}
.preview-card .fail-reason{color:#f56c6c;font-size:13px}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;display:none;background:#fff;border:1px solid #ebeef5;border-radius:8px;padding:12px 18px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
#toast.on{display:block}
#toast.ok{border-left:4px solid #67c23a}
#toast.err{border-left:4px solid #f56c6c}
</style>
</head>
<body>
<header>
  <h1>题库管理系统</h1>
  <div class="stat" id="stat"></div>
</header>
<main>
  <div class="toolbar">
    <button class="btn btn-primary" onclick="openImport()">导入题库</button>
    <span class="spacer"></span>
  </div>
  <div id="list"></div>
</main>

<div class="modal-mask" id="mask">
  <div class="modal wide" id="modal">
    <div class="modal-header"><h3 id="mTitle">题库导入</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-footer" id="mFooter">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn" id="btnDemo" onclick="fillDemo()">填充示例</button>
      <button class="btn" onclick="parseCurrent()">解析并校验题库</button>
      <button class="btn btn-primary" onclick="doImport()">确认导入</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================= 基础数据 ================= */
let questions = [
  {id:1,type:'single',stem:'下列哪一项属于中国的第一级行政区划？',options:[{k:'A',t:'省'},{k:'B',t:'市'},{k:'C',t:'县'},{k:'D',t:'乡'}],answer:['A'],analysis:'省、自治区、直辖市、特别行政区为第一级行政区划。'},
  {id:2,type:'multi',stem:'以下属于可再生能源的有（多选）：',options:[{k:'A',t:'太阳能'},{k:'B',t:'风能'},{k:'C',t:'煤炭'},{k:'D',t:'水能'}],answer:['A','B','D'],analysis:'煤炭为不可再生能源。'},
  {id:3,type:'judge',stem:'地球绕太阳公转一周约为 365 天。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:['A'],analysis:'约 365.24 天。'}
];
const uid = () => Date.now() + Math.floor(Math.random()*1000);
const TYPE_NAME = {single:'单选题', multi:'多选题', judge:'判断题'};
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const MAX_OPT = LETTERS.length;
const JUDGE_OPTS = [{k:'A',t:'正确'},{k:'B',t:'错误'}];
let importMode = 'file', fileRecords = null, fileName = '';

/* ================= 答案解析 ================= */
function toHalf(s){
  return String(s==null?'':s)
    .replace(/[\uFF10-\uFF19]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFF10+48))
    .replace(/[\uFF21-\uFF3A]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFF21+65))
    .replace(/[\uFF41-\uFF5A]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFF41+97))
    .replace(/[\u3000]/g,' ');
}
const NOISE = ['正确答案','标准答案','答案','选项','下列','以及','和','与','及','或','包括','均','选','项','个','题','第',
  'and','or','not','the','a','an','true','false','yes','no','all','none','ok','ng',
  '全选','全部','所有','无','空','正确','错误','对','错','是','否','真','假'];
const SEP_RE = /[#|,，、;；:：.。·\/\\()（）\[\]{}<>《》"'“”‘’]+/g;
const CN_NUM = {'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
const JIA_NUM = {'甲':1,'乙':2,'丙':3,'丁':4,'戊':5,'己':6,'庚':7,'辛':8,'壬':9,'癸':10};
function expandRanges(s){
  return s.replace(/([A-Z0-9])\s*(?:[-~～—–]|至|到)\s*([A-Z0-9])/g,(m,a,b)=>{
    if(/[A-Z]/.test(a)&&/[A-Z]/.test(b)&&a<=b) return LETTERS.slice(LETTERS.indexOf(a),LETTERS.indexOf(b)+1).join(' ');
    if(/\d/.test(a)&&/\d/.test(b)&&+a<=+b) return LETTERS.slice(+a-1,+b).join(' ');
    return m;
  });
}
function circledToNum(ch){ const c=ch.charCodeAt(0); if(c>=0x2460&&c<=0x2473)return c-0x2460+1; if(c>=0x24F1&&c<=0x24F9)return c-0x24F1+11; return null; }
function cnNum(s){
  if(s==='十')return 10;
  if(/^十[一二三四五六七八九]$/.test(s))return 10+CN_NUM[s[1]];
  if(CN_NUM.hasOwnProperty(s))return CN_NUM[s];
  if(JIA_NUM.hasOwnProperty(s))return JIA_NUM[s];
  return null;
}
function extractLetters(raw){
  let s = toHalf(raw).trim();
  if(!s) return [];
  if(/^(全选|全部|所有|all)$/i.test(s)) return 'ALL';
  s = expandRanges(s);
  s = s.replace(/[\u2460-\u2473\u24F1-\u24F9]/g, ch=>' '+circledToNum(ch)+' ');
  s = s.replace(SEP_RE,' ');
  NOISE.slice().sort((a,b)=>b.length-a.length).forEach(w=>{s=s.split(w).join(' ');});
  s = s.replace(/([A-Za-z\u4e00-\u9fa5])(\d+)/g,'$1 $2').replace(/(\d+)([A-Za-z\u4e00-\u9fa5])/g,'$1 $2');
  let out = [];
  s.split(/\s+/).filter(Boolean).forEach(t=>{
    if(/^[A-Z]+$/i.test(t)) out=out.concat(t.toUpperCase().split(''));
    else if(/^\d+$/.test(t)){ const n=parseInt(t,10); if(n>=1&&n<=MAX_OPT) out.push(LETTERS[n-1]); }
    else { const n=cnNum(t); if(n!=null&&n>=1&&n<=MAX_OPT) out.push(LETTERS[n-1]); }
  });
  return [...new Set(out)].sort((a,b)=>LETTERS.indexOf(a)-LETTERS.indexOf(b));
}
const JUDGE_TRUE=new Set(['正确','对','√','✓','✔','y','yes','t','true','1','是','a','ok','pass','真']);
const JUDGE_FALSE=new Set(['错误','错','×','✗','✘','n','no','f','false','0','否','b','ng','fail','假']);
function parseJudgeAnswer(raw){
  let s = toHalf(raw).trim().toLowerCase().replace(SEP_RE,' ').replace(/\s+/g,' ').trim();
  if(!s) return [];
  if(JUDGE_TRUE.has(s)) return ['A'];
  if(JUDGE_FALSE.has(s)) return ['B'];
  const first = s.split(' ')[0];
  if(JUDGE_TRUE.has(first)) return ['A'];
  if(JUDGE_FALSE.has(first)) return ['B'];
  if(/^(正确|对|√|✓|✔|y|yes|t|true|1|是|a)/.test(s)) return ['A'];
  if(/^(错误|错|×|✗|✘|n|no|f|false|0|否|b)/.test(s)) return ['B'];
  return [];
}
function parseAnswer(type, raw, validKeys){
  if(type==='judge') return parseJudgeAnswer(raw);
  const keys = (validKeys||LETTERS).filter(k=>LETTERS.includes(k));
  let r = extractLetters(raw);
  if(r==='ALL') return keys.slice();
  r = r.filter(k=>keys.includes(k));
  if(type==='single') r = r.slice(0,1);
  return r;
}
const TYPE_MAP = {'单选':'single','单选题':'single','single':'single','多选':'multi','多选题':'multi','multi':'multi','判断':'judge','判断题':'judge','judge':'judge'};

/* ================= 弹窗 ================= */
function openModal({title, body}){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = body;
  document.getElementById('mask').classList.add('on');
}
function closeModal(){ document.getElementById('mask').classList.remove('on'); }
document.getElementById('mask').addEventListener('click', e => { if(e.target.id==='mask') closeModal(); });
function toast(msg, type='ok'){
  const t = document.getElementById('toast'); t.textContent = msg; t.className = 'on ' + type;
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='', 2200);
}

/* ================= 列表 ================= */
function render(){
  document.getElementById('stat').textContent = `共 ${questions.length} 题`;
  document.getElementById('list').innerHTML = questions.length ? questions.map(q => `
    <div class="card">
      <div class="meta">
        <span class="tag ${q.type==='multi'?'multi':q.type==='judge'?'judge':''}">${TYPE_NAME[q.type]}</span>
        <span style="color:#909399;font-size:12px">#${q.id}</span>
        <span class="spacer"></span>
        <button class="btn btn-ghost" style="color:#f56c6c" onclick="del(${q.id})">删除</button>
      </div>
      <div class="stem">${esc(q.stem)}</div>
      <ul class="opts">${q.options.map(o =>
        `<li class="${q.answer.includes(o.k)?'right':''}">${o.k}. ${esc(o.t)}${q.answer.includes(o.k)?' ✔':''}</li>`).join('')}</ul>
      <div class="ans">答案：<b>${ansText(q)}</b>${q.analysis?`<br>解析：${esc(q.analysis)}`:''}</div>
    </div>`).join('') : '<div class="empty">暂无题目，请点击「导入题库」</div>';
}
function ansText(q){
  if(q.type==='judge') return q.answer.map(k=>k==='A'?'正确':'错误').join(' / ')||'—';
  return q.answer.join('、')||'—';
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function del(id){
  if(!confirm('确定删除？')) return;
  questions = questions.filter(q=>q.id!==id); render(); toast('已删除');
}

/* ================= 导入弹窗 ================= */
function openImport(){
  document.getElementById('mFooter').innerHTML =
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn" id="btnDemo" onclick="fillDemo()">填充示例</button>
     <button class="btn" onclick="parseCurrent()">解析并校验题库</button>
     <button class="btn btn-primary" onclick="doImport()">确认导入</button>`;
  openModal({title:'题库导入', body:`
    <div class="import-hero">
      <h2>📥 导入新题库</h2>
      <div class="sub">支持 Excel（.xlsx/.xls）、CSV、TXT、JSON 或直接粘贴文本</div>
    </div>

    <div class="rules-panel">
      <h4>📋 操作步骤</h4>
      <ul>
        <li>1. 上方填写题库名称</li>
        <li>2. Excel中<strong>连表头一起</strong>全选复制数据</li>
        <li>3. 粘贴到下方文本框（或选文件），点击「解析并校验题库」</li>
      </ul>
      <h4 style="margin-top:14px">✅ 格式要求</h4>
      <ul>
        <li>必填表头：<code>题型</code>、<code>题目</code>、<code>答案</code>，不可修改缺失</li>
        <li>选填列：解析、选项A~选项H（仅客观题需设置）</li>
        <li>禁止合并单元格、公式、隐藏行列，保持纯文本</li>
      </ul>
      <h4 style="margin-top:14px">✏️ 题型与答案规则</h4>
      <div class="section-title">【客观题】单选 / 多选 / 判断</div>
      <ul>
        <li>单选题：填单个字母（A~H）</li>
        <li>多选题：填全部正确字母（如 ABC，可带空格/顿号），至少2项</li>
        <li>判断题：正确→对/正确/√/T/A/1/是/Y；错误→错/错误/×/F/B/0/否/N</li>
      </ul>
      <div class="section-title">【主观题】填空 / 简答 / 论述</div>
      <ul><li>直接填写标准答案文本，填空题多空用分号分隔</li></ul>
      <div class="tip-box">💡 表头文字不可私自改动（如"题目"不能改"题干"），单次导入建议≤5000题</div>
    </div>

    <input class="name-input" id="impName" placeholder="请输入题库名称（如：普速线路专业题库）">

    <div class="import-tabs">
      <button id="tabFile" class="on" onclick="switchMode('file')">选择文件</button>
      <button id="tabText" onclick="switchMode('text')">粘贴文本</button>
    </div>

    <div id="paneFile">
      <div class="file-box">
        <div class="icon">📄</div>
        <div class="desc">支持 .xlsx / .xls / .csv / .txt / .json</div>
        <input type="file" id="impFile" accept=".xlsx,.xls,.csv,.txt,.json" onchange="handleFile(this.files[0])">
        <div class="name" id="fileLabel">${fileName?('已选：'+fileName):'尚未选择文件'}</div>
      </div>
    </div>

    <div id="paneText" style="display:none">
      <textarea class="paste-box" id="impText" placeholder="请将 Excel 的内容直接粘贴到这里…"></textarea>
    </div>

    <div class="preview-wrap" id="impPreview"></div>
  `});
  window._imp = {ok:[], fail:[]};
  switchMode(importMode);
}
function switchMode(m){
  importMode = m;
  document.getElementById('tabFile').className = m==='file'?'on':'';
  document.getElementById('tabText').className = m==='text'?'on':'';
  document.getElementById('paneFile').style.display = m==='file'?'':'none';
  document.getElementById('paneText').style.display = m==='text'?'':'none';
  document.getElementById('btnDemo').style.display = m==='text'?'':'none';
}
function fillDemo(){
  document.getElementById('impText').value =
`题型|题目|选项|答案|解析
单选|中国的首都是哪座城市？|北京;上海;广州;深圳|A|北京为首都。
多选|下列属于可再生能源的有？|太阳能;风能;煤炭;水能|A,B,D|煤炭不可再生。
判断|地球绕太阳公转一周约 365 天。||Y|约 365.24 天。
判断|1 公里等于 100 米。||N|应为 1000 米。`;
  parseCurrent();
}

/* ---- 文件读取 ---- */
function handleFile(file){
  if(!file) return;
  fileName = file.name;
  document.getElementById('fileLabel').textContent = '已选：' + fileName;
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls'].includes(ext)){
    if(!window.XLSX){ toast('Excel 解析组件未加载，请联网或改用 CSV/TXT','err'); return; }
    const r = new FileReader();
    r.onload = () => {
      try{
        const wb = XLSX.read(r.result,{type:'array'});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:''});
        fileRecords = rowsToRecords(rows);
        parseCurrent('文件');
      }catch(e){ toast('Excel 解析失败：'+e.message,'err'); }
    };
    r.readAsArrayBuffer(file);
  }else if(ext==='json'){
    const r = new FileReader();
    r.onload = () => {
      try{
        const arr = JSON.parse(r.result);
        fileRecords = (Array.isArray(arr)?arr:[arr]).map(it=>({
          type:it.type||it['题型'], stem:it.stem||it['题目'], options:it.options||it['选项'],
          answer:it.answer||it['答案'], analysis:it.analysis||it['解析']
        }));
        parseCurrent('文件');
      }catch(e){ toast('JSON 解析失败：'+e.message,'err'); }
    };
    r.readAsText(file,'UTF-8');
  }else{
    const r = new FileReader();
    r.onload = () => {
      document.getElementById('impText').value = r.result;
      fileRecords = null; switchMode('text'); parseCurrent();
    };
    r.readAsText(file,'UTF-8');
  }
}
function rowsToRecords(rows){
  if(!rows||!rows.length) return [];
  const clean=c=>String(c==null?'':c).trim();
  let hIdx=-1, map=null;
  for(let i=0;i<Math.min(rows.length,5);i++){
    const cells=rows[i].map(clean);
    const m={opts:[]};
    cells.forEach((c,j)=>{
      const k=c.toLowerCase();
      if(/题型|类型|题目类型|^type$/.test(k)) m.type=j;
      else if(/^(stem|question|title)$|^题目$|^问题|题干/.test(k)) m.stem=j;
      else if(/答案|answer/i.test(k)) m.answer=j;
      else if(/解析|解释|analysis/i.test(k)) m.analysis=j;
      else if(/^选项\s*([a-z0-9一二三四五六七八]+)?$/i.test(k)) m.opts.push({j,label:(m.opts.length+1).toString()});
    });
    if(m.stem!=null||m.type!=null){ hIdx=i; map=m; break; }
  }
  const recs=[];
  const body = hIdx>=0 ? rows.slice(hIdx+1) : rows;
  body.forEach((row,i)=>{
    const cells=row.map(clean);
    if(!cells.some(c=>c)) return;
    let rec;
    if(map){
      const opts = map.opts.map((o,n)=>({k:LETTERS[n],t:cells[o.j]})).filter(o=>o.t);
      rec = {type:map.type!=null?cells[map.type]:'',stem:map.stem!=null?cells[map.stem]:'',
             options:opts, answer:map.answer!=null?cells[map.answer]:'', analysis:map.analysis!=null?cells[map.analysis]:''};
    }else{
      rec = {type:cells[0],stem:cells[1],options:(cells[2]||'').split(/[;；]/),answer:cells[3],analysis:cells[4]};
    }
    rec._from='第'+(i+1)+'行';
    recs.push(rec);
  });
  return recs;
}

/* ---- 解析预览：每种题型只显示第一道题 ---- */
function parseCurrent(source){
  const ok=[], fail=[];
  if(source==='文件' || (importMode==='file'&&fileRecords)){
    if(!fileRecords||!fileRecords.length){ toast('文件未解析出数据','err'); return; }
    fileRecords.forEach((it,i)=>normalize(it, it._from||('第'+(i+1)+'条'), ok, fail));
  }else{
    const text = document.getElementById('impText').value;
    const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('#'));
    if(!lines.length){ toast('没有可解析的内容','err'); return; }
    if(lines[0].startsWith('[')||lines[0].startsWith('{')){
      try{
        const arr=JSON.parse(text);
        (Array.isArray(arr)?arr:[arr]).forEach((it,i)=>normalize(it,'第'+(i+1)+'条',ok,fail));
      }catch(e){ fail.push({line:'JSON',reason:'JSON 解析失败：'+e.message}); }
    }else{
      lines.forEach((line,i)=>{
        const sep=line.includes('|')?'|':line.includes('\t')?'\t':',';
        const c=line.split(sep);
        normalize({type:c[0],stem:c[1],options:(c[2]||'').split(/[;；]/),answer:c[3],analysis:c[4]},'第'+(i+1)+'行',ok,fail);
      });
    }
  }
  window._imp = {ok, fail};

  // 预览：每种题型第一道题
  const firstOf = {};
  ok.forEach(q=>{ if(!firstOf[q.type]) firstOf[q.type] = q; });
  const types = ['single','multi','judge'];

  document.getElementById('impPreview').innerHTML = `
    <h4>✅ 解析结果：<span class="stat-line"><span class="ok">成功 ${ok.length} 条</span><span class="fail">失败 ${fail.length} 条</span></span></h4>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      ${types.filter(t=>firstOf[t]).map(t=>{
        const q = firstOf[t];
        return `<div class="preview-card">
          <span class="ptype ${t}">${TYPE_NAME[t]}（示例）</span>
          <div class="stem">${esc(q.stem)}</div>
          ${q.options.length?`<ul class="opts">${q.options.map(o=>
            `<li class="${q.answer.includes(o.k)?'right':''}">${o.k}. ${esc(o.t)}${q.answer.includes(o.k)?' ✔':''}</li>`
          ).join('')}</ul>`:''}
          <div class="ans-line">答案：<b>${ansText(q)}</b>${q.analysis?` | 解析：${esc(q.analysis)}`:''}</div>
        </div>`;
      }).join('')}
      ${fail.length?`<div class="preview-card"><div class="fail-reason">⚠️ ${fail.length} 条数据未能识别（见控制台或修正后重试）</div></div>`:''}
      ${!ok.length&&fail.length?`<div class="preview-card"><div class="fail-reason">${fail.map(f=>`${f.line}：${f.reason}`).join('<br>')}</div></div>`:''}
    </div>`;
}

function normalize(it, from, ok, fail){
  try{
    const type = TYPE_MAP[String(it.type||'单选').trim().toLowerCase()] || 'single';
    const stem = String(it.stem||'').trim();
    if(!stem) throw '题干为空';
    let options, answer;
    if(type==='judge'){
      options = JUDGE_OPTS.map(o=>({...o}));
      answer = parseJudgeAnswer(it.answer);
      if(!answer.length) throw '答案无法识别：'+(it.answer||'空');
    }else{
      const raw = Array.isArray(it.options)?it.options:String(it.options||'').split(/[;；]/);
      options = raw.map((t,i)=>({k:LETTERS[i]||String.fromCharCode(65+i),t:String(t).trim()})).filter(o=>o.t).slice(0,MAX_OPT);
      if(options.length<2) throw '选项不足 2 个';
      answer = parseAnswer(type, it.answer, options.map(o=>o.k));
      if(!answer.length) throw '答案无法识别或超出选项范围：'+(it.answer||'空');
    }
    ok.push({id:uid(),type,stem,options,answer,analysis:String(it.analysis||'').trim(),from});
  }catch(e){ fail.push({line:from,reason:e.message||String(e)}); }
}

function doImport(){
  const {ok,fail} = window._imp||{};
  if(!ok||!ok.length){ toast('没有可导入的数据，请先解析预览','err'); return; }
  const name = (document.getElementById('impName')?.value||'').trim();
  questions = ok.map(({id,type,stem,options,answer,analysis})=>({id,type,stem,options,answer,analysis})).concat(questions);
  closeModal(); render();
  toast(name ? `「${name}」成功导入 ${ok.length} 题` : `成功导入 ${ok.length} 题`);
}

render();
</script>
