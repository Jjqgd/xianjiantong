<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能题库导入系统</title>
<!-- 引入 SheetJS 解析 Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary-color: #d03f3f;
  --success-color: #67c23a;
  --warning-color: #e6a23c;
  --text-main: #303133;
  --text-regular: #606266;
  --border-color: #dcdfe6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f3f5;color:var(--text-main);font-size:14px;-webkit-font-smoothing:antialiased}
.container{max-width:800px;margin:0 auto;padding:16px}
.page-header{text-align:center;margin-bottom:20px;padding-top:20px}
.page-header h2{font-size:20px;color:var(--primary-color);font-weight:600}
.page-header p{font-size:12px;color:#999;margin-top:6px}
.rules-card{background:#fff;border:1px solid #ffecec;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.02)}
.rules-card h4{color:var(--primary-color);font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.rules-card ul{list-style:none;padding-left:16px}
.rules-card li{padding:4px 0;color:var(--text-regular);line-height:1.6;font-size:13px}
.rules-card code{background:#fff5f5;padding:2px 6px;border-radius:4px;font-size:12px;color:var(--primary-color);font-family:monospace}
.input-name{width:100%;padding:12px 16px;border:1px solid var(--border-color);border-radius:8px;font-size:14px;outline:none;background:#fff;transition:border-color .2s}
.input-name::placeholder{color:#c0c4cc}
.input-name:focus{border-color:var(--primary-color)}
.import-tabs{display:flex;gap:12px;margin:20px 0 16px}
.import-tabs button{flex:1;padding:12px 0;border:1px solid var(--primary-color);border-radius:8px;background:transparent;color:var(--primary-color);font-size:14px;font-weight:500;transition:all .2s}
.import-tabs button.active{background:var(--primary-color);color:#fff}
.file-zone{border:2px dashed #fcdada;border-radius:12px;background:#fff;padding:40px 20px;text-align:center;transition:all .2s}
.file-zone .icon{font-size:32px;margin-bottom:12px;opacity:.6}
.file-zone .text{font-size:12px;color:#999}
.file-zone .file-name{color:var(--primary-color);font-weight:600;margin-top:8px}
.file-zone input[type=file]{display:none}
.upload-btn{margin-top:16px;padding:8px 20px;border:1px solid var(--border-color);border-radius:20px;background:#fff;font-size:13px;cursor:pointer}
.paste-area{width:100%;height:220px;padding:12px;border:1px solid var(--border-color);border-radius:8px;font-size:13px;font-family:monospace;resize:none;outline:none;transition:border-color .2s}
.paste-area:focus{border-color:var(--primary-color)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.btn{flex:1;padding:14px 0;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn.parse{background:#fff;border:1px solid var(--border-color);color:var(--text-regular)}
.btn.parse:active{background:#f5f7fa}
.btn.confirm{background:var(--primary-color);color:#fff;box-shadow:0 4px 12px rgba(208,63,63,.2)}
.btn.confirm:active{transform:scale(0.98)}
.result-box{margin-top:24px;display:none}
.result-box h4{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stat-line{display:flex;gap:20px;font-size:14px;font-weight:600}
.stat-line .ok{color:var(--success-color)}
.stat-line .fail{color:var(--danger-color)}
.fail-list{background:#fff;border:1px solid #fef0f0;border-radius:8px;padding:16px;max-height:300px;overflow-y:auto;font-size:12px;color:#f56c6c;line-height:1.8}
.success-demo{margin-top:16px}
.demo-card{background:#fff;border:1px solid #ebeef5;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.02)}
.demo-card .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:8px}
.demo-card .tag.s{background:#ecf5ff;color:#409eff}
.demo-card .tag.m{background:#fdf6ec;color:var(--warning-color)}
.demo-card .tag.j{background:#f0f9eb;color:var(--success-color)}
.demo-card .stem{font-weight:600;font-size:15px;margin-bottom:10px}
.demo-card .opts{list-style:none}
.demo-card .opts li{padding:4px 0;font-size:13px;color:var(--text-regular)}
.demo-card .opts li.correct{color:var(--success-color);font-weight:600}
#listPage{display:none;max-width:100%;padding:0}
.list-top{padding:16px;background:#fff;border-bottom:1px solid #ebeef5;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.list-top h2{font-size:16px;font-weight:600}
.list-top .stat{font-size:12px;color:#999;margin-right:12px}
.q-card{background:#fff;border-bottom:1px solid #f0f2f5;padding:16px;margin-bottom:1px}
.q-card .meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.q-card .q-stem{font-size:15px;line-height:1.6;margin-bottom:12px}
.q-card .q-opts{list-style:none}
.q-card .q-opts li{padding:6px 0;border-bottom:1px dashed #f2f6fc;font-size:14px}
.q-card .q-opts li:last-child{border-bottom:none}
.q-card .q-opts li.right{color:var(--success-color);font-weight:600}
.q-card .ans{background:#f8f9fb;border-radius:6px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--text-regular);line-height:1.6}
.q-card .ans b{color:#409eff}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #ebeef5;padding:12px 24px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:2000;font-size:14px;display:none}
</style>
</head>
<body>

<!-- ==================== 导入页面 ==================== -->
<div id="importPage" class="container">
  <div class="page-header">
    <h2>📥 智能题库导入</h2>
    <p>系统会自动过滤空行与表头，智能适配表格结构</p>
  </div>

  <div class="rules-card">
    <h4>💡 格式说明</h4>
    <ul>
      <li><strong>不挑表头名称</strong>：系统会自动识别并跳过表头行</li>
      <li><strong>自动过滤空行</strong>：无需提前手动删除表格中的空行</li>
      <li>标准列顺序：题型 | 题目 | 选项 | 答案 | 解析</li>
    </ul>
  </div>

  <input class="input-name" id="libName" placeholder="请输入题库名称（如：劳动安全考试题库）">

  <div class="import-tabs">
    <button class="active" id="btnModeFile" onclick="switchMode('file')">选择文件</button>
    <button id="btnModeText" onclick="switchMode('text')">粘贴文本</button>
  </div>

  <!-- 文件上传模块 -->
  <div id="paneFile" class="file-zone">
    <div class="icon">📄</div>
    <div class="text">支持 .xlsx / .xls / .csv / .txt / .json</div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.json" onchange="onFileChange(this.files[0])">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">选择文件</button>
    <div id="fileNameDisplay" class="file-name"></div>
  </div>

  <!-- 文本粘贴模块 -->
  <div id="paneText" style="display:none">
    <textarea class="paste-area" id="textArea" placeholder="在此粘贴文本内容（支持Excel直接复制）"></textarea>
  </div>

  <div class="actions">
    <button class="btn parse" onclick="startParse()">解析并校验题库</button>
    <button class="btn confirm" onclick="confirmImport()">确认导入</button>
  </div>

  <!-- 解析结果展示 -->
  <div id="resultBox" class="result-box">
    <h4>
      <span>✅ 解析结果：</span>
      <span class="stat-line"><span class="ok" id="sucCount">成功 0 条</span><span class="fail" id="failCount">失败 0 条</span></span>
    </h4>
    <div id="failList" class="fail-list" style="display:none"></div>
    <div id="successDemo" class="success-demo"></div>
  </div>
</div>

<!-- ==================== 列表页面 ==================== -->
<div id="listPage">
  <div class="list-top">
    <h2>题库管理</h2>
    <div>
      <span class="stat" id="totalStat">共 0 题</span>
      <button style="padding:6px 12px;border:1px solid var(--border-color);border-radius:6px;background:#fff;font-size:12px;cursor:pointer" onclick="goBack()">返回导入</button>
    </div>
  </div>
  <div id="questionList"></div>
</div>

<div id="toast"></div>

<script>
/**
 * ============================================================
 * 1. 全局基础数据与配置 (Global Config)
 * ============================================================
 */
const APP_CONFIG = {
  MAX_OPT: 26,
  LETTERS: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
  TYPE_MAP: {
    '单选': 'single', '单选题': 'single', 'single': 'single', 's': 'single',
    '多选': 'multi', '多选题': 'multi', 'multi': 'multi', 'm': 'multi',
    '判断': 'judge', '判断题': 'judge', 'judge': 'judge', 'j': 'judge'
  },
  JUDGE_OPTS: [{k:'A',t:'正确'},{k:'B',t:'错误'}],
  NOISE_WORDS: ['正确答案','标准答案','答案','选项','下列','以及','和','与','及','或','包括','均','选','项','个','题','第'],
  JUDGE_TRUE: new Set(['正确','对','√','✓','✔','y','yes','t','true','1','是','a','ok','pass','真']),
  JUDGE_FALSE: new Set(['错误','错','×','✗','✘','n','no','f','false','0','否','b','ng','fail','假'])
};

/**
 * ============================================================
 * 2. 核心解析引擎 (Core Parser Engine)
 * ============================================================
 */
const CoreParser = (() => {
  
  const toHalf = (s) => {
    return String(s == null ? '' : s)
      .replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48))
      .replace(/[\uFF21-\uFF3A]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFF21 + 65))
      .replace(/[\uFF41-\uFF5A]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFF41 + 97))
      .replace(/[\u3000]/g, ' ');
  };

  const cleanNoise = (s) => {
    let res = toHalf(s).trim();
    APP_CONFIG.NOISE_WORDS.forEach(w => { res = res.split(w).join(' '); });
    return res;
  };

  const extractLetters = (raw) => {
    let s = cleanNoise(raw);
    if (!s) return [];
    
    s = s.replace(/([A-Z0-9])\s*[-~—–]\s*([A-Z0-9])/g, (m, p1, p2) => {
      let i1 = /[A-Z]/.test(p1) ? APP_CONFIG.LETTERS.indexOf(p1) + 1 : parseInt(p1);
      let i2 = /[A-Z]/.test(p2) ? APP_CONFIG.LETTERS.indexOf(p2) + 1 : parseInt(p2);
      if(i1 > i2) return m;
      let arr = [];
      for(let i=i1;i<=i2;i++) arr.push(i <= 26 ? APP_CONFIG.LETTERS[i-1] : i);
      return arr.join(' ');
    });

    s = s.replace(/[#|,，、;；:：.。·\/\\()（）\[\]{}<>《》"'“”‘’]+/g, ' ');
    s = s.replace(/([A-Za-z\u4e00-\u9fa5])(\d+)/g, '$1 $2').replace(/(\d+)([A-Za-z\u4e00-\u9fa5])/g, '$1 $2');
    
    let out = [];
    s.split(/\s+/).filter(Boolean).forEach(t => {
      if (/^[A-Z]+$/i.test(t)) out = out.concat(t.toUpperCase().split(''));
      else if (/^\d+$/.test(t)) {
        let n = parseInt(t, 10);
        if (n >= 1 && n <= APP_CONFIG.MAX_OPT) out.push(APP_CONFIG.LETTERS[n-1]);
      }
    });
    return [...new Set(out)];
  };

  const parseJudge = (raw) => {
    let s = cleanNoise(raw).toLowerCase().replace(/\s+/g, '');
    if (APP_CONFIG.JUDGE_TRUE.has(s) || APP_CONFIG.JUDGE_TRUE.has(s[0])) return ['A'];
    if (APP_CONFIG.JUDGE_FALSE.has(s) || APP_CONFIG.JUDGE_FALSE.has(s[0])) return ['B'];
    return [];
  };

  const parseItem = (rawItem) => {
    try {
      if (!rawItem) return null;
      
      const typeKey = String(rawItem.type || '').trim().toLowerCase();
      const type = APP_CONFIG.TYPE_MAP[typeKey] || 'single';
      const stem = String(rawItem.stem || '').trim();
      
      if (!stem) return { error: '题干为空' };

      let options = [];
      let answer = [];

      if (type === 'judge') {
        options = APP_CONFIG.JUDGE_OPTS.map(o => ({...o}));
        answer = parseJudge(rawItem.answer);
        if (!answer.length) return { error: '判断题答案无法识别' };
      } else {
        let rawOpts = rawItem.options;
        if (typeof rawOpts === 'string') {
          rawOpts = rawOpts.split(/[;；,，\s|]/).filter(Boolean);
        } else if (!Array.isArray(rawOpts)) {
          rawOpts = [];
        }

        options = rawOpts.map((t, i) => ({k: APP_CONFIG.LETTERS[i], t: String(t).trim()})).filter(o => o.t);
        
        if (options.length < 2) return { error: '有效选项不足 2 个' };
        
        if (options.length > APP_CONFIG.MAX_OPT) options = options.slice(0, APP_CONFIG.MAX_OPT);

        const validKeys = options.map(o => o.k);
        answer = extractLetters(rawItem.answer || '').filter(k => validKeys.includes(k));
        
        if (!answer.length) return { error: '答案中未包含有效选项字母' };
        if (type === 'single' && answer.length > 1) answer = [answer[0]];
      }

      return {
        id: Date.now() + Math.floor(Math.random() * 1000),
        type: type,
        stem: stem,
        options: options,
        answer: answer,
        analysis: String(rawItem.analysis || '').trim()
      };
    } catch (e) {
      return { error: e.message || '解析异常' };
    }
  };

  const parseText = (text) => {
    if (!text || !text.trim()) return [];
    
    if (text.trim().startsWith('[') || text.trim().startsWith('{')) {
      try {
        let jsonArr = JSON.parse(text);
        if (!Array.isArray(jsonArr)) jsonArr = [jsonArr];
        return jsonArr.map(item => ({
          type: item['type'] || item['题型'],
          stem: item['stem'] || item['题目'] || item['题干'],
          options: item['options'] || item['选项'],
          answer: item['answer'] || item['答案'],
          analysis: item['analysis'] || item['解析']
        }));
      } catch (e) { /* 失败则继续按 CSV 处理 */ }
    }

    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return [];

    let startIndex = 0;
    if (/题型|题目|题干|选项|答案|解析|type|stem|answer/i.test(lines[0])) {
      startIndex = 1;
    }

    const records = [];
    for (let i = startIndex; i < lines.length; i++) {
      const line = lines[i];
      let sep = '|';
      if (!line.includes('|') && line.includes('\t')) sep = '\t';
      else if (!line.includes('|') && !line.includes('\t') && line.includes(',')) sep = ',';
      
      const cols = line.split(sep).map(c => c.trim());
      records.push({
        type: cols[0],
        stem: cols[1],
        options: cols[2] || '',
        answer: cols[3],
        analysis: cols[4] || ''
      });
    }
    return records;
  };

  /**
   * 优化版 Excel 解析：智能识别表头并过滤空行
   */
  const parseExcelRows = (rows) => {
    if (!rows || rows.length === 0) return [];
    
    const cleanCell = c => String(c == null ? '' : c).trim();
    
    // 1. 智能过滤：如果第一行包含常规表头关键字，自动跳过
    let startIndex = 0;
    const firstRowStr = rows[0].map(cleanCell).join('|');
    if (/题型|题目|题干|选项|答案|解析|type|stem|answer/i.test(firstRowStr)) {
      startIndex = 1;
    }

    const records = [];
    for (let i = startIndex; i < rows.length; i++) {
      const row = rows[i].map(cleanCell);
      
      // 2. 过滤整行为空的情况
      if (!row.some(Boolean)) continue;
      
      // 3. 过滤掉只有“题型”和“题目”这两个表头关键字的行（兼容多行表头）
      if (row.every((cell, index) => !cell || ['题型','题目','题干','选项','答案','解析'].includes(cell))) {
        continue;
      }

      records.push({
        type: row[0] || '',
        stem: row[1] || '',
        options: row[2] ? row[2].split(/[;；|,，]/) : [],
        answer: row[3] || '',
        analysis: row[4] || ''
      });
    }
    return records;
  };

  return { parseItem, parseText, parseExcelRows };
})();

/**
 * ============================================================
 * 3. 状态管理与 UI 交互 (State & UI)
 * ============================================================
 */
let appState = {
  mode: 'file',
  tempRawRecords: [],
  finalParsedData: [],
  failErrors: []
};

function showToast(msg, type = 'ok') {
  let d = document.getElementById('toast');
  d.textContent = msg;
  d.style.display = 'block';
  d.style.borderLeft = type === 'err' ? '4px solid #f56c6c' : '4px solid #67c23a';
  clearTimeout(d._h);
  d._h = setTimeout(() => d.style.display = 'none', 2500);
}

window.switchMode = function(mode) {
  appState.mode = mode;
  document.getElementById('btnModeFile').className = mode === 'file' ? 'active' : '';
  document.getElementById('btnModeText').className = mode === 'text' ? 'active' : '';
  document.getElementById('paneFile').style.display = mode === 'file' ? 'block' : 'none';
  document.getElementById('paneText').style.display = mode === 'text' ? 'block' : 'none';
};

window.onFileChange = function(file) {
  if (!file) return;
  document.getElementById('fileNameDisplay').textContent = `已选：${file.name}`;
  const ext = file.name.split('.').pop().toLowerCase();

  const reader = new FileReader();
  
  if (['xlsx', 'xls'].includes(ext)) {
    if (!window.XLSX) { showToast('Excel解析组件未加载，请联网使用', 'err'); return; }
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, blankrows:false, defval:''});
        appState.tempRawRecords = CoreParser.parseExcelRows(rows);
        showToast('Excel读取成功，请点击解析按钮');
      } catch(err) { showToast('Excel文件读取失败', 'err'); }
    };
    reader.readAsArrayBuffer(file);
  } else if (ext === 'json') {
    reader.onload = (e) => {
      try {
        appState.tempRawRecords = CoreParser.parseText(e.target.result);
        showToast('JSON读取成功，请点击解析按钮');
      } catch(err) { showToast('JSON文件读取失败', 'err'); }
    };
    reader.readAsText(file);
  } else {
    reader.onload = (e) => {
      document.getElementById('textArea').value = e.target.result;
      switchMode('text');
      showToast('文本已载入，请点击解析按钮');
    };
    reader.readAsText(file);
  }
};

window.startParse = function() {
  appState.finalParsedData = [];
  appState.failErrors = [];

  if (appState.mode === 'file') {
    if (!appState.tempRawRecords.length) {
      showToast('请先选择或载入文件', 'err');
      return;
    }
  } else {
    const text = document.getElementById('textArea').value;
    if (!text.trim()) { showToast('请先粘贴文本内容', 'err'); return; }
    appState.tempRawRecords = CoreParser.parseText(text);
  }

  appState.tempRawRecords.forEach((raw, index) => {
    const res = CoreParser.parseItem(raw);
    if (res && !res.error) {
      appState.finalParsedData.push(res);
    } else {
      appState.failErrors.push({line: `第${index+1}行`, msg: res?.error || '数据异常'});
    }
  });

  renderResult();
};

function renderResult() {
  const box = document.getElementById('resultBox');
  box.style.display = 'block';

  document.getElementById('sucCount').textContent = `成功 ${appState.finalParsedData.length} 条`;
  document.getElementById('failCount').textContent = `失败 ${appState.failErrors.length} 条`;

  const failDiv = document.getElementById('failList');
  if (appState.failErrors.length > 0) {
    failDiv.style.display = 'block';
    failDiv.innerHTML = appState.failErrors.map(e => `${e.line}：${e.msg}`).join('<br>');
  } else {
    failDiv.style.display = 'none';
  }

  const demoDiv = document.getElementById('successDemo');
  if (appState.finalParsedData.length > 0) {
    let html = `<div style="font-size:13px;color:#999;margin-bottom:10px">解析成功示例（展示前 3 条）：</div>`;
    appState.finalParsedData.slice(0, 3).forEach(q => {
      html += `<div class="demo-card">
        <span class="tag ${q.type==='single'?'s':q.type==='multi'?'m':'j'}">${q.type==='single'?'单选题':q.type==='multi'?'多选题':'判断题'}</span>
        <div class="stem">${escapeHtml(q.stem)}</div>
        <ul class="opts">${q.options.map(o => `<li class="${q.answer.includes(o.k)?'correct':''}">${o.k}. ${escapeHtml(o.t)}</li>`).join('')}</ul>
      </div>`;
    });
    demoDiv.innerHTML = html;
    demoDiv.style.display = 'block';
  } else {
    demoDiv.style.display = 'none';
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

window.confirmImport = function() {
  if (!appState.finalParsedData.length) {
    showToast('没有可导入的数据，请先解析并校验', 'err');
    return;
  }
  localStorage.setItem('question_bank_data', JSON.stringify(appState.finalParsedData));
  const libName = document.getElementById('libName').value.trim() || '未命名题库';
  showToast(`✅ 成功导入 ${appState.finalParsedData.length} 题到 [${libName}]`);
  setTimeout(() => showPage('list'), 500);
};

window.showPage = function(page) {
  if (page === 'list') {
    document.getElementById('importPage').style.display = 'none';
    document.getElementById('listPage').style.display = 'block';
    renderListPage();
  } else {
    document.getElementById('importPage').style.display = 'block';
    document.getElementById('listPage').style.display = 'none';
  }
};

window.goBack = function() {
  showPage('import');
  appState.tempRawRecords = [];
  appState.finalParsedData = [];
  document.getElementById('fileInput').value = '';
  document.getElementById('fileNameDisplay').textContent = '';
  document.getElementById('resultBox').style.display = 'none';
};

function renderListPage() {
  let data = [];
  try { data = JSON.parse(localStorage.getItem('question_bank_data') || '[]'); } catch(e){}
  
  document.getElementById('totalStat').textContent = `共 ${data.length} 题`;
  const listDiv = document.getElementById('questionList');
  
  if (data.length === 0) {
    listDiv.innerHTML = '<div style="text-align:center;padding:60px 0;color:#999;font-size:14px">暂无题目，请返回导入页添加题目</div>';
    return;
  }

  listDiv.innerHTML = data.map(q => `
    <div class="q-card">
      <div class="meta">
        <span class="tag ${q.type==='single'?'s':q.type==='multi'?'m':'j'}" style="font-size:12px;font-weight:600">${q.type==='single'?'单选题':q.type==='multi'?'多选题':'判断题'}</span>
      </div>
      <div class="q-stem">${escapeHtml(q.stem)}</div>
      <ul class="q-opts">${q.options.map(o => `<li class="${q.answer.includes(o.k)?'right':''}">${o.k}. ${escapeHtml(o.t)}</li>`).join('')}</ul>
      <div class="ans">答案：<b>${q.answer.join('、')}</b>${q.analysis ? ` | 解析：${escapeHtml(q.analysis)}` : ''}</div>
    </div>
  `).join('');
}

showPage('import');

</script>
</body>
</html>
