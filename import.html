<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>导入新题库 - 铁途学练</title>
<link rel="icon" href="logo.png">

<!-- 🔒 最强防盗锁 -->
<script>
  (function() {
    var allowedDomains = ["jjqgd.github.io", "localhost", "127.0.0.1"];
    var host = window.location.hostname;
    var isAllowed = false;
    for (var i = 0; i < allowedDomains.length; i++) {
      if (host === allowedDomains[i] || host.endsWith("." + allowedDomains[i])) { isAllowed = true; break; }
    }
    if (!isAllowed) {
      document.documentElement.innerHTML = '';
      var warn = document.createElement('div');
      warn.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;';
      warn.innerHTML = '<div style="font-size:60px;margin-bottom:20px;">🛑</div><h2 style="color:#d32f2f;font-size:24px;font-weight:bold;">未经授权，禁止盗用</h2><p style="color:#666;font-size:14px;">此系统受版权保护。</p>';
      document.body.appendChild(warn);
      setInterval(function(){}, 99999); 
      throw new Error("Unauthorized Domain Access");
    }
  })();
</script>

<script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  body { background-color: #f0f4f8; color: #1e293b; padding: 10px; -webkit-tap-highlight-color: transparent; }
  .nav { background: #fff; padding: 10px 15px; border-bottom: 2px solid #b71c1c; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; margin-bottom: 10px; }
  .nav-logo { font-size: 1.2rem; font-weight: bold; color: #b71c1c; display: flex; align-items: center; gap: 8px; }
  .nav-logo img { width: 30px; height: 30px; object-fit: contain; }
  .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .btn { border: none; border-radius: 8px; padding: 12px 15px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: #0d47a1; color: #fff; }
  .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
  .footer { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: 20px; padding-bottom: 20px; }
  
  input[type="file"] {
    display: block !important;
    width: 100%;
    padding: 20px 10px;
    border: 2px dashed #0d47a1;
    border-radius: 8px;
    background-color: #eff6ff;
    color: #0d47a1;
    font-size: 1rem;
    font-weight: bold;
    outline: none;
    cursor: pointer;
  }

  /* App 专属弹窗与输入框样式 */
  .modal-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .modal-header { padding: 15px; background: #fff; color: #b71c1c; font-weight: bold; border-bottom: 1px solid #eee; font-size: 1.1rem; text-align: center; }
  .modal-body { padding: 20px; font-size: 0.95rem; line-height: 1.6; color: #333; text-align: center; max-height: 60vh; overflow-y: auto;}
  .modal-footer { padding: 15px; text-align: center; border-top: 1px solid #eee; display: flex; gap: 10px; }
  .modal-footer .btn { flex: 1; }
  
  .custom-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; margin-top: 10px; text-align: center; }
  .custom-input:focus { border-color: #0d47a1; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">
    <img src="logo.png" onerror="this.style.display='none'"> 导入新题库
  </div>
</div>

<div class="card" style="text-align:center; padding:40px 15px;">
  <h2 style="color:#b71c1c;margin-bottom:15px;">📥 上传文件</h2>
  <p style="color:#64748b;font-size:0.9rem;margin-bottom:20px;line-height:1.6;">
    支持 Excel 格式。<br>系统将进行严格对齐，并在入库前生成报告。
  </p>
  
  <input type="file" id="fileUpload" accept=".xlsx,.xls,.csv" onchange="handleFileSelect(event)">
  
  <div id="loadingText" style="display:none; margin-top:20px; color:#0d47a1; font-weight:bold;">正在解析并校验数据，请稍候...</div>

  <button class="btn btn-outline" onclick="window.location.href='index.html'" style="margin-top:20px;">取消并返回首页</button>
</div>
<div class="footer">技术支持：秦十三郎</div>

<!-- 通用 App 弹窗容器 -->
<div id="appModal" class="modal-mask" style="display:none;">
  <div class="modal-box">
    <div class="modal-header" id="modalTitle">铁途学练提示</div>
    <div class="modal-body" id="modalBody">
      <div id="modalText"></div>
      <input type="text" id="modalInput" class="custom-input" style="display:none;">
    </div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
var pendingQuestions = []; 
var pendingName = "";

// ================= App 专属弹窗系统 =================
function showAlert(title, msg, onOk) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalText').innerHTML = msg;
  document.getElementById('modalInput').style.display = 'none';
  var footer = document.getElementById('modalFooter');
  footer.innerHTML = `<button class="btn btn-primary" onclick="closeModal()">我知道了</button>`;
  window.onModalClose = onOk || null;
  document.getElementById('appModal').style.display = 'flex';
}

function showConfirm(title, msg, onOk, onCancel) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalText').innerHTML = msg;
  document.getElementById('modalInput').style.display = 'none';
  var footer = document.getElementById('modalFooter');
  footer.innerHTML = `
    <button class="btn btn-outline" onclick="closeModal(true)">取消</button>
    <button class="btn btn-primary" onclick="closeModal(false)">确认导入</button>
  `;
  window.onModalOk = onOk;
  window.onModalCancel = onCancel || null;
  document.getElementById('appModal').style.display = 'flex';
}

function showPrompt(title, defaultValue, onOk, onCancel) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalText').innerText = '请为该题库命名：';
  var input = document.getElementById('modalInput');
  input.style.display = 'block';
  input.value = defaultValue;
  var footer = document.getElementById('modalFooter');
  footer.innerHTML = `
    <button class="btn btn-outline" onclick="closeModal(true)">取消</button>
    <button class="btn btn-primary" onclick="submitModal()">确定</button>
  `;
  window.onModalOk = onOk;
  window.onModalCancel = onCancel || null;
  document.getElementById('appModal').style.display = 'flex';
  setTimeout(function(){ input.focus(); }, 100);
}

function closeModal(isCancel) {
  document.getElementById('appModal').style.display = 'none';
  if (isCancel && window.onModalCancel) window.onModalCancel();
  else if (!isCancel && window.onModalOk) window.onModalOk();
}

function submitModal() {
  var val = document.getElementById('modalInput').value.trim();
  if (!val) { alert('名称不能为空！'); return; }
  document.getElementById('appModal').style.display = 'none';
  if (window.onModalOk) window.onModalOk(val);
}

// ================= 核心逻辑 =================
function handleFileSelect(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('loadingText').style.display = 'block';
  
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var data = new Uint8Array(evt.target.result);
      var wb = XLSX.read(data, {type: 'array'});
      var result = parseExcel(wb);
      
      var parsed = result.data;
      var errors = result.errors;
      var stats = result.stats;

      document.getElementById('loadingText').style.display = 'none';

      if (parsed.length === 0) {
        return showAlert('解析失败', '未能提取到任何有效题目，请检查表格中是否有“题目”和“答案”列。');
      }

      pendingQuestions = parsed;
      pendingName = file.name.replace(/\.[^/.]+$/, "");

      // 生成导入报告
      var reportHtml = `
        <div style="text-align:left; margin-bottom:15px; padding:15px; background:#f0f4f8; border-radius:8px;">
          <div style="font-size:1.1rem; font-weight:bold; color:#0d47a1; margin-bottom:10px;">📊 解析报告</div>
          <div>成功抓取题目：<b style="color:#b71c1c; font-size:1.2rem;">${parsed.length}</b> 题</div>
          <div style="margin-top:8px; color:#666; font-size:0.9rem;">
            单选题：${stats.single} 题<br>
            多选题：${stats.multiple} 题<br>
            判断题：${stats.judge} 题
          </div>
        </div>
      `;

      if (errors.length > 0) {
        reportHtml += `<div style="text-align:left; color:#d32f2f; font-weight:bold; margin-bottom:10px;">⚠️ 拦截异常行 (共 ${errors.length} 条):</div>`;
        reportHtml += `<div style="text-align:left; font-size:0.85rem; max-height:150px; overflow-y:auto; background:#fff5f5; padding:10px; border-radius:8px; border:1px solid #ffcdd2;">`;
        errors.forEach(function(err) {
          reportHtml += `<div style="margin-bottom:6px; border-bottom:1px dashed #ffcdd2; padding-bottom:4px;">
            <strong>${err.pos}</strong>：${err.msg}
          </div>`;
        });
        reportHtml += `</div>`;
      }

      // 弹出确认窗口
      showConfirm('导入确认', reportHtml, function() {
        // 确认导入，进入命名
        showPrompt('命名题库', pendingName, function(bankName) {
          saveAndGo(bankName);
        }, function() {
          saveAndGo(pendingName);
        });
      }, function() {
        // 取消导入
        document.getElementById('fileUpload').value = '';
      });

    } catch(err) {
      document.getElementById('loadingText').style.display = 'none';
      showAlert('解析失败', err.message || '请检查表格格式');
    }
  };
  reader.readAsArrayBuffer(file);
}

function saveAndGo(bankName) {
  var newId = 'bank_' + Date.now();
  localStorage.setItem('xjt_new_import', JSON.stringify({
    id: newId,
    name: bankName,
    questions: pendingQuestions
  }));
  window.location.href = 'index.html';
}

// ================= 绝对死锁对齐引擎 =================
function parseExcel(wb) {
  var allParsed = [];
  var errorList = []; 
  var stats = { single: 0, multiple: 0, judge: 0 };
  
  wb.SheetNames.forEach(function(sheetName) {
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: false });
    if (!rows || rows.length < 2) return;

    var colQ = -1, colAns = -1, colAna = -1, colType = -1;
    var optCols = [];
    var headerRowIndex = -1;

    // 1. 锁定表头（扩大匹配范围，保证兼容所有题库）
    for (var r = 0; r < Math.min(rows.length, 30); r++) {
      var row = rows[r];
      if (!row || row.length === 0) continue;
      
      var tempQ = -1, tempAns = -1, tempAna = -1, tempType = -1;
      var tempOpts = [];

      for (var c = 0; c < row.length; c++) {
        var h = String(row[c] || '').trim().toLowerCase();
        if (!h) continue;

        if (tempQ === -1 && (h.indexOf('题目') > -1 || h.indexOf('题干') > -1 || h.indexOf('试题') > -1 || h.indexOf('问题') > -1 || h.indexOf('内容') > -1 || h === 'question')) tempQ = c;
        else if (tempAns === -1 && (h.indexOf('答案') > -1 || h === 'answer')) tempAns = c;
        else if (tempAna === -1 && (h.indexOf('解析') > -1 || h.indexOf('说明') > -1 || h.indexOf('备注') > -1 || h.indexOf('出处') > -1 || h.indexOf('分析') > -1)) tempAna = c;
        else if (tempType === -1 && (h.indexOf('题型') > -1 || h.indexOf('类型') > -1 || h === 'type')) tempType = c;
        else if (h.indexOf('选项') > -1 || h.indexOf('选择项') > -1 || /^[a-g]$/i.test(h) || /^[a-g]选项$/i.test(h) || /^选择项\d+$/i.test(h)) tempOpts.push(c);
      }

      if (tempQ !== -1 && tempAns !== -1) {
        colQ = tempQ; colAns = tempAns; colAna = tempAna; colType = tempType;
        optCols = tempOpts; headerRowIndex = r;
        break;
      }
    }

    if (headerRowIndex === -1) return; 

    // 2. 逐行绝对对齐提取
    for (var r = headerRowIndex + 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row || row.length === 0) continue;

      var qText = String(row[colQ] || '').trim();
      if (!qText) continue; // 没题目直接跳过

      var opts = [];
      for (var o = 0; o < optCols.length; o++) {
        var val = String(row[optCols[o]] || '').trim();
        if (val) opts.push(val);
      }

      var ansRaw = String(row[colAns] || '').trim().toUpperCase();
      var anaText = colAna !== -1 ? String(row[colAna] || '').trim() : '';
      var typeStr = colType !== -1 ? String(row[colType] || '').trim().toLowerCase() : '';
      var excelRow = r + 1; 

      if (!ansRaw) {
        errorList.push({ pos: `第 ${excelRow} 行`, msg: `题目【${qText.substring(0,10)}...】缺少答案` });
        continue;
      }

      // 清洗多选特殊字符
      ansRaw = ansRaw.replace(/[，、\s\/\#\-]/g, ',');
      var type = 'single';
      var ansIndices = [];
      
      var judgeT = ['正确','对','T','TRUE','Y','YES','√','V','是','A'];
      var judgeF = ['错误','错','不对','F','FALSE','N','NO','×','X','否','B'];

      // 题型判定
      if (typeStr.indexOf('判') > -1 || judgeT.indexOf(ansRaw) > -1 || judgeF.indexOf(ansRaw) > -1) {
        type = 'judge';
        opts = ['正确', '错误']; 
        if (judgeT.indexOf(ansRaw) > -1) ansIndices = [0];
        else if (judgeF.indexOf(ansRaw) > -1) ansIndices = [1];
      } 
      
      if (ansIndices.length === 0) {
        var letters = ansRaw.match(/[A-G]/g) || [];
        if (typeStr.indexOf('多') > -1 || letters.length > 1) {
          type = 'multiple';
        }
        for (var l = 0; l < letters.length; l++) {
          var idx = letters[l].charCodeAt(0) - 65;
          if (ansIndices.indexOf(idx) === -1) ansIndices.push(idx);
        }
        ansIndices.sort();
      }

      if (ansIndices.length === 0) {
        errorList.push({ pos: `第 ${excelRow} 行`, msg: `题目【${qText.substring(0,10)}...】的答案【${ansRaw}】无法解析为字母` });
        continue;
      }

      // 校验选项是否存在
      var maxAns = Math.max.apply(null, ansIndices);
      if (opts.length <= maxAns && type !== 'judge') {
         errorList.push({ pos: `第 ${excelRow} 行`, msg: `题目【${qText.substring(0,10)}...】答案选了 ${String.fromCharCode(65+maxAns)}，但表格缺失该选项` });
         continue;
      }

      allParsed.push({
        id: 'q_' + r + '_' + Date.now() + Math.floor(Math.random()*1000),
        question: qText,
        type: type,
        options: opts.length > 1 ? opts : (type === 'judge' ? ['正确', '错误'] : opts), 
        answer: ansIndices,
        analysis: anaText, 
        streak: 0
      });
      
      stats[type]++;
    }
  });

  return { data: allParsed, errors: errorList, stats: stats };
}
</script>
</body>
</html>
