/* ===== 搜题 ===== */
function openSearch() {
  searchKeyword = ''; searchType = 'all'; var mask = document.createElement('div'); mask.className = 'search-mask'; mask.id = 'searchModal';
  mask.innerHTML = `<div class="search-box">
    <div class="search-header"><h3>🔍 题库搜索</h3><button class="btn btn-outline" style="padding:4px 10px; font-size:0.85rem;" onclick="document.body.removeChild(document.getElementById('searchModal'))">关闭</button></div>
    <div class="search-input-group">
      <input type="text" id="searchInput" placeholder="输入题目或笔记关键字..." oninput="doSearch()">
      <div class="search-filters">
        <button class="${searchType === 'all' ? 'active' : ''}" onclick="setSearchType('all')">全部</button>
        <button class="${searchType === 'single' ? 'active' : ''}" onclick="setSearchType('single')">单选</button>
        <button class="${searchType === 'multiple' ? 'active' : ''}" onclick="setSearchType('multiple')">多选</button>
        <button class="${searchType === 'judge' ? 'active' : ''}" onclick="setSearchType('judge')">判断</button>
        <button class="${searchType === 'fill' ? 'active' : ''}" onclick="setSearchType('fill')">填空</button>
      </div>
    </div>
    <div class="search-results" id="searchResults"><div style="text-align:center; color:#94a3b8; margin-top:20px;">请输入关键字开始搜索...</div></div>
  </div>`;
  document.body.appendChild(mask); setTimeout(function(){ document.getElementById('searchInput').focus(); }, 100);
}

function setSearchType(type) {
  searchType = type; var btns = document.querySelectorAll('.search-filters button'); btns.forEach(function(btn) { btn.classList.remove('active'); });
  var typeMap = { all:0, single:1, multiple:2, judge:3, fill:4, short:5, essay:6 };
  if (typeMap[type] !== undefined) btns[typeMap[type]].classList.add('active');
  doSearch();
}

function doSearch() {
  var keyword = document.getElementById('searchInput').value.trim(); var resDiv = document.getElementById('searchResults');
  if (!keyword) { resDiv.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:20px;">请输入关键字开始搜索...</div>'; return; }
  
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  var results = []; 
  
  for (var i = 0; i < qs.length; i++) { 
    var q = qs[i]; 
    if (searchType !== 'all' && q.type !== searchType) continue; 
    
    if (q.question.indexOf(keyword) > -1) { 
      results.push({ q: q, matchType: '题目' }); 
      continue;
    }
    var note = getNotes()[getQKeyForNote(q)];
    if (note && note.text && note.text.indexOf(keyword) > -1) {
      results.push({ q: q, matchType: '笔记' });
    }
  }
  
  if (results.length === 0) { resDiv.innerHTML = '<div style="text-align:center; color:#ef4444; margin-top:20px;">没有找到相关题目或笔记...</div>'; return; }
  
  var html = ''; 
  for (var j = 0; j < results.length; j++) { 
    var r = results[j]; var tName = TYPE_NAMES[r.q.type] || '未知'; 
    html += `<div class="search-item" onclick="jumpToSearchResult(${qs.indexOf(r.q)})">
      <div class="s-title">${r.q.question}</div>
      <div class="s-type" style="color:${r.matchType==='笔记'?'#f59e0b':'#64748b'};">[${r.matchType}匹配] 题型：${tName}</div>
    </div>`; 
  }
  resDiv.innerHTML = html;
}
function jumpToSearchResult(idx) { 
  document.body.removeChild(document.getElementById('searchModal')); 
  practiceQuestions = allBanks[activeBankId].questions.slice(); 
  practiceIndex = idx; 
  practiceSelections = []; 
  isWrongPracticeMode = false; 
  currentMode = 'recite'; 
  installBackGuard();
  render(); 
}
/* ===== 答题卡：练习模式对错配色 ===== */
function buildSheetHtml(questions, currentIdx, selections, type) {
  var groups = { single: [], multiple: [], judge: [], fill: [], short: [], essay: [] };
  for (var k = 0; k < questions.length; k++) { if (groups[questions[k].type]) groups[questions[k].type].push({ idx: k, q: questions[k] }); }
  var html = '';
  var types = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var jumpFn = 'jumpPractice';
  if (type === 'exam') jumpFn = 'jumpExam';
  else if (type === 'examReview') jumpFn = 'jumpExamReview';
  else if (type === 'recite') jumpFn = 'jumpRecite';
  else if (type === 'review') jumpFn = 'jumpReview';
  else if (type === 'favReview') jumpFn = 'jumpFav';

  for (var t = 0; t < types.length; t++) {
    var tp = types[t]; var items = groups[tp]; if (items.length === 0) continue;
    html += `<div class="acc-group"><div class="acc-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span style="font-size:1.05rem;">${TYPE_NAMES[tp]}</span><span>共 ${items.length} 题</span></div><div class="acc-body">`;
    for (var i = 0; i < items.length; i++) {
      var item = items[i]; var cls = 'num-btn'; var s = selections[item.idx] || [];
      
      // 根据模式决定答题卡的颜色
      if (type === 'practice') {
        if (item.q.isAnswered) {
          if (isSubjective(item.q.type)) cls += ' right';
          else {
            var okP = s.length === item.q.answer.length && s.every(function(v){ return item.q.answer.indexOf(v) > -1; });
            cls += okP ? ' right' : ' wrong';
          }
        }
      } else if (type === 'recite' || type === 'review' || type === 'favReview') { 
        cls += ' right'; 
      } else if (type === 'exam') { 
        if (s.length > 0 || isSubjective(item.q.type)) cls += ' right'; 
      } else if (type === 'examReview') {
        if (isSubjective(item.q.type)) { if (s.length > 0) cls += ' right'; }
        else if (s.length > 0) {
          var ok = s.length === item.q.answer.length && s.every(function(v){ return item.q.answer.indexOf(v) > -1; });
          cls += ok ? ' right' : ' wrong';
        }
      }
      var mi = getQMarkInfo(item.q);
      var dotHtml = mi.dot ? `<span style="position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:${mi.color}; border-radius:50%; box-shadow:0 0 0 1px #fff;"></span>` : '';
      html += `<div class="${cls}" style="position:relative;" onclick="${jumpFn}(${item.idx})">${item.idx+1}${dotHtml}</div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

/* ===== 练习/背题入口 ===== */
function startReviewDue() {
  if (!guardGate()) return;
  var due = getDueWrongList();
  if (due.length === 0) return showToast('今天没有待复习的错题', true);
  practiceQuestions = due.slice();
  isWrongPracticeMode = true;
  practiceSource = 'dueReview';
  practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) {
    practiceQuestions[i].isAnswered = isSubjective(practiceQuestions[i].type);
    if (practiceQuestions[i].streak === undefined) practiceQuestions[i].streak = 0;
    ensureReviewFields(practiceQuestions[i]);
  }
  currentMode = 'practice'; savePracticeProgress(); installBackGuard(); render();
}

function startPractice(type) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  if (type === 'wrong') {
    if (wrongBook.length === 0) return showToast('错题本为空', true);
    practiceQuestions = wrongBook.slice(); isWrongPracticeMode = true;
  } else if (type === 'fav') {
    if (favorites.length === 0) return showToast('收藏夹为空', true);
    practiceQuestions = qs.filter(function(q){ return isFav(q); }); isWrongPracticeMode = false;
  } else {
    if (qs.length === 0) return showToast('题库为空', true);
    if (type === 'all') practiceQuestions = qs.slice();
    else if (type === 'random') { practiceQuestions = qs.slice().sort(function(){ return 0.5 - Math.random(); }); showToast('已为您打乱顺序'); }
    else practiceQuestions = qs.filter(function(q){ return q.type === type; });
    isWrongPracticeMode = false;
  }
  if (practiceQuestions.length === 0) return showToast('该分类下暂无题目', true);
  practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) {
    practiceQuestions[i].isAnswered = isSubjective(practiceQuestions[i].type);
    if (practiceQuestions[i].streak === undefined) practiceQuestions[i].streak = 0;
  }
  currentMode = 'practice'; savePracticeProgress(); installBackGuard(); render();
}

function startRecite(type) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : []; if (qs.length === 0) return showToast('题库为空', true);
  reciteJudgeFilter = 'all';
  var allQs = type === 'all' ? qs.slice() : qs.filter(function(q){ return q.type === type; });
  if (allQs.length === 0) return showToast('该分类下暂无题目', true);
  practiceQuestions = allQs; practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = true; }
  isWrongPracticeMode = false; currentMode = 'recite'; savePracticeProgress(); installBackGuard(); render();
}

function changeReciteFilter(filterType) {
  reciteJudgeFilter = filterType; var qs = activeBankId ? allBanks[activeBankId].questions : []; var baseQs = qs.filter(function(q){ return q.type === 'judge'; });
  if (filterType === 'true') { practiceQuestions = baseQs.filter(function(q){ return q.answer.indexOf(0) > -1; }); }
  else if (filterType === 'false') { practiceQuestions = baseQs.filter(function(q){ return q.answer.indexOf(1) > -1; }); }
  else { practiceQuestions = baseQs; }
  if (practiceQuestions.length === 0) { showToast('该过滤条件下暂无题目', true); practiceQuestions = baseQs; }
  else { practiceIndex = 0; practiceSelections = []; for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = true; } render(); }
}

function buildQuestionHtml(q, sels, showAns, isReciteJudge) {
  if (q.type === 'judge' && (!q.options || q.options.length === 0)) q.options = ['正确', '错误'];
  if (isSubjective(q.type)) {
    var ansText = typeof q.answer === 'string' ? q.answer : (Array.isArray(q.answer) ? q.answer.join('；') : '');
    if (!showAns) return `<div class="subjective-answer" style="border-color:var(--border-color);"><div class="sa-title" style="color:var(--text-sub);">📝 本题为主观题，请自行作答</div></div>`;
    return `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansText}</div></div>`;
  }

  var renderQ = JSON.parse(JSON.stringify(q));
  
  // ★ 核心修复：使用缓存键，保证每次重渲染时选项顺序一致
  if (randomOptionsMode && (renderQ.type === 'single' || renderQ.type === 'multiple')) {
    var cacheKey = getQKey(q);
    if (!window._randomOptCache) window._randomOptCache = {};
    
    if (!window._randomOptCache[cacheKey]) {
      var idxArr = renderQ.options.map(function(_, i){ return i; });
      idxArr.sort(function(){ return Math.random() - 0.5; });
      window._randomOptCache[cacheKey] = {
        options: idxArr.map(function(i){ return renderQ.options[i]; }),
        answer: renderQ.answer.map(function(oldIdx){ return idxArr.indexOf(oldIdx); })
      };
    }
    renderQ.options = window._randomOptCache[cacheKey].options;
    renderQ.answer = window._randomOptCache[cacheKey].answer;
  }

  var optsHtml = '';
  for (var i = 0; i < renderQ.options.length; i++) {
    var cls = 'opt';
    if (showAns) {
      if (renderQ.answer.indexOf(i) > -1) cls += ' correct';
      else if (sels && sels.indexOf(i) > -1) cls += ' wrong';
    } else if (sels && sels.indexOf(i) > -1) { cls += ' selected'; }
    var clickAction = isReciteJudge ? `onclick="toggleReciteJudge(${i})"` : `onclick="selectPractice(${i})"`;
    optsHtml += `<div class="${cls}" ${clickAction}><div class="opt-prefix">${String.fromCharCode(65+i)}</div><div>${renderQ.options[i]}</div></div>`;
  }
  return optsHtml;
}

function buildAnalysisHtml(q, sels, showAns) {
  if (!showAns) return '';
  var isCorrect = true;
  if (!isSubjective(q.type)) {
    isCorrect = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
  }
  var ansDisplay = isSubjective(q.type)
    ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；'))
    : q.answer.map(function(i){ return String.fromCharCode(65+i); }).join(', ');
  return `<div class="analysis show ${isCorrect ? 'success' : 'error'}"><div style="font-weight:bold;margin-bottom:5px;">正确答案：<span style="color:#10b981;">${ansDisplay}</span></div>${q.analysis ? `<div style="margin-top:8px; font-weight:bold; color:#0d47a1;">解析：</div><div style="color:var(--text-main); margin-top:4px;">${q.analysis}</div>` : ''}</div>`;
}

function renderPractice() {
  if (practiceIndex >= practiceQuestions.length) {
    localStorage.removeItem('xjt_practice_progress');
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:40px;"><h2 style="color:#0d47a1;margin-bottom:15px;">🎉 练习完成</h2><p style="color:var(--text-sub);margin-bottom:20px;">您已完成本轮练习。</p><button class="btn btn-primary btn-block" onclick="currentMode='home';render()">返回首页</button></div>`;
    return;
  }
  var q = practiceQuestions[practiceIndex];
  var sels = practiceSelections[practiceIndex] || [];
  var showAns = q.isAnswered && autoShowAnswer;
  var isCorrect = showAns && (isSubjective(q.type) || (sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; })));
  
  // ★ 核心：渲染带高亮的题目文本
  var qTextHtml = renderQTextWithMarks(q, isNoteMarkMode, window.onWordClick);
  
  // ★ 雷达高亮修复：不在笔记模式时，自动高亮陷阱词
  if (!isNoteMarkMode) {
    var traps = checkTrapWords(q.question);
    if (traps.length > 0) {
      var tempDiv = document.createElement('div');
      tempDiv.innerText = q.question;
      var safeText = tempDiv.innerHTML;
      for (var t = 0; t < traps.length; t++) {
        var word = traps[t];
        var safeWord = escapeRegExp(word);
        var reg = new RegExp(safeWord, 'g');
        safeText = safeText.replace(reg, function(m){ return '<span style="color:#dc2626; font-weight:bold; text-decoration:underline;">' + m + '</span>'; });
      }
      qTextHtml = safeText;
    }
  }

  var optsHtml = buildQuestionHtml(q, sels, showAns, false);
  var typeName = TYPE_NAMES[q.type] || '未知题型';
  
  var targetStreak = parseInt(localStorage.getItem('xjt_streak_target')) || 5;
  var streakHtml = isWrongPracticeMode ? `<span style="font-size:0.8rem;color:#ef4444;font-weight:bold; cursor:pointer;" onclick="showStreakSetting()">🔥连对: ${q.streak||0}/${targetStreak} ⚙️</span>` : '';
  
  var sheetHtml = buildSheetHtml(practiceQuestions, practiceIndex, practiceSelections, 'practice');
  var feedbackAnim = '';
  if (showAns && !isSubjective(q.type)) {
    feedbackAnim = `<div class="feedback-badge"><div class="feedback-text">${isCorrect ? '对' : '错'}</div></div>`;
  }

function selectPractice(idx) {
  if (currentMode === 'recite') return;
  var q = practiceQuestions[practiceIndex];
  if (q.isAnswered || isSubjective(q.type)) return;
  var sels = practiceSelections[practiceIndex] || [];

  if (q.type === 'multiple') {
    var pos = sels.indexOf(idx);
    if (pos > -1) sels.splice(pos, 1); else sels.push(idx);
    practiceSelections[practiceIndex] = sels;
    savePracticeProgress(); renderPractice();
  } else {
    practiceSelections[practiceIndex] = [idx];
    q.isAnswered = true;
    addDoneQuestion(q.id);
    var isCorrect = q.answer.length === 1 && q.answer[0] === idx;
    handlePracticeResult(q, isCorrect);
    savePracticeProgress();
    renderPractice();
    if (autoShowAnswer && isCorrect && !isWrongPracticeMode && practiceIndex < practiceQuestions.length - 1) {
      setTimeout(function() { nextPractice(); }, 1000);
    }

function handlePracticeResult(q, isCorrect) {
  var todayStr = new Date().toLocaleDateString();
  var stats = JSON.parse(localStorage.getItem('xjt_stats_'+todayStr) || '{"done":0,"correct":0}');
  stats.done++;
  if (isCorrect) stats.correct++;
  localStorage.setItem('xjt_stats_'+todayStr, JSON.stringify(stats));

  var typeStats = JSON.parse(localStorage.getItem('xjt_type_stats') || '{}');
  var tp = q.type || 'unknown';
  if (!typeStats[tp]) typeStats[tp] = { done: 0, correct: 0 };
  typeStats[tp].done++;
  if (isCorrect) typeStats[tp].correct++;
  localStorage.setItem('xjt_type_stats', JSON.stringify(typeStats));

  var qKey = getQKey(q);
  var targetStreak = parseInt(localStorage.getItem('xjt_streak_target')) || 5;

  if (isWrongPracticeMode) {
    ensureReviewFields(q);
    if (isCorrect) {
      q.streak = (q.streak || 0) + 1;
      q.reviewCount = (q.reviewCount || 0) + 1;
      q.lastReviewAt = Date.now();
      q.stage = Math.min((q.stage || 0) + 1, REVIEW_INTERVALS.length - 1);
      q.nextReviewAt = reviewAddDays(Date.now(), REVIEW_INTERVALS[q.stage]);
      if (q.streak >= targetStreak) {
        wrongBook = wrongBook.filter(function(item){ return getQKey(item) !== qKey; });
        showToast('🎉 连对' + targetStreak + '次，已移出错题本');
        if (wrongBook.length === 0) practiceIndex = practiceQuestions.length;
      }
    } else {
      q.streak = 0;
      q.stage = 0;
      q.nextReviewAt = reviewAddDays(Date.now(), REVIEW_INTERVALS[0]);
    }
    saveData();
  } else {
    if (!isCorrect) {
      var exist = false;
      for (var i=0; i<wrongBook.length; i++) { 
        if (wrongBook[i].bankId === activeBankId && getQKey(wrongBook[i]) === qKey) {
          exist = true; break;
        }
      }
      if (!exist) {
        var nw = {
          bankId: activeBankId,
          id: q.id || null,
          question: q.question,
          type: q.type,
          options: q.options,
          answer: q.answer,
          analysis: q.analysis,
          streak: 0
        };
        ensureReviewFields(nw);
        wrongBook.push(nw);
        saveData();
      }
    }
  }
}

function nextPractice() {
  if(practiceIndex < practiceQuestions.length) { practiceIndex++; savePracticeProgress(); render(); }
}

/* ===== 题库平滑升级：按内容指纹（qFavKey）继承旧记录 ===== */
function buildBankKeyIndex(bankId) {
  var idx = {};
  var bank = allBanks[bankId];
  if (!bank || !bank.questions) return idx;
  for (var i = 0; i < bank.questions.length; i++) {
    var q = bank.questions[i];
    if (!q) continue;
    var k = qFavKey(q);
    if (!idx[k]) idx[k] = q;
  }
  return idx;
}

// 导入新题库后，把旧题库里“题干+选项完全一致”的记录复制到新题库
function migrateRecordsToBank(newBankId, sourceBankIds) {
  var stat = { wrong: 0, note: 0, correction: 0, streak: 0 };
  var bank = allBanks[newBankId];
  if (!bank || !bank.questions) return stat;
  var newIdx = buildBankKeyIndex(newBankId);
  var srcSet = sourceBankIds || [];
  var srcIdx = {};
  srcSet.forEach(function (bid) { srcIdx[bid] = buildBankKeyIndex(bid); });

  // 1) 连对次数 / 已答状态
  bank.questions.forEach(function (q) {
    if (!q) return;
    var k = qFavKey(q);
    for (var s = 0; s < srcSet.length; s++) {
      var old = srcIdx[srcSet[s]] ? srcIdx[srcSet[s]][k] : null;
      if (!old) continue;
      var changed = false;
      if ((old.streak || 0) > (q.streak || 0)) { q.streak = old.streak; changed = true; }
      if (old.isAnswered && !q.isAnswered) { q.isAnswered = true; changed = true; }
      if (changed) { stat.streak++; break; }
    }
  });

  // 2) 错题记录
  var existKeys = {};
  for (var j = 0; j < wrongBook.length; j++) {
    if (wrongBook[j] && wrongBook[j].bankId === newBankId) existKeys[qFavKey(wrongBook[j])] = 1;
  }
  for (var i = 0; i < wrongBook.length; i++) {
    var w = wrongBook[i];
    if (!w || w.bankId === newBankId) continue;
    if (srcSet.length && srcSet.indexOf(w.bankId) < 0) continue;
    var k2 = qFavKey(w);
    var t = newIdx[k2];
    if (!t || existKeys[k2]) continue;
    wrongBook.push({
      bankId: newBankId, id: t.id || null,
      question: t.question, type: t.type, options: t.options, answer: t.answer, analysis: t.analysis,
      streak: w.streak || 0,
      firstWrongAt: w.firstWrongAt, stage: w.stage, reviewCount: w.reviewCount,
      lastReviewAt: w.lastReviewAt, nextReviewAt: w.nextReviewAt
    });
    existKeys[k2] = 1; stat.wrong++;
  }

  // 3) 笔记 / 纠错（key = bankId + '_' + 内容哈希）
  var notes = getNotes(), corrs = getCorrections();
  Object.keys(notes).forEach(function (key) {
    var pos = key.indexOf('_q_');
    if (pos < 0) return;
    var contentKey = key.slice(pos + 1);
    var srcBank = key.slice(0, pos);
    if (srcBank === newBankId) return;
    if (srcSet.length && srcSet.indexOf(srcBank) < 0) return;
    if (!newIdx[contentKey]) return;
    var nk = newBankId + '_' + contentKey;
    if (notes[nk] === undefined) { notes[nk] = notes[key]; stat.note++; }
  });
  Object.keys(corrs).forEach(function (key) {
    var pos = key.indexOf('_q_');
    if (pos < 0) return;
    var contentKey = key.slice(pos + 1);
    var srcBank = key.slice(0, pos);
    if (srcBank === newBankId) return;
    if (srcSet.length && srcSet.indexOf(srcBank) < 0) return;
    if (!newIdx[contentKey]) return;
    var nk = newBankId + '_' + contentKey;
    if (corrs[nk] === undefined) { corrs[nk] = corrs[key]; stat.correction++; }
  });
  saveNotes(notes); saveCorrections(corrs);
  saveData();
  return stat;
}

  });

  html += `<div class="card" style="padding:12px;font-size:0.8rem;line-height:1.7;">

  </div>`;

  for (var i = 0; i < groupOrder.length; i++) {

      var ansArr = w.answer || [];
      var srcBanks = Object.keys(g.banks);
      var srcName = srcBanks.map(function (b) { return allBanks[b] ? allBanks[b].name : '已删除题库'; }).join(' / ');
      var tName = TYPE_NAMES[w.type] || '未知';
      var isSubj = isSubjective(w.type);
      var ansDisplay = isSubj ? (typeof ansArr === 'string' ? ansArr : ansArr.join('；')) : ansArr.map(function (ix) { return String.fromCharCode(65 + ix); }).join(', ');
      var k = qFavKey(w);
      var optHtml = '';
      if (!isSubj) {
        for (var j = 0; j < optArr.length; j++) {
          var isAns = ansArr.indexOf(j) > -1;
          optHtml += `<div class="opt ${isAns ? 'correct' : ''} disabled"><div class="opt-prefix">${String.fromCharCode(65 + j)}</div><div>${optArr[j]}</div></div>`;
        }
      } else {
        optHtml = `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansDisplay}</div></div>`;
      }
      // 笔记：先取本题库同 key，再按内容指纹兜底找其他题库的笔记
      var noteObj = null;
      try {
        var notesAll = getNotes();
        var nk = w.bankId + '_' + k;
        if (notesAll[nk]) noteObj = notesAll[nk];
        if (!noteObj) {
          Object.keys(notesAll).forEach(function (x) {
            if (noteObj) return;
            var item = notesAll[x];
            if (!item) return;
            if (x.length > k.length && x.slice(-(k.length + 1)) === '_' + k && (item.text || (item.images || []).length)) noteObj = item;
          });
        }
      } catch (e) { noteObj = null; }
      var noteHtml = '';
      if (noteObj && ((noteObj.text && noteObj.text.trim()) || (noteObj.images || []).length)) {
        var nt = (noteObj.text || '').trim();
        var ims = noteObj.images || [];
        noteHtml = `<div style="margin-top:8px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;">

          ${ims.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">${ims.map(function (src) { return `<img src="${src}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #fde68a;">`; }).join('')}</div>` : ''}

        </div>

        ${optHtml}
        ${buildAnalysisHtml(w, [], true)}
        ${noteHtml}
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn btn-primary btn-small" style="flex:1;padding:8px;font-size:0.82rem;" onclick="extractWrongToCurrentBank('${w.bankId}','${k}')">📥 提取这道题</button>
          <button class="btn btn-danger-ghost btn-small" style="flex:1;padding:8px;font-size:0.82rem;" onclick="removeWrongHistoryItem('${k}')">🗑️ 剔除</button>
        </div>
      </div>`;
    } catch (e) { console.error('历史错题渲染跳过', e); }
  }

  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;
}

function removeWrongHistoryItem(key) {
  var n = wrongBook.filter(function (w) { return w && w.question && qFavKey(w) === key; }).length;

    wrongBook = wrongBook.filter(function (w) { return !(w && w.question && qFavKey(w) === key); });

    showToast('已剔除 ' + n + ' 条错题记录');
  });
}

function clearAllWrongHistory() {
  var n = wrongBook.length;
  if (!n) { showToast('当前没有错题记录'); return; }
  showAppConfirm('一键剔除全部历史错题', '将清空所有题库的错题记录，共 ' + n + ' 条。笔记和纠错不受影响，剔除后不可恢复。', '确定剔除', '取消', function () {
    wrongBook = [];
    saveData(); render();
    showToast('历史错题已全部剔除');
  });
}

function extractWrongRecordsToActiveBank(recs) {
  var bank = allBanks[activeBankId];
  var idx = buildBankKeyIndex(activeBankId);
  var added = 0, linked = 0;
  var existKeys = {};
  for (var j = 0; j < wrongBook.length; j++) {
    if (wrongBook[j] && wrongBook[j].bankId === activeBankId) existKeys[getQKey(wrongBook[j])] = 1;
  }
  var notes = getNotes(), corrs = getCorrections();

  recs.forEach(function (w) {
    if (!w || !w.question) return;
    var k = qFavKey(w);
    var t = idx[k];
    if (!t) {
      t = {
        id: w.id || ('q_m_' + Date.now().toString(36) + '_' + added),
        type: w.type, question: w.question,
        options: (w.options || []).slice(),
        answer: (w.answer || []).slice(),
        analysis: w.analysis || ''
      };
      bank.questions.push(t); idx[k] = t; added++;
    }
    if (!existKeys[k]) {
      wrongBook.push({
        bankId: activeBankId, id: t.id || null,
        question: t.question, type: t.type, options: t.options, answer: t.answer, analysis: t.analysis,
        streak: w.streak || 0,
        firstWrongAt: w.firstWrongAt, stage: w.stage, reviewCount: w.reviewCount,
        lastReviewAt: w.lastReviewAt, nextReviewAt: w.nextReviewAt
      });
      existKeys[k] = 1; linked++;
    }
    // 笔记 / 纠错跟随到当前题库
    var srcKey = w.bankId + '_' + k;
    var dstKey = activeBankId + '_' + k;
    if (notes[srcKey] !== undefined && notes[dstKey] === undefined) notes[dstKey] = notes[srcKey];
    if (corrs[srcKey] !== undefined && corrs[dstKey] === undefined) corrs[dstKey] = corrs[srcKey];
  });

  saveNotes(notes); saveCorrections(corrs);
  return { added: added, linked: linked, total: recs.length };
}

function extractWrongToCurrentBank(srcBankId, key) {
  if (!activeBankId || !allBanks[activeBankId]) { showToast('请先选择题库', true); return; }
  var rec = null;
  for (var i = 0; i < wrongBook.length; i++) {
    if (wrongBook[i].bankId === srcBankId && getQKey(wrongBook[i]) === key) { rec = wrongBook[i]; break; }
  }
  if (!rec) { showToast('这条错题记录已不存在', true); return; }
  var res = extractWrongRecordsToActiveBank([rec]);
  saveData(); render();
  showToast('已提取到「' + allBanks[activeBankId].name + '」' + (res.added ? '（新增 ' + res.added + ' 道题）' : '（题库已有此题）'));
}

function extractAllWrongToCurrentBank() {
  if (!activeBankId || !allBanks[activeBankId]) { showToast('请先选择题库', true); return; }
  if (!wrongBook.length) { showToast('没有可提取的错题', true); return; }
  var all = wrongBook.slice();
  var res = extractWrongRecordsToActiveBank(all);
  saveData();
  currentMode = 'home'; render();
  showToast('已提取 ' + res.total + ' 条：新增 ' + res.added + ' 道题，绑定到当前题库 ' + res.linked + ' 条');
}

          for (var j = 0; j < q.options.length; j++) {

              var cTop = container.getBoundingClientRect().top;
              for (var k = 0; k < items.length; k++) {

function applyReviewFilter(list) {
  return list.filter(function (w) {
    ensureReviewFields(w);
    if (reviewTypeFilter !== 'all' && w.type !== reviewTypeFilter) return false;
    if (reviewStatusFilter === 'weak' && (w.streak || 0) > 0) return false;
    if (reviewStatusFilter === 'good' && (w.streak || 0) === 0) return false;
    return true;
  });
}
function setReviewTypeFilter(t) { reviewTypeFilter = t; window.reviewPageIndex = 0; render(); }
function setReviewStatusFilter(s) { reviewStatusFilter = s; window.reviewPageIndex = 0; render(); }
function buildReviewFilterBar(allWrong) {
  var types = [];
  allWrong.forEach(function (w) { if (types.indexOf(w.type) < 0) types.push(w.type); });

    return `<button class="btn ${cls}" style="flex:1;padding:5px;font-size:0.75rem;" onclick="setReviewTypeFilter('${t}')">${label}</button>`;
  }).join('');
  var statusBtns = [['all', '全部'], ['weak', '未掌握'], ['good', '已掌握']].map(function (s) {
    var cls = reviewStatusFilter === s[0] ? 'btn-primary' : 'btn-outline';
    return `<button class="btn ${cls}" style="flex:1;padding:5px;font-size:0.75rem;" onclick="setReviewStatusFilter('${s[0]}')">${s[1]}</button>`;
  }).join('');

      try {
        var q = currentWrong[i];
        if (!q || !q.question) continue; 
        if (!q.options) q.options = [];
        if (!q.answer) q.answer = [];
        if (q.type === 'judge' && q.options.length === 0) q.options = ['正确', '错误'];
        
        var tName = TYPE_NAMES[q.type] || '未知';
        var isSubj = isSubjective(q.type);
        var ansDisplay = isSubj ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；')) : q.answer.map(function(idx){ return String.fromCharCode(65+idx); }).join(', ');
        
        var optHtml = '';
        if (!isSubj) {
          for (var j = 0; j < q.options.length; j++) {
            var isAns = q.answer.indexOf(j) > -1;
            optHtml += `<div class="opt ${isAns ? 'correct' : ''} disabled"><div class="opt-prefix">${String.fromCharCode(65+j)}</div><div>${q.options[j]}</div></div>`;
          }
        } else {
          optHtml = `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansDisplay}</div></div>`;
        }

        html += `<div class="card review-item" id="review-item-${i}" data-idx="${i}" style="scroll-margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px;align-items:center;">
            <span class="tag" style="background:#ef4444; margin-bottom:0;">${tName} · 第 ${i+1} 题</span>
            <span style="color:#ef4444;font-weight:bold;">连对: ${q.streak||0}/${targetStreak}</span>
          </div>
          <div class="q-text" style="padding-right:0;">${q.question}</div>
          ${optHtml}
          ${buildAnalysisHtml(q, [], true)}</div>`;
      } catch(e) { console.error('单题渲染跳过', e); }
    }
    
    html += `</div>
      <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
        <div class="sheet-content" onclick="event.stopPropagation()">
          <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:var(--text-sub);font-weight:normal;">点击题号可跳转</span></div>
          ${buildSheetHtml(currentWrong, window.reviewPageIndex || 0, [], 'review')}
        </div>
      </div>`;
      
    appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;

    setTimeout(function() {
      try {
        var el = document.getElementById('review-item-' + (window.reviewPageIndex || 0));
        var container = document.getElementById('reviewScrollContainer');
        if (el && container) container.scrollTop = el.offsetTop - 10;
      } catch(e){}
    }, 40);

    setTimeout(function() {
      try {
        var container = document.getElementById('reviewScrollContainer');
        if (container) {
          var scrollTimer = null;
          container.addEventListener('scroll', function() {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(function() {
              var items = container.querySelectorAll('.review-item');
              var bestIdx = 0, bestDist = Infinity;
              var cTop = container.getBoundingClientRect().top;
              for (var k = 0; k < items.length; k++) {
                var r = items[k].getBoundingClientRect();
                var d = Math.abs(r.top - cTop - 10);
                if (d < bestDist) { bestDist = d; bestIdx = k; }
              }
              window.reviewPageIndex = bestIdx;
            }, 250);
          }, { passive: true });
        }
      } catch(e){}
    }, 60);

  } catch(err) {
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:30px;">加载出错：${err.message}</div>`;
  }
}

  if (!cb) return;
  cb.checked = !cb.checked;
  var on = cb.checked;

  card.style.color = on ? '#0f766e' : '';

  if (sp) {
    sp.style.fontWeight = on ? 'bold' : 'normal';
    var base = sp.textContent.replace(/^✓\s*/, '');
    sp.textContent = on ? ('✓ ' + base) : base;
  }

}

/* 按当前模拟考试设置组一套卷（不改动 examQuestions，用于导出试题） */
function buildExamPaper() {
  var order = ['single','multiple','judge','fill','short','essay'];
  var numKeys = { single:'numSingle', multiple:'numMultiple', judge:'numJudge', fill:'numFill', short:'numShort', essay:'numEssay' };
  var scoreKeys = { single:'scoreSingle', multiple:'scoreMultiple', judge:'scoreJudge', fill:'scoreFill', short:'scoreShort', essay:'scoreEssay' };
  for (var i = 0; i < order.length; i++) {
    var t = order[i];
    var nEl = document.getElementById('num_' + t);
    if (nEl) { var nv = parseInt(nEl.value); examConfig[numKeys[t]] = isNaN(nv) ? 0 : Math.max(0, nv); }
    var sEl = document.getElementById('sc_' + t);
    if (sEl) { var sv = parseFloat(sEl.value); if (!isNaN(sv) && sv > 0) examConfig[scoreKeys[t]] = sv; }
  }
  var totalPool = [];
  var tEl = document.getElementById('ex_time');
  if (tEl) { var tv = parseInt(tEl.value); if (!isNaN(tv) && tv > 0) examConfig.timeLimit = tv; }
  if (crossBankExamMode && window.selectedBankIds && window.selectedBankIds.length > 0) {
    for (var k = 0; k < window.selectedBankIds.length; k++) {
      var bId = window.selectedBankIds[k];
      var pct = (window.bankPercents && window.bankPercents[bId]) || 0;
      if (pct <= 0 || !allBanks[bId]) continue;
      var bp = allBanks[bId].questions.slice();
      var take = Math.round(bp.length * (pct / 100)); if (take === 0) take = 1;
      bp.sort(function(){ return 0.5 - Math.random(); });
      totalPool = totalPool.concat(bp.slice(0, take));
    }
  } else {
    totalPool = (activeBankId && allBanks[activeBankId]) ? allBanks[activeBankId].questions.slice() : [];
  }
  /* M_pool_fallback: 跨题库占比未填(全为0)时，回退用选中题库全量，再兜底当前题库，避免组卷 0 题 */
  if (totalPool.length === 0) {
    if (crossBankExamMode && window.selectedBankIds && window.selectedBankIds.length > 0) {
      for (var m = 0; m < window.selectedBankIds.length; m++) { var bm = allBanks[window.selectedBankIds[m]]; if (bm && bm.questions) totalPool = totalPool.concat(bm.questions); }
    }
    if (totalPool.length === 0 && activeBankId && allBanks[activeBankId]) { totalPool = allBanks[activeBankId].questions.slice(); }
  }
  var paper = [];
  for (var j = 0; j < order.length; j++) {
    var tt = order[j];
    var pool = totalPool.filter(function(q){ return q.type === tt; });
    pool.sort(function(){ return 0.5 - Math.random(); });
    var need = examConfig[numKeys[tt]] || 0;
    if (need > 0) paper = paper.concat(pool.slice(0, Math.min(pool.length, need)));
  }
  return paper;
}

function startExam() {
  if (!guardGate()) return;
  
  examInstantFeedback = !!(document.getElementById('ex_instant') && document.getElementById('ex_instant').checked);
  crossBankExamMode = !!(document.getElementById('ex_cross') && document.getElementById('ex_cross').checked);
  examPreferWrong = !!(document.getElementById('ex_preferWrong') && document.getElementById('ex_preferWrong').checked);
  examPreferUndone = !!(document.getElementById('ex_preferUndone') && document.getElementById('ex_preferUndone').checked);
  
  localStorage.setItem('xjt_exam_instant_feedback', examInstantFeedback?'1':'0');
  localStorage.setItem('xjt_cross_bank', crossBankExamMode?'1':'0');
  localStorage.setItem('xjt_exam_prefer_wrong', examPreferWrong?'1':'0');
  localStorage.setItem('xjt_exam_prefer_undone', examPreferUndone?'1':'0');

  function getScoreVal(id, defaultVal) {
    var el = document.getElementById('sc_' + id);
    if (!el) return defaultVal;
    var val = parseFloat(el.value);
    return isNaN(val) ? defaultVal : val;
  }
  function getNumVal(id, defaultVal) {
    var el = document.getElementById('num_' + id);
    if (!el) return defaultVal;
    var val = parseInt(el.value);
    return isNaN(val) ? defaultVal : Math.max(0, val);
  }
  examConfig.scoreSingle = getScoreVal('single', 2);
  examConfig.scoreMultiple = getScoreVal('multiple', 4);
  examConfig.scoreJudge = getScoreVal('judge', 2);
  examConfig.scoreFill = getScoreVal('fill', 5);
  examConfig.scoreShort = getScoreVal('short', 10);
  examConfig.scoreEssay = getScoreVal('essay', 20);
  examConfig.numSingle = getNumVal('single', 20);
  examConfig.numMultiple = getNumVal('multiple', 10);
  examConfig.numJudge = getNumVal('judge', 20);
  examConfig.numFill = getNumVal('fill', 0);
  examConfig.numShort = getNumVal('short', 0);
  examConfig.numEssay = getNumVal('essay', 0);
  localStorage.setItem('xjt_exam_config', JSON.stringify(examConfig));

  var mins = parseInt(document.getElementById('ex_time').value) || 60;
  var passVal = (document.getElementById('ex_pass').value || '').trim();
  var passInput = passVal === '' ? NaN : parseInt(passVal);

  var doneList = getDoneQuestions();
  var wrongIds = {};
  for (var wi=0; wi<wrongBook.length; wi++) { wrongIds[getQKey(wrongBook[wi])] = 1; }
  function isDoneQ(q){ return doneList.indexOf(getQKey(q)) > -1; }

  // ★ 1. 准备所有待抽的题池
  var totalPool = [];
  if (crossBankExamMode && window.selectedBankIds && window.selectedBankIds.length > 0) {
    for (var k=0; k<window.selectedBankIds.length; k++) {
      var bId = window.selectedBankIds[k];
      var pct = window.bankPercents[bId] || 0;
      if (pct <= 0) continue;
      
      var bPool = allBanks[bId].questions;
      var takeNum = Math.round(bPool.length * (pct / 100));
      if (takeNum === 0 && pct > 0) takeNum = 1;
      
      bPool = bPool.slice().sort(function(){ return 0.5 - Math.random(); });
      totalPool = totalPool.concat(bPool.slice(0, takeNum));
    }
  } else {
    var qs = activeBankId ? allBanks[activeBankId].questions : [];
    totalPool = qs.slice();
  }

  if (totalPool.length === 0) return showToast('抽题结果为空，请检查抽题设置', true);

  // ★ 2. 先初始化考卷数组（必须放在循环前面！）
  examQuestions = [];
  var typeOrder = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var numMap2 = { single:'numSingle', multiple:'numMultiple', judge:'numJudge', fill:'numFill', short:'numShort', essay:'numEssay' };

  for (var t = 0; t < typeOrder.length; t++) {
    var currentType = typeOrder[t];
    var typePool = totalPool.filter(function(q){ return q.type === currentType; });

    // 题型内部打乱 + 优先级排序
    typePool.sort(function(){ return 0.5 - Math.random(); });
    if (examPreferWrong || examPreferUndone) {
      typePool.sort(function(a, b){
        if (examPreferWrong) {
          var aw = wrongIds[String(a.id)]?1:0, bw = wrongIds[String(b.id)]?1:0;
          if (aw !== bw) return bw - aw;
        }
        if (examPreferUndone) {
          var ad = isDoneQ(a)?1:0, bd = isDoneQ(b)?1:0;
          if (ad !== bd) return ad - bd;
        }
        return 0;
      });
    }

    // ★ 按设置的数量截取；数量填 0 则不抽该题型；题库不足则取全部
    var needNum = examConfig[numMap2[currentType]] || 0;
    if (needNum > 0) {
      typePool = typePool.slice(0, Math.min(typePool.length, needNum));
      examQuestions = examQuestions.concat(typePool);
    }
  }

  if (examQuestions.length === 0) {
    return showToast('抽题结果为空，请检查题型数量设置', true);
  }

  examIndex = 0; examSelections = []; examAnswered = []; examAborted = false;
  examStartTime = Date.now();
  examRemainingSeconds = mins * 60;
  currentMode = 'exam';

  var totalScore = totalOf();
  if (isNaN(passInput) || passInput <= 0) {
    examConfig.passScore = -1;
  } else {
    examConfig.passScore = Math.min(totalScore, passInput);
  }

  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(function() {
    examRemainingSeconds--;
    if (examRemainingSeconds <= 0) {
      clearInterval(examTimer); examTimer = null;
      showToast('考试时间到，自动交卷');
      submitExam(true);
    } else {
      var tEl = document.getElementById('examTimer');
      if (tEl) {
        var m = Math.floor(examRemainingSeconds / 60);
        var s = examRemainingSeconds % 60;
        tEl.innerText = (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
      }
    }
  }, 1000);

  installBackGuard();
  render();
}

function examJudge(i) {
  var q = examQuestions[i];
  var s = examSelections[i] || [];
  if (isSubjective(q.type)) { examAnswered[i] = 1; return 1; }
  
  var isExact = s.length === q.answer.length && s.every(function(v){ return q.answer.indexOf(v) > -1; });
  var isWrong = s.some(function(v){ return q.answer.indexOf(v) === -1; });
  
  if (isExact) {
    examAnswered[i] = 1; // 1 = 全对
  } else if (q.type === 'multiple' && multiHalfScoreMode && !isWrong && s.length > 0) {
    examAnswered[i] = 3; // 3 = 半对
  } else {
    examAnswered[i] = 2; // 2 = 错
  }
  return examAnswered[i];
}

function selectExam(idx) {
  var q = examQuestions[examIndex];
  if (isSubjective(q.type)) return;
  if (examInstantFeedback && (examAnswered[examIndex] || 0) > 0) return;

  var sels = examSelections[examIndex] || [];
  if (q.type === 'multiple') {
    var pos = sels.indexOf(idx);
    if (pos > -1) sels.splice(pos, 1); else sels.push(idx);
    examSelections[examIndex] = sels;
    examAnswered[examIndex] = 0;
    renderExam();
    return;
  }

  examSelections[examIndex] = [idx];
  examJudge(examIndex);        // 始终判定，记录状态
  renderExam();

  // 合格线提前终止检查（无论是否开启即时反馈都检查）
  if (checkEarlyFail()) return;

  // 即时反馈：答对自动下一题
  if (examInstantFeedback && examAnswered[examIndex] === 1 && examIndex < examQuestions.length - 1) {
    setTimeout(function(){ if (currentMode === 'exam') nextExam(); }, 800);
  }
}

function confirmExamMulti() {
  var q = examQuestions[examIndex];
  var sels = examSelections[examIndex] || [];
  if (sels.length === 0) return;
  examJudge(examIndex);
  renderExam();
  if (checkEarlyFail()) return;
  if (examInstantFeedback && examAnswered[examIndex] === 1 && examIndex < examQuestions.length - 1) {
    setTimeout(function(){ if (currentMode === 'exam') nextExam(); }, 800);
  }
}

function checkEarlyFail() {
  if (examConfig.passScore < 0) return false; // 未设置合格线，跳过

  var got = 0, remain = 0;
  for (var i = 0; i < examQuestions.length; i++) {
    var sc = scoreOf(examQuestions[i]);
    if (examAnswered[i] === 1) got += sc;
    else remain += sc;
  }
  // 已得 + 剩余满分 < 合格线 → 数学上已无法达标
  if (got + remain < examConfig.passScore) {
    if (examTimer) { clearInterval(examTimer); examTimer = null; }
    examScore = { got: got, total: totalOf(), usedTime: usedTimeStr() };
    showEarlyFailModal();
    return true;
  }
  return false;
}

function submitExam(auto) {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  
  var got = 0, total = 0;
  examWrongList = [];
  
  for (var j = 0; j < examQuestions.length; j++) {
    var q = examQuestions[j];
    var sc = scoreOf(q);
    total += sc;
    
    // 主观题直接给满分
    if (isSubjective(q.type)) { 
      got += sc; 
      continue; 
    }
    
    var sels = examSelections[j] || [];
    
    // 判断是否完全正确
    var isExact = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
    
    if (isExact) {
      got += Number(sc);
      examAnswered[j] = 1;
    } else {
      examAnswered[j] = 2;
      examWrongList.push(q);
      addToWrongBook(q);
    }
  }
  
  // 强制处理浮点数精度
  got = Number(got.toFixed(2));
  total = Number(total.toFixed(2));
  
  saveData();

  var examHistory = JSON.parse(localStorage.getItem('xjt_exam_history') || '[]');
  examHistory.push({ date: Date.now(), got: got, total: total, acc: total > 0 ? Math.round(got / total * 100) : 0, usedTime: usedTimeStr() });
  if (examHistory.length > 50) examHistory = examHistory.slice(-50);
  localStorage.setItem('xjt_exam_history', JSON.stringify(examHistory));

    examScore = { got: got, total: total, usedTime: usedTimeStr(), fireworksShown: false };
    // ★ 达标判定：满分 或 达到合格线 → 解锁荣誉证书
    examScore.isFull = (got >= total && total > 0);
    examScore.passed = examScore.isFull || (examConfig.passScore > 0 && got >= examConfig.passScore);
    if (examScore.passed) {
      examScore.certNo = certNoStr();

      recordCertificate(examScore.certNo, got, total);
    }

  currentMode = 'result';
  render();
}

/* ===== 烟花 + 彩带（6 秒） ===== */
var fwTimer=null, fwAnim=null, fwCanvas=null, fwCtx=null, fwParticles=[], fwRibbons=[], fwEndAt=0;
function launchFireworks(ms) {
  if (fwCanvas && fwCanvas.parentNode) fwCanvas.parentNode.removeChild(fwCanvas);
  fwCanvas = document.createElement('canvas');
  fwCanvas.id = 'fireworks-canvas';
  document.body.appendChild(fwCanvas);
  fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight;
  fwCtx = fwCanvas.getContext('2d');
  fwParticles = []; fwRibbons = []; fwEndAt = Date.now() + ms;
  if (fwTimer) clearInterval(fwTimer);
  fwTimer = setInterval(function(){
    if (Date.now() > fwEndAt) return;
    spawnFirework();
    if (Math.random() < 0.7) spawnRibbon();
    if (Math.random() < 0.5) spawnRibbon();
  }, 420);
  if (fwAnim) cancelAnimationFrame(fwAnim);
  fwAnim = requestAnimationFrame(fwLoop);
}
function spawnFirework() {
  var x = Math.random() * fwCanvas.width;
  var y = Math.random() * fwCanvas.height * 0.6 + 40;
  var hue = Math.floor(Math.random() * 360);
  var n = 40 + Math.floor(Math.random() * 30);
  for (var i = 0; i < n; i++) {
    var a = Math.PI * 2 * i / n, sp = 1.5 + Math.random() * 3.5;
    fwParticles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:60+Math.random()*30, max:90, color:'hsl('+hue+',90%,60%)', size:2+Math.random()*2 });
  }
}
function spawnRibbon() {
  var colors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899'];
  fwRibbons.push({ x:Math.random()*fwCanvas.width, y:-20, w:6+Math.random()*6, h:14+Math.random()*12, vy:2+Math.random()*2.5, vx:-1+Math.random()*2, rot:Math.random()*Math.PI, vr:-0.1+Math.random()*0.2, color:colors[Math.floor(Math.random()*colors.length)] });
}
function fwLoop() {
  if (!fwCanvas) return;
  var now = Date.now();
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  for (var i = fwParticles.length-1; i >= 0; i--) {
    var p = fwParticles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.99; p.vy *= 0.99; p.life--;
    if (p.life <= 0) { fwParticles.splice(i, 1); continue; }
    fwCtx.globalAlpha = Math.max(0, p.life / p.max);
    fwCtx.fillStyle = p.color;
    fwCtx.beginPath(); fwCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); fwCtx.fill();
  }
  for (var j = fwRibbons.length-1; j >= 0; j--) {
    var r = fwRibbons[j];
    r.x += r.vx; r.y += r.vy; r.rot += r.vr;
    if (r.y > fwCanvas.height + 30) { fwRibbons.splice(j, 1); continue; }
    fwCtx.globalAlpha = 1;
    fwCtx.save(); fwCtx.translate(r.x, r.y); fwCtx.rotate(r.rot);
    fwCtx.fillStyle = r.color; fwCtx.fillRect(-r.w/2, -r.h/2, r.w, r.h);
    fwCtx.restore();
  }
  fwCtx.globalAlpha = 1;
  if (now > fwEndAt && fwTimer) { clearInterval(fwTimer); fwTimer = null; }
  if (now > fwEndAt + 1500 && fwParticles.length === 0 && fwRibbons.length === 0) {
    cancelAnimationFrame(fwAnim); fwAnim = null;
    if (fwCanvas && fwCanvas.parentNode) fwCanvas.parentNode.removeChild(fwCanvas);
    fwCanvas = null;
    return;
  }
  fwAnim = requestAnimationFrame(fwLoop);
}

    // 得分/满分统一格式（保留小数兼容 0.5 步长配置）
    var displayGotSc = (gotSc % 1 === 0) ? gotSc : gotSc.toFixed(1);

    if (!isSubj) {
      for (var j = 0; j < q.options.length; j++) {

        var isUser = sels.indexOf(j) > -1;

        html += `<div class="${optClass}"><div class="opt-prefix">${String.fromCharCode(65+j)}</div><div>${q.options[j]}</div></div>`;
      }
    } else {
      html += `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansDisplay}</div></div>`;
    }

    }

    html += `${buildAnalysisHtml(q, sels, true)}</div>`;
  }
  html += `</div>`;
  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;

function validateResumeQuestions(p) {

    var f1 = [];

      var qq = list[qi]; 
      if (wMap[qq.id]) { 
        qq.streak = wMap[qq.id].streak || 0; 
        f1.push(qq); 
      } 
    }
    if (f1.length === 0) { 
      localStorage.removeItem('xjt_practice_progress'); 
      showToast('错题已全部掌握，进度已清空', true); 
      return null; 
    }
    list = f1;
  } else if ((p.source || '') === 'fav') {
    var f2 = list.filter(function(qq){ return isFav(qq); });
    if (f2.length === 0) { 
      localStorage.removeItem('xjt_practice_progress'); 
      showToast('收藏夹已清空，进度已重置', true); 
      return null; 
    }
    list = f2;
  } else if (['single','multiple','judge','fill','short','essay'].indexOf(p.source || '') > -1) {
    var curQs = activeBankId ? allBanks[activeBankId].questions : [];
    var idSet = {};
    for (var ci = 0; ci < curQs.length; ci++) { 
      if (curQs[ci].id != null) idSet[String(curQs[ci].id)] = 1; 
    }
    var f3 = list.filter(function(qq){ return qq.id == null || idSet[String(qq.id)]; });
    if (f3.length === 0) { 
      localStorage.removeItem('xjt_practice_progress'); 
      showToast('题库已变更，进度已重置', true); 
      return null; 
    }
    list = f3;
  }
  return list;
}

/* ===== 新增：薄弱点专练（按正确率最低的题型自动抽题） ===== */
function startWeakPractice(targetType) {
  if (!guardGate()) return;
  if (!activeBankId || !allBanks[activeBankId]) return showToast('请先选择题库', true);
  var wqs = allBanks[activeBankId].questions || [];
  if (wqs.length === 0) return showToast('题库为空', true);

  var wTypeStats = JSON.parse(localStorage.getItem('xjt_type_stats') || '{}');
  var wOrder = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var wCands = [];
  wOrder.forEach(function (tp) {
    var s = wTypeStats[tp];
    if (!s || !s.done) return;
    var hasQ = false;
    for (var i = 0; i < wqs.length; i++) { if (wqs[i].type === tp) { hasQ = true; break; } }
    if (!hasQ) return;
    wCands.push({ tp: tp, acc: Math.round(s.correct / s.done * 100), done: s.done });
  });
  if (wCands.length === 0) return showToast('还没有足够的答题记录，先做几套再看', true);

  var pickType = targetType;
  if (!pickType) {
    wCands.sort(function (a, b) { return a.acc - b.acc; });
    pickType = wCands[0].tp;
  }
  var wPool = wqs.filter(function (q) { return q.type === pickType; });
  if (wPool.length === 0) return showToast('当前题库没有该题型', true);

  var wWrongMap = {};
  wrongBook.filter(function (w) { return w.bankId === activeBankId; }).forEach(function (w) {
    wWrongMap[qFavKey(w)] = (w.streak || 0);
  });
  var wWeak = [], wOthers = [];
  wPool.forEach(function (q) {
    var k = qFavKey(q);
    if (wWrongMap.hasOwnProperty(k)) wWeak.push(q); else wOthers.push(q);
  });
  wWeak.sort(function (a, b) { return (wWrongMap[qFavKey(a)] || 0) - (wWrongMap[qFavKey(b)] || 0); });
  wOthers.sort(function () { return 0.5 - Math.random(); });

  practiceQuestions = wWeak.concat(wOthers).slice(0, 20);
  var wStat = null;
  wCands.forEach(function (c) { if (c.tp === pickType) wStat = c; });
  var wTname = TYPE_NAMES[pickType] || pickType;
  practiceSource = 'weak_' + pickType;
  practiceIndex = 0; practiceSelections = []; isWrongPracticeMode = false;
  for (var j = 0; j < practiceQuestions.length; j++) {
    practiceQuestions[j].isAnswered = isSubjective(practiceQuestions[j].type);
    if (practiceQuestions[j].streak === undefined) practiceQuestions[j].streak = 0;
  }
  if (wStat) showToast('🎯 ' + wTname + ' 正确率 ' + wStat.acc + '%，专练 ' + practiceQuestions.length + ' 题');
  else showToast('🎯 薄弱专练 ' + practiceQuestions.length + ' 题');
  currentMode = 'practice'; savePracticeProgress(); installBackGuard(); render();
}

function startDailyPractice(n) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  if (!qs.length) return showToast('题库为空', true);
  var wrongStreak = {};
  wrongBook.filter(function (w) { return w.bankId === activeBankId; }).forEach(function (w) { wrongStreak[qFavKey(w)] = w.streak || 0; });
  var tier0 = [], tier1 = [], tier2 = [];
  qs.forEach(function (q) {
    var k = qFavKey(q);
    if (wrongStreak.hasOwnProperty(k)) tier0.push(q);
    else if (!q.isAnswered) tier1.push(q);
    else tier2.push(q);
  });
  function shuf(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var want = Math.min(n, qs.length);
  var picked = [];
  [shuf(tier0), shuf(tier1), shuf(tier2)].forEach(function (list) {
    for (var i = 0; i < list.length && picked.length < want; i++) picked.push(list[i]);
  });
  picked = shuf(picked);
  practiceQuestions = picked;
  practiceSource = 'daily';
  practiceIndex = 0; practiceSelections = [];
  // 错题是从历史做题记录里抽的，题对象上还留着上次的 isAnswered，必须清零，
  // 否则一进来就直接显示答案、没法作答（主观题本来就是看答案，默认放行）
  picked.forEach(function (q) {
    if (q.streak === undefined) q.streak = 0;
    q.isAnswered = isSubjective(q.type);
  });
  currentMode = 'practice';
  if (typeof installBackGuard === 'function') installBackGuard();
  render();
  var fromWrong = picked.filter(function (q) { return wrongStreak.hasOwnProperty(qFavKey(q)); }).length;
  showToast('每日一练 ' + picked.length + ' 题' + (fromWrong ? '，含 ' + fromWrong + ' 道错题' : ''));
}

function currentQForTools() {

function answerTextOf(q) {
  if (!q || q.answer === undefined || q.answer === null) return '';
  if (q.type === 'judge') {
    var j = Array.isArray(q.answer) ? q.answer[0] : q.answer;
    return (j === 0 || j === '0' || j === true) ? '正确' : '错误';
  }
  if (isSubjective(q.type)) return (typeof q.answer === 'string' ? q.answer : q.answer.join('；'));
  return Array.isArray(q.answer) ? q.answer.map(function (i) { return String.fromCharCode(65 + i); }).join('') : String.fromCharCode(65 + q.answer);
}

function buildQuestionPlainText(q) {
  if (!q) return '';
  var lines = [];
  lines.push('【' + (TYPE_NAMES[q.type] || '题目') + '】');
  lines.push(q.question || '');
  if (q.options && q.options.length && !isSubjective(q.type)) {
    q.options.forEach(function (o, i) { lines.push(String.fromCharCode(65 + i) + '. ' + o); });
  }
  var ans = answerTextOf(q);
  if (ans) lines.push('【正确答案】' + ans);
  if (q.analysis) lines.push('【解析】' + q.analysis);
  lines.push('—— 来自「铁途学练」铁路工务刷题助手');
  return lines.join('\n');
}

function copyTextToClipboard(text, okMsg) {
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    if (ta.setSelectionRange) ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    ta.remove();
  } catch (e) { ok = false; }
  if (ok) { showToast(okMsg || '已复制'); return; }
  try {
    if (window.plus && plus.navigator && plus.navigator.setClipboard) {
      plus.navigator.setClipboard(text);
      showToast(okMsg || '已复制');
      return;
    }
  } catch (e) {}
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast(okMsg || '已复制'); }, function () { showToast('复制失败，请长按文字手动复制', true); });
      return;
    }
  } catch (e) {}
  showToast('复制失败，请长按文字手动复制', true);
}

function copyQuestionText() {
  var q = currentQForTools();
  if (!q) return showToast('请先进入题目', true);

}

function searchOnBaidu() {
  var q = currentQForTools();
  if (!q) return showToast('请先进入题目', true);
  var kw = (q.question || '').replace(/[（(]\s*[）)]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!kw) return showToast('题干为空', true);
  if (kw.length > 40) kw = kw.slice(0, 40);
  var url = 'https://m.baidu.com/s?wd=' + encodeURIComponent(kw);
  try {
    if (window.plus && plus.runtime && plus.runtime.openURL) { plus.runtime.openURL(url); return; }
  } catch (e) {}
  window.open(url, '_blank');
}

function drawQuestionCard(q, logoImg) {
  var W = 750, PAD = 44;
  var FONT = '"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif';
  var cv = document.createElement('canvas');
  var ctx = cv.getContext('2d');
  function setF(w, s) { ctx.font = w + ' ' + s + 'px ' + FONT; }
  function wrap(text, maxW) {
    var out = [], line = '';
    var chars = String(text || '').split('');
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i];
      if (ch === '\n') { out.push(line); line = ''; continue; }
      var test = line + ch;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = ch; } else { line = test; }
    }
    if (line || !out.length) out.push(line);
    return out;
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  setF('bold', 30);
  var qLines = wrap(q.question || '', W - PAD * 2).slice(0, 10);
  var opts = (!isSubjective(q.type) && q.type !== 'judge' && q.options) ? q.options : [];
  var optItems = opts.map(function (o, i) {
    setF('normal', 24);
    return { label: String.fromCharCode(65 + i), lines: wrap(o, W - PAD * 2 - 46).slice(0, 4) };
  });
  var ansTxt = answerTextOf(q);
  setF('normal', 22);
  var anaLines = q.analysis ? wrap(q.analysis, W - PAD * 2).slice(0, 10) : [];

  var H = 168;
  H += qLines.length * 42 + 14;
  optItems.forEach(function (o) { H += o.lines.length * 34 + 8; });
  if (optItems.length) H += 8;
  H += 66;
  if (anaLines.length) H += 40 + anaLines.length * 32;
  H += 118;

  cv.width = W;
  cv.height = Math.max(H, 520);

  ctx.fillStyle = '#fffdf8';
  ctx.fillRect(0, 0, cv.width, cv.height);
  var g = ctx.createLinearGradient(0, 0, 0, 190);
  g.addColorStop(0, '#fff5f5');
  g.addColorStop(1, '#fffdf8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cv.width, 190);
  ctx.fillStyle = '#b71c1c';
  ctx.fillRect(0, 0, cv.width, 8);

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  // logo（用应用真实图标；无图时退回红块"铁"字）
  if (logoImg) {
    ctx.fillStyle = '#fff';
    rr(PAD - 4, 28, 88, 88, 44); ctx.fill();
    ctx.drawImage(logoImg, PAD, 32, 80, 80);
  } else {
    ctx.fillStyle = '#b71c1c';
    rr(PAD, 40, 64, 64, 12); ctx.fill();
    ctx.fillStyle = '#fff';
    setF('bold', 36);
    ctx.textAlign = 'center';
    ctx.fillText('铁', PAD + 32, 72);
    ctx.textAlign = 'left';
  }
  ctx.fillStyle = '#1f2937';
  setF('bold', 34);
  ctx.fillText('铁途学练', PAD + 96, 58);
  ctx.fillStyle = '#6b7280';
  setF('normal', 18);
  ctx.fillText('铁道征途 · 勤学练兵', PAD + 96, 90);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#b71c1c';
  setF('bold', 18);
  ctx.fillText('题库 · 每日一练', W - PAD, 60);
  ctx.fillStyle = '#9ca3af';
  setF('normal', 16);
  ctx.fillText(TYPE_NAMES[q.type] || '题目', W - PAD, 88);
  ctx.textAlign = 'left';

  var y = 160;

  ctx.fillStyle = '#111827';
  setF('bold', 30);
  qLines.forEach(function (ln) { ctx.fillText(ln, PAD, y + 18); y += 42; });
  y += 14;

  optItems.forEach(function (o) {
    ctx.fillStyle = '#f3f4f6';
    rr(PAD, y - 4, 30, 30, 15); ctx.fill();
    ctx.fillStyle = '#b71c1c';
    setF('bold', 18);
    ctx.textAlign = 'center';
    ctx.fillText(o.label, PAD + 15, y + 11);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#374151';
    setF('normal', 24);
    o.lines.forEach(function (ln, li) { ctx.fillText(ln, PAD + 46, y + 18 + li * 34); });
    y += o.lines.length * 34 + 8;
  });
  if (optItems.length) y += 8;

  if (ansTxt) {
    ctx.fillStyle = '#ecfdf5';
    rr(PAD, y, W - PAD * 2, 50, 10); ctx.fill();
    ctx.fillStyle = '#065f46';
    setF('bold', 22);
    ctx.fillText('正确答案：' + ansTxt, PAD + 18, y + 26);
    y += 66;
  }

  if (anaLines.length) {
    ctx.fillStyle = '#b91c1c';
    setF('bold', 20);
    ctx.fillText('解析', PAD, y + 12);
    y += 34;
    ctx.fillStyle = '#4b5563';
    setF('normal', 22);
    anaLines.forEach(function (ln) { ctx.fillText(ln, PAD, y + 12); y += 32; });
  }

  var fy = cv.height - 112;
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, fy - 12); ctx.lineTo(W - PAD, fy - 12); ctx.stroke();

  ctx.fillStyle = '#b71c1c';
  setF('bold', 22);
  ctx.fillText('铁途学练', PAD, fy + 18);
  ctx.fillStyle = '#6b7280';
  setF('normal', 18);
  ctx.fillText('各行各业题库 · 错题复习 · 模拟考试', PAD, fy + 46);
  ctx.fillStyle = '#9ca3af';
  setF('normal', 17);
  ctx.fillText('技术支持：秦十三郎', PAD, fy + 72);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#b71c1c';
  setF('bold', 18);
  ctx.fillText('一起刷题 · 稳稳过考', W - PAD, fy + 18);
  ctx.fillStyle = '#9ca3af';
  setF('normal', 16);
  ctx.fillText('每天 10 题，进步看得见', W - PAD, fy + 46);
  ctx.textAlign = 'left';

  return cv.toDataURL('image/png');
}

// ================= 纯 JS 二维码生成器 (防断网依赖) =================
function generateQRCode(text, size) {
  // 优先本地离线生成二维码（qrcode.min.js），无网络也能扫码
  try {
    if (typeof qrcode === 'function' && text) {
      var qr = qrcode(0, 'M');
      qr.addData(String(text));
      qr.make();
      var n = qr.getModuleCount();
      var cell = Math.max(2, Math.floor(size / n));
      var c = document.createElement('canvas');
      c.width = c.height = n * cell;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#000000';
      for (var r = 0; r < n; r++) {
        for (var col = 0; col < n; col++) {
          if (qr.isDark(r, col)) ctx.fillRect(col * cell, r * cell, cell, cell);
        }
      }
      return c.toDataURL('image/png');
    }
  } catch (e) { console.error('本地二维码生成失败:', e); }
  // 兜底：外网接口（仅在线时可用）
  return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(text);
}
// ================= 滑动切题监听 =================
var touchStartX = 0;
var touchEndX = 0;

function handleTouchStart(e) {
  touchStartX = e.changedTouches[0].screenX;
}

function handleTouchEnd(e, prevFn, nextFn) {
  touchEndX = e.changedTouches[0].screenX;
  var diff = touchEndX - touchStartX;
  // 滑动距离超过 80 像素才触发，防止误触
  if (diff > 80) { 
    if (typeof prevFn === 'function') prevFn(); // 向右滑 = 上一题
  } else if (diff < -80) { 
    if (typeof nextFn === 'function') nextFn(); // 向左滑 = 下一题
  }
}

/* ================= 导出 PDF 通用保存 ================= */
function sanitizeFileName(name) {
  return String(name || '未命名').replace(/[\\/:*?"<>|\r\n]+/g, '_').replace(/\s+/g, ' ').trim();
}

// 5+ App 环境：把 Blob 写入本地文件；浏览器环境：走 a[download] 下载
// 回调 onDone(path, isPublicDir)：App 端先写手机“下载”目录，不行再写私有目录，两条路都保底
// 最后一招：绕过 plus.io，直接用安卓/鸿蒙原生 FileOutputStream 写文件。
// 有些鸿蒙机型的 FileWriter.write 写二进制会抛空错误，原生接口不受影响。
function saveViaNativeJava(blob, fileName, onOk, onErr) {
  try {
    if (typeof plus === 'undefined' || !plus.android || !plus.android.runtimeMainActivity) { onErr('当前环境没有 plus.android'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var fos = null, file = null;
      try {
        var dataUrl = String(fr.result || '');
        var b64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
        if (!b64) { onErr('base64 为空'); return; }
        console.log('[导出] 原生写入 base64 长度 = ' + b64.length);
        var File = plus.android.importClass('java.io.File');
        var FileOutputStream = plus.android.importClass('java.io.FileOutputStream');
        var B64CLASS = plus.android.importClass('android.util.Base64');
        var main = plus.android.runtimeMainActivity();
        var dir = null;
        try { dir = new File(main.getExternalFilesDir(null), '铁途学练导出'); } catch (e) { dir = null; }
        if (!dir) { dir = new File(main.getFilesDir(), '铁途学练导出'); }
        try { dir.mkdirs(); } catch (e) {}
        file = new File(dir, fileName);
        fos = new FileOutputStream(file);
        // 关键：一整段约 1MB 的 base64 字符串经过 JS→Java 桥接会被丢掉，
        // Base64.decode 于是返回 null，写入时就抛 NullPointerException（length of null array）。
        // 改成拆小块：每次 8KB base64（约 6KB 原始字节）解码后立刻写入。
        var CHUNK = 8192;
        var i = 0, total = b64.length, chunks = 0;
        while (i < total) {
          var chunk = b64.substring(i, i + CHUNK);
          var bytes = plus.android.invoke('android.util.Base64', 'decode', chunk, 0);
          if (!bytes) { try { bytes = B64CLASS.decode(chunk, 0); } catch (x) {} }
          if (!bytes) { throw new Error('Base64.decode 返回 null，偏移 ' + i); }
          fos.write(bytes);
          chunks++;
          i += CHUNK;
        }
        fos.flush();
        fos.close();
        fos = null;
        var sz = 0; try { sz = file.length(); } catch (x) {}
        console.log('[导出] 原生写入完成，共 ' + chunks + ' 块，文件 ' + sz + ' 字节');
        if (sz < 1000) { throw new Error('写入后文件只有 ' + sz + ' 字节，内容没落盘'); }
        onOk(file.getAbsolutePath(), false);
      } catch (e) {
        try { if (fos) fos.close(); } catch (x) {}
        var msg = String(e);
        try { if (e && e.message) msg = e.message; } catch (x) {}
        try { if (e && e.getClass) { var cn = e.getClass().getName(); if (cn) msg = cn + ": " + msg; } } catch (x) {}
        onErr('原生写入失败：' + msg);
      }
    };
    fr.onerror = function () { onErr('读取 PDF 数据失败'); };
    fr.readAsDataURL(blob);
  } catch (e) { onErr('原生写入异常：' + String(e)); }
}

// 把 5+ 的 IO 错误对象转成能看懂的文字（原来直接 console.error 只会打印 [object Object]）
function debugIoErr(e) {
  if (!e) return 'null';
  if (typeof e === 'string') return e;
  var parts = [];
  try {
    ['name', 'code', 'message', 'description'].forEach(function (k) {
      if (e[k] !== undefined && e[k] !== null) parts.push(k + '=' + e[k]);
    });
  } catch (x) {}
  if (parts.length === 0) { try { parts.push('keys=' + Object.keys(e).join(',')); } catch (x) {} }
  try { var j = JSON.stringify(e); if (j && j !== '{}') parts.push('json=' + j.slice(0, 160)); } catch (x) {}
  return parts.join(' | ') || String(e);
}

// 5+ App 环境：把 Blob 写入本地文件；浏览器环境：走 a[download] 下载
// App 端策略：先转 ArrayBuffer 再写（比直接写 Blob 兼容性强得多）；
// 目录按「下载目录 → 私有目录」依次尝试，原名写不进去再用纯英文文件名重来一遍。
function savePdfBlob(blob, fileName, onDone, onFail) {
  var inApp = (typeof plus !== 'undefined' && plus.android);
  if (!inApp) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    onDone(fileName, true);
    return;
  }
  if (typeof hkSaveBytes !== 'function') { onFail('保存组件未加载'); return; }
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var u8 = new Uint8Array(fr.result);
      showToast('正在保存 ' + Math.max(1, Math.round(u8.length / 1024)) + ' KB，请稍候…');
      setTimeout(function () {
        try {
          hkSaveBytes(u8, fileName, 'application/pdf', function (path, isPub) { onDone(path, isPub); }, function (msg) { onFail(msg || '保存失败'); });
        } catch (e2) { onFail(String(e2)); }
      }, 50);
    } catch (e) { onFail(String(e)); }
  };
  fr.onerror = function () { onFail('读取 PDF 数据失败'); };
  fr.readAsArrayBuffer(blob);
}

/* ===== 逐页生成 PDF =====
   老做法把整条长元素一次性交给 html2pdf，有几个坑：
   1) html2canvas 拿不到显式宽高时算出的画布高度是 0，导出的 PDF 正文空白、只剩一张水印纸；
   2) 题量一大整张画布能高到上万像素，手机上直接爆内存；
   3) html2pdf 的 from() 会把元素搬进它自己的容器，搬完之后元素坐标就变了，
      于是第二页往后全被截成空白。
   现在：每页单独复制到一个固定在 (0,0) 的容器里截图 → 在画布上合成水印 → 逐页 addImage 拼进同一个 PDF。 */
// 导出遮罩：盖住临时排版容器，避免生成 PDF 时纸张在页面底层闪动
function showPdfOverlay(msg) {
  hidePdfOverlay();
  var ov = document.createElement('div');
  ov.id = 'pdfOverlay';
  ov.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;background:#fff;z-index:2147483600;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"SimSun","宋体",serif;overscroll-behavior:contain;';
  ov.innerHTML = '<style>@keyframes pdfspin{to{transform:rotate(360deg)}}</style>'
    + '<div style="width:40px;height:40px;border:4px solid #eee;border-top-color:#b71c1c;border-radius:50%;animation:pdfspin .9s linear infinite;"></div>'
    + '<div id="pdfOverlayMsg" style="margin-top:14px;font-size:14px;color:#555;">' + (msg || '正在生成 PDF…') + '</div>';
  document.body.appendChild(ov);
  return ov;
}
function hidePdfOverlay() {
  var ov = document.getElementById('pdfOverlay');
  if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
}
function setPdfOverlayMsg(t) {
  var m = document.getElementById('pdfOverlayMsg');
  if (m) m.textContent = t;
}
function buildPdfFromPages(element, wmDataUrl, onProgress) {
  var t0 = Date.now(); window.__pdfT0 = t0;
  var pages = element.querySelectorAll('.pdf-page');
  if (!pages || pages.length === 0) pages = [element];
  var A4_W = 210, A4_H = 297, MARGIN = 10;
  var CONTENT_W = A4_W - MARGIN * 2;
  var CONTENT_H = A4_H - MARGIN * 2;
  var baseCss = element.style.cssText || '';

  // 水印直接在画布上画：不依赖 PNG 透明通道（jsPDF 对带 alpha 的整页 PNG 支持不稳，会糊成一页白雾）
  function stampWatermark(cv) {
    try {
      var wc = cv.getContext('2d');
      wc.save();
      wc.globalAlpha = 0.07;
      wc.translate(cv.width / 2, cv.height / 2);
      wc.rotate(-Math.PI / 4);
      wc.textAlign = 'center';
      wc.textBaseline = 'middle';
      wc.fillStyle = '#b71c1c';
      wc.font = 'bold ' + Math.round(cv.width * 0.17) + 'px "SimSun","宋体",sans-serif';
      wc.fillText('铁途学练', 0, 0);
      try {
        if (typeof authWmTag === 'function') {
          wc.globalAlpha = 0.1;
          wc.fillStyle = '#0d47a1';
          wc.font = 'bold ' + Math.round(cv.width * 0.045) + 'px "SimSun","宋体",sans-serif';
          wc.fillText('专属编号 ' + authWmTag(), 0, Math.round(cv.height * 0.075));
        }
      } catch (e) {}
      wc.restore();
    } catch (e) {}
  }

  var wmReady = Promise.resolve(true);

  return wmReady.then(function () {
    var blank = document.createElement('div');
    blank.style.cssText = 'width:1px;height:1px;overflow:hidden;position:absolute;left:-9999px;top:0;';
    document.body.appendChild(blank);

    return html2pdf().set({ margin: 0, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, image: { type: 'jpeg', quality: 0.95 } })
      .from(blank).toPdf().get('pdf')
      .then(function (pdf) {
        if (blank.parentNode) blank.parentNode.removeChild(blank);
        var reuseFirst = false;
        try { pdf.deletePage(1); } catch (e) { reuseFirst = true; }

        var total = pages.length;
        var done = 0;
        var chain = Promise.resolve();

        [].forEach.call(pages, function (pg) {
          chain = chain.then(function () {
            var one = document.createElement('div');
            one.style.cssText = baseCss + ' position:absolute; left:0; top:0; z-index:-1; pointer-events:none;';
            one.appendChild(pg.cloneNode(true));
            document.body.appendChild(one);

            var rect = one.getBoundingClientRect();
            var cw = Math.round(rect.width);
            var ch = Math.round(rect.height);

            var o = {
              margin: 0,
              html2canvas: {
                scale: 1.3, useCORS: true, backgroundColor: '#ffffff',
                width: cw, height: ch,
                windowWidth: cw + 40, windowHeight: ch + 40,
                x: 0, y: 0, scrollX: 0, scrollY: 0
              },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
              image: { type: 'jpeg', quality: 0.95 },
              pagebreak: { mode: [] }
            };

            return html2pdf().set(o).from(one).toCanvas().get('canvas').then(function (cv) {
              /* 水印已随页面一起截图，无需在画布上重复绘制 */
              var url = cv.toDataURL('image/jpeg', 0.72);
              if (reuseFirst) { pdf.setPage(1); reuseFirst = false; }
              else { pdf.addPage(); }
              pdf.addImage(url, 'JPEG', MARGIN, MARGIN, CONTENT_W, CONTENT_H);
              done++;
              if (typeof onProgress === 'function') { try { onProgress(done, total); } catch (e) {} }
              try { cv.width = 1; cv.height = 1; } catch (e) {}
              if (one.parentNode) one.parentNode.removeChild(one);
            }, function (err) {
              if (one.parentNode) one.parentNode.removeChild(one);
              throw err;
            });
          });
        });

        return chain.then(function () {
          try { console.log('[导出] 生成用时 ' + (Date.now() - t0) + 'ms（' + total + ' 页）'); } catch (e) {}
          return pdf;
        });
      });
  });
}

// 统一收尾：水印已加在 pdf 上，按环境落盘并提示导出状态
function finalizePdfExport(pdf, fileName, element, successMsg) {
  var removed = false;
  function cleanup() { if (element && element.parentNode) document.body.removeChild(element); hidePdfOverlay(); removed = true; }
  // 兜底：万一写文件回调始终不回来（老机型 plus.io 偶发无响应），12 秒后也把临时容器清掉
  var watchdog = setTimeout(function () { if (!removed) cleanup(); }, 12000);
  var blob;
  var tSave = Date.now();
  try { blob = pdf.output('blob'); } catch (e) { clearTimeout(watchdog); cleanup(); showToast('生成 PDF 失败，请重试', true); console.error(e); return; }
  savePdfBlob(blob, fileName, function(path, isPublic) {
    clearTimeout(watchdog); cleanup();
    try { console.log('[导出] 保存用时 ' + (Date.now() - tSave) + 'ms'); } catch (e) {}
    var inApp = (typeof plus !== 'undefined' && plus.io);
    if (inApp) {
      var _ms = Date.now() - (window.__pdfT0 || Date.now());
      showToast('导出成功：' + fileName + (isPublic ? '（下载目录）' : '（应用目录）') + '，用时 ' + (_ms / 1000).toFixed(1) + ' 秒');
      // App 里存完直接把文件交给系统打开，省得用户找不到目录
      try {
        var openPath = path;
        if (openPath && openPath.indexOf('file://') !== 0 && openPath.charAt(0) === '/') openPath = 'file://' + openPath;
        // 存到 MediaStore 的「下载」时返回的是 Download/xxx 这种描述串，不是真路径，不能拿去 openFile
        if (openPath && openPath.indexOf('file://') === 0) {
          setTimeout(function () {
            try { plus.runtime.openFile(openPath); } catch (e) { console.warn('打开文件失败', e); }
          }, 260);
        }
      } catch (e) {}
    }
    else showToast(successMsg || '导出成功，请保存或打印');
  }, function(err) {
    clearTimeout(watchdog); cleanup();
    var inApp2 = (typeof plus !== 'undefined' && plus.io);
    showToast(inApp2 ? '保存失败：请检查手机是否允许本应用写入存储，然后重试' : '保存文件失败，请重试', true);
    console.error('[导出] 保存失败：' + (err && (err.message || err.code || err) || '未知错误'), err);
  });
}

function exportWrongToPrint() {
  var currentWrong = wrongBook.filter(function(w){ return w.bankId === activeBankId; });
  if (currentWrong.length === 0) return showToast('当前没有错题可导出', true);

  var bankName = (activeBankId && allBanks[activeBankId]) ? allBanks[activeBankId].name : "综合";
  showToast('正在生成 PDF，请稍候...');

  var groups = { single: [], multiple: [], judge: [], fill: [], short: [], essay: [] };
  for (var i = 0; i < currentWrong.length; i++) {
    if (groups[currentWrong[i].type]) groups[currentWrong[i].type].push(currentWrong[i]);
  }

  var typeNames = { single: '单选题', multiple: '多选题', judge: '判断题', fill: '填空题', short: '简答题', essay: '论述题' };
  var typeOrder = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var chineseNumbers = ['一', '二', '三', '四', '五', '六'];
  var sectionIndex = 0;

  var PAGE_W_MM = 190;
  var PAGE_H_MM = 277;          // A4 可用高度 277mm，用 mm 单位保证与 190mm 宽同比
  var MAX_H = 0;                // 已改为按每页实际高度动态计算，此变量仅保留占位

  var pagesWrap = document.createElement('div');
  // ★ 生成用的容器必须挪到屏幕外：以前它直接挂在 body 上，190mm 宽的长条会一直显示在页面底部，
  // 看上去像“预览页”，而且关不掉。这里放到视口外，html2canvas 仍能正常截图。
  pagesWrap.style.cssText = 'position:absolute; left:0; top:0; z-index:-1; pointer-events:none; width:' + PAGE_W_MM + 'mm; padding:0 15px; box-sizing:border-box; background:#fff; font-family:"SimSun","宋体",serif; font-size:13pt; line-height:1.6; color:#000;';
  document.body.appendChild(pagesWrap);
  showPdfOverlay('正在生成 PDF…');

  var curInner = null;
  function newPageInner() {
    var pageDiv = document.createElement('div');
    pageDiv.className = 'pdf-page';
    pageDiv.style.cssText = 'position:relative; width:100%; height:' + PAGE_H_MM + 'mm; box-sizing:border-box; overflow:hidden; background:#fff;';
    var inner = document.createElement('div');
    inner.style.cssText = 'position:relative; z-index:2;';
    pageDiv.appendChild(inner);
    // 水印直接画进页面里：跟着页面一起截图，位置恒定，也不会像整页 PNG 那样把正文糊成白雾
    var wmLayer = document.createElement('div');
    wmLayer.style.cssText = 'position:absolute; left:0; top:0; right:0; bottom:0; z-index:1; display:flex; align-items:center; justify-content:center; pointer-events:none; overflow:hidden;';
    var wmSpan = document.createElement('span');
    wmSpan.style.cssText = 'position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-30deg); font-family:"SimSun","宋体",serif; font-size:88pt; font-weight:bold; color:rgba(183,28,28,0.07); white-space:nowrap; line-height:1;';
    wmSpan.textContent = '铁途学练';
    wmLayer.appendChild(wmSpan);
    pageDiv.appendChild(wmLayer);
    pagesWrap.appendChild(pageDiv);
    curInner = inner;
    return inner;
  }
  function addBlock(blockHtml) {
    if (!curInner) newPageInner();
    var tmp = document.createElement('div');
    tmp.innerHTML = blockHtml;
    var node = tmp.firstElementChild;
    if (!node) return;
    curInner.appendChild(node);
    if (curInner.getBoundingClientRect().height > (curInner.parentNode.clientHeight - 8) && curInner.childElementCount > 1) {
      curInner.removeChild(node);
      newPageInner();
      curInner.appendChild(node);
    }
  }

  // 卷头
  addBlock(`<div style="text-align:center;"><h1 style="font-size:22pt; margin:0 0 10px; font-weight:bold;">${bankName} - 错题本</h1><div style="font-size:12pt; padding-bottom:10px;">共计：${currentWrong.length} 题</div><hr style="border:1px solid #000; margin:0 0 14px;"></div>`);

  for (var t = 0; t < typeOrder.length; t++) {
    var type = typeOrder[t];
    var tQs = groups[type];
    if (!tQs || tQs.length === 0) continue;

    var secTitle = chineseNumbers[sectionIndex] || String(sectionIndex + 1);
    sectionIndex++;
    addBlock(`<div style="font-weight:bold; font-size:14pt; padding:14px 0 10px;">${secTitle}、${typeNames[type]}（共 ${tQs.length} 题）</div>`);

    for (var j = 0; j < tQs.length; j++) {
      var qq = tQs[j];
      var optsHtml = '';
      if (qq.type === 'judge') {
        optsHtml += `<div style="margin-left:20pt; padding-bottom:2px;">A. 正确 &nbsp;&nbsp;&nbsp;&nbsp; B. 错误</div>`;
      } else if (qq.type !== 'fill' && qq.type !== 'short' && qq.type !== 'essay' && qq.options) {
        for (var k = 0; k < qq.options.length; k++) {
          optsHtml += `<div style="margin-left:20pt; padding-bottom:2px;">${String.fromCharCode(65 + k)}. ${qq.options[k]}</div>`;
        }
      } else {
        optsHtml += `<div style="height:50pt; border-bottom:1px dotted #000; margin-top:8pt;"></div>`;
        if (qq.type === 'short' || qq.type === 'essay') {
          optsHtml += `<div style="height:50pt; border-bottom:1px dotted #000; margin-top:8pt;"></div>`;
        }
      }
      addBlock(`<div style="padding-top:8px;"><div style="padding-bottom:4px;">${j + 1}. ${qq.question}</div>${optsHtml}</div>`);
    }
  }

  var element = pagesWrap;

  var wmCanvas = document.createElement('canvas');
  wmCanvas.width = 900; wmCanvas.height = 1273;
  var ctx = wmCanvas.getContext('2d');
  ctx.translate(wmCanvas.width / 2, wmCanvas.height / 2);

function exportExamToWord(isPreview) {
  var bankName = (activeBankId && allBanks[activeBankId]) ? allBanks[activeBankId].name : "综合";
  
  var qs = [];
  if (isPreview === true) {
    // 设置页“导出试题”：按当前组卷设置（各题型题量、分值、跨库抽题）生成一套试卷再导出
    qs = buildExamPaper();

  } else {
    qs = (examQuestions && examQuestions.length > 0) ? examQuestions : buildExamPaper();
  }
  
  if (qs.length === 0) return showToast('当前没有题目可导出', true);

  showToast('正在生成 PDF，请稍候...');

  var groups = { single: [], multiple: [], judge: [], fill: [], short: [], essay: [] };

  var typeNames = { single: '单选题', multiple: '多选题', judge: '判断题', fill: '填空题', short: '简答题', essay: '论述题' };

  var chineseNumbers = ['一', '二', '三', '四', '五', '六'];
  var sectionIndex = 0;

  /* ★ 真实测量分页：每页固定 A4 可用高度，逐题测量是否放得下，放不下就换页
