<style>
  @font-face { font-family: 'MaoTi'; src: url('./font.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
  @font-face { font-family: 'MaoTi'; src: url('./font.ttf') format('truetype'); font-weight: bold; font-style: normal; font-display: swap; }
  :root { --bg-color: #f0f4f8; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --border-color: #e2e8f0; --input-bg: #f8fafc; --mao-ink: #221f1a; }
  body.dark-mode { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-sub: #94a3b8; --border-color: #334155; --input-bg: #0f172a; --mao-ink: #d8d5cf; }
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-main); padding: calc(10px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) calc(10px + env(safe-area-inset-left, 0px)); -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s; }

  /* 开屏动画 */
  #splash-screen { position: fixed; top:0; left:0; right:0; bottom:0; background: #fcf9f2; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s; }
  #splash-screen.hidden { opacity: 0; pointer-events: none; }
  .splash-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .calligraphy-group { display: flex; gap: 40px; position: absolute; transition: opacity 0.8s ease; align-items: center; justify-content: center; }
  .calligraphy-group.fade-out { opacity: 0; pointer-events: none; }
  .calligraphy-col { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 3.5rem; font-weight: bold; writing-mode: vertical-rl; color: #b71c1c; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); opacity: 0; transform: scale(1.1); animation: inkReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .col-1 { margin-top: 60px; } .col-2 { margin-bottom: 60px; animation-delay: 0.5s; }
  .second-splash { display: none; position: absolute; opacity: 0; width: 100%; height: 100%; }
  .second-splash.show { display: block; opacity: 1; }
  .main-text-group { display: flex; align-items: flex-start; justify-content: center; gap: 15px; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); }
  .second-col { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-weight: bold; writing-mode: vertical-rl; color: #b71c1c; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); animation: inkReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
  .second-col.s-col-1 { font-size: 3.2rem; margin-top: 30px; }
  .second-col.s-col-2 { font-size: 3.6rem; animation-delay: 0.5s; }
  .signature { font-family: 'MaoTi', 'STXingkai', cursive; font-size: 1.2rem; color: #b71c1c; writing-mode: vertical-rl; opacity: 0; animation: inkReveal 1.5s 1s forwards; margin-top: 150px; margin-left: 5px; }
  @keyframes inkReveal { 0% { opacity: 0; filter: blur(10px); transform: scale(1.1); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }

  /* 基础样式 */
  .nav { background: var(--card-bg); padding: 10px 15px; border-bottom: 2px solid #b71c1c; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; max-width: 480px; margin: 0 auto 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; }
  #app { max-width: 480px; margin: 0 auto; }
  .nav-logo { font-size: 0.95rem; font-weight: bold; color: #b71c1c; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .nav-logo img { width: 22px; height: 22px; object-fit: contain; }
  .nav-right { font-size: 0.8rem; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; overflow: visible; }
  .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; border-left: 4px solid #b71c1c; padding-left: 8px; }
  .banner { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; line-height: 1.5; }
  .price-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; text-align: center; }
  .price-card { flex: 1 1 21%; min-width: 0; border-radius: 8px; padding: 8px 2px; position: relative; }
  .price-card .p-label { font-size: 0.7rem; margin-bottom: 4px; }
  .price-card .p-price { font-size: 1.0rem; font-weight: bold; }

  .bank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; }
  .bank-item.active { border-color: #0d47a1; background: rgba(13,71,161,0.1); }
  .bank-title { font-weight: bold; font-size: 0.95rem; }
  .bank-meta { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
  .stat-item { flex: 1; min-width: 60px; background: var(--input-bg); padding: 10px; border-radius: 8px; text-align: center; }
  .stat-num { font-size: 1.2rem; font-weight: bold; color: #0d47a1; }
  .stat-label { font-size: 0.75rem; color: var(--text-sub); }

  /* 圆饼图 */
  .pie-chart-container { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  .pie-chart { width: 70px; height: 70px; border-radius: 50%; background: conic-gradient(#10b981 0%, #10b981 var(--percentage), var(--border-color) var(--percentage), var(--border-color) 100%); display: flex; align-items: center; justify-content: center; position: relative; }
  .pie-chart::after { content: ''; position: absolute; width: 50px; height: 50px; background: var(--card-bg); border-radius: 50%; }
  .pie-chart-text { position: absolute; z-index: 1; font-weight: bold; color: var(--text-main); font-size: 1rem; }
  .pie-info { flex: 1; padding-left: 20px; text-align: left; }
  .pie-info div { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
  .pie-info span { font-size: 1.1rem; font-weight: bold; color: #0d47a1; }

  .menu { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .menu-btn { flex: 1; min-width: 30%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px 2px; text-align: center; font-weight: bold; font-size: 0.82rem; cursor: pointer; color: var(--text-main); white-space: nowrap; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
  .menu-btn:active { background: var(--input-bg); }
  .sub-menu { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .sub-menu .btn { flex: 1; min-width: 18%; padding: 8px 0; font-size: 0.85rem; border-radius: 6px; }

  .btn { border: none; border-radius: 8px; padding: 12px 15px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; white-space: nowrap; }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: #0d47a1; color: #fff; }
  .btn-danger { background: #b71c1c; color: #fff; border: 1px solid transparent; }
  .btn-danger-ghost { background: var(--input-bg); border: 1px solid #b71c1c; color: #ef4444; }
  .btn-outline { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); }
  .btn-block { width: 100%; margin-top: 10px; }
  .btn-green { background: #10b981; color: #fff; }
  .btn-small { padding: 6px 10px; font-size: 0.8rem; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 10px 15px; border-radi;}
  .timer { font-family: monospace; font-size: 1.1rem; font-weight: bold; color: #ef4444; }
  .q-progress { font-size: 0.85rem; color: var(--text-sub); font-weight: bold; }

  .sheet-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 999; display: none; align-items: fl
  }
  .sheet-mask.show {
    display: flex;
	 }
  .sheet-content { background: var(--bg-color); width: 100%; max-height: 75vh; border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
  .sheet-mask.show .sheet-content { transform: translateY(0); }
  .sheet-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  .acc-group { margin-bottom: 12px; background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
  .acc-header { padding: 12px 15px; background: var(--input-bg); font-weight: bold; font-size: 0.95rem; color: #0d47a1; display: flex; justify-content: space-between; cursor: pointer; }
  .acc-header span { font-size: 0.8rem; color: var(--text-sub); font-weight: normal; }
  .acc-body { padding: 15px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; border-top: 1px solid var(--border-color); }
  .acc-body.hidden { display: none; }
  .num-btn { width: 30px; height: 30px; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: var(--input-bg); border-radius: 50%; font-weight: bold; color: var(--text-main); border: 1px solid var(--border-color); cursor: pointer; font-size: 0.72rem; }
  .num-btn.done, .num-btn.right { background: #10b981; color: #fff; border-color: #10b981; }
  .num-btn.wrong { background: #ef4444; color: #fff; border-color: #ef4444; }

  .tag { display: inline-block; padding: 2px 8px; background: #0d47a1; color: #fff; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
  .q-text { font-size: 1.05rem; font-weight: bold; line-height: 1.5; margin-bottom: 15px; position: relative; padding-right: 65px; }
  .note-badge { background: var(--input-bg); border-left: 4px solid #0d47a1; padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #0d47a1; margin-bottom: 15px; cursor: pointer; }
  .note-badge:active { opacity: 0.7; }
  .mao-quote { flex: 1; text-align: center; color: var(--mao-ink); font-family: "MaoTi", "STXingkai", "KaiTi", "楷体", KaiTi, serif; font-size: 1.05rem; font-weight: bold; line-height: 1.3; padding: 0 10px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
  .mao-inner { display: inline-block; white-space: nowrap; font-family: inherit; }
  .mao-quote.scroll { text-align: left; }
  .mao-quote.scroll .mao-inner { animation: maoMarquee linear infinite; }
  @keyframes maoMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .mao-quote.fade-in { animation: maoFade 0.8s ease; }
  @keyframes maoFade { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }

  .subjective-answer { background: var(--input-bg); border: 2px solid #10b981; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
  .subjective-answer .sa-title { font-weight: bold; color: #10b981; margin-bottom: 8px; font-size: 0.9rem; }
  .subjective-answer .sa-content { line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; color: var(--text-main); }

  .opt { border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; position: relative; background: var(--card-bg); }
  .opt:hover:not(.disabled) { border-color: #94a3b8; }
  .opt.selected { border-color: #0d47a1; background: rgba(13,71,161,0.1); }
  .opt.correct { border-color: #10b981; background: rgba(16,185,129,0.1); }
  .opt.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }
  .opt.disabled { cursor: not-allowed; }
  .opt-prefix { width: 22px; height: 22px; border-radius: 50%; background: var(--input-bg); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; color: var(--text-sub); }
  .opt.selected .opt-prefix { background: #0d47a1; color: #fff; border-color: #0d47a1; }
  .opt.correct .opt-prefix { background: #10b981; color: #fff; border-color: #10b981; }
  .opt.wrong .opt-prefix { background: #ef4444; color: #fff; border-color: #ef4444; }

  .analysis { padding: 12px; background: var(--input-bg); border-radius: 8px; margin-top: 15px; font-size: 0.85rem; border-left: 4px solid #0d47a1; line-height: 1.5; color: var(--text-sub); display: none; }
  .analysis.show { display: block; }
  .analysis.error { border-left-color: #ef4444; }
  .analysis.success { border-left-color: #10b981; }

  .exam-review-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 0.85rem; line-height: 1.5; background: var(--input-bg); }
  .exam-review-box.err { border-left: 4px solid #ef4444; }
  .exam-review-box.ok { border-left: 4px solid #10b981; }

  /* 单选组样式 */
  .radio-group { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .radio-item { flex: 1; min-width: 30%; padding: 8px; text-align: center; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; cursor: pointer; background: var(--card-bg); }
  .radio-item.active { background: #0d47a1; color: #fff; border-color: #0d47a1; }

  /* 毛体分数 */
  .score-box { text-align: center; padding: 30px 0; }
  .score-num, .score-slant-num {
      font-family: 'Segoe Script', 'Bradley Hand', 'Comic Sans MS', 
                   'STXingkai', 'KaiTi', cursive;
      color: #e53935;          /* 红笔色，比 #d32f2f 更鲜亮 */
      font-size: 5rem;
      font-weight: bold;
      display: inline-block;
      line-height: 1;
      transform: rotate(-4deg);  /* 微微歪斜，像手写 */
      letter-spacing: 1px;
  }
  .bottom-actions { display: flex; gap: 10px; margin-top: 20px; }
  .bottom-actions .btn { flex: 1; }
  .maoti-result { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 2.2rem; color: #0d47a1; text-align: center; margin: 20px 0; line-height: 1.4; }
  .maoti-result.full { color: #b71c1c; }
  .maoti-fail { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 2rem; color: #d32f2f; text-align: center; line-height: 1.5; }

  .toast { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 9999; display: none; }

  .app-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .app-box { background: var(--card-bg); padding: 25px 25px calc(25px + env(safe-area-inset-bottom, 0px)); border-radius: 16px; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .app-box h3 { font-size: 1.2rem; color: #b71c1c; margin-bottom: 10px; font-weight: bold; }
  .app-box p { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.5; }
  .app-box .actions { display: flex; gap: 10px; }
  .app-box .btn { flex: 1; padding: 10px; font-size: 0.95rem; border-radius: 8px; }

  .footer { text-align: center; color: var(--text-sub); font-size: 0.8rem; margin-top: 20px; padding-bottom: 20px; }

  .search-tip { text-align: center; font-size: 0.75rem; color: #64748b; line-height: 1.5; margin: 2px 4px 14px; padding: 7px 10px; background: var(--input-bg); border: 1px dashed var(--border-color); border-radius: 8px; }
  .search-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .search-box { background: var(--card-bg); border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
  .search-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
  .search-header h3 { font-size: 1.1rem; color: #0d47a1; margin: 0; }
  .search-input-group { padding: 15px; background: var(--input-bg); }
  .search-input-group input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; background: var(--card-bg); color: var(--text-main); }
  .search-input-group input:focus { border-color: #0d47a1; }
  .search-filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .search-filters button { flex: 1; min-width: 15%; padding: 6px; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); cursor: pointer; }
  .search-filters button.active { background: #0d47a1; color: #fff; border-color: #0d47a1; }
  .search-results { flex: 1; overflow-y: auto; padding: 15px; }
  .search-item { border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px; background: var(--card-bg); cursor: pointer; }
  .search-item:active { background: var(--input-bg); }
  .search-item .s-title { font-weight: bold; font-size: 0.95rem; color: var(--text-main); margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .search-item .s-type { font-size: 0.75rem; color: var(--text-sub); }

  .feedback-badge { position: absolute; top: -30px; right: -35px; width: 90px; height: 90px; pointer-events: none; z-index: 40; opacity: 0; transform: rotate(-10deg) scale(0); animation: stampIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; align-items: center; justify-content: center; }
  .feedback-badge::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 42 8 C 15 12, 2 35, 8 60 C 12 85, 35 96, 60 92 C 82 88, 94 70, 90 45 C 88 28, 78 15, 62 10 C 50 6, 40 12, 35 25' fill='none' stroke='%23d32f2f' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' /%3E%3C/svg%3E"); background-size: contain; background-repeat: no-repeat; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
  .feedback-text { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 3rem; font-weight: bold; color: #d32f2f; transform: rotate(-10deg); margin-top: -6px; margin-left: -4px; }
  @keyframes stampIn { 0% { transform: rotate(-30deg) scale(0); opacity: 0; } 80% { transform: rotate(-8deg) scale(1.1); opacity: 1; } 100% { transform: rotate(-10deg) scale(1); opacity: 1; } }

  #fireworks-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }

  /* ========== 折叠面板 ========== */
  .fold-panel { margin-bottom: 12px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
  .fold-header { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 0.95rem; color: var(--text-main); background: var(--input-bg); }
  .fold-header .fold-icon { transition: transform 0.25s; font-size: 0.8rem; color: var(--text-sub); }
  .fold-header.collapsed .fold-icon { transform: rotate(-90deg); }
  .panel-content { overflow: hidden; max-height: 600px; transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1), padding 0.32s cubic-bezier(0.4, 0, 0.2, 1); padding: 10px 12px; }
  .panel-content.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; }
  .rename-btn { padding: 3px 8px; font-size: 0.75rem; margin-right: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); border-radius: 4px; cursor: pointer; }
  .bank-fold-content { display: flex; gap: 8px; align-items: center; }
  .bank-fold-content .btn { padding: 6px 12px; font-size: 0.8rem; }

  /* ========== 字号调节 ========== */
  .font-ctrl { display: flex; gap: 4px; align-items: center; }
  .font-ctrl button { width: 28px; height: 28px; padding: 0; font-size: 0.85rem; line-height: 1; }
  .q-text, .opt, .analysis, .subjective-answer { font-size: var(--q-font-size, 1rem); }
  .opt .opt-prefix { font-size: calc(var(--q-font-size, 1rem) * 0.8); }
  .fav-star { float:right; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-sub); border-radius:8px; padding:4px 8px; font-size:0.8rem; cursor:pointer; white-space:nowrap; }
  .fav-star.on { background:#fff7e6; color:#b45309; border-color:#fcd34d; }
  .fav-star:active { opacity:0.8; }

  return authSign(rec).then(function (sig) {
    rec.sig = sig; var s = JSON.stringify(rec);
    try { localStorage.setItem(AUTH_KEYS.ls, s); } catch (e) {}
    try { sessionStorage.setItem(AUTH_KEYS.ss, s); } catch (e) {}
    authCkSet(s); authIdbPut(s);
    var el = document.querySelector('[' + AUTH_KEYS.dom + ']');
    if (!el) { el = document.createElement('div'); el.setAttribute(AUTH_KEYS.dom, s); el.style.display = 'none'; document.body.appendChild(el); }
    else { el.setAttribute(AUTH_KEYS.dom, s); }
  });
}
function authReadAll() {
  var raw = [];
  try { raw.push(localStorage.getItem(AUTH_KEYS.ls)); } catch (e) {}
  try { raw.push(sessionStorage.getItem(AUTH_KEYS.ss)); } catch (e) {}
  raw.push(authCkGet());
  var el = document.querySelector('[' + AUTH_KEYS.dom + ']'); if (el) raw.push(el.getAttribute(AUTH_KEYS.dom));
  return authIdbGet().then(function (v) { raw.push(v); return raw; }).then(function (list) {
    var valid = [];
    list.forEach(function (s) { if (!s) return; try { var r = JSON.parse(s); if (r && r.sig) valid.push(r); } catch (e) {} });
    if (!valid.length) return { rec: null, tamper: false };
    return Promise.all(valid.map(function (r) {
      var c = Object.assign({}, r); delete c.sig;
      return authSha256(AUTH_SECRET + '|' + JSON.stringify(c)).then(function (h) { return h.slice(0, 16) === r.sig; });
    })).then(function (oks) {
      var good = valid.filter(function (_, i) { return oks[i]; });
      if (!good.length) return { rec: null, tamper: true };
      var map = {};
      good.forEach(function (r) { var k = JSON.stringify([r.fp, r.fpl, r.first, r.exp, r.act]); (map[k] = map[k] || []).push(r); });
      var keys = Object.keys(map).sort(function (a, b) { return map[b].length - map[a].length; });
      return { rec: map[keys[0]][0], tamper: keys.length > 1 };
    });
  });
}

/* ---------- 淘宝时间双重控制 ---------- */
function authNetTime() {
  return new Promise(function(resolve) {
    var isResolved = false;
    var timeoutId = setTimeout(function() {
      if (!isResolved) {
        isResolved = true;
        resolve(null); // 3秒超时直接返回null，走离线容错
      }
    }, 3000);

    // 优先尝试淘宝，如果报错则快速尝试备用节点
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp', true);
    xhr.timeout = 2500;
    xhr.onload = function() {
      if (isResolved) return;
      try {
        var d = JSON.parse(xhr.responseText);
        if (d && d.data && d.data.t) {
          isResolved = true;
          clearTimeout(timeoutId);
          resolve(parseInt(d.data.t));
          return;
        }
      } catch(e) {}
      // 淘宝失败，试苏宁
      tryXhr('https://f.m.suning.com/api/ct.do', function(d) {
        return d.currentTime;
      });
    };
    xhr.onerror = xhr.ontimeout = function() {
      if (isResolved) return;
      tryXhr('https://f.m.suning.com/api/ct.do', function(d) {
        return d.currentTime;
      });
    };
    xhr.send();

    function tryXhr(url, getter) {
      if (isResolved) return;
      var x2 = new XMLHttpRequest();
      x2.open('GET', url, true);
      x2.timeout = 2500;
      x2.onload = function() {
        if (isResolved) return;
        try {
          var d = JSON.parse(x2.responseText);
          var t = getter(d);
          if (t) {
            isResolved = true;
            clearTimeout(timeoutId);
            resolve(parseInt(t));
            return;
          }
        } catch(e) {}
        // 苏宁失败，用本地时间兜底（防止卡死）
        if (!isResolved) { isResolved = true; clearTimeout(timeoutId); resolve(Date.now()); }
      };
      x2.onerror = x2.ontimeout = function() {
        if (!isResolved) { isResolved = true; clearTimeout(timeoutId); resolve(Date.now()); }
      };
      x2.send();
    }
  });
}
function netTime() { return authNetTime().catch(function () { return null; }); }

/* ---------- 激活码校验 ---------- */
function authVerifyCode(code, devCode) {
  var dc = devCode || authDeviceCode;
  var p = String(code).toUpperCase().replace(/[^A-Z0-9-]/g, '').split('-');
  if (p.length !== 3) return Promise.resolve(null);
  var tag = p[2], got = p[0] + p[1];
  return authSha256(AUTH_SECRET + '|' + dc + '|' + tag).then(function (h) {
    if (authB32(authHexU8(h), 10) !== got) return null;
    return tag === 'PERM' ? AUTH_PERM : parseInt(tag.slice(1), 36);
  });
}

function doLogin() {
  var box = document.getElementById('regCodeInput');

  if (!code) return showToast('请先输入激活码', true);

  netTime().then(function (now) {
    if (now == null) { showToast('需要联网激活，请连接网络后重试', true); return; }
    authVerifyCode(code).then(function (exp) {
      if (exp == null) { showToast('激活码无效或不属于本设备', true); return; }
      authReadAll().then(function (res) {

        rec.act = true; rec.exp = exp; rec.code = code; rec.maxSeen = now;

          pendingTrial = false;
          showToast(exp >= AUTH_PERM ? '永久授权激活成功' : '授权激活成功');

/* ---------- 启动校验 ---------- */
function authBoot() {
  authReady = false;
  var c = authComps();
  Promise.all([authFpOf(c, false), authFpOf(c, true)]).then(function (f) {
    authFp = f[0]; authFpLoose = f[1]; authDeviceCode = authDeviceCodeOf(f[0]);
    if (currentMode === 'login') render();
    return netTime();
  }).then(function (now) {
    if (now == null) { authLock('offline'); return; }
    return authReadAll().then(function (res) {
      if (res.tamper) { authLock('tamper'); return; }
      var rec = res.rec;

      if (!rec) {
        pendingTrial = true;
        authReady = true;
        isAuthorized = false;
        currentMode = 'login';
        render();
        return;
      }
      pendingTrial = false;

      if (rec.fp !== authFp && rec.fpl !== authFpLoose) { authLock('device'); return; }
      if (rec.maxSeen && now < rec.maxSeen - 5 * 60000) { authLock('clock'); return; }
      rec.maxSeen = now; authSaveAll(rec);
      if (rec.act) { if (rec.exp <= now) { authLock('expired'); return; } authOk('activated', rec.exp); }
      else { if (rec.exp <= now) { authLock('trial'); return; } authOk('trial', rec.exp); }
    });
  });
}
function authRetry() {
  if (currentMode === 'login') { 
    appContainer.innerHTML = '<div class="card" style="text-align:center;padding:40px 15px;">正在尝试多个服务器校验，请稍候…</div>'; 
  }
  authOfflineCount = 0;
  
  // 增加一个 15 秒的保险丝，如果 15 秒还没切回来，强行报错并恢复界面
  var safetyTimer = setTimeout(function() {
    if (!authReady && currentMode === 'login') {
      authLockReason = 'offline';
      authReady = true;
      renderLogin();
      showToast('网络连接超时，请检查网络或切换流量重试', true);
    }
  }, 15000);

  // 调用授权启动
  authBoot();
  
  // 正常成功后清除保险丝
  var checkInterval = setInterval(function() {
    if (authReady) {
      clearTimeout(safetyTimer);
      clearInterval(checkInterval);
    }
  }, 500);
}

var authOfflineCount = 0;
function authHeartbeat() {
  netTime().then(function (now) {
    if (now == null) {
      authOfflineCount++;
      if (authOfflineCount >= 6) {
        if (isAuthorized) authLock('offline');
      } else {
        console.warn('网络不佳，已切换至离线模式，剩余容错次数：' + (6 - authOfflineCount));
      }
      return;
    }
    authOfflineCount = 0;
    if (!isAuthorized) return;
    if (authExpire < AUTH_PERM && authExpire <= now) {
      authLock('expired');
      return;
    }
    authReadAll().then(function (res) {
      if (res.tamper) { authLock('tamper'); return; }
      if (res.rec) {
        res.rec.maxSeen = now;
        authSaveAll(res.rec);
      }
    });
  });
}

    }
  });

  window.addEventListener('online', function () {
    if (isAuthorized) {
      showToast('网络已恢复，正在重新校验授权...');
      authHeartbeat();
    }
  });

  document.addEventListener('visibilitychange', function () {

  });
}

        if (!wrongBook[i].bankId && activeBankId) {

       throw new Error("Invalid");
    }
    if (isAuthorized && currentMode !== 'login' && currentMode !== 'import') {

var maoTimer = null;
function quoteText(q) { return q.who ? q.t + ' — ' + q.who : q.t; }
function pickMaoQuote(exclude) {
  var pool = LEADER_QUOTES.filter(function (q) { return q.t !== exclude; });
  var arr = pool.length ? pool : LEADER_QUOTES;
  return arr[Math.floor(Math.random() * arr.length)];
}
function renderMaoQuote(el, q) {
  var full = quoteText(q);
  el.dataset.text = q.t;
  el.innerHTML = '<span class="mao-inner"></span>';
  var inner = el.querySelector('.mao-inner');
  inner.textContent = full;
  el.classList.remove('scroll');
  inner.style.animationDuration = '';
  requestAnimationFrame(function () {
    if (inner.scrollWidth > el.clientWidth + 2) {
      el.classList.add('scroll');
      inner.textContent = full + '　　' + full;
      var one = inner.scrollWidth / 2;
      inner.style.animationDuration = Math.max(8, one / 35) + 's';
    }
  });
}
// 主动预加载毛体；字体就绪后重绘一次当前语录，规避本地字体晚到、动态文本不重绘
function ensureMaoFontReady(el) {
  if (!document.fonts) return;
  try {
    document.fonts.load('normal 16px MaoTi').catch(function () {});
    document.fonts.load('bold 16px MaoTi').catch(function () {});
  } catch (e) {}
  if (!document.fonts.ready) return;
  document.fonts.ready.then(function () {
    var ok = false;
    try { ok = document.fonts.check('bold 16px MaoTi'); } catch (e) {}
    console.log('[MaoFont] ready, check=' + ok);
    if (!el || el.style.display === 'none') return;
    var cur = null;
    for (var i = 0; i < LEADER_QUOTES.length; i++) { if (LEADER_QUOTES[i].t === el.dataset.text) { cur = LEADER_QUOTES[i]; break; } }
    if (cur) renderMaoQuote(el, cur);
  }).catch(function () {});
}
function showMaoQuote() {
  var el = document.getElementById('maoQuote');
  if (!el) return;
  el.style.display = 'block';
  if (!el.dataset.text) renderMaoQuote(el, pickMaoQuote());
  ensureMaoFontReady(el);
}
function updateMaoQuoteVisibility() {
  var el = document.getElementById('maoQuote');
  if (!el) return;
  var inExam = EXAM_MODES.indexOf(currentMode) > -1;
  if (inExam) el.style.display = 'none'; else showMaoQuote();

function startMaoQuoteRotator() {
  if (maoTimer) return;
  maoTimer = setInterval(function () {
    var el = document.getElementById('maoQuote');
    if (!el || el.style.display === 'none') return;
    var next = pickMaoQuote(el.dataset.text);

}

function goToImport() { if (!guardGate()) return; window.location.href='import.html'; }
function switchBank(id) { activeBankId = id; saveData(); render(); }

/* ===== 收藏 ===== */
function toggleFavorite(key, oldId){
  if (!guardGate()) return;
  try {
    var pos = favorites.indexOf(key);
    var oldPos = (oldId != null && oldId !== '') ? favorites.indexOf(String(oldId)) : -1;
    if (pos > -1 || oldPos > -1) {
      if (pos > -1) favorites.splice(pos, 1);
      if (oldPos > -1) favorites.splice(oldPos, 1);
    } else { favorites.push(key); }
    saveData();
    if (currentMode === 'exam') renderExam();
    else if (currentMode === 'recite') renderRecite();
    else if (currentMode === 'practice') renderPractice();
    else if (currentMode === 'favReview') renderFavReview();
    else render();
  } catch(e) { showToast('操作失败，请重试', true); }
}
function openFavReview() { if (!guardGate()) return; currentMode = 'favReview'; render(); }
function renderFavReview() {
  try {
    var qs = activeBankId && allBanks[activeBankId] ? allBanks[activeBankId].questions : [];
    var favQs = [];
    for (var i = 0; i < qs.length; i++) {
      try { if (isFav(qs[i])) favQs.push(qs[i]); } catch(e) {}
    }

    if (favQs.length === 0) {
      appContainer.innerHTML = `<div style="margin-bottom:10px;"><button class="btn btn-outline" onclick="currentMode='home';render()">⬅ 返回</button></div><div class="card" style="text-align:center;padding:30px;">🔖 当前题库暂无收藏题目</div>`;
      return;
    }

    if (favBrowseMode === 'page') {
      renderFavPage();
      return;
    }

    var html = `<div class="toolbar" style="padding:10px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="currentMode='home';render()">⬅ 返回</button>
        <div class="q-progress" style="font-size:0.9rem;">收藏夹 (${favQs.length})</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-outline btn-small" onclick="toggleFavBrowse()">📄 翻页</button>
        <button class="btn btn-outline btn-small" onclick="openFavSheet()">答题卡</button>
        <button class="btn btn-danger btn-small" onclick="clearAllFav()">🗑️ 剔除</button>
      </div>
    </div>`;

    html += `<div id="favScrollContainer" style="overflow-y:auto; -webkit-overflow-scrolling:touch; height:calc(100vh - 140px); padding-bottom:20px;">`;
    for (var i = 0; i < favQs.length; i++) {
      try {
        var q = favQs[i];
        if (!q || !q.question) continue;
        if (!q.options) q.options = [];
        if (!q.answer) q.answer = [];
        if (q.type === 'judge' && q.options.length === 0) q.options = ['正确', '错误'];
        
        var tName = TYPE_NAMES[q.type] || '未知';
        var isSubj = isSubjective(q.type);
        var ansDisplay = isSubj ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；')) : q.answer.map(function(x){ return String.fromCharCode(65+x); }).join(', ');
        
        var optHtml = '';
        if (!isSubj) {
          for (var j = 0; j < q.options.length; j++) {
            var isAns = q.answer.indexOf(j) > -1;
            optHtml += `<div class="opt ${isAns ? 'correct' : ''} disabled"><div class="opt-prefix">${String.fromCharCode(65+j)}</div><div>${q.options[j]}</div></div>`;
          }
        } else {
          optHtml = `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansDisplay}</div></div>`;
        }

        var favKey = typeof qFavKey === 'function' ? qFavKey(q) : '';
        var qid = q.id || '';

        html += `<div class="card review-item" id="fav-item-${i}" data-idx="${i}" style="scroll-margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px;align-items:center;">
            <span class="tag" style="background:#f59e0b; margin-bottom:0;">${tName} · 第 ${i+1} 题</span>
            <button class="fav-star on" style="float:none; margin:0;" onclick="toggleFavorite('${favKey}','${qid}')">⭐ 取消收藏</button>
          </div>
          <div class="q-text" style="padding-right:0;">${q.question}</div>
          ${optHtml}
          ${buildAnalysisHtml(q, [], true)}</div>`;
      } catch(e) { console.error('渲染题目报错:', e); }
    }
    
    html += `</div>
      <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
        <div class="sheet-content" onclick="event.stopPropagation()">
          <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:var(--text-sub);font-weight:normal;">点击题号可跳转</span></div>
          ${buildSheetHtml(favQs, window.favPageIndex || 0, [], 'favReview')}
        </div>
      </div>`;
      
    appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;

    setTimeout(function() {
      try {
        var el = document.getElementById('fav-item-' + (window.favPageIndex || 0));
        var container = document.getElementById('favScrollContainer');
        if (el && container) container.scrollTop = el.offsetTop - 10;
      } catch(e){}
    }, 40);

    setTimeout(function() {
      try {
        var container = document.getElementById('favScrollContainer');
        if (container) {
          var scrollTimer = null;
          container.addEventListener('scroll', function() {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(function() {
              var items = container.querySelectorAll('.review-item');
              var bestIdx = 0, bestDist = Infinity;
              var cTop = container.getBoundingClientRect().top;
              for (var k = 0; k < items.length; k++) {
                var r = items[k].getBoundingClientRect();
                var d = Math.abs(r.top - cTop - 10);
                if (d < bestDist) { bestDist = d; bestIdx = k; }
              }
              window.favPageIndex = bestIdx;
            }, 250);
          }, { passive: true });
        }
      } catch(e){}
    }, 60);

  } catch(err) {
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:30px;">加载出错：${err.message}</div>`;
  }
}

function clearAllFav() {

}

function openStudyStats() { if (!guardGate()) return; currentMode = 'stats'; render(); }
function renderStudyStats() {
  var totalDone = 0, totalCorrect = 0;
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.indexOf('xjt_stats_') === 0) {
      var s = JSON.parse(localStorage.getItem(key) || '{"done":0,"correct":0}');
      totalDone += (s.done || 0); totalCorrect += (s.correct || 0);
    }
  }
  var totalAcc = totalDone > 0 ? Math.round(totalCorrect / totalDone * 100) : 0;

  var typeStats = JSON.parse(localStorage.getItem('xjt_type_stats') || '{}');
  var typeOrder = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var typeRows = [];
  typeOrder.forEach(function (tp) {
    var ts = typeStats[tp];
    if (!ts || !ts.done) return;
    typeRows.push({ tp: tp, name: TYPE_NAMES[tp] || tp, done: ts.done, correct: ts.correct, acc: Math.round(ts.correct / ts.done * 100) });
  });
  var weakest = null;
  typeRows.forEach(function (r) { if (!weakest || r.acc < weakest.acc) weakest = r; });

  var examHistory = JSON.parse(localStorage.getItem('xjt_exam_history') || '[]');
  var days = [];
  for (var d = 6; d >= 0; d--) {
    var dt = new Date(); dt.setDate(dt.getDate() - d);
    var label = (dt.getMonth() + 1) + '/' + dt.getDate();
    var st = JSON.parse(localStorage.getItem('xjt_stats_' + dt.toLocaleDateString()) || '{"done":0,"correct":0}');
    days.push({ label: label, done: st.done || 0, correct: st.correct || 0 });
  }
  var maxDone = 1; for (var m = 0; m < days.length; m++) { if (days[m].done > maxDone) maxDone = days[m].done; }
  var bars = '';
  for (var k = 0; k < days.length; k++) {
    var day = days[k]; var h = Math.round(day.done / maxDone * 70);
    var acc = day.done > 0 ? Math.round(day.correct / day.done * 100) : 0;
    bars += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:110px;">
      <div style="font-size:0.68rem;color:var(--text-main);font-weight:bold;margin-bottom:3px;">${day.done}</div>
      <div style="width:58%;background:${day.done===0 ? 'var(--border-color)' : 'linear-gradient(180deg,#0d47a1,#1e88e5)'};border-radius:4px 4px 0 0;height:${Math.max(3,h)}px;"></div>
      <div style="font-size:0.65rem;color:var(--text-sub);margin-top:4px;">${day.label}</div>
      <div style="font-size:0.62rem;color:#10b981;font-weight:bold;">${acc}%</div>
    </div>`;
  }
  var html = `<div style="margin-bottom:12px;"><button class="btn btn-outline" onclick="currentMode='home';render()">⬅ 返回</button></div>`;
  html += `<div class="card"><div class="title">📈 学习数据总览</div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">${totalDone}</div><div class="stat-label">累计做题</div></div>
      <div class="stat-item"><div class="stat-num" style="color:#10b981;">${totalCorrect}</div><div class="stat-label">累计正确</div></div>
      <div class="stat-item"><div class="stat-num" style="color:#b71c1c;">${totalAcc}%</div><div class="stat-label">累计正确率</div></div>
    </div></div>`;
  html += `<div class="card"><div class="title">近 7 天做题趋势</div>
    <div style="display:flex;gap:6px;align-items:flex-end;">${bars}</div>
    <div style="font-size:0.75rem;color:var(--text-sub);margin-top:12px;line-height:1.5;">柱高 = 当日做题数；柱顶数字 = 做题量；柱底百分比 = 当日正确率。数据每天 0 点起独立统计。</div></div>`;

  var typeBars = '';
  if (typeRows.length === 0) {
    typeBars = '<div style="font-size:0.82rem;color:var(--text-sub);">暂无分题型答题记录，开始练习后自动统计。</div>';
  } else {
    typeRows.forEach(function (r) {
      var barColor = r.acc >= 80 ? '#10b981' : (r.acc >= 60 ? '#f59e0b' : '#ef4444');
      var weakTag = (weakest && r.tp === weakest.tp) ? ' ⚠️最弱' : '';
      typeBars += `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;">
          <span>${r.name}${weakTag}</span>
          <span style="font-weight:bold;color:${barColor};">${r.acc}% <span style="color:var(--text-sub);font-weight:normal;">(${r.correct}/${r.done})</span></span>
        </div>
        <div style="height:8px;background:var(--border-color);border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${r.acc}%;background:${barColor};border-radius:4px;"></div>
        </div>
      </div>`;
    });
  }
  var weakTip = (weakest && weakest.done > 0) ? `<div style="margin-top:10px;padding:10px;background:#fef2f2;border-radius:8px;font-size:0.82rem;color:#b91c1c;">⚠️ 薄弱提醒：「${weakest.name}」正确率最低（${weakest.acc}%），建议优先针对性练习。</div>` : '';
  html += `<div class="card"><div class="title">🎯 分题型正确率</div>${typeBars}${weakTip}</div>`;

  var chartHtml, recent = examHistory.slice(-10);
  if (examHistory.length === 0) {
    chartHtml = '<div style="font-size:0.82rem;color:var(--text-sub);">暂无模考成绩记录，完成一次模拟考试后自动生成曲线。</div>';
  } else {
    var W = 320, H = 150, pL = 34, pR = 14, pT = 16, pB = 26, n = recent.length;
    function X(i) { return pL + (n > 1 ? i * (W - pL - pR) / (n - 1) : (W - pL - pR) / 2); }
    function Y(a) { return pT + (100 - a) / 100 * (H - pT - pB); }
    var pts = recent.map(function (r, i) { return X(i) + ',' + Y(r.acc); }).join(' ');
    var grid = [0, 50, 100].map(function (g) { return `<line x1="${pL}" y1="${Y(g)}" x2="${W - pR}" y2="${Y(g)}" stroke="var(--border-color)" stroke-dasharray="3,3" stroke-width="1"/><text x="4" y="${Y(g) + 4}" font-size="9" fill="var(--text-sub)">${g}</text>`; }).join('');
    var dots = recent.map(function (r, i) { var d = new Date(r.date); var lb = (d.getMonth() + 1) + '/' + d.getDate(); return `<circle cx="${X(i)}" cy="${Y(r.acc)}" r="4" fill="#ef4444"/><text x="${X(i)}" y="${Y(r.acc) - 7}" font-size="9" fill="var(--text-main)" text-anchor="middle" font-weight="bold">${r.acc}</text><text x="${X(i)}" y="${H - 8}" font-size="8" fill="var(--text-sub)" text-anchor="middle">${lb}</text>`; }).join('');
    chartHtml = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${grid}<polyline points="${pts}" fill="none" stroke="#0d47a1" stroke-width="2"/>${dots}</svg>`;
  }
  var chartTitle = examHistory.length > 0 ? `📊 模考成绩曲线（近 ${recent.length} 次）` : '📊 模考成绩曲线';
  html += `<div class="card"><div class="title">${chartTitle}</div>${chartHtml}</div>`;

  html += `<div class="card"><div class="title">💡 数据说明</div><div style="font-size:0.82rem;color:var(--text-sub);line-height:1.7;">累计数据来自每日统计的自动汇总，无需手动记录。错题会同步计入「累计正确率」，坚持练习即可看到正确率稳步上升。</div></div>`;
  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;
}

/* ===== 搜题 ===== */
function openSearch() {
  searchKeyword = ''; searchType = 'all'; var mask = document.createElement('div'); mask.className = 'search-mask'; mask.id = 'searchModal';
  mask.innerHTML = `<div class="search-box">
    <div class="search-header"><h3>🔍 题库搜索</h3><button class="btn btn-outline" style="padding:4px 10px; font-size:0.85rem;" onclick="document.body.removeChild(document.getElementById('searchModal'))">关闭</button></div>
    <div class="search-input-group">
      <input type="text" id="searchInput" placeholder="输入题目或笔记关键字..." oninput="doSearch()">
      <div class="search-filters">
        <button class="${searchType === 'all' ? 'active' : ''}" onclick="setSearchType('all')">全部</button>
        <button class="${searchType === 'single' ? 'active' : ''}" onclick="setSearchType('single')">单选</button>
        <button class="${searchType === 'multiple' ? 'active' : ''}" onclick="setSearchType('multiple')">多选</button>
        <button class="${searchType === 'judge' ? 'active' : ''}" onclick="setSearchType('judge')">判断</button>
        <button class="${searchType === 'fill' ? 'active' : ''}" onclick="setSearchType('fill')">填空</button>
      </div>
    </div>
    <div class="search-results" id="searchResults"><div style="text-align:center; color:#94a3b8; margin-top:20px;">请输入关键字开始搜索...</div></div>
  </div>`;
  document.body.appendChild(mask); setTimeout(function(){ document.getElementById('searchInput').focus(); }, 100);
}

function setSearchType(type) {
  searchType = type; var btns = document.querySelectorAll('.search-filters button'); btns.forEach(function(btn) { btn.classList.remove('active'); });
  var typeMap = { all:0, single:1, multiple:2, judge:3, fill:4, short:5, essay:6 };
  if (typeMap[type] !== undefined) btns[typeMap[type]].classList.add('active');
  doSearch();
}

function doSearch() {
  var keyword = document.getElementById('searchInput').value.trim(); var resDiv = document.getElementById('searchResults');
  if (!keyword) { resDiv.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:20px;">请输入关键字开始搜索...</div>'; return; }
  
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  var results = []; 
  
  for (var i = 0; i < qs.length; i++) { 
    var q = qs[i]; 
    if (searchType !== 'all' && q.type !== searchType) continue; 
    
    if (q.question.indexOf(keyword) > -1) { 
      results.push({ q: q, matchType: '题目' }); 
      continue;
    }
    var note = getNotes()[getQKeyForNote(q)];
    if (note && note.text && note.text.indexOf(keyword) > -1) {
      results.push({ q: q, matchType: '笔记' });
    }
  }
  
  if (results.length === 0) { resDiv.innerHTML = '<div style="text-align:center; color:#ef4444; margin-top:20px;">没有找到相关题目或笔记...</div>'; return; }
  
  var html = ''; 
  for (var j = 0; j < results.length; j++) { 
    var r = results[j]; var tName = TYPE_NAMES[r.q.type] || '未知'; 
    html += `<div class="search-item" onclick="jumpToSearchResult(${qs.indexOf(r.q)})">
      <div class="s-title">${r.q.question}</div>
      <div class="s-type" style="color:${r.matchType==='笔记'?'#f59e0b':'#64748b'};">[${r.matchType}匹配] 题型：${tName}</div>
    </div>`; 
  }
  resDiv.innerHTML = html;
}
function jumpToSearchResult(idx) { 
  document.body.removeChild(document.getElementById('searchModal')); 
  practiceQuestions = allBanks[activeBankId].questions.slice(); 
  practiceIndex = idx; 
  practiceSelections = []; 
  isWrongPracticeMode = false; 
  currentMode = 'recite'; 
  installBackGuard();
  render(); 
}
/* ===== 答题卡：练习模式对错配色 ===== */
function buildSheetHtml(questions, currentIdx, selections, type) {
  var groups = { single: [], multiple: [], judge: [], fill: [], short: [], essay: [] };
  for (var k = 0; k < questions.length; k++) { if (groups[questions[k].type]) groups[questions[k].type].push({ idx: k, q: questions[k] }); }
  var html = '';
  var types = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var jumpFn = 'jumpPractice';
  if (type === 'exam') jumpFn = 'jumpExam';
  else if (type === 'examReview') jumpFn = 'jumpExamReview';
  else if (type === 'recite') jumpFn = 'jumpRecite';
  else if (type === 'review') jumpFn = 'jumpReview';
  else if (type === 'favReview') jumpFn = 'jumpFav';

  for (var t = 0; t < types.length; t++) {
    var tp = types[t]; var items = groups[tp]; if (items.length === 0) continue;
    html += `<div class="acc-group"><div class="acc-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span style="font-size:1.05rem;">${TYPE_NAMES[tp]}</span><span>共 ${items.length} 题</span></div><div class="acc-body">`;
    for (var i = 0; i < items.length; i++) {
      var item = items[i]; var cls = 'num-btn'; var s = selections[item.idx] || [];
      
      // 根据模式决定答题卡的颜色
      if (type === 'practice') {
        if (item.q.isAnswered) {
          if (isSubjective(item.q.type)) cls += ' right';
          else {
            var okP = s.length === item.q.answer.length && s.every(function(v){ return item.q.answer.indexOf(v) > -1; });
            cls += okP ? ' right' : ' wrong';
          }
        }
      } else if (type === 'recite' || type === 'review' || type === 'favReview') { 
        cls += ' right'; 
      } else if (type === 'exam') { 
        if (s.length > 0 || isSubjective(item.q.type)) cls += ' right'; 
      } else if (type === 'examReview') {
        if (isSubjective(item.q.type)) { if (s.length > 0) cls += ' right'; }
        else if (s.length > 0) {
          var ok = s.length === item.q.answer.length && s.every(function(v){ return item.q.answer.indexOf(v) > -1; });
          cls += ok ? ' right' : ' wrong';
        }
      }
      var mi = getQMarkInfo(item.q);
      var dotHtml = mi.dot ? `<span style="position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:${mi.color}; border-radius:50%; box-shadow:0 0 0 1px #fff;"></span>` : '';
      html += `<div class="${cls}" style="position:relative;" onclick="${jumpFn}(${item.idx})">${item.idx+1}${dotHtml}</div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

/* ===== 练习/背题入口 ===== */
function startReviewDue() {
  if (!guardGate()) return;
  var due = getDueWrongList();
  if (due.length === 0) return showToast('今天没有待复习的错题', true);
  practiceQuestions = due.slice();
  isWrongPracticeMode = true;
  practiceSource = 'dueReview';
  practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) {
    practiceQuestions[i].isAnswered = isSubjective(practiceQuestions[i].type);
    if (practiceQuestions[i].streak === undefined) practiceQuestions[i].streak = 0;
    ensureReviewFields(practiceQuestions[i]);
  }
  currentMode = 'practice'; savePracticeProgress(); installBackGuard(); render();
}

function startPractice(type) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  if (type === 'wrong') {
    if (wrongBook.length === 0) return showToast('错题本为空', true);
    practiceQuestions = wrongBook.slice(); isWrongPracticeMode = true;
  } else if (type === 'fav') {
    if (favorites.length === 0) return showToast('收藏夹为空', true);
    practiceQuestions = qs.filter(function(q){ return isFav(q); }); isWrongPracticeMode = false;
  } else {
    if (qs.length === 0) return showToast('题库为空', true);
    if (type === 'all') practiceQuestions = qs.slice();
    else if (type === 'random') { practiceQuestions = qs.slice().sort(function(){ return 0.5 - Math.random(); }); showToast('已为您打乱顺序'); }
    else practiceQuestions = qs.filter(function(q){ return q.type === type; });
    isWrongPracticeMode = false;
  }
  if (practiceQuestions.length === 0) return showToast('该分类下暂无题目', true);
  practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) {
    practiceQuestions[i].isAnswered = isSubjective(practiceQuestions[i].type);
    if (practiceQuestions[i].streak === undefined) practiceQuestions[i].streak = 0;
  }
  currentMode = 'practice'; savePracticeProgress(); installBackGuard(); render();
}

function startRecite(type) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : []; if (qs.length === 0) return showToast('题库为空', true);
  reciteJudgeFilter = 'all';
  var allQs = type === 'all' ? qs.slice() : qs.filter(function(q){ return q.type === type; });
  if (allQs.length === 0) return showToast('该分类下暂无题目', true);
  practiceQuestions = allQs; practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = true; }
  isWrongPracticeMode = false; currentMode = 'recite'; savePracticeProgress(); installBackGuard(); render();
}

function changeReciteFilter(filterType) {
  reciteJudgeFilter = filterType; var qs = activeBankId ? allBanks[activeBankId].questions : []; var baseQs = qs.filter(function(q){ return q.type === 'judge'; });
  if (filterType === 'true') { practiceQuestions = baseQs.filter(function(q){ return q.answer.indexOf(0) > -1; }); }
  else if (filterType === 'false') { practiceQuestions = baseQs.filter(function(q){ return q.answer.indexOf(1) > -1; }); }
  else { practiceQuestions = baseQs; }
  if (practiceQuestions.length === 0) { showToast('该过滤条件下暂无题目', true); practiceQuestions = baseQs; }
  else { practiceIndex = 0; practiceSelections = []; for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = true; } render(); }
}

function buildQuestionHtml(q, sels, showAns, isReciteJudge) {
  if (q.type === 'judge' && (!q.options || q.options.length === 0)) q.options = ['正确', '错误'];
  if (isSubjective(q.type)) {
    var ansText = typeof q.answer === 'string' ? q.answer : (Array.isArray(q.answer) ? q.answer.join('；') : '');
    if (!showAns) return `<div class="subjective-answer" style="border-color:var(--border-color);"><div class="sa-title" style="color:var(--text-sub);">📝 本题为主观题，请自行作答</div></div>`;
    return `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansText}</div></div>`;
  }

  var renderQ = JSON.parse(JSON.stringify(q));
  
  // ★ 核心修复：使用缓存键，保证每次重渲染时选项顺序一致
  if (randomOptionsMode && (renderQ.type === 'single' || renderQ.type === 'multiple')) {
    var cacheKey = getQKey(q);
    if (!window._randomOptCache) window._randomOptCache = {};
    
    if (!window._randomOptCache[cacheKey]) {
      var idxArr = renderQ.options.map(function(_, i){ return i; });
      idxArr.sort(function(){ return Math.random() - 0.5; });
      window._randomOptCache[cacheKey] = {
        options: idxArr.map(function(i){ return renderQ.options[i]; }),
        answer: renderQ.answer.map(function(oldIdx){ return idxArr.indexOf(oldIdx); })
      };
    }
    renderQ.options = window._randomOptCache[cacheKey].options;
    renderQ.answer = window._randomOptCache[cacheKey].answer;
  }

  var optsHtml = '';
  for (var i = 0; i < renderQ.options.length; i++) {
    var cls = 'opt';
    if (showAns) {
      if (renderQ.answer.indexOf(i) > -1) cls += ' correct';
      else if (sels && sels.indexOf(i) > -1) cls += ' wrong';
    } else if (sels && sels.indexOf(i) > -1) { cls += ' selected'; }
    var clickAction = isReciteJudge ? `onclick="toggleReciteJudge(${i})"` : `onclick="selectPractice(${i})"`;
    optsHtml += `<div class="${cls}" ${clickAction}><div class="opt-prefix">${String.fromCharCode(65+i)}</div><div>${renderQ.options[i]}</div></div>`;
  }
  return optsHtml;
}

function buildAnalysisHtml(q, sels, showAns) {
  if (!showAns) return '';
  var isCorrect = true;
  if (!isSubjective(q.type)) {
    isCorrect = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
  }
  var ansDisplay = isSubjective(q.type)
    ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；'))
    : q.answer.map(function(i){ return String.fromCharCode(65+i); }).join(', ');
  return `<div class="analysis show ${isCorrect ? 'success' : 'error'}"><div style="font-weight:bold;margin-bottom:5px;">正确答案：<span style="color:#10b981;">${ansDisplay}</span></div>${q.analysis ? `<div style="margin-top:8px; font-weight:bold; color:#0d47a1;">解析：</div><div style="color:var(--text-main); margin-top:4px;">${q.analysis}</div>` : ''}</div>`;
}

function renderPractice() {
  if (practiceIndex >= practiceQuestions.length) {
    localStorage.removeItem('xjt_practice_progress');
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:40px;"><h2 style="color:#0d47a1;margin-bottom:15px;">🎉 练习完成</h2><p style="color:var(--text-sub);margin-bottom:20px;">您已完成本轮练习。</p><button class="btn btn-primary btn-block" onclick="currentMode='home';render()">返回首页</button></div>`;
    return;
  }
  var q = practiceQuestions[practiceIndex];
  var sels = practiceSelections[practiceIndex] || [];
  var showAns = q.isAnswered && autoShowAnswer;
  var isCorrect = showAns && (isSubjective(q.type) || (sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; })));
  
  // ★ 核心：渲染带高亮的题目文本
  var qTextHtml = renderQTextWithMarks(q, isNoteMarkMode, window.onWordClick);
  
  // ★ 雷达高亮修复：不在笔记模式时，自动高亮陷阱词
  if (!isNoteMarkMode) {
    var traps = checkTrapWords(q.question);
    if (traps.length > 0) {
      var tempDiv = document.createElement('div');
      tempDiv.innerText = q.question;
      var safeText = tempDiv.innerHTML;
      for (var t = 0; t < traps.length; t++) {
        var word = traps[t];
        var safeWord = escapeRegExp(word);
        var reg = new RegExp(safeWord, 'g');
        safeText = safeText.replace(reg, function(m){ return '<span style="color:#dc2626; font-weight:bold; text-decoration:underline;">' + m + '</span>'; });
      }
      qTextHtml = safeText;
    }
  }

  var optsHtml = buildQuestionHtml(q, sels, showAns, false);
  var typeName = TYPE_NAMES[q.type] || '未知题型';
  
  var targetStreak = parseInt(localStorage.getItem('xjt_streak_target')) || 5;
  var streakHtml = isWrongPracticeMode ? `<span style="font-size:0.8rem;color:#ef4444;font-weight:bold; cursor:pointer;" onclick="showStreakSetting()">🔥连对: ${q.streak||0}/${targetStreak} ⚙️</span>` : '';
  
  var sheetHtml = buildSheetHtml(practiceQuestions, practiceIndex, practiceSelections, 'practice');
  var feedbackAnim = '';
  if (showAns && !isSubjective(q.type)) {
    feedbackAnim = `<div class="feedback-badge"><div class="feedback-text">${isCorrect ? '对' : '错'}</div></div>`;
  }
  var multiConfirmBtn = '';
  if (!showAns && q.type === 'multiple') {
    multiConfirmBtn = `<button class="btn btn-primary" onclick="confirmMultiPractice()" ${sels.length===0?'disabled style="opacity:0.5"':''}>确认答案</button>`;
  }

  // 纠错横幅
  var corr = getCorrections()[getQKeyForNote(q)];
  var corrBanner = '';
  if (corr) {
    corrBanner = `<div style="background:#fffbeb; border:1px solid #fcd34d; color:#b45309; padding:10px; border-radius:8px; font-size:0.85rem; margin-bottom:12px; line-height:1.5;">
      <div style="font-weight:bold; margin-bottom:4px;">⚠️ 你已对此题进行了纠错：</div>
      <div style="margin-bottom:4px;"><b>题目改为：</b>${corr.newQuestion}</div>
      <div><b>正确答案：</b>${corr.newAnswer === 0 ? '正确' : '错误'} ${corr.note ? ' | <b>理由：</b>'+corr.note : ''}</div>
    </div>`;
  }

  appContainer.innerHTML = `
  
    <div class="toolbar" style="padding:10px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="confirmExitPractice()">⬅ 退出</button>
        <div class="q-progress" style="font-size:0.9rem;">${practiceIndex+1} / ${practiceQuestions.length}</div>
      </div>
     <div style="display:flex; align-items:center; gap:8px;">
       <button class="btn btn-danger btn-small" style="padding:6px 10px;font-size:0.75rem;" onclick="openSimilarModal()">🔎 查找相似题目</button>
       <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="openSheet()">答题卡</button>
     </div>
    </div>
    <div class="card" style="position:relative;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span class="tag" style="margin-bottom:0;">${typeName}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          ${streakHtml}
          
          <!-- ★ 笔记按钮：支持单选、多选、判断 -->
          ${['single','multiple','judge'].indexOf(q.type) > -1 ? `<button class="btn btn-outline btn-small" style="padding:4px 8px; border-color:#cbd5e1;" onclick="openNoteDrawer()">📝 笔记</button>` : ''}
          
          <!-- ★ 纠错按钮：专门给判断题 -->
          ${q.type === 'judge' ? `<button class="btn btn-outline btn-small" style="padding:4px 8px; border-color:#fca5a5; color:#b91c1c;" onclick="openCorrectionModal()">✏️ 纠错</button>` : ''}
                    <!-- ★ 新增：加入对比按钮 -->
                    <button class="btn btn-outline btn-small" style="padding:4px 8px; border-color:#cbd5e1;" onclick="toggleCompareBook(practiceQuestions[practiceIndex])">
                      ${compareBook.some(function(cq){ return getQKeyForNote(cq) === getQKeyForNote(q); }) ? '⚖️ 已对比' : '⚖️ 对比'}
                    </button>
		  
          <button class="fav-star ${isFav(q)?'on':''}" style="float:none; margin:0;" onclick="toggleFavorite('${qFavKey(q)}','${q.id||''}')">${isFav(q)?'⭐ 收藏':'☆ 收藏'}</button>
        </div>
      </div>
      
      ${corrBanner}
      <div class="q-text" style="padding-right:0;" id="qTextContainer">${qTextHtml}${feedbackAnim}</div>
      
      ${optsHtml}
      ${buildAnalysisHtml(q, sels, showAns)}
      <div class="bottom-actions">
        <button class="btn btn-outline" onclick="prevPractice()" ${practiceIndex===0?'disabled style="opacity:0.5"':''}>⬅ 上一题</button>
        ${multiConfirmBtn}
        <button class="btn btn-primary" onclick="nextPractice()">${practiceIndex === practiceQuestions.length-1 ? '完成' : '下一题 ➡'}</button>
      </div>
    </div>
    <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
      <div class="sheet-content" onclick="event.stopPropagation()">
        <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:var(--text-sub);font-weight:normal;">(绿=对 红=错 黄点=有笔记/纠错)</span></div>
        <div style="display:flex;gap:8px;margin-bottom:12px;"><input type="number" id="jumpNumInput" min="1" placeholder="输入题号直接跳转" style="flex:1;padding:9px;border:2px solid var(--border-color);border-radius:8px;font-size:1rem;background:var(--card-bg);color:var(--text-main);outline:none;"><button class="btn btn-primary" style="padding:9px 18px;" onclick="jumpToNumber()">跳转</button></div>
        ${sheetHtml}
      </div>
    </div>
  `;
}

// ★ 查找相似题目：点击按钮后才弹窗，不再自动弹出
function openSimilarModal() {
  var q = practiceQuestions[practiceIndex];
  if (!q) return;
  var old = document.getElementById('simModalMask');
  if (old) old.remove();
  var similar = findSimilarQuestions(q);
  if (!similar || similar.length === 0) {
    showToast('未找到高相似度题目');
    return;
  }
  var simHtml = '';
  for (var s = 0; s < similar.length; s++) {
    var sq = similar[s].q;
    if (sq.type === 'judge' && (!sq.options || sq.options.length === 0)) sq.options = ['正确', '错误'];
    var optsHtml = '';
    if (isSubjective(sq.type)) {
      var ansText = typeof sq.answer === 'string' ? sq.answer : (sq.answer || []).join('；');
      optsHtml = `<div style="margin-top:8px; font-size:0.82rem; color:#334155; line-height:1.5;">📝 参考答案：${ansText}</div>`;
    } else if (sq.options && sq.options.length) {
      optsHtml = '<div style="margin-top:8px;">' + sq.options.map(function(opt, j) {
        var isAns = sq.answer && sq.answer.indexOf(j) > -1;
        var bg = isAns ? 'background:#fef2f2;color:#b71c1c;font-weight:bold;border:1px solid #fecaca;' : 'background:#f8fafc;color:#334155;border:1px solid #e2e8f0;';
        return `<div style="padding:6px 8px;border-radius:6px;margin-bottom:5px;font-size:0.82rem;${bg}">${String.fromCharCode(65+j)}. ${opt}${isAns?' ✔':''}</div>`;
      }).join('') + '</div>';
    }
    simHtml += `<div style="background:#f8fafc; border:1px solid #e2e8f0; padding:10px; border-radius:8px; margin-bottom:10px; font-size:0.9rem;">
      <div style="color:#dc2626; font-weight:bold; margin-bottom:5px; font-size:0.8rem;">相似度：${similar[s].score}%</div>
      <div style="color:#334155; line-height:1.5;">${sq.question}</div>
      <details style="margin-top:8px;">
        <summary style="cursor:pointer; color:#0d47a1; font-size:0.8rem; font-weight:bold;">查看选项与答案 ▾</summary>
        ${optsHtml}
      </details>
    </div>`;
  }
  var mask = document.createElement('div');
  mask.className = 'app-mask';
  mask.id = 'simModalMask';
  mask.innerHTML = `<div class="app-box" style="max-width:340px; text-align:left;">
    <h3 style="text-align:center; margin-bottom:15px; color:#b71c1c;">🔎 高相似度题目</h3>
    <p style="font-size:0.8rem; color:#64748b; margin-bottom:10px;">共找到 ${similar.length} 道相似题，点击"查看选项与答案"展开：</p>
    <div style="max-height:250px; overflow-y:auto; padding-right:5px;">${simHtml}</div>
    <div class="actions" style="margin-top:20px;">
      <button class="btn btn-primary btn-block" onclick="document.body.removeChild(document.getElementById('simModalMask'))">关闭</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
}

function renderRecite() {
  if (practiceIndex >= practiceQuestions.length) {
    localStorage.removeItem('xjt_practice_progress');

function selectPractice(idx) {
  if (currentMode === 'recite') return;
  var q = practiceQuestions[practiceIndex];
  if (q.isAnswered || isSubjective(q.type)) return;
  var sels = practiceSelections[practiceIndex] || [];

  if (q.type === 'multiple') {
    var pos = sels.indexOf(idx);
    if (pos > -1) sels.splice(pos, 1); else sels.push(idx);
    practiceSelections[practiceIndex] = sels;
    savePracticeProgress(); renderPractice();
  } else {
    practiceSelections[practiceIndex] = [idx];
    q.isAnswered = true;
    addDoneQuestion(q.id);
    var isCorrect = q.answer.length === 1 && q.answer[0] === idx;
    handlePracticeResult(q, isCorrect);
    savePracticeProgress();
    renderPractice();
    if (autoShowAnswer && isCorrect && !isWrongPracticeMode && practiceIndex < practiceQuestions.length - 1) {
      setTimeout(function() { nextPractice(); }, 1000);
    }
  }
}

function confirmMultiPractice() {
  var q = practiceQuestions[practiceIndex];
  q.isAnswered = true;
  addDoneQuestion(q.id);
  var sels = practiceSelections[practiceIndex] || [];
  var isCorrect = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });

  savePracticeProgress();

function changeStreakTarget(delta) {
  var current = parseInt(localStorage.getItem('xjt_streak_target')) || 5;

  localStorage.setItem('xjt_streak_target', current);
  
  // 实时更新弹窗里的数字显示
  var display = document.getElementById('streakValDisplay');
  if (display) display.innerText = current;
}

function handlePracticeResult(q, isCorrect) {
  var todayStr = new Date().toLocaleDateString();
  var stats = JSON.parse(localStorage.getItem('xjt_stats_'+todayStr) || '{"done":0,"correct":0}');
  stats.done++;
  if (isCorrect) stats.correct++;
  localStorage.setItem('xjt_stats_'+todayStr, JSON.stringify(stats));

  var typeStats = JSON.parse(localStorage.getItem('xjt_type_stats') || '{}');
  var tp = q.type || 'unknown';
  if (!typeStats[tp]) typeStats[tp] = { done: 0, correct: 0 };
  typeStats[tp].done++;
  if (isCorrect) typeStats[tp].correct++;
  localStorage.setItem('xjt_type_stats', JSON.stringify(typeStats));

  var qKey = getQKey(q);
  var targetStreak = parseInt(localStorage.getItem('xjt_streak_target')) || 5;

  if (isWrongPracticeMode) {
    ensureReviewFields(q);
    if (isCorrect) {
      q.streak = (q.streak || 0) + 1;
      q.reviewCount = (q.reviewCount || 0) + 1;
      q.lastReviewAt = Date.now();
      q.stage = Math.min((q.stage || 0) + 1, REVIEW_INTERVALS.length - 1);
      q.nextReviewAt = reviewAddDays(Date.now(), REVIEW_INTERVALS[q.stage]);
      if (q.streak >= targetStreak) {
        wrongBook = wrongBook.filter(function(item){ return getQKey(item) !== qKey; });
        showToast('🎉 连对' + targetStreak + '次，已移出错题本');
        if (wrongBook.length === 0) practiceIndex = practiceQuestions.length;
      }
    } else {
      q.streak = 0;
      q.stage = 0;
      q.nextReviewAt = reviewAddDays(Date.now(), REVIEW_INTERVALS[0]);
    }
    saveData();
  } else {
    if (!isCorrect) {
      var exist = false;
      for (var i=0; i<wrongBook.length; i++) { 
        if (wrongBook[i].bankId === activeBankId && getQKey(wrongBook[i]) === qKey) {
          exist = true; break;
        }
      }
      if (!exist) {
        var nw = {
          bankId: activeBankId,
          id: q.id || null,
          question: q.question,
          type: q.type,
          options: q.options,
          answer: q.answer,
          analysis: q.analysis,
          streak: 0
        };
        ensureReviewFields(nw);
        wrongBook.push(nw);
        saveData();
      }
    }
  }
}

function applyReviewFilter(list) {
  return list.filter(function (w) {
    ensureReviewFields(w);
    if (reviewTypeFilter !== 'all' && w.type !== reviewTypeFilter) return false;
    if (reviewStatusFilter === 'weak' && (w.streak || 0) > 0) return false;
    if (reviewStatusFilter === 'good' && (w.streak || 0) === 0) return false;
    return true;
  });
}
function setReviewTypeFilter(t) { reviewTypeFilter = t; window.reviewPageIndex = 0; render(); }

function buildReviewFilterBar(allWrong) {
  var types = [];
  allWrong.forEach(function (w) { if (types.indexOf(w.type) < 0) types.push(w.type); });
  var typeBtns = ['all'].concat(types).map(function (t) {
    var label = t === 'all' ? '全部题型' : (TYPE_NAMES[t] || t);
    var cls = reviewTypeFilter === t ? 'btn-primary' : 'btn-outline';
    return `<button class="btn ${cls}" style="flex:1;padding:5px;font-size:0.75rem;" onclick="setReviewTypeFilter('${t}')">${label}</button>`;
  }).join('');
  var statusBtns = [['all', '全部'], ['weak', '未掌握'], ['good', '已掌握']].map(function (s) {
    var cls = reviewStatusFilter === s[0] ? 'btn-primary' : 'btn-outline';
    return `<button class="btn ${cls}" style="flex:1;padding:5px;font-size:0.75rem;" onclick="setReviewStatusFilter('${s[0]}')">${s[1]}</button>`;
  }).join('');
  return `<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">${typeBtns}</div><div style="display:flex;gap:6px;margin-bottom:12px;">${statusBtns}</div>`;

        var isSubj = isSubjective(q.type);
        var ansDisplay = isSubj ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；')) : q.answer.map(function(idx){ return String.fromCharCode(65+idx); }).join(', ');
        
        var optHtml = '';
        if (!isSubj) {
          for (var j = 0; j < q.options.length; j++) {
            var isAns = q.answer.indexOf(j) > -1;
            optHtml += `<div class="opt ${isAns ? 'correct' : ''} disabled"><div class="opt-prefix">${String.fromCharCode(65+j)}</div><div>${q.options[j]}</div></div>`;
          }
        } else {
          optHtml = `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansDisplay}</div></div>`;
        }

        html += `<div class="card review-item" id="review-item-${i}" data-idx="${i}" style="scroll-margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px;align-items:center;">
            <span class="tag" style="background:#ef4444; margin-bottom:0;">${tName} · 第 ${i+1} 题</span>
            <span style="color:#ef4444;font-weight:bold;">连对: ${q.streak||0}/${targetStreak}</span>
          </div>
          <div class="q-text" style="padding-right:0;">${q.question}</div>
          ${optHtml}
          ${buildAnalysisHtml(q, [], true)}</div>`;
      } catch(e) { console.error('单题渲染跳过', e); }
    }
    
    html += `</div>
      <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
        <div class="sheet-content" onclick="event.stopPropagation()">
          <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:var(--text-sub);font-weight:normal;">点击题号可跳转</span></div>
          ${buildSheetHtml(currentWrong, window.reviewPageIndex || 0, [], 'review')}
        </div>
      </div>`;
      
    appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;

    setTimeout(function() {
      try {
        var el = document.getElementById('review-item-' + (window.reviewPageIndex || 0));
        var container = document.getElementById('reviewScrollContainer');
        if (el && container) container.scrollTop = el.offsetTop - 10;
      } catch(e){}
    }, 40);

    setTimeout(function() {
      try {
        var container = document.getElementById('reviewScrollContainer');
        if (container) {
          var scrollTimer = null;
          container.addEventListener('scroll', function() {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(function() {
              var items = container.querySelectorAll('.review-item');
              var bestIdx = 0, bestDist = Infinity;
              var cTop = container.getBoundingClientRect().top;
              for (var k = 0; k < items.length; k++) {
                var r = items[k].getBoundingClientRect();
                var d = Math.abs(r.top - cTop - 10);
                if (d < bestDist) { bestDist = d; bestIdx = k; }
              }
              window.reviewPageIndex = bestIdx;
            }, 250);
          }, { passive: true });
        }
      } catch(e){}
    }, 60);

  } catch(err) {
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:30px;">加载出错：${err.message}</div>`;
  }
}
