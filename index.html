<!-- 🔒 防盗锁 -->
<script>
  (function() {
    var allowedDomains = ["jjqgd.github.io", "localhost", "127.0.0.1"];
    var host = window.location.hostname;
    var isAllowed = false;
    for (var i = 0; i < allowedDomains.length; i++) {
      if (host === allowedDomains[i] || host.endsWith("." + allowedDomains[i])) { isAllowed = true; break; }
    }
    if (!isAllowed) {
      document.documentElement.innerHTML = '<div style="text-align:center; margin-top:50px; font-size:20px; color:red; font-weight:bold;">🛑 未经授权，禁止盗用本系统！</div>';
      throw new Error("Unauthorized Domain");
    }
  })();
</script>

<script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  body { background-color: #f0f4f8; color: #1e293b; padding: 10px; -webkit-tap-highlight-color: transparent; }
  
  #splash-screen { position: fixed; top:0; left:0; right:0; bottom:0; background: #fcf9f2; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s; }
  #splash-screen.hidden { opacity: 0; pointer-events: none; }
  .calligraphy-box { display: flex; gap: 40px; }
  .calligraphy-col { font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', cursive; font-size: 3.5rem; font-weight: bold; writing-mode: vertical-rl; color: #111; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); opacity: 0; transform: scale(1.1); animation: inkReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .col-1 { margin-top: 60px; }
  .col-2 { margin-bottom: 60px; color: #b71c1c; animation-delay: 0.5s; }
  @keyframes inkReveal { 0% { opacity: 0; filter: blur(10px); transform: scale(1.1); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }

  .nav { background: #fff; padding: 10px 15px; border-bottom: 2px solid #b71c1c; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; margin-bottom: 10px; }
  .nav-logo { font-size: 1.2rem; font-weight: bold; color: #b71c1c; display: flex; align-items: center; gap: 8px; }
  .nav-logo img { width: 30px; height: 30px; object-fit: contain; }
  .nav-right { font-size: 0.8rem; color: #64748b; }

  .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; border-left: 4px solid #b71c1c; padding-left: 8px; }
  .banner { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; line-height: 1.5; }

  .bank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; }
  .bank-item.active { border-color: #0d47a1; background: #eff6ff; }
  .bank-title { font-weight: bold; font-size: 0.95rem; }
  .bank-meta { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }

  .stat-num { font-size: 1.2rem; font-weight: bold; color: #0d47a1; }
  .stat-label { font-size: 0.75rem; color: #64748b; }

  .menu { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .menu-btn { flex: 1; min-width: 45%; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
  .menu-btn:active { background: #f1f5f9; }
  .sub-menu { display: flex; gap: 8px; }
  .sub-menu .btn { flex: 1; padding: 8px 0; font-size: 0.85rem; border-radius: 6px; }

  .btn { border: none; border-radius: 8px; padding: 12px 15px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: #0d47a1; color: #fff; }
  .btn-danger { background: #b71c1c; color: #fff; }
  .btn-outline { background: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
  .btn-block { width: 100%; margin-top: 10px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

  .sheet-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 999; display: flex; align-items: flex-end; transition: opacity 0.2s; }
  .sheet-content { background: #f8fafc; width: 100%; max-height: 75vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
  .sheet-mask.show .sheet-content { transform: translateY(0); }
  .sheet-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  
  .acc-group { margin-bottom: 12px; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
  .acc-header { padding: 12px 15px; background: #f1f5f9; font-weight: bold; font-size: 0.95rem; color: #0d47a1; display: flex; justify-content: space-between; cursor: pointer; }
  .acc-header span { font-size: 0.8rem; color: #64748b; font-weight: normal; }
  .acc-body { padding: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; border-top: 1px solid #e2e8f0; }
  .acc-body.hidden { display: none; }
  .num-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 6px; font-weight: bold; color: #1e293b; border: 1px solid #cbd5e1; cursor: pointer; }
  .num-btn.done { background: #0d47a1; color: #fff; border-color: #0d47a1; }

  .tag { display: inline-block; padding: 2px 8px; background: #0d47a1; color: #fff; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
  .q-text { font-size: 1.05rem; font-weight: bold; line-height: 1.5; margin-bottom: 15px; }
  .opt { border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; font-size: 0.95rem; cursor: pointer; }
  .opt-prefix { width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
  
  .opt.selected { border-color: #0d47a1; background: #eff6ff; }
  .opt.selected .opt-prefix { background: #0d47a1; color: #fff; border-color: #0d47a1; }
  .opt.correct { border-color: #10b981; background: #ecfdf5; }
  .opt.correct .opt-prefix { background: #10b981; color: #fff; border-color: #10b981; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; }
  .opt.wrong .opt-prefix { background: #ef4444; color: #fff; border-color: #ef4444; }

  .analysis { padding: 12px; background: #f8fafc; border-radius: 8px; margin-top: 15px; font-size: 0.85rem; border-left: 4px solid #0d47a1; line-height: 1.5; color: #475569; }
  .analysis.error { border-left-color: #ef4444; background: #fef2f2; }
  .analysis.success { border-left-color: #10b981; background: #ecfdf5; }

  .score-box { text-align: center; padding: 30px 0; }
  .score-num { font-family: "Georgia", serif; color: #d32f2f; font-size: 5rem; font-weight: bold; display: inline-block; border-bottom: 4px double #d32f2f; line-height: 1; margin-bottom: 15px; padding: 0 10px; }
  
  .bottom-actions { display: flex; gap: 10px; margin-top: 20px; }
  .bottom-actions .btn { flex: 1; }
  
  .maoti-result { font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', cursive; font-size: 2.2rem; color: #0d47a1; text-align: center; margin: 20px 0; line-height: 1.4; }
  .maoti-result.full { color: #b71c1c; }
  
  .toast { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 9999; display: none; }
  
  .app-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .app-box { background: #fff; padding: 25px; border-radius: 16px; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .app-box h3 { font-size: 1.2rem; color: #b71c1c; margin-bottom: 10px; font-weight: bold; }
  .app-box p { font-size: 0.95rem; color: #475569; margin-bottom: 20px; line-height: 1.5; }
  .app-box .actions { display: flex; gap: 10px; }
  .app-box .btn { flex: 1; padding: 10px; font-size: 0.95rem; border-radius: 8px; }
  
  .prompt-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .prompt-box { background: #fff; padding: 20px; border-radius: 12px; width: 80%; max-width: 300px; }
  .prompt-box input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 15px 0; font-size: 1rem; }
  .footer { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: 20px; padding-bottom: 20px; }
</style>

<body>

<div id="splash-screen">
  <div class="calligraphy-box">
    <div class="calligraphy-col col-1">铁道征途</div>
    <div class="calligraphy-col col-2">勤学练兵</div>
  </div>
</div>

<div class="nav">
  <div class="nav-logo">
    <img src="logo.png" onerror="this.style.display='none'"> 铁途学练
  </div>
  <div class="nav-right">在线学习考核平台</div>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ================= 1. 单机离线注册码系统 =================
var isAuthorized = localStorage.getItem('xjt_offline_auth') === 'true';

// 获取用户的设备码（全自动生成）
function getDeviceId() {
  var devId = localStorage.getItem('xjt_device_id');
  if (devId) return devId;
  var nav = window.navigator;
  var raw = nav.userAgent + nav.language + screen.width + screen.height;
  var hash = 0;
  for (var i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash |= 0;
  }
  var hex = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
  devId = 'DEV-' + hex.substring(0,4) + '-' + hex.substring(4,8);
  localStorage.setItem('xjt_device_id', devId);
  return devId;
}

// 校验算法（必须和您的手机生成器一模一样）
function generateSecretKey(deviceId) {
  var salt = "TieTuXueLian2024Qin"; // 🔒 您的独家暗号
  var raw = deviceId + salt;
  var hash = 0;
  for (var i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash) + raw.charCodeAt(i);
    hash |= 0;
  }
  var hex = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
  return 'TT-' + hex.substring(0,4) + '-' + hex.substring(4,8);
}

function doLogin() {
  var inputCode = document.getElementById('regCodeInput').value.trim().toUpperCase();
  var myDevId = getDeviceId();
  var correctCode = generateSecretKey(myDevId);

  if (inputCode === correctCode) {
    isAuthorized = true;
    localStorage.setItem('xjt_offline_auth', 'true');
    currentMode = Object.keys(allBanks).length > 0 ? 'home' : 'import';
    showToast('激活成功，欢迎使用！');
    render();
  } else {
    showToast('注册码错误，请检查输入或联系客服', true);
  }
}

// ================= 2. 业务逻辑区 =================
var allBanks = {}; var activeBankId = null; var wrongBook = []; var currentMode = 'login';
var practiceQuestions = [], practiceIndex = 0, practiceSelections = [], isWrongPracticeMode = false;
var examQuestions = [], examIndex = 0, examSelections = [];
var examConfig = { single: 0, multiple: 0, judge: 0, scoreSingle: 2, scoreMultiple: 4, scoreJudge: 2, timeLimit: 60 };
var examScore = { got: 0, total: 0, usedTime: '0分0秒' };
var examTimer = null, examStartTime = 0, examRemainingSeconds = 0;

var appContainer = document.getElementById('app');
var toastEl = document.getElementById('toast');

setTimeout(function() { document.getElementById('splash-screen').classList.add('hidden'); }, 2800);

function showToast(msg, isErr) {
  toastEl.innerText = msg;
  toastEl.style.background = isErr ? '#ef4444' : 'rgba(0,0,0,0.8)';
  toastEl.style.display = 'block';
  setTimeout(function() { toastEl.style.display = 'none'; }, 2500);
}

function showAppConfirm(title, msg, okText, cancelText, onOk, onCancel) {
  var mask = document.createElement('div');
  mask.className = 'app-mask';
  mask.innerHTML = `
    <div class="app-box">
      <h3>${title}</h3>
      <p>${msg}</p>
      <div class="actions">
        <button class="btn btn-outline" id="btnCancel">${cancelText}</button>
        <button class="btn btn-primary" id="btnOk">${okText}</button>
      </div>
    </div>
  `;
  document.body.appendChild(mask);
  document.getElementById('btnCancel').onclick = function() { document.body.removeChild(mask); if(onCancel) onCancel(); };
  document.getElementById('btnOk').onclick = function() { document.body.removeChild(mask); if(onOk) onOk(); };
}

function confirmExitPractice() {
  showAppConfirm('铁途学练', '确定要退出当前练习吗？(进度将不再保留)', '退出', '取消', function() {
    localStorage.removeItem('xjt_practice_progress'); currentMode = 'home'; render();
  });
}
function confirmExitExam() {
  showAppConfirm('铁途学练', '确定退出考试？成绩不保存。', '退出', '取消', function() {
    if(examTimer) clearInterval(examTimer); examTimer = null; currentMode = 'home'; render();
  });
}
function confirmSubmitExam() { showAppConfirm('铁途学练', '确定要交卷吗？', '交卷', '取消', function() { submitExam(); }); }
function confirmDeleteBank(id) {
  showAppConfirm('铁途学练', '确定删除该题库？', '删除', '取消', function() {
    delete allBanks[id];
    if (activeBankId === id) { var keys = Object.keys(allBanks); activeBankId = keys.length > 0 ? keys[0] : null; }
    saveData(); render();
  });
}

function saveData() {
  localStorage.setItem('xjt_banks', JSON.stringify(allBanks));
  localStorage.setItem('xjt_active', activeBankId || '');
  localStorage.setItem('xjt_wrong', JSON.stringify(wrongBook));
}

function savePracticeProgress() {
  if (currentMode === 'practice') {
    localStorage.setItem('xjt_practice_progress', JSON.stringify({ questions: practiceQuestions, index: practiceIndex, selections: practiceSelections, isWrong: isWrongPracticeMode }));
  }
}

function restorePracticeProgress() {
  var pStr = localStorage.getItem('xjt_practice_progress');
  if (pStr) {
    try {
      var p = JSON.parse(pStr);
      if (p.questions && p.questions.length > 0) {
        showAppConfirm('铁途学练', '检测到上次未完成的练习，是否继续？', '继续', '放弃', function() {
          practiceQuestions = p.questions; practiceIndex = p.index; practiceSelections = p.selections; isWrongPracticeMode = p.isWrong;
          currentMode = 'practice'; render();
        }, function() { localStorage.removeItem('xjt_practice_progress'); });
      }
    } catch(e) {}
  }
}

function loadData() {
  try {
    var b = localStorage.getItem('xjt_banks'); var a = localStorage.getItem('xjt_active'); var w = localStorage.getItem('xjt_wrong');
    if (b) allBanks = JSON.parse(b); if (a) activeBankId = a;
    if (w) { wrongBook = JSON.parse(w); for (var i=0; i<wrongBook.length; i++) { if (wrongBook[i].streak === undefined) wrongBook[i].streak = 0; } }
    if (activeBankId && !allBanks[activeBankId]) activeBankId = null;
  } catch(e) {}
}

function checkNewImport() {
  var newBankStr = localStorage.getItem('xjt_new_import');
  if (newBankStr) {
    try {
      var newBank = JSON.parse(newBankStr);
      allBanks[newBank.id] = { name: newBank.name, questions: newBank.questions };
      activeBankId = newBank.id; localStorage.removeItem('xjt_new_import'); saveData();
      showToast('导入成功，共 ' + newBank.questions.length + ' 题');
    } catch(e) {}
  }
}

function render() {
  if (!isAuthorized) { currentMode = 'login'; }
  else if (Object.keys(allBanks).length === 0) { currentMode = 'import'; }
  else if (currentMode === 'login' || currentMode === 'import') { currentMode = 'home'; }

  if (currentMode === 'login') renderLogin();
  else if (currentMode === 'import') renderImport();
  else if (currentMode === 'home') renderHome();
  else if (currentMode === 'practice') renderPractice();
  else if (currentMode === 'examSetup') renderExamSetup();
  else if (currentMode === 'exam') renderExam();
  else if (currentMode === 'result') renderResult();
  else if (currentMode === 'review') renderReview();
}

// ================= 3. 页面渲染区 =================
function renderLogin() {
  var myDevId = getDeviceId();
  appContainer.innerHTML = `
    <div class="card" style="text-align:center; margin-top:10%; padding: 30px 20px;">
      <h2 style="color:#b71c1c;margin-bottom:10px;">🔐 单机离线授权</h2>
      <p style="color:#64748b;font-size:0.9rem;margin-bottom:20px;">请将下方【设备码】发给客服购买</p>
      
      <div style="background:#f1f5f9; padding:15px; border-radius:8px; margin-bottom:20px; border: 1px dashed #cbd5e1;">
        <div style="font-size:0.8rem; color:#64748b; margin-bottom:5px;">您的设备码</div>
        <div style="font-size:1.3rem; font-weight:bold; color:#0d47a1; letter-spacing:2px;">${myDevId}</div>
        <button class="btn btn-outline" style="margin-top:10px; padding:6px 12px; font-size:0.85rem; display:inline-block;" onclick="copyDeviceId('${myDevId}')">📋 一键复制设备码</button>
      </div>

      <input type="text" id="regCodeInput" placeholder="请输入客服发给您的注册码" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;text-align:center;font-size:1.1rem;margin-bottom:20px; text-transform:uppercase;">
      
      <button class="btn btn-primary btn-block" onclick="doLogin()">激活软件</button>
    </div>
    <div class="footer">技术支持：秦十三郎</div>
  `;
}

function copyDeviceId(id) {
  var input = document.createElement("input");
  input.value = id;
  document.body.appendChild(input);
  input.select();
  document.execCommand("copy");
  document.body.removeChild(input);
  showToast('设备码已复制，请发给客服');
}

function renderImport() {
  appContainer.innerHTML = `
    <div class="card" style="text-align:center; padding:40px 15px;">
      <h2 style="color:#b71c1c;margin-bottom:15px;">📥 导入新题库</h2>
      <p style="color:#64748b;font-size:0.9rem;margin-bottom:20px;line-height:1.6;">
        系统将跳转至独立导入页面。
      </p>
      <button class="btn btn-primary btn-block" style="padding:15px;" onclick="window.location.href='import.html'">📂 前往导入页面</button>
      ${Object.keys(allBanks).length > 0 ? `<button class="btn btn-outline btn-block" onclick="currentMode='home';render()" style="margin-top:20px;">返回首页</button>` : ''}
    </div>
    <div class="footer">技术支持：秦十三郎</div>
  `;
}

function renderHome() {
  var bankEntries = Object.keys(allBanks);
  var hasActive = activeBankId && allBanks[activeBankId];
  var qs = hasActive ? allBanks[activeBankId].questions : [];
  var html = '';

  if (hasActive) {
    var cS = 0, cM = 0, cJ = 0;
    for (var j = 0; j < qs.length; j++) {
      if (qs[j].type === 'single') cS++; else if (qs[j].type === 'multiple') cM++; else if (qs[j].type === 'judge') cJ++;
    }
    html += `
      <div class="card">
        <div class="title">当前训练：${allBanks[activeBankId].name}</div>
        <div class="stats">
          <div class="stat-item"><div class="stat-num" style="color:#b71c1c;">${qs.length}</div><div class="stat-label">总题量</div></div>
          <div class="stat-item"><div class="stat-num">${cS}</div><div class="stat-label">单选</div></div>
          <div class="stat-item"><div class="stat-num">${cM}</div><div class="stat-label">多选</div></div>
          <div class="stat-item"><div class="stat-num">${cJ}</div><div class="stat-label">判断</div></div>
          <div class="stat-item" style="background:#fef2f2;"><div class="stat-num" style="color:#ef4444;">${wrongBook.length}</div><div class="stat-label" style="color:#b91c1c;">错题数</div></div>
        </div>
        <div class="menu">
          <div class="menu-btn" onclick="startPractice('all')">📖 顺序练习</div>
          <div class="menu-btn" onclick="startExamSetup()">📝 模拟考试</div>
          <div class="menu-btn" onclick="startPractice('wrong')">🔥 错题集训</div>
          <div class="menu-btn" onclick="openReview()">📑 错题查看</div>
        </div>
        <div class="sub-menu">
          <button class="btn btn-outline" onclick="startPractice('single')">专项：单选</button>
          <button class="btn btn-outline" onclick="startPractice('multiple')">专项：多选</button>
          <button class="btn btn-outline" onclick="startPractice('judge')">专项：判断</button>
        </div>
      </div>
    `;
  }

  html += `<div class="card"><div class="title">我的题库</div>`;
  if (bankEntries.length === 0) {
    html += `<div style="text-align:center;color:#94a3b8;font-size:0.9rem;">暂无题库</div>`;
  } else {
    for (var i = 0; i < bankEntries.length; i++) {
      var id = bankEntries[i]; var b = allBanks[id]; var isAct = id === activeBankId;
      html += `
        <div class="bank-item ${isAct ? 'active' : ''}" onclick="switchBank('${id}')">
          <div>
            <div class="bank-title">${isAct ? '✅ ' : '📁 '}${b.name}</div>
            <div class="bank-meta">共 ${b.questions.length} 题</div>
          </div>
          <button class="btn btn-danger" style="padding:5px 10px;font-size:0.8rem;" onclick="event.stopPropagation();confirmDeleteBank('${id}')">删除</button>
        </div>
      `;
    }
  }
  html += `<button class="btn btn-primary btn-block" onclick="goToImport()">➕ 导入新题库</button></div>`;
  
  html += `
    <div class="banner">
      <b>🔒 隐私安全提示：</b>本系统采用本地缓存形式，不涉及上传云端，绝对安全。导入后请勿清理浏览器缓存，以免数据丢失。
    </div>
    <div class="footer">技术支持：秦十三郎</div>
  `;
  appContainer.innerHTML = html;
}

function goToImport() { window.location.href='import.html'; }
function switchBank(id) { activeBankId = id; saveData(); render(); }

function buildSheetHtml(questions, currentIdx, selections, type) {
  var groups = { single: [], multiple: [], judge: [] };
  for (var k = 0; k < questions.length; k++) groups[questions[k].type].push({ idx: k, q: questions[k] });
  var html = ''; var types = ['single', 'multiple', 'judge']; var typeNames = { single: '单选题', multiple: '多选题', judge: '判断题' };
  var jumpFn = type === 'practice' ? 'jumpPractice' : 'jumpExam';
  for (var t = 0; t < types.length; t++) {
    var tp = types[t]; var items = groups[tp]; if (items.length === 0) continue;
    html += `<div class="acc-group"><div class="acc-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span style="font-size:1.1rem;">${typeNames[tp]}</span><span>共 ${items.length} 题 (点击折叠/展开)</span></div><div class="acc-body">`;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var isDone = type === 'practice' ? item.q.isAnswered : (selections[item.idx] && selections[item.idx].length > 0);
      html += `<div class="num-btn ${isDone ? 'done' : ''}" onclick="${jumpFn}(${item.idx})">${item.idx+1}</div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function startPractice(type) {
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  if (type === 'wrong') {
    if (wrongBook.length === 0) return showToast('错题本为空', true);
    practiceQuestions = wrongBook.slice(); isWrongPracticeMode = true;
  } else {
    if (qs.length === 0) return showToast('题库为空', true);
    practiceQuestions = type === 'all' ? qs.slice() : qs.filter(function(q){ return q.type === type; });
    isWrongPracticeMode = false;
  }
  if (practiceQuestions.length === 0) return showToast('该分类下暂无题目', true);
  practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = false; if (practiceQuestions[i].streak === undefined) practiceQuestions[i].streak = 0; }
  currentMode = 'practice'; savePracticeProgress(); render();
}

function renderPractice() {
  if (practiceIndex >= practiceQuestions.length) {
    localStorage.removeItem('xjt_practice_progress'); 
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:40px;"><h2 style="color:#0d47a1;margin-bottom:15px;">🎉 练习完成</h2><p style="color:#64748b;margin-bottom:20px;">您已完成本轮练习。</p><button class="btn btn-primary btn-block" onclick="currentMode='home';render()">返回首页</button></div>`;
    return;
  }
  var q = practiceQuestions[practiceIndex]; var sels = practiceSelections[practiceIndex] || [];
  var showAns = q.isAnswered; var isCorrect = showAns && sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
  var optsHtml = '';
  for (var i = 0; i < q.options.length; i++) {
    var cls = 'opt';
    if (showAns) { if (q.answer.indexOf(i) > -1) cls += ' correct'; else if (sels.indexOf(i) > -1) cls += ' wrong'; }
    else if (sels.indexOf(i) > -1) cls += ' selected';
    optsHtml += `<div class="${cls}" onclick="selectPractice(${i})"><div class="opt-prefix">${String.fromCharCode(65+i)}</div><div>${q.options[i]}</div></div>`;
  }
  var typeName = q.type === 'single' ? '单选题' : q.type === 'multiple' ? '多选题' : '判断题';
  var streakHtml = isWrongPracticeMode ? `<span style="float:right;font-size:0.8rem;color:#ef4444;font-weight:bold;">🔥连对: ${q.streak}/5</span>` : '';
  var sheetHtml = buildSheetHtml(practiceQuestions, practiceIndex, practiceSelections, 'practice');
  
  appContainer.innerHTML = `
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="confirmExitPractice()">⬅ 退出</button>
        <div class="q-progress">${practiceIndex+1} / ${practiceQuestions.length}</div>
      </div>
      <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="openSheet()">答题卡</button>
    </div>
    <div class="card">
      <span class="tag">${typeName}</span>${streakHtml}
      <div class="q-text">${q.question}</div>${optsHtml}
      <div class="analysis ${showAns ? (isCorrect ? 'success' : 'error') : ''}" style="display:${showAns ? 'block' : 'none'};">
        <div style="font-weight:bold;margin-bottom:5px;">正确答案：<span style="color:#10b981;">${q.answer.map(function(i){ return String.fromCharCode(65+i); }).join(', ')}</span></div>
        ${isWrongPracticeMode && isCorrect ? `<div style="color:#10b981;font-weight:bold;">✅ 连对次数 +1</div>` : ''}
        ${isWrongPracticeMode && !isCorrect ? `<div style="color:#ef4444;font-weight:bold;">❌ 答错了，连对重置</div>` : ''}
      </div>
      <div class="bottom-actions">
        <button class="btn btn-outline" onclick="prevPractice()" ${practiceIndex===0?'disabled style="opacity:0.5"':''}>⬅ 上一题</button>
        ${(!showAns && q.type === 'multiple') ? `<button class="btn btn-primary" onclick="confirmMultiPractice()" ${sels.length===0?'disabled style="opacity:0.5"':''}>确认答案</button>` : ''}
        <button class="btn btn-primary" onclick="nextPractice()">${practiceIndex === practiceQuestions.length-1 ? '完成' : '下一题 ➡'}</button>
      </div>
    </div>
    <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
      <div class="sheet-content" onclick="event.stopPropagation()">
        <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:#64748b;font-weight:normal;">(点击题号跳转)</span></div>${sheetHtml}
      </div>
    </div>
  `;
}

function openSheet() { document.getElementById('sheetModal').style.display='flex'; setTimeout(function(){document.getElementById('sheetModal').classList.add('show');},10); }
function closeSheet(e) { if(e.target.id==='sheetModal'){ document.getElementById('sheetModal').classList.remove('show'); setTimeout(function(){document.getElementById('sheetModal').style.display='none';},300); } }
function jumpPractice(idx) { practiceIndex = idx; closeSheet({target:{id:'sheetModal'}}); savePracticeProgress(); renderPractice(); }
function prevPractice() { if(practiceIndex > 0) { practiceIndex--; savePracticeProgress(); renderPractice(); } }

function selectPractice(idx) {
  var q = practiceQuestions[practiceIndex]; if (q.isAnswered) return;
  var sels = practiceSelections[practiceIndex] || [];
  if (q.type === 'multiple') {
    var pos = sels.indexOf(idx); if (pos > -1) sels.splice(pos, 1); else sels.push(idx);
    practiceSelections[practiceIndex] = sels; savePracticeProgress(); renderPractice();
  } else {
    practiceSelections[practiceIndex] = [idx]; q.isAnswered = true;
    var isCorrect = q.answer.length === 1 && q.answer[0] === idx;
    handlePracticeResult(q, isCorrect); savePracticeProgress(); renderPractice();
    if (isCorrect && !isWrongPracticeMode && practiceIndex < practiceQuestions.length - 1) {
      setTimeout(function() { nextPractice(); }, 600);
    }
  }
}

function confirmMultiPractice() {
  var q = practiceQuestions[practiceIndex]; q.isAnswered = true;
  var sels = practiceSelections[practiceIndex] || [];
  var isCorrect = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
  handlePracticeResult(q, isCorrect); savePracticeProgress(); renderPractice();
}

function handlePracticeResult(q, isCorrect) {
  if (isWrongPracticeMode) {
    if (isCorrect) {
      q.streak = (q.streak || 0) + 1;
      if (q.streak >= 5) {
        wrongBook = wrongBook.filter(function(item){ return item.id !== q.id; });
        showToast('🎉 连对5次，已移出错题本');
        if (wrongBook.length === 0) practiceIndex = practiceQuestions.length;
      }
    } else { q.streak = 0; }
    saveData();
  } else {
    if (!isCorrect) {
      var exist = false; for (var i=0; i<wrongBook.length; i++) { if (wrongBook[i].id === q.id) exist = true; }
      if (!exist) { wrongBook.push({ id: q.id, question: q.question, type: q.type, options: q.options, answer: q.answer, streak: 0 }); saveData(); }
    }
  }
}

function nextPractice() { if(practiceIndex < practiceQuestions.length) { practiceIndex++; savePracticeProgress(); renderPractice(); } }

function openReview() { currentMode = 'review'; render(); }
function renderReview() {
  if (wrongBook.length === 0) {
    appContainer.innerHTML = `<div style="margin-bottom:10px;"><button class="btn btn-outline" onclick="currentMode='home';render()">⬅ 返回</button></div><div class="card" style="text-align:center;padding:30px;">🎉 暂无错题</div>`;
    return;
  }
  var html = `<div style="display:flex;justify-content:space-between;margin-bottom:15px;"><h3>错题本 (${wrongBook.length})</h3><button class="btn btn-outline" onclick="currentMode='home';render()">返回</button></div>`;
  for (var i = 0; i < wrongBook.length; i++) {
    var q = wrongBook[i];
    html += `
      <div class="card" style="border-left:4px solid #ef4444;">
        <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px;">
          <span class="tag">${q.type==='single'?'单选':q.type==='multiple'?'多选':'判断'}</span><span style="color:#ef4444;font-weight:bold;">连对: ${q.streak||0}/5</span>
        </div>
        <div style="font-weight:bold;font-size:0.95rem;margin-bottom:10px;">${q.question}</div>
        <div style="font-size:0.85rem;color:#10b981;margin-bottom:5px;font-weight:bold;">正确答案：${q.answer.map(function(idx){ return String.fromCharCode(65+idx); }).join(', ')}</div>
        <div style="font-size:0.85rem;color:#64748b;line-height:1.5;">${q.options.map(function(o,idx){ return String.fromCharCode(65+idx) + '. ' + o; }).join('<br>')}</div>
      </div>
    `;
  }
  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;
}

function startExamSetup() { currentMode = 'examSetup'; render(); }
function renderExamSetup() {
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  var cS = 0, cM = 0, cJ = 0;
  for (var i=0; i<qs.length; i++) { if (qs[i].type === 'single') cS++; else if (qs[i].type === 'multiple') cM++; else if (qs[i].type === 'judge') cJ++; }
  appContainer.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:15px;"><h3>📝 考试组卷</h3><button class="btn btn-outline" onclick="currentMode='home';render()">退出</button></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;"><span>单选题 (共${cS}题)</span><div>抽 <input type="number" id="cS" value="${Math.min(5,cS)}" style="width:50px;text-align:center;"> 题，每题 <input type="number" id="pS" value="2" style="width:40px;text-align:center;"> 分</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;"><span>多选题 (共${cM}题)</span><div>抽 <input type="number" id="cM" value="${Math.min(2,cM)}" style="width:50px;text-align:center;"> 题，每题 <input type="number" id="pM" value="4" style="width:40px;text-align:center;"> 分</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;"><span>判断题 (共${cJ}题)</span><div>抽 <input type="number" id="cJ" value="${Math.min(3,cJ)}" style="width:50px;text-align:center;"> 题，每题 <input type="number" id="pJ" value="2" style="width:40px;text-align:center;"> 分</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;"><span>考试时长</span><div><input type="number" id="tLimit" value="60" style="width:50px;text-align:center;"> 分钟</div></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="startExam()">开始考试</button>
  `;
}

function startExam() {
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  var cS = parseInt(document.getElementById('cS').value) || 0; var cM = parseInt(document.getElementById('cM').value) || 0;
  var cJ = parseInt(document.getElementById('cJ').value) || 0; var tLimit = parseInt(document.getElementById('tLimit').value) || 60;
  if (cS + cM + cJ === 0) return showToast('请至少选择一题', true);
  var sQS = qs.filter(function(q){ return q.type === 'single'; }).sort(function(){ return 0.5 - Math.random(); });
  var mQS = qs.filter(function(q){ return q.type === 'multiple'; }).sort(function(){ return 0.5 - Math.random(); });
  var jQS = qs.filter(function(q){ return q.type === 'judge'; }).sort(function(){ return 0.5 - Math.random(); });
  examQuestions = sQS.slice(0, cS).concat(mQS.slice(0, cM)).concat(jQS.slice(0, cJ));
  examConfig = { scoreSingle: parseInt(document.getElementById('pS').value) || 1, scoreMultiple: parseInt(document.getElementById('pM').value) || 1, scoreJudge: parseInt(document.getElementById('pJ').value) || 1, timeLimit: tLimit };
  examIndex = 0; examSelections = []; for (var i=0; i<examQuestions.length; i++) examSelections.push([]);
  examStartTime = Date.now(); examRemainingSeconds = tLimit * 60;
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(function() {
    examRemainingSeconds--;
    if (examRemainingSeconds <= 0) { clearInterval(examTimer); examTimer = null; showToast('时间到，自动交卷', true); submitExam(); }
    else {
      var tEl = document.getElementById('timerDisplay');
      if (tEl) {
        var m = Math.floor(examRemainingSeconds / 60); var s = examRemainingSeconds % 60;
        tEl.innerText = (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
        if (examRemainingSeconds < 60) tEl.style.color = '#ef4444';
      }
    }
  }, 1000);
  currentMode = 'exam'; render();
}

function renderExam() {
  if (examIndex >= examQuestions.length) return submitExam();
  var q = examQuestions[examIndex]; var sels = examSelections[examIndex] || []; var optsHtml = '';
  for (var i=0; i<q.options.length; i++) { var cls = 'opt' + (sels.indexOf(i) > -1 ? ' selected' : ''); optsHtml += `<div class="${cls}" onclick="selectExam(${i})"><div class="opt-prefix">${String.fromCharCode(65+i)}</div><div>${q.options[i]}</div></div>`; }
  var typeName = q.type === 'single' ? '单选题' : q.type === 'multiple' ? '多选题' : '判断题';
  var sheetHtml = buildSheetHtml(examQuestions, examIndex, examSelections, 'exam');
  var m = Math.floor(examRemainingSeconds / 60); var s = examRemainingSeconds % 60; var timerStr = (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
  
  appContainer.innerHTML = `
    <div class="toolbar">
      <div>
        <div id="timerDisplay" class="timer" style="${examRemainingSeconds < 60 ? 'color:#ef4444;' : ''}">${timerStr}</div>
        <div class="q-progress">进度：${examIndex+1} / ${examQuestions.length}</div>
      </div>
      <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="openSheet()">答题卡</button>
    </div>
    <div class="card">
      <span class="tag">${typeName}</span><div class="q-text">${q.question}</div>${optsHtml}
      <div class="bottom-actions">
        <button class="btn btn-outline" onclick="prevExam()" ${examIndex===0?'disabled style="opacity:0.5"':''}>⬅ 上一题</button>
        <button class="btn btn-primary" onclick="nextExam()">${examIndex===examQuestions.length-1?'交卷':'下一题 ➡'}</button>
      </div>
    </div>
    <div style="display:flex;gap:15px;justify-content:center;margin-top:20px;">
      <button class="btn btn-danger" onclick="confirmSubmitExam()">交卷</button>
      <button class="btn btn-outline" onclick="confirmExitExam()">退出</button>
    </div>
    <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
      <div class="sheet-content" onclick="event.stopPropagation()">
        <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:#64748b;font-weight:normal;">(点击题号跳转)</span></div>${sheetHtml}
      </div>
    </div>
  `;
}

function jumpExam(idx) { examIndex = idx; closeSheet({target:{id:'sheetModal'}}); renderExam(); }
function selectExam(idx) {
  var q = examQuestions[examIndex]; var sels = examSelections[examIndex] || [];
  if (q.type === 'multiple') { var pos = sels.indexOf(idx); if (pos > -1) sels.splice(pos, 1); else sels.push(idx); }
  else { sels = [idx]; }
  examSelections[examIndex] = sels; renderExam();
}
function nextExam() { if (examIndex === examQuestions.length - 1) { confirmSubmitExam(); } else { examIndex++; renderExam(); } }
function prevExam() { if (examIndex > 0) { examIndex--; renderExam(); } }

function submitExam() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  var usedSec = Math.floor((Date.now() - examStartTime) / 1000); var usedTimeStr = Math.floor(usedSec/60) + '分' + (usedSec%60) + '秒';
  var got = 0, total = 0;
  for (var i=0; i<examQuestions.length; i++) {
    var q = examQuestions[i]; var pts = q.type==='single' ? examConfig.scoreSingle : q.type==='multiple' ? examConfig.scoreMultiple : examConfig.scoreJudge; total += pts;
    var ans = q.answer.slice().sort(); var sel = (examSelections[i] || []).slice().sort();
    var isCorrect = ans.length === sel.length && ans.every(function(v,idx){ return v === sel[idx]; });
    if (isCorrect) got += pts;
    else { var exist = false; for (var j=0; j<wrongBook.length; j++) { if (wrongBook[j].id === q.id) exist = true; } if (!exist) { wrongBook.push({ id: q.id, question: q.question, type: q.type, options: q.options, answer: q.answer, streak: 0 }); } }
  }
  saveData(); examScore = { got: got, total: total, usedTime: usedTimeStr }; currentMode = 'result'; render();
}

function renderResult() {
  var isFull = examScore.got === examScore.total && examScore.total > 0;
  var msg = isFull ? '你真棒，继续加油！' : '不要气馁，再去多刷刷题，满分等着你！';
  var msgClass = isFull ? 'maoti-result full' : 'maoti-result';
  appContainer.innerHTML = `
    <div class="card score-box">
      <h2 style="color:#0d47a1;margin-bottom:20px;">📊 考试成绩</h2>
      <div class="score-num">${examScore.got}</div>
      <div style="font-size:1.1rem;color:#64748b;font-weight:bold;margin-bottom:20px;">总分：${examScore.total} 分</div>
      <div class="${msgClass}">${msg}</div>
      <div style="color:#64748b;font-size:0.9rem;margin-bottom:30px;">本次用时：${examScore.usedTime}</div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" style="flex:1;" onclick="currentMode='home';render()">返回首页</button>
        <button class="btn btn-outline" style="flex:1;" onclick="currentMode='review';render()">查看错题</button>
      </div>
    </div>
  `;
}

loadData();
checkNewImport();
render();
setTimeout(function() { if (currentMode === 'home') restorePracticeProgress(); }, 3000);
</script>
</body>
</html>
