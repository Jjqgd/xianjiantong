<script>
  // 5+ App 打包后必用的启动图收尾：manifest 里 splashscreen.autoclose=false，
  // 必须由页面主动调用 plus.navigator.closeSplashscreen()，否则会一直停在原生启动图上（表现为打不开/黑屏）。
  // 关闭时机：等页面 DOM 画出第一帧后再关，原生启动图正好当加载遮罩，避免中途露出白底。
  (function () {
    var closed = false;
    function forceClose() {
      if (closed) return;
      if (typeof plus !== 'undefined' && plus.navigator && plus.navigator.closeSplashscreen) {
        try { plus.navigator.closeSplashscreen(); closed = true; } catch (e) {}
      }
    }
    function closeAfterFirstFrame() {
      var start = function () {
        if (window.requestAnimationFrame) {
          requestAnimationFrame(function () { requestAnimationFrame(forceClose); });
        } else {
          setTimeout(forceClose, 200);
        }
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start, false);
      } else {
        start();
      }
      setTimeout(forceClose, 8000); // 兜底：页面异常时也保证最迟 8 秒关掉，不会永远卡在启动图
    }
    if (typeof window.plus !== 'undefined' && window.plus.navigator) closeAfterFirstFrame();
    document.addEventListener('plusready', closeAfterFirstFrame, false);
  })();
</script>

.btn-danger{ background: linear-gradient(135deg,#b91c1c,#ef4444); }
.btn-outline{ background: var(--card-bg); border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(15,23,42,.04); }

/* 首页菜单：三列紧凑卡片式按钮，最后两行两个大按钮均分 */

/* ==================== 手机网页全面适配层（2026-11） ==================== */
/* 1) 全局不横向溢出：任何元素都不许把手机视图撑出左右滚动条 */
html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: contain; }
img, svg, video, canvas { max-width: 100%; height: auto; }
#app, .nav, .card, .app-box, .search-box, .sheet-content { box-sizing: border-box; }

/* 2) iOS 聚焦输入框会自动放大整页，输入框字号统一拉到 16px */
input:not([type=checkbox]):not([type=radio]), textarea, select { font-size: 16px !important; }

/* 3) 手指点得中：可点元素最小命中高度 */
.btn { min-height: 40px; white-space: normal; line-height: 1.3; }
.menu-btn { min-height: 46px; }
.fold-header { min-height: 40px; }
.num-btn { width: 34px; height: 34px; font-size: 0.8rem; }

/* 4) 长题干、长单词、超长题库名不撑破屏幕 */
.q-text, .opt, .analysis, .sa-content, .subjective-answer .sa-content, .bank-title,
.review-item, .search-item, .banner, .daily-sub, .note-badge, .mao-quote, .result-mao-text { overflow-wrap: anywhere; word-break: break-word; }
.toast { max-width: calc(100% - 32px); width: max-content; box-sizing: border-box; text-align: center; word-break: break-word; }

/* 5) 弹层 / 底部抽屉：适配刘海屏安全区和动态视口高度 */
.sheet-content { max-height: 80vh; max-height: 80dvh; }
.app-mask, .search-mask { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
.app-box, .search-box { max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); }
.search-box { width: 92%; }

/* 6) 工具栏、底部按钮组在窄屏自动换行，不再挤成一条 */
.toolbar { gap: 8px; }
.toolbar > div:first-child { min-width: 0; }
/* 工具栏右侧按钮区：一行自动排布，放不下就换行，绝不撑出屏幕 */
.toolbar-actions {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  justify-content: flex-end;
  align-items: center;
  margin-left: auto;
  flex: 0 1 auto;
  max-width: 100%;
}
.toolbar-actions .btn { flex: 0 0 auto; white-space: nowrap; }
.bottom-actions { flex-wrap: wrap; }
.bottom-actions .btn { min-width: 45%; }

/* 7) 折叠面板抬高上限，避免固定 600px 把题库/设置项裁掉（仍保留展开动画） */
.panel-content { max-height: 3000px; }
.panel-content.collapsed { max-height: 0; }

/* 8) 超窄屏（320~360px）与横屏小高度适配 */
@media (max-width: 360px) {
  .calligraphy-col { font-size: 2.9rem; }
  .second-col.s-col-1 { font-size: 2.6rem; }
  .second-col.s-col-2 { font-size: 2.9rem; }
  .score-slant-num { font-size: 5rem; }
  .maoti-result { font-size: 1.85rem; }
  .home-main-menu .menu-btn { font-size: 0.72rem; padding: 12px 2px; }
  .stat-item { min-width: 46%; }
  .card { padding: 14px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  #splash-screen .calligraphy-col { font-size: 2.4rem; }
  #splash-screen .main-text-group { transform: translate(-50%, -50%) scale(0.82); }
}
@media (min-width: 700px) {
  #app, .nav { max-width: 640px; }
}

/* 9) 授权读取中的进度条（刷新时先显示它，不闪登录表单） */
.auth-loading-bar { width: 132px; height: 4px; border-radius: 4px; background: rgba(183,28,28,.14); overflow: hidden; }
.auth-loading-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #b71c1c; animation: authBar 1.1s ease-in-out infinite; }
@keyframes authBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(330%); } }

<script>
// 禁用右键和F12，提高破解门槛（防君子不防小人）
document.oncontextmenu = function() { return false; };
document.onkeydown = function(e) {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key))) {
    return false;
  }
};

// ================= 夜间模式（跟随手机系统自动切换） =================

function syncDarkUI() {
  var sw = document.getElementById('toggleDark');
  if (sw) sw.checked = document.body.classList.contains('dark-mode');
}
function toggleDarkMode() {
  var isDark = document.body.classList.contains('dark-mode');
  if (isDark) {
    document.body.classList.remove('dark-mode');
  } else {
    document.body.classList.add('dark-mode');
  }
  syncDarkUI();
}
function toggleDarkModeBySwitch(checked) {
  var isDark = document.body.classList.contains('dark-mode');
  if (checked !== isDark) toggleDarkMode();
}

function applyEyeCareVars(on) {
  if (on) {
    document.documentElement.style.setProperty('--bg-color', '#C7EDCC');
    document.documentElement.style.setProperty('--card-bg', '#e0f2e9');
    document.documentElement.style.setProperty('--input-bg', '#d1e7dd');
    document.documentElement.style.setProperty('--text-main', '#1e293b');
    document.documentElement.style.setProperty('--border-color', '#b0c4b1');
  } else {
    document.documentElement.style.setProperty('--bg-color', '#f0f4f8');
    document.documentElement.style.setProperty('--card-bg', '#ffffff');
    document.documentElement.style.setProperty('--input-bg', '#f8fafc');
    document.documentElement.style.setProperty('--text-main', '#1e293b');
    document.documentElement.style.setProperty('--border-color', '#e2e8f0');
  }
}

function initDarkMode() {
  try {
    if (localStorage.getItem('xjt_eye_care') === '1') {
      isEyeCareMode = true;
      document.body.classList.add('eye-care-mode');
      applyEyeCareVars(true);
    }

    // 默认跟随手机系统深浅色
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark-mode');
    }
    syncDarkUI();
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        // 跟随手机系统深浅色自动切换
        if (e.matches) {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
        }
        syncDarkUI();
      });
    }
  } catch (err) {
    console.error('主题初始化异常，不影响正常做题:', err);
  }
}
initDarkMode();

// ================= 全局设置：作答后始终显示答案 =================
var autoShowAnswer = true;

// ================= 已做题库存储 =================
function getDoneQuestions() {
  try { return JSON.parse(localStorage.getItem('xjt_done_questions') || '[]'); }
  catch(e) { return []; }
}
function addDoneQuestion(qid) {
  var done = getDoneQuestions();
  if (done.indexOf(qid) === -1) {
    done.push(qid);
    localStorage.setItem('xjt_done_questions', JSON.stringify(done));
  }

}
function authIdbGet() {
  return authIdb().then(function (db) {

function authCkSet(v) { try { document.cookie = AUTH_KEYS.ck + '=' + encodeURIComponent(v) + ';max-age=31536000;path=/;SameSite=Lax'; } catch (e) {} }
function authCkGet() { var m = document.cookie.match(new RegExp('(?:^|; )' + AUTH_KEYS.ck + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }
function authSign(rec) {
  var c = Object.assign({}, rec); delete c.sig;
  return authSha256(AUTH_SECRET + '|' + JSON.stringify(c)).then(function (h) { return h.slice(0, 16); });
}
var authSaving = 0;   /* 正在写入的授权记录数量：写入过程中不触发"记录异常"判定 */
function authSaveAll(rec) {
  authSaving++;
  var done = function () { authSaving = Math.max(0, authSaving - 1); };
  return authSign(rec).then(function (sig) {
    rec.sig = sig; var s = JSON.stringify(rec);
    try { localStorage.setItem(AUTH_KEYS.ls, s); } catch (e) {}
    try { sessionStorage.setItem(AUTH_KEYS.ss, s); } catch (e) {}
    authCkSet(s); authIdbPut(s);
    var el = document.querySelector('[' + AUTH_KEYS.dom + ']');
    if (!el) { el = document.createElement('div'); el.setAttribute(AUTH_KEYS.dom, s); el.style.display = 'none'; document.body.appendChild(el); }
    else { el.setAttribute(AUTH_KEYS.dom, s); }
  }).then(done, done);
}
function authReadAll() {
  var raw = [];
  try { raw.push(localStorage.getItem(AUTH_KEYS.ls)); } catch (e) {}
  try { raw.push(sessionStorage.getItem(AUTH_KEYS.ss)); } catch (e) {}
  raw.push(authCkGet());
  var el = document.querySelector('[' + AUTH_KEYS.dom + ']'); if (el) raw.push(el.getAttribute(AUTH_KEYS.dom));
  return authIdbGet().then(function (v) { raw.push(v); return raw; }).then(function (list) {
    var valid = [];
    list.forEach(function (s) { if (!s) return; try { var r = JSON.parse(s); if (r && r.sig) valid.push(r); } catch (e) {} });
    if (!valid.length) return { rec: null, tamper: false };
    return Promise.all(valid.map(function (r) {
      var c = Object.assign({}, r); delete c.sig;
      return authSha256(AUTH_SECRET + '|' + JSON.stringify(c)).then(function (h) { return h.slice(0, 16) === r.sig; });
    })).then(function (oks) {
      var good = valid.filter(function (_, i) { return oks[i]; });
      if (!good.length) return { rec: null, tamper: true };
      /* 同一浏览器可能因指纹漂移留下多条记录：优先正式授权，其次到期时间更晚，
         再按最近使用时间取一条，不再因为"存在多条"就把用户锁回登录页。 */
      good.sort(function (a, b) {
        var d = (b.act ? 1 : 0) - (a.act ? 1 : 0);
        if (d) return d;
        d = (b.exp || 0) - (a.exp || 0);
        if (d) return d;
        return (b.maxSeen || 0) - (a.maxSeen || 0);
      });
      return { rec: good[0], tamper: false };
    });
  });
}

/* ---------- 淘宝时间双重控制 ---------- */
function authNetTime() {
  return new Promise(function(resolve) {
    var isResolved = false;
    var timeoutId = setTimeout(function() {
      if (!isResolved) {
        isResolved = true;
        resolve(null); // 3秒超时直接返回null，走离线容错
      }
    }, 3000);

    // 优先尝试淘宝，如果报错则快速尝试备用节点
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp', true);
    xhr.timeout = 2500;
    xhr.onload = function() {
      if (isResolved) return;
      try {
        var d = JSON.parse(xhr.responseText);
        if (d && d.data && d.data.t) {
          isResolved = true;
          clearTimeout(timeoutId);
          resolve(parseInt(d.data.t));
          return;
        }
      } catch(e) {}
      // 淘宝失败，试苏宁
      tryXhr('https://f.m.suning.com/api/ct.do', function(d) {
        return d.currentTime;
      });
    };
    xhr.onerror = xhr.ontimeout = function() {
      if (isResolved) return;
      tryXhr('https://f.m.suning.com/api/ct.do', function(d) {
        return d.currentTime;
      });
    };
    xhr.send();

    function tryXhr(url, getter) {
      if (isResolved) return;
      var x2 = new XMLHttpRequest();
      x2.open('GET', url, true);
      x2.timeout = 2500;
      x2.onload = function() {
        if (isResolved) return;
        try {
          var d = JSON.parse(x2.responseText);
          var t = getter(d);
          if (t) {
            isResolved = true;
            clearTimeout(timeoutId);
            resolve(parseInt(t));
            return;
          }
        } catch(e) {}
        // 苏宁失败，用本地时间兜底（防止卡死）
        if (!isResolved) { isResolved = true; clearTimeout(timeoutId); resolve(Date.now()); }
      };
      x2.onerror = x2.ontimeout = function() {
        if (!isResolved) { isResolved = true; clearTimeout(timeoutId); resolve(Date.now()); }
      };
      x2.send();
    }
  });
}
function netTime() { return authNetTime().catch(function () { return null; }); }

/* ---------- 激活码校验 ---------- */
function authVerifyCode(code, devCode) {
  var dc = devCode || authDeviceCode;
  var p = String(code).toUpperCase().replace(/[\u2010-\u2015\uFF0D\uFE63]/g, '-').replace(/[^A-Z0-9-]/g, '').split('-');
  if (p.length !== 3) return Promise.resolve(null);
  var tag = p[2], got = p[0] + p[1];
  return authSha256(AUTH_SECRET + '|' + dc + '|' + tag).then(function (h) {
    if (authB32(authHexU8(h), 10) !== got) return null;
    return tag === 'PERM' ? AUTH_PERM : parseInt(tag.slice(1), 36);
  });
}

function doLogin() {

    if (now == null) { showToast('需要联网激活，请连接网络后重试', true); return; }
    authVerifyCode(code).then(function (exp) {

      authReadAll().then(function (res) {

        rec.act = true; rec.exp = exp; rec.code = code; rec.maxSeen = now;
        /* 老记录换新码时沿用原指纹，保证同一台设备的注册码前后一致 */
        if (!rec.fp) { rec.fp = authFp; rec.fpl = authFpLoose; }
        authRec = rec;
        authAnchorSet(rec.fp);

/* ---------- 启动校验 ---------- */
/* 顺序原则：先在本地存档里找授权 → 能认的直接放行（刷新页面不再要求输入注册码）
   → 再联网校准时间；只有确证到期、记录被篡改、确实换了设备才拦回登录页。 */
function authBoot() {
  authReady = false;
  if (currentMode === 'login' && !authLockReason) renderGate();

  authFpCandidates().then(function (cands) {
    authCands = cands;
    authFp = cands.fp; authFpLoose = cands.fpl;
    return authReadAll();
  }).then(function (res) {
    var cands = authCands;
    var rec = res && res.rec;

    if (res && res.tamper) { authLock('tamper'); return null; }

    if (!rec) {
      if (isAuthorized) return null;   /* 启动校验期间已经通过其它途径激活，不要回退到登录页 */
      authRec = null;
      authDeviceCode = authDeviceCodeOf(authFp);
      pendingTrial = true;
      authReady = true;
      isAuthorized = false;
      currentMode = 'login';
      render();
      return null;
    }

    authRec = rec;
    /* 设备码始终以"首次授权时"的指纹为准：横竖屏切换、画布渲染漂移都不会让老注册码失效 */
    authDeviceCode = authDeviceCodeOf(rec.fp || authFp);

    if (!authFpMatch(rec, cands)) { authLock('device'); return null; }
    pendingTrial = false;

    var now0 = Date.now();
    var clockBack = !!(rec.maxSeen && now0 < rec.maxSeen - 30 * 60000);
    if (clockBack) return { rec: rec, clockBack: true };   /* 本地时间可疑：等联网校准再定 */

    if (rec.exp >= AUTH_PERM || rec.exp > now0) authOk(rec.act ? 'activated' : 'trial', rec.exp);
    else authLock(rec.act ? 'expired' : 'trial');
    return { rec: rec };
  }).then(function (o) {
    if (!o) return;
    return netTime().then(function (now) {
      if (now == null) {
        /* 联网失败：已经放行的用户继续用（离线容错），未放行的才提示联网 */
        if (!isAuthorized && o.clockBack) { authLock('clock'); return; }
        if (!isAuthorized) { authLock('offline'); return; }
        return;
      }
      if (o.rec.maxSeen && now < o.rec.maxSeen - 5 * 60000) { authLock('clock'); return; }
      if (o.rec.exp < AUTH_PERM && o.rec.exp <= now) { authLock(o.rec.act ? 'expired' : 'trial'); return; }
      o.rec.maxSeen = now;
      authSaveAll(o.rec);
      if (!isAuthorized) authOk(o.rec.act ? 'activated' : 'trial', o.rec.exp);
    });
  });
}
function authRetry() {
  if (currentMode === 'login') { 
    appContainer.innerHTML = '<div class="card" style="text-align:center;padding:40px 15px;">正在尝试多个服务器校验，请稍候…</div>';

var authOfflineCount = 0;
function authHeartbeat() {
  netTime().then(function (now) {
    if (now == null) {
      authOfflineCount++;
      /* 联网只是"校准"手段，不是"能否使用"的开关：
         手机网络时好时坏，断网不应该把人踢回登录页要求重新输入注册码。 */
      if (authOfflineCount === 6 && isAuthorized) {
        showToast('网络不稳定，已进入离线使用模式');
      }
      return;
    }
    authOfflineCount = 0;
    if (!isAuthorized) return;
    if (authExpire < AUTH_PERM && authExpire <= now) {
      authLock('expired');
      return;
    }
    authReadAll().then(function (res) {
      if (res.tamper) { authLock('tamper'); return; }
      if (res.rec) {
        res.rec.maxSeen = now;
        authSaveAll(res.rec);
      }
    });
  });
}

  mask.innerHTML = `<div class="app-box"><h3>${title}</h3><div>${msg}</div><div class="actions" style="margin-top:20px;"><button class="btn btn-outline" id="btnCancel">${cancelText}</button><button class="btn btn-primary" id="btnOk">${okText}</button></div></div>`;
  document.body.appendChild(mask);
  document.getElementById('btnCancel').onclick = function() { document.body.removeChild(mask); if(onCancel) onCancel(); };
  document.getElementById('btnOk').onclick = function() { document.body.removeChild(mask); if(onOk) onOk(); };
}

/* 需求14：退出练习时询问是否保留进度 */
function confirmExitPractice() {
  var mask = document.createElement('div'); mask.className = 'app-mask';
  mask.innerHTML = `<div class="app-box">
    <h3>退出学习</h3>
    <p>是否保留本次答题进度？</p>
    <div class="actions" style="flex-direction:column;">
      <button class="btn btn-primary" id="exSave">保留进度并退出</button>
      <button class="btn btn-danger" id="exDrop" style="margin-top:8px;">不保留，直接退出</button>
      <button class="btn btn-outline" id="exCancel" style="margin-top:8px;">取消</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  document.getElementById('exSave').onclick = function(){ savePracticeProgress(); window._randomOptCache = {}; document.body.removeChild(mask); currentMode='home'; render(); };
  document.getElementById('exDrop').onclick = function(){ localStorage.removeItem('xjt_practice_progress'); window._randomOptCache = {}; document.body.removeChild(mask); currentMode='home'; render(); };
  document.getElementById('exCancel').onclick = function(){ document.body.removeChild(mask); };
}

/* 需求4：考试中退出提醒 */
function confirmExitExam() {
  showAppConfirm('退出考试', '退出将终止当前考试，本次成绩不会保存。确定退出吗？', '终止退出', '继续答题', function() {
    if (examTimer) { clearInterval(examTimer); examTimer = null; }

    currentMode = 'home';
    render();
  });
}

function confirmSubmitExam() { showAppConfirm('铁途学练', '确定要交卷吗？（主观题需自行评分）', '交卷', '取消', function() { submitExam(false); }); }
function confirmDeleteBank(id) { showAppConfirm('铁途学练', '确定删除该题库？', '删除', '取消', function() { delete allBanks[id]; if (activeBankId === id) { var keys = Object.keys(allBanks); activeBankId = keys.length > 0 ? keys[0] : null; } saveData(); render(); }); }
function clearAllBanks() {
  var keys = Object.keys(allBanks);
  if (keys.length === 0) return showToast('暂无题库', true);
  showAppConfirm('铁途学练', '确定删除全部 ' + keys.length + ' 个题库？此操作不可恢复，建议先「备份存档」。', '全部删除', '取消', function() {
    allBanks = {}; activeBankId = null;
    saveData(); render(); showToast('已删除全部题库');
  });
}

function saveData() { localStorage.setItem('xjt_banks', JSON.stringify(allBanks)); localStorage.setItem('xjt_active', activeBankId || ''); localStorage.setItem('xjt_wrong', JSON.stringify(wrongBook)); localStorage.setItem('xjt_fav', JSON.stringify(favorites)); }
function savePracticeProgress() { if (currentMode === 'practice' || currentMode === 'recite') { localStorage.setItem('xjt_practice_progress', JSON.stringify({ mode: currentMode, source: currentMode === 'recite' ? reciteSource : practiceSource, bankId: activeBankId, questions: practiceQuestions, index: practiceIndex, selections: practiceSelections, isWrong: isWrongPracticeMode })); } }
function restorePracticeProgress() {
  var pStr = localStorage.getItem('xjt_practice_progress');
  if (!pStr) return;
  try {
    var p = JSON.parse(pStr);
    if (!p.questions || p.questions.length === 0 || p.index >= p.questions.length) { localStorage.removeItem('xjt_practice_progress'); return; }
    if (p.bankId && !allBanks[p.bankId]) { localStorage.removeItem('xjt_practice_progress'); return; }
    var modeName = p.mode === 'recite' ? '背题' : '练习';
    showAppConfirm('铁途学练', '检测到上次未完成的' + modeName + '，是否继续？', '继续', '放弃', function() {
      practiceQuestions = p.questions; practiceIndex = p.index || 0; practiceSelections = p.selections || [];
      isWrongPracticeMode = !!p.isWrong; practiceSource = p.source || 'all'; reciteSource = p.source || 'all';
      currentMode = p.mode || 'practice'; installBackGuard(); render();
    }, function() { localStorage.removeItem('xjt_practice_progress'); });
  } catch(e) {}
}
function loadData() { 
  try { 
    var b = localStorage.getItem('xjt_banks'); 
    var a = localStorage.getItem('xjt_active'); 
    var w = localStorage.getItem('xjt_wrong'); 
    if (b) allBanks = JSON.parse(b); 
    if (a) activeBankId = a; 
    if (w) { 
      wrongBook = JSON.parse(w); 
      for (var i=0; i<wrongBook.length; i++) {
        if (wrongBook[i].streak === undefined) wrongBook[i].streak = 0;
        ensureReviewFields(wrongBook[i]);
        // ★ 核心修复：如果是老数据没有 bankId，强制把当前题库ID赋给它
        if (!wrongBook[i].bankId && activeBankId) {
          wrongBook[i].bankId = activeBankId;
        }
      }
      // 保存回本地，下次就不乱了
      saveData();
    } 
    var favStr = localStorage.getItem('xjt_fav'); 
    if (favStr) { try { favorites = JSON.parse(favStr); } catch(e2) { favorites = []; } } 
    if (activeBankId && !allBanks[activeBankId]) activeBankId = null; 
  } catch(e) {} 
}
function checkNewImport() {
  var newBankStr = localStorage.getItem('xjt_new_import');
  if (!newBankStr) return;
  try {
    var newBank = JSON.parse(newBankStr);
    var oldBankIds = Object.keys(allBanks);
    allBanks[newBank.id] = { name: newBank.name, questions: newBank.questions };
    activeBankId = newBank.id;
    localStorage.removeItem('xjt_new_import');
    // ★ 题库平滑升级：内容一致的题，继承旧题库的错题/连对/笔记/纠错
    var migStat = { wrong: 0, note: 0, correction: 0, streak: 0 };
    try { migStat = migrateRecordsToBank(newBank.id, oldBankIds); } catch (em) { console.error('迁移失败', em); }
    saveData();
    var msg = '导入成功，共 ' + newBank.questions.length + ' 题';
    if (migStat.wrong || migStat.note || migStat.correction) {
      msg += '；已继承错题 ' + migStat.wrong + ' 条、笔记 ' + migStat.note + ' 条、纠错 ' + migStat.correction + ' 条';
    }
    showToast(msg);
  } catch (e) {}
}

/* ==================== 科学计算器（练习页 / 考试页悬浮调用） ==================== */
var kCalc = { open: false, expr: '', deg: true, justEval: false, fab: null, mask: null };

function kFact(n) {
  if (n < 0 || Math.abs(n - Math.round(n)) > 1e-9) throw new Error('阶乘只支持非负整数');
  n = Math.round(n);
  if (n > 170) return Infinity;
  var r = 1;
  for (var i = 2; i <= n; i++) r *= i;
  return r;
}

/* 结果规整：12 位有效数字，消掉 0.1+0.2=0.30000000000000004 这类浮点尾巴 */
function kTidy(v) {
  if (typeof v !== 'number' || isNaN(v)) throw new Error('无效结果');
  if (!isFinite(v)) return v > 0 ? Infinity : -Infinity;
  if (Math.abs(v) < 1e-12) return 0;
  return Number(v.toPrecision(12));
}

function kFunc(name, x, deg) {
  var rad = deg ? x * Math.PI / 180 : x, a, b, c;
  switch (name) {
    case 'SIN': return Math.sin(rad);
    case 'COS': return Math.cos(rad);
    case 'TAN':
      c = Math.cos(rad);
      if (Math.abs(c) < 1e-10) throw new Error('该角度无定义');
      return Math.sin(rad) / c;
    case 'ASIN':
      if (x < -1 || x > 1) throw new Error('超出定义域 [-1,1]');
      a = Math.asin(x); return deg ? a * 180 / Math.PI : a;
    case 'ACOS':
      if (x < -1 || x > 1) throw new Error('超出定义域 [-1,1]');
      b = Math.acos(x); return deg ? b * 180 / Math.PI : b;
    case 'ATAN':
      c = Math.atan(x); return deg ? c * 180 / Math.PI : c;
    case 'LOG':
      if (x <= 0) throw new Error('对数要求正数');
      return Math.log10(x);
    case 'LN':
      if (x <= 0) throw new Error('对数要求正数');
      return Math.log(x);
    case 'SQRT':
      if (x < 0) throw new Error('负数不能开方');
      return Math.sqrt(x);
    case 'ABS': return Math.abs(x);
  }
  throw new Error('未知函数');
}

/* 递归下降解析：+ - * / ^ ! % 括号 函数 常量，右结合幂 */
function kEval(input, deg) {
  var src = String(input || '')
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
    .replace(/π/g, 'PI').replace(/√/g, 'SQRT');
  var pos = 0;
  function skip() { while (src[pos] === ' ') pos++; }
  function peek() { return src[pos]; }
  function fail(m) { throw new Error(m || '表达式有误'); }
  function isNum(c) { return c >= '0' && c <= '9'; }

  function parseExpr() {
    var v = parseTerm(), c;
    for (;;) {
      skip(); c = peek();
      if (c === '+') { pos++; v = v + parseTerm(); }
      else if (c === '-') { pos++; v = v - parseTerm(); }
      else return v;
    }
  }
  function parseTerm() {
    var v = parseUnary(), c, d;
    for (;;) {
      skip(); c = peek();
      if (c === '*') { pos++; v = v * parseUnary(); }
      else if (c === '/') { pos++; d = parseUnary(); if (d === 0) fail('不能除以 0'); v = v / d; }
      else return v;
    }
  }
  /* 幂优先于一元负号：-5^2 = -(5^2) = -25；2^3^2 = 2^(3^2) 右结合 */
  function parseFactor() {
    var base = parsePostfix();
    skip();
    if (peek() === '^') { pos++; return Math.pow(base, parseUnary()); }
    return base;
  }
  function parseUnary() {
    skip();
    if (peek() === '-') { pos++; return -parseUnary(); }
    if (peek() === '+') { pos++; return parseUnary(); }
    return parseFactor();
  }
  function parsePostfix() {
    var v = parsePrimary();
    for (;;) {
      skip();
      if (peek() === '!') { pos++; v = kFact(v); }
      else if (peek() === '%') { pos++; v = v / 100; }
      else return v;
    }
  }
  function parsePrimary() {
    skip();
    var c = peek();
    if (c === '(') {
      pos++; var v = parseExpr(); skip();
      if (peek() !== ')') fail('括号不匹配');
      pos++; return v;
    }
    if (isNum(c) || c === '.') {
      var start = pos;
      while (pos < src.length && (isNum(src[pos]) || src[pos] === '.')) pos++;
      if (src[pos] === 'E' || src[pos] === 'e') {
        var save = pos; pos++;
        if (src[pos] === '+' || src[pos] === '-') pos++;
        var ds = pos;
        while (pos < src.length && isNum(src[pos])) pos++;
        if (pos === ds) pos = save;
      }
      var num = parseFloat(src.slice(start, pos));
      if (isNaN(num)) fail('数字有误');
      return num;
    }
    if (/[A-Za-z]/.test(c)) {
      var s = pos;
      while (pos < src.length && /[A-Za-z]/.test(src[pos])) pos++;
      var name = src.slice(s, pos).toUpperCase();
      if (name === 'PI') return Math.PI;
      if (name === 'E') return Math.E;
      skip();
      if (peek() !== '(') fail('函数缺少括号');
      pos++; var arg = parseExpr(); skip();
      if (peek() !== ')') fail('括号不匹配');
      pos++; return kFunc(name, arg, deg);
    }
    fail('表达式不完整');
  }

  var val = parseExpr();
  skip();
  if (pos < src.length) fail('表达式有误');
  return kTidy(val);
}

function kFmt(v) {
  if (v === Infinity) return '∞';
  if (v === -Infinity) return '-∞';
  if (Math.abs(v) >= 1e12 || (Math.abs(v) < 1e-6 && v !== 0)) {
    return v.toExponential(6).replace('e', '×10^');
  }
  return String(v);
}

/* 悬浮球位置：默认在“下一题”按钮右上方，可拖动，拖完记住（按设备存在本地） */
function kCalcFabDefaultPos() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var contentW = Math.min(vw, 480);
  var rightEdge = (vw + contentW) / 2;
  return { x: rightEdge - 12 - 52, y: vh - 96 - 52 };
}

function kCalcApplyFabPos() {
  if (!kCalc.fab) return;
  var size = 52, pad = 4, pos = null;
  try { pos = JSON.parse(localStorage.getItem('xjt_calc_fab_pos') || 'null'); } catch (e) { pos = null; }
  if (!pos || typeof pos.x !== 'number' || typeof pos.y !== 'number') pos = kCalcFabDefaultPos();
  var x = Math.min(Math.max(pos.x, pad), window.innerWidth - size - pad);
  var y = Math.min(Math.max(pos.y, pad), window.innerHeight - size - pad);
  kCalc.fab.style.left = x + 'px';
  kCalc.fab.style.top = y + 'px';
  kCalc.fab.style.right = 'auto';
  kCalc.fab.style.bottom = 'auto';
}

function kCalcBindFabDrag(fab) {
  var sx = 0, sy = 0, bx = 0, by = 0, dragging = false, moved = false;
  function pt(e) { return (e.touches && e.touches[0]) ? e.touches[0] : e; }
  function down(e) {
    var p = pt(e); if (!p) return;
    var r = fab.getBoundingClientRect();
    bx = r.left; by = r.top;
    sx = p.clientX; sy = p.clientY;
    dragging = true; moved = false;
    if (e.preventDefault && e.cancelable) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = pt(e); if (!p) return;
    var dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    var size = 52, pad = 4;
    var nx = Math.min(Math.max(bx + dx, pad), window.innerWidth - size - pad);
    var ny = Math.min(Math.max(by + dy, pad), window.innerHeight - size - pad);
    fab.style.left = nx + 'px';
    fab.style.top = ny + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
    if (e.preventDefault && e.cancelable) e.preventDefault();
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    kCalc.skipClick = true;
    if (!moved) {
      // 按下就松开 = 想打开计算器。触屏下 touchstart 的 preventDefault 会吞掉后续 click，
      // 所以这里直接打开，不能指望 fab.onclick
      kCalcOpen();
      setTimeout(function () { kCalc.skipClick = false; }, 300);
      return;
    }
    if (moved) {
      try {
        localStorage.setItem('xjt_calc_fab_pos', JSON.stringify({
          x: parseFloat(fab.style.left) || 0,
          y: parseFloat(fab.style.top) || 0
        }));
      } catch (e) {}
    }
  }
  fab.addEventListener('touchstart', down, { passive: false });
  fab.addEventListener('touchmove', move, { passive: false });
  fab.addEventListener('touchend', up, false);
  fab.addEventListener('mousedown', down, false);
  document.addEventListener('mousemove', move, false);
  document.addEventListener('mouseup', up, false);
}

/* 顶部小横条可上下拖动整块面板：拖到上方就不会压住题目和选项 */
function kCalcBindDrag(mask) {
  var panel = mask.querySelector('#kCalcPanel');
  var hand = mask.querySelector('#kDrag');
  if (!panel || !hand) return;
  var sy = 0, base = 0, dragging = false;
  function pt(e) { return (e.touches && e.touches[0]) ? e.touches[0] : e; }
  function down(e) {
    var p = pt(e); if (!p) return;
    dragging = true; base = kCalc.dy || 0; sy = p.clientY;
    kCalc.justDrag = true;
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    if (e.preventDefault && e.cancelable) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    var p = pt(e); if (!p) return;
    var dy = base + (p.clientY - sy);
    var maxUp = -(mask.offsetHeight - panel.offsetHeight - 8);
    if (dy > 0) dy = 0;
    if (dy < maxUp) dy = maxUp;
    kCalc.dy = dy;
    panel.style.transform = 'translateY(' + dy + 'px)';
    if (e.preventDefault && e.cancelable) e.preventDefault();
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';
    // 拖动结束后 300ms 内忽略遮罩点击，避免松手误触把面板关掉
    setTimeout(function () { kCalc.justDrag = false; }, 300);
  }
  // 拖动区域：整块面板都可以拖，只有键盘区和按钮本身不参与拖动
  function inPad(t) {
    while (t && t !== mask) {
      if (t.id === 'kPad') return true;
      t = t.parentNode;
    }
    return false;
  }
  function onDown(e) {
    var t = e.target;
    if (!t || t.tagName === 'BUTTON' || inPad(t)) return;
    down(e);
  }
  panel.addEventListener('mousedown', onDown, false);
  panel.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', move, false);
  document.addEventListener('mouseup', up, false);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', up, false);
}

function kCalcRender() {
  var e = document.getElementById('kExpr'), r = document.getElementById('kRes');
  if (!e || !r) return;
  e.textContent = kCalc.expr || '0';
  if (kCalc.justEval) {
    r.textContent = kCalc.lastResult;
  } else if (kCalc.expr) {
    try { r.textContent = kFmt(kEval(kCalc.expr, kCalc.deg)); }
    catch (err) { r.textContent = ''; }
  } else {
    r.textContent = '0';
  }
}

function kCalcBackspace(expr) {
  var m = expr.match(/(asin|acos|atan|sin|cos|tan|log|ln|sqrt)$/);
  if (m) return expr.slice(0, -m[0].length);
  return expr.slice(0, -1);
}

var kCalcFuncToks = {
  sin: 'sin(', cos: 'cos(', tan: 'tan(', asin: 'asin(', ln: 'ln(', log: 'log(',
  sqrt: '√(', sqr: '^2', pow: '^', pi: 'π', fact: '!'
};

var kCalcImplicit = ['π', 'e', '√(', 'sin(', 'cos(', 'tan(', 'asin(', 'ln(', 'log('];

function kCalcPress(k) {
  if (k === 'ac') { kCalc.expr = ''; kCalc.justEval = false; kCalc.lastResult = ''; kCalcRender(); return; }
  if (k === 'back') { kCalc.expr = kCalcBackspace(kCalc.expr); kCalc.justEval = false; kCalcRender(); return; }
  if (k === 'neg') {
    var ex = kCalc.expr;
    if (!ex) { kCalc.justEval = false; kCalcRender(); return; }
    if (ex.indexOf('-(') === 0 && ex.slice(-1) === ')') kCalc.expr = ex.slice(2, -1);
    else kCalc.expr = '-(' + ex + ')';
    kCalc.justEval = false; kCalcRender(); return;
  }
  if (k === '=') {
    if (!kCalc.expr) return;
    try {
      var val = kEval(kCalc.expr, kCalc.deg);
      kCalc.lastResult = kFmt(val);
      kCalc.justEval = true;
      kCalcRender();
    } catch (err) {
      kCalc.lastResult = '错误：' + err.message;
      kCalc.justEval = true;
      kCalcRender();
    }
    return;
  }
  if (k === 'e') { kCalcAppend('e'); return; }
  if (kCalcFuncToks[k]) { kCalcAppend(kCalcFuncToks[k]); return; }
  kCalcAppend(k);
}

function kCalcAppend(tok) {
  if (kCalc.justEval) {
    kCalc.justEval = false;
    if (/^[0-9.]/.test(tok) || tok === '(') kCalc.expr = '';
  }
  // 数字/右括号后面直接跟常量或函数，自动补乘号：2π → 2×π
  if (kCalcImplicit.indexOf(tok) > -1 && /[0-9)]$/.test(kCalc.expr)) kCalc.expr += '×';
  var isOp = /^[+\-×÷^]$/.test(tok);
  if (isOp && kCalc.expr && /[+\-×÷^]$/.test(kCalc.expr)) {
    kCalc.expr = kCalc.expr.slice(0, -1) + tok;
  } else if (tok === '.' ) {
    var tail = kCalc.expr.match(/[0-9.]*$/)[0];
    if (tail.indexOf('.') > -1) { kCalcRender(); return; }
    if (!tail) tok = '0.';
    kCalc.expr += tok;
  } else {
    kCalc.expr += tok;
  }
  kCalcRender();
}

function kCalcToggleDeg() {
  kCalc.deg = !kCalc.deg;
  var b = document.getElementById('kDegBtn');
  if (b) b.textContent = kCalc.deg ? 'DEG' : 'RAD';
  kCalcRender();
}

function kCalcOpen() {
  kCalcBuildUI();

}

function quoteText(q) { return q.who ? q.t + ' — ' + q.who : q.t; }
function pickMaoQuote(exclude) {
  var pool = LEADER_QUOTES.filter(function (q) { return q.t !== exclude; });
  var arr = pool.length ? pool : LEADER_QUOTES;
  return arr[Math.floor(Math.random() * arr.length)];

function renderMaoQuote(el, q) {
  var full = quoteText(q);
  el.dataset.text = q.t;
  el.innerHTML = '<span class="mao-inner"></span>';
  var inner = el.querySelector('.mao-inner');
  inner.textContent = full;
  el.classList.remove('scroll');
  inner.style.animationDuration = '';
  requestAnimationFrame(function () {
    if (inner.scrollWidth > el.clientWidth + 2) {
      el.classList.add('scroll');
      inner.textContent = full + '　　' + full;
      var one = inner.scrollWidth / 2;
      inner.style.animationDuration = Math.max(8, one / 35) + 's';
    }
  });
}
// 主动预加载毛体；字体就绪后重绘一次当前语录，规避本地字体晚到、动态文本不重绘
function ensureMaoFontReady(el) {
  if (!document.fonts) return;
  try {
    document.fonts.load('normal 16px MaoTi').catch(function () {});
    document.fonts.load('bold 16px MaoTi').catch(function () {});
  } catch (e) {}
  if (!document.fonts.ready) return;
  document.fonts.ready.then(function () {
    var ok = false;
    try { ok = document.fonts.check('bold 16px MaoTi'); } catch (e) {}
    console.log('[MaoFont] ready, check=' + ok);
    if (!el || el.style.display === 'none') return;
    var cur = null;
    for (var i = 0; i < LEADER_QUOTES.length; i++) { if (LEADER_QUOTES[i].t === el.dataset.text) { cur = LEADER_QUOTES[i]; break; } }
    if (cur) renderMaoQuote(el, cur);
  }).catch(function () {});
}
function showMaoQuote() {
  var el = document.getElementById('maoQuote');
  if (!el) return;
  el.style.display = 'block';
  if (!el.dataset.text) renderMaoQuote(el, pickMaoQuote());
  ensureMaoFontReady(el);
}
function updateMaoQuoteVisibility() {
  var el = document.getElementById('maoQuote');

function startMaoQuoteRotator() {
  if (maoTimer) return;

}

function goToImport() { if (!guardGate()) return; window.location.href='import.html'; }
function switchBank(id) { activeBankId = id; saveData(); render(); }

/* ===== 题库多选合并 ===== */
var bankMergeSel = {};

function toggleBankSelect(id) {
  if (!allBanks[id]) return;
  bankMergeSel[id] = !bankMergeSel[id];
  var on = !!bankMergeSel[id];
  var el = document.getElementById('bsel_' + id);
  if (el) {
    el.style.background = on ? '#0d47a1' : 'transparent';
    el.style.borderColor = on ? '#0d47a1' : '#94a3b8';
    el.innerHTML = on ? '✓' : '';
  }
}

function mergeSelectedBanks() {
  if (!guardGate()) return;
  var ids = [];
  for (var k in bankMergeSel) { if (bankMergeSel[k] && allBanks[k]) ids.push(k); }
  if (ids.length < 2) { showToast('请至少勾选 2 个题库再合并', true); return; }
  var totalQ = 0;
  ids.forEach(function(id) { totalQ += (allBanks[id].questions || []).length; });

  // 默认名称：已存在“综合题库”则加序号
  var baseName = '综合题库';
  var finalName = baseName, n = 2;
  var nameUsed = function(nm) {
    var used = false;
    for (var bid in allBanks) { if (allBanks[bid] && allBanks[bid].name === nm) { used = true; break; } }
    return used;
  };
  while (nameUsed(finalName)) { finalName = baseName + n; n++; }

  var mask = document.createElement('div'); mask.className = 'app-mask';
  mask.innerHTML = `<div class="app-box">
    <h3>合并题库</h3>
    <div style="font-size:0.82rem;color:var(--text-sub);line-height:1.6;">将把选中的 <b>${ids.length}</b> 个题库（共 <b>${totalQ}</b> 题）拼成一个新题库，原题库会保留。</div>
    <input type="text" id="mergeNameInput" value="${finalName}" maxlength="30"
      style="width:100%;box-sizing:border-box;padding:12px;border:2px solid var(--border-color);border-radius:8px;font-size:1rem;outline:none;background:var(--input-bg);color:var(--text-main);text-align:center;margin-top:12px;">
    <div class="actions" style="margin-top:20px;">
      <button class="btn btn-outline" id="mergeCancel">取消</button>
      <button class="btn btn-primary" id="mergeOk">合并</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  var input = document.getElementById('mergeNameInput');
  setTimeout(function() { input.focus(); input.select(); }, 60);
  function close() { if (mask.parentNode) document.body.removeChild(mask); }
  function doMerge() {
    var nm = input.value.trim();
    if (nm === '') { showToast('题库名称不能为空'); return; }
    if (nameUsed(nm)) { showToast('已有同名题库，请换个名字'); return; }
    var qs = [];
    ids.forEach(function(id) {
      var arr = allBanks[id].questions || [];
      for (var i = 0; i < arr.length; i++) {
        try { qs.push(JSON.parse(JSON.stringify(arr[i]))) ; } catch(e) { qs.push(arr[i]); }
      }
    });
    // 跨题库可能存在相同题号，去重避免收藏/错题记录串号
    var seen = {};
    qs.forEach(function(q, i) {
      if (!q || !q.id) { if (q) q.id = 'qm_' + i; return; }
      if (seen[q.id]) { q.id = q.id + '_m' + i; }
      seen[q.id] = 1;
    });
    var newId = 'bank_' + Date.now();
    allBanks[newId] = { name: nm, questions: qs };
    activeBankId = newId;
    bankMergeSel = {};
    close(); saveData(); currentMode = 'home'; render();
    showToast('已合并 ' + ids.length + ' 个题库，共 ' + qs.length + ' 题');
  }
  document.getElementById('mergeCancel').onclick = close;
  document.getElementById('mergeOk').onclick = doMerge;
  input.onkeydown = function(e) { if (e.key === 'Enter') doMerge(); };
  mask.onclick = function(e) { if (e.target === mask) close(); };
}

/* ===== 收藏 ===== */
function toggleFavorite(key, oldId){
  if (!guardGate()) return;
  try {
    var pos = favorites.indexOf(key);
    var oldPos = (oldId != null && oldId !== '') ? favorites.indexOf(String(oldId)) : -1;
    if (pos > -1 || oldPos > -1) {
      if (pos > -1) favorites.splice(pos, 1);
      if (oldPos > -1) favorites.splice(oldPos, 1);
    } else { favorites.push(key); }
    saveData();
    if (currentMode === 'exam') renderExam();
    else if (currentMode === 'recite') renderRecite();
    else if (currentMode === 'practice') renderPractice();
    else if (currentMode === 'favReview') renderFavReview();
    else render();
  } catch(e) { showToast('操作失败，请重试', true); }
}
function openFavReview() { if (!guardGate()) return; currentMode = 'favReview'; render(); }
function renderFavReview() {
  try {
    var qs = activeBankId && allBanks[activeBankId] ? allBanks[activeBankId].questions : [];
    var favQs = [];
    for (var i = 0; i < qs.length; i++) {
      try { if (isFav(qs[i])) favQs.push(qs[i]); } catch(e) {}
    }

    if (favQs.length === 0) {
      appContainer.innerHTML = `<div style="margin-bottom:10px;"><button class="btn btn-outline" onclick="currentMode='home';render()">⬅ 返回</button></div><div class="card" style="text-align:center;padding:30px;">🔖 当前题库暂无收藏题目</div>`;
      return;
    }

    if (favBrowseMode === 'page') {
      renderFavPage();
      return;
    }

    var html = `<div class="toolbar" style="padding:10px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="currentMode='home';render()">返回</button>
        <div class="q-progress" style="font-size:0.9rem;">收藏夹 (${favQs.length})</div>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-outline btn-small" onclick="toggleFavBrowse()">翻页</button>
        <button class="btn btn-outline btn-small" onclick="openFavSheet()">答题卡</button>
        <button class="btn btn-danger btn-small" onclick="clearAllFav()">剔除</button>
      </div>
    </div>`;

    html += `<div id="favScrollContainer" style="overflow-y:auto; -webkit-overflow-scrolling:touch; height:calc(100vh - 140px); height:calc(100dvh - 140px); padding-bottom:20px;">`;
    for (var i = 0; i < favQs.length; i++) {
      try {
        var q = favQs[i];
        if (!q || !q.question) continue;
        if (!q.options) q.options = [];
        if (!q.answer) q.answer = [];
        if (q.type === 'judge' && q.options.length === 0) q.options = ['正确', '错误'];
        
        var tName = TYPE_NAMES[q.type] || '未知';
        var isSubj = isSubjective(q.type);
        var ansDisplay = isSubj ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；')) : q.answer.map(function(x){ return String.fromCharCode(65+x); }).join(', ');
        
        var optHtml = '';
        if (!isSubj) {
          for (var j = 0; j < q.options.length; j++) {
            var isAns = q.answer.indexOf(j) > -1;
            optHtml += `<div class="opt ${isAns ? 'correct' : ''} disabled"><div class="opt-prefix">${String.fromCharCode(65+j)}</div><div>${q.options[j]}</div></div>`;
          }
        } else {
          optHtml = `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansDisplay}</div></div>`;
        }

        var favKey = typeof qFavKey === 'function' ? qFavKey(q) : '';
        var qid = q.id || '';

        html += `<div class="card review-item" id="fav-item-${i}" data-idx="${i}" style="scroll-margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px;align-items:center;">
            <span class="tag" style="background:#f59e0b; margin-bottom:0;">${tName} · 第 ${i+1} 题</span>
            <button class="fav-star on" style="float:none; margin:0;" onclick="toggleFavorite('${favKey}','${qid}')">⭐ 取消收藏</button>
          </div>
          <div class="q-text" style="padding-right:0;">${q.question}</div>
          ${optHtml}
          ${buildAnalysisHtml(q, [], true)}</div>`;
      } catch(e) { console.error('渲染题目报错:', e); }
    }
    
    html += `</div>
      <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
        <div class="sheet-content" onclick="event.stopPropagation()">
          <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:var(--text-sub);font-weight:normal;">点击题号可跳转</span></div>
          ${buildSheetHtml(favQs, window.favPageIndex || 0, [], 'favReview')}
        </div>
      </div>`;
      
    appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;

    setTimeout(function() {
      try {
        var el = document.getElementById('fav-item-' + (window.favPageIndex || 0));
        var container = document.getElementById('favScrollContainer');
        if (el && container) container.scrollTop = el.offsetTop - 10;
      } catch(e){}
    }, 40);

    setTimeout(function() {
      try {
        var container = document.getElementById('favScrollContainer');
        if (container) {
          var scrollTimer = null;
          container.addEventListener('scroll', function() {
            if (scrollTimer) clearTimeout(scrollTimer);
            scrollTimer = setTimeout(function() {
              var items = container.querySelectorAll('.review-item');
              var bestIdx = 0, bestDist = Infinity;
              var cTop = container.getBoundingClientRect().top;
              for (var k = 0; k < items.length; k++) {
                var r = items[k].getBoundingClientRect();
                var d = Math.abs(r.top - cTop - 10);
                if (d < bestDist) { bestDist = d; bestIdx = k; }
              }
              window.favPageIndex = bestIdx;
            }, 250);
          }, { passive: true });
        }
      } catch(e){}
    }, 60);

  } catch(err) {
    appContainer.innerHTML = `<div class="card" style="text-align:center;padding:30px;">加载出错：${err.message}</div>`;
  }
}

function clearAllFav() {
  showAppConfirm('一键剔除', '确定要清空当前题库的所有收藏吗？', '确定剔除', '取消', function() {
    var qs = activeBankId && allBanks[activeBankId] ? allBanks[activeBankId].questions : [];
    for (var i = 0; i < qs.length; i++) {
      var k = qFavKey(qs[i]);
      var oldId = qs[i].id ? String(qs[i].id) : '';
      // 从收藏夹里移除
      var pos = favorites.indexOf(k);
      if (pos > -1) favorites.splice(pos, 1);
      if (oldId) {
        var oldPos = favorites.indexOf(oldId);
        if (oldPos > -1) favorites.splice(oldPos, 1);
      }
    }
    saveData();
    render();
    showToast('当前题库收藏已清空');
  });
}

    var isSubj = isSubjective(q.type);
    var ansDisplay = isSubj ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；')) : q.answer.map(function(x){ return String.fromCharCode(65+x); }).join(', ');

          <div class="q-progress" style="font-size:0.9rem;">${window.favPageIndex+1} / ${favQs.length}</div>
        </div>

      <div class="card">

          <button class="fav-star on" style="float:none; margin:0;" onclick="toggleFavorite('${qFavKey(q)}','${q.id||''}')">⭐ 取消收藏</button>

  if (window.favPageIndex < favQs.length - 1) { window.favPageIndex++; renderFavPage(); } else { currentMode='home'; render(); }
}

/* ===== 答案分布 / 蒙题概率 / 记忆方法 ===== */
function collectAnswerDist(qs) {
  var dist = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  var usable = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  var counted = 0, optSum = 0, randSum = 0;
  var mDist = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  var mCombo = {};
  var mCnt = 0, mAnsSum = 0, mHitTotal = 0;
  var jT = 0, jF = 0, jOther = 0, jCnt = 0;

  (qs || []).forEach(function (q) {
    if (!q) return;

    // 判断题
    if (q.type === 'judge') {
      jCnt++;
      var jA = Array.isArray(q.answer) ? q.answer[0] : q.answer;
      if (jA === 0) jT++; else if (jA === 1) jF++; else jOther++;
      return;
    }

    // 多选题：按“正确选项被选中的次数”统计
    if (q.type === 'multiple') {
      if (!q.options || q.options.length < 2) return;
      var ans = Array.isArray(q.answer) ? q.answer : [];
      if (!ans.length) return;
      var okAns = [];
      ans.forEach(function (ix) {
        if (typeof ix === 'number' && !isNaN(ix) && ix >= 0 && ix <= 4) {
          var L = String.fromCharCode(65 + ix);
          if (mDist[L] !== undefined) { mDist[L]++; mHitTotal++; okAns.push(ix); }
        }
      });
      if (!okAns.length) return;
      mCnt++; mAnsSum += okAns.length;
      var combo = okAns.slice().sort(function (x, y) { return x - y; }).map(function (v) { return String.fromCharCode(65 + v); }).join('');
      mCombo[combo] = (mCombo[combo] || 0) + 1;
      return;
    }

    if (q.type !== 'single') return;
    if (!q.options || q.options.length < 2) return;
    var a = q.answer;
    var idx = Array.isArray(a) ? a[0] : a;
    if (typeof idx !== 'number' || isNaN(idx) || idx < 0) return;
    var letter = String.fromCharCode(65 + idx);
    if (dist[letter] === undefined) return;
    var nOpts = Math.min(q.options.length, 5);
    dist[letter]++; counted++; optSum += nOpts; randSum += 1 / nOpts;
    for (var k = 0; k < nOpts; k++) usable[String.fromCharCode(65 + k)]++;
  });

  return {
    dist: dist,
    usable: usable,
    counted: counted,
    avgOpts: counted > 0 ? optSum / counted : 4,
    randP: counted > 0 ? randSum / counted * 100 : 25,
    mDist: mDist,
    mCombo: mCombo,
    mCnt: mCnt,
    mHitTotal: mHitTotal,
    mAnsAvg: mCnt > 0 ? mAnsSum / mCnt : 0,
    jT: jT, jF: jF, jOther: jOther, jCnt: jCnt
  };
}

function distBarHtml(dist, counted) {
  var out = '';
  ['A', 'B', 'C', 'D', 'E'].forEach(function (L) {
    if (dist[L] === 0 && L === 'E') return;
    var n = dist[L], pct = counted > 0 ? Math.round(n / counted * 1000) / 10 : 0;
    out += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
      <div style="width:16px;font-weight:bold;font-size:0.85rem;">${L}</div>
      <div style="flex:1;height:12px;background:var(--border-color);border-radius:6px;overflow:hidden;">
        <div style="width:${Math.min(100, pct)}%;height:100%;background:linear-gradient(90deg,#0d47a1,#1e88e5);border-radius:6px;"></div>
      </div>
      <div style="width:88px;text-align:right;font-size:0.72rem;color:var(--text-sub);white-space:nowrap;"><b style="color:var(--text-main);">${n}</b>题 · ${pct}%</div>
    </div>`;
  });
  return out;
}

function mComboBarHtml(comboMap, total) {
  var keys = Object.keys(comboMap || {}).sort(function (a, b) { return comboMap[b] - comboMap[a]; });
  var out = '';
  keys.forEach(function (cb) {
    var n = comboMap[cb], pct = total > 0 ? Math.round(n / total * 1000) / 10 : 0;
    out += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
      <div style="width:62px;font-weight:bold;font-size:0.78rem;letter-spacing:1px;">${cb}</div>
      <div style="flex:1;height:12px;background:var(--border-color);border-radius:6px;overflow:hidden;">
        <div style="width:${Math.min(100, pct)}%;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:6px;"></div>
      </div>
      <div style="width:88px;text-align:right;font-size:0.72rem;color:var(--text-sub);white-space:nowrap;"><b style="color:var(--text-main);">${n}</b>题 · ${pct}%</div>
    </div>`;
  });
  return out;
}

function buildMemoryTips(qs, typeRows) {
  var tips = [];
  var tCount = { single: 0, multiple: 0, judge: 0, fill: 0, short: 0, essay: 0 };
  var numCount = 0;
  (qs || []).forEach(function (q) {
    if (!q) return;
    if (tCount[q.type] !== undefined) tCount[q.type]++;
    if (/\d+(\.\d+)?\s*(mm|毫米|厘米|cm|分米|米|m|km|千米|公里|‰|%|°|度|号|根|处|块|人|名|天|日|小时|分钟|秒|kg|吨|t|层|级|次|遍|趟|档)/i.test(q.question || '')) numCount++;
  });
  var total = (qs || []).length;

  // 1. 主力题型策略
  var mains = [];
  Object.keys(tCount).forEach(function (k) { if (tCount[k] > 0) mains.push({ k: k, n: tCount[k] }); });
  mains.sort(function (a, b) { return b.n - a.n; });
  if (mains.length && total > 0) {
    var m0 = mains[0];
    tips.push('主力是「' + (TYPE_NAMES[m0.k] || m0.k) + '」共 ' + m0.n + ' 题（占 ' + Math.round(m0.n / total * 100) + '%）：先按规章目录「章—节—条」通读一遍，把每道题定位回原文条款，记条文比记题目更抗变式。');
  }
  // 2. 数值型考点
  if (numCount >= 10) {
    tips.push('有 ' + numCount + ' 题涉及数值标准（间距、长度、坡度、厚度、周期等）：单独做一张「数值对照表」，同类指标横向排一行，专门盯容易记混的那几个数字，比逐题背省一半时间。');
  }
  // 3. 判断题
  if (tCount.judge >= 5) {
    tips.push('判断题 ' + tCount.judge + ' 题：遇到「一律、全部、严禁、必须同时」这类绝对表述，先怀疑再判断，规章题最爱在例外条款和适用范围上做文章。');
  }
  // 4. 多选
  if (tCount.multiple >= 5) {
    tips.push('多选题 ' + tCount.multiple + ' 题：用「确定项优先」法，先勾选 100% 有把握的，边界项宁少勿多，多选错一个整题归零，保守更划算。');
  }
  // 5. 主观题
  if (tCount.fill + tCount.short + tCount.essay >= 5) {
    tips.push('主观题 ' + (tCount.fill + tCount.short + tCount.essay) + ' 题：按「项目 + 数值 + 条件」三要素记骨架，答题时照骨架扩写，比整句背诵更容易回忆。');
  }
  // 6. 薄弱题型
  if (typeRows && typeRows.length) {
    var weakest = null;
    typeRows.forEach(function (r) { if (!weakest || r.acc < weakest.acc) weakest = r; });
    if (weakest && weakest.done >= 5 && weakest.acc < 80) {
      tips.push('你目前「' + weakest.name + '」正确率最低（' + weakest.acc + '%）：先集中刷这一类 2~3 天，再回到混合练习，补短板比刷熟悉的题提分快。');
    }
  }
  // 7. 错题三刷
  tips.push('错题按「当天 → 3 天后 → 7 天后」三刷：第三刷只回想解析里的关键句，能复述出关键句才算真的记住。');
  return tips.slice(0, 5);
}

function renderStudyStats() {
  var totalDone = 0, totalCorrect = 0;
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.indexOf('xjt_stats_') === 0) {
      var s = JSON.parse(localStorage.getItem(key) || '{"done":0,"correct":0}');
      totalDone += (s.done || 0); totalCorrect += (s.correct || 0);
    }
  }
  var totalAcc = totalDone > 0 ? Math.round(totalCorrect / totalDone * 100) : 0;

  var typeStats = JSON.parse(localStorage.getItem('xjt_type_stats') || '{}');
  var typeOrder = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var typeRows = [];
  typeOrder.forEach(function (tp) {
    var ts = typeStats[tp];
    if (!ts || !ts.done) return;
    typeRows.push({ tp: tp, name: TYPE_NAMES[tp] || tp, done: ts.done, correct: ts.correct, acc: Math.round(ts.correct / ts.done * 100) });
  });
  var weakest = null;
  typeRows.forEach(function (r) { if (!weakest || r.acc < weakest.acc) weakest = r; });

  var examHistory = JSON.parse(localStorage.getItem('xjt_exam_history') || '[]');
  var days = [];
  for (var d = 6; d >= 0; d--) {
    var dt = new Date(); dt.setDate(dt.getDate() - d);
    var label = (dt.getMonth() + 1) + '/' + dt.getDate();
    var st = JSON.parse(localStorage.getItem('xjt_stats_' + dt.toLocaleDateString()) || '{"done":0,"correct":0}');
    days.push({ label: label, done: st.done || 0, correct: st.correct || 0 });
  }
  var maxDone = 1; for (var m = 0; m < days.length; m++) { if (days[m].done > maxDone) maxDone = days[m].done; }
  var bars = '';
  for (var k = 0; k < days.length; k++) {
    var day = days[k]; var h = Math.round(day.done / maxDone * 70);
    var acc = day.done > 0 ? Math.round(day.correct / day.done * 100) : 0;
    bars += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:110px;">
      <div style="font-size:0.68rem;color:var(--text-main);font-weight:bold;margin-bottom:3px;">${day.done}</div>
      <div style="width:58%;background:${day.done===0 ? 'var(--border-color)' : 'linear-gradient(180deg,#0d47a1,#1e88e5)'};border-radius:4px 4px 0 0;height:${Math.max(3,h)}px;"></div>
      <div style="font-size:0.65rem;color:var(--text-sub);margin-top:4px;">${day.label}</div>
      <div style="font-size:0.62rem;color:#10b981;font-weight:bold;">${acc}%</div>
    </div>`;
  }
  var html = `<div style="margin-bottom:12px;"><button class="btn btn-outline" onclick="currentMode='home';render()">⬅ 返回</button></div>`;
  html += `<div class="card"><div class="title">📈 学习数据总览</div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">${totalDone}</div><div class="stat-label">累计做题</div></div>
      <div class="stat-item"><div class="stat-num" style="color:#10b981;">${totalCorrect}</div><div class="stat-label">累计正确</div></div>
      <div class="stat-item"><div class="stat-num" style="color:#b71c1c;">${totalAcc}%</div><div class="stat-label">累计正确率</div></div>
    </div></div>`;
  html += `<div class="card"><div class="title">近 7 天做题趋势</div>
    <div style="display:flex;gap:6px;align-items:flex-end;">${bars}</div>
    <div style="font-size:0.75rem;color:var(--text-sub);margin-top:12px;line-height:1.5;">柱高 = 当日做题数；柱顶数字 = 做题量；柱底百分比 = 当日正确率。数据每天 0 点起独立统计。</div></div>`;

  var typeBars = '';
  if (typeRows.length === 0) {
    typeBars = '<div style="font-size:0.82rem;color:var(--text-sub);">暂无分题型答题记录，开始练习后自动统计。</div>';
  } else {
    typeRows.forEach(function (r) {
      var barColor = r.acc >= 80 ? '#10b981' : (r.acc >= 60 ? '#f59e0b' : '#ef4444');
      var weakTag = (weakest && r.tp === weakest.tp) ? ' ⚠️最弱' : '';
      typeBars += `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;">
          <span>${r.name}${weakTag}</span>
          <span style="font-weight:bold;color:${barColor};">${r.acc}% <span style="color:var(--text-sub);font-weight:normal;">(${r.correct}/${r.done})</span></span>
        </div>
        <div style="height:8px;background:var(--border-color);border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${r.acc}%;background:${barColor};border-radius:4px;"></div>
        </div>
      </div>`;
    });
  }
  var weakTip = (weakest && weakest.done > 0) ? `<div style="margin-top:10px;padding:10px;background:#fef2f2;border-radius:8px;font-size:0.82rem;color:#b91c1c;">⚠️ 薄弱提醒：「${weakest.name}」正确率最低（${weakest.acc}%），建议优先针对性练习。<div style="margin-top:8px;"><button class="btn btn-primary btn-small" onclick="startWeakPractice('${weakest.tp}')" style="width:100%;">💪 立即专练这个题型</button></div></div>` : '';
  html += `<div class="card"><div class="title">🎯 分题型正确率</div>${typeBars}${weakTip}</div>`;

  // ★ 本题库答案分布 + 蒙题概率 + 记忆方法
  var bankQs = (activeBankId && allBanks[activeBankId]) ? allBanks[activeBankId].questions : [];
  var bankName = (activeBankId && allBanks[activeBankId]) ? allBanks[activeBankId].name : '当前题库';
  var distInfo = collectAnswerDist(bankQs);

  var hasAnyDist = distInfo.counted > 0 || distInfo.mCnt > 0 || distInfo.jCnt > 0;

  if (hasAnyDist) {
    var mAvgTxt = Math.round(distInfo.mAnsAvg * 10) / 10;
    var sBlock = '', mBlock = '', jBlock = '', jTp = 0, jFp = 0;

    if (distInfo.counted > 0) {
      sBlock = `<div style="font-size:0.8rem;font-weight:bold;margin-bottom:6px;">单选 ${distInfo.counted} 题</div>${distBarHtml(distInfo.dist, distInfo.counted)}`;
    } else {
      sBlock = `<div style="font-size:0.8rem;color:var(--text-sub);">本题库没有可统计的单选题。</div>`;
    }

    if (distInfo.mCnt > 0) {
      mBlock = `<div style="font-size:0.8rem;font-weight:bold;margin:14px 0 6px;">多选 ${distInfo.mCnt} 题
        <span style="font-weight:normal;color:var(--text-sub);font-size:0.7rem;display:block;margin-top:2px;">按“正确答案组合”统计，共 ${Object.keys(distInfo.mCombo).length} 种组合，平均每题 ${mAvgTxt} 个正确项</span></div>${mComboBarHtml(distInfo.mCombo, distInfo.mCnt)}`;
    } else {
      mBlock = `<div style="font-size:0.8rem;color:var(--text-sub);margin-top:14px;">本题库没有多选题。</div>`;
    }

    if (distInfo.jCnt > 0) {
      jTp = Math.round(distInfo.jT / distInfo.jCnt * 1000) / 10;
      jFp = Math.round(distInfo.jF / distInfo.jCnt * 1000) / 10;
      jBlock = `<div style="font-size:0.8rem;font-weight:bold;margin:14px 0 6px;">判断 ${distInfo.jCnt} 题</div>
        <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--border-color);">
          <div style="width:${jTp}%;background:#10b981;"></div>
          <div style="width:${jFp}%;background:#ef4444;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.73rem;color:var(--text-sub);margin-top:5px;">
          <span>✅ 正确 ${distInfo.jT} 题 · ${jTp}%</span><span>❌ 错误 ${distInfo.jF} 题 · ${jFp}%</span>
        </div>`;
    } else {
      jBlock = `<div style="font-size:0.8rem;color:var(--text-sub);margin-top:14px;">本题库没有判断题。</div>`;
    }

    html += `<div class="card"><div class="title">🎲 本题库答案分布</div>
      ${sBlock}${mBlock}${jBlock}
      <div style="font-size:0.74rem;color:var(--text-sub);margin-top:10px;line-height:1.6;">统计范围：${bankName}。单选、判断按选项/正误统计；多选题按“正确答案组合”统计（如 ABC 表示该题正确答案是 A、B、C 三个选项），不拆成单个选项，所以各组百分比加起来正好 100%。选项不足或答案异常的题会跳过。</div></div>`;

    // 蒙题概率
    if (distInfo.counted > 0) {
      var maxL = 'A', minL = 'A';
      ['A', 'B', 'C', 'D'].forEach(function (L) {
        if (distInfo.dist[L] > distInfo.dist[maxL]) maxL = L;
        if (distInfo.dist[L] < distInfo.dist[minL]) minL = L;
      });
      var pMax = Math.round(distInfo.dist[maxL] / distInfo.counted * 1000) / 10;
      var pMin = Math.round(distInfo.dist[minL] / distInfo.counted * 1000) / 10;
      var randP = Math.round(distInfo.randP * 10) / 10;
      var avgOptsTxt = Math.round(distInfo.avgOpts * 10) / 10;
      var eCnt = distInfo.dist.E;
      var eNote = eCnt > 0
        ? `另外题库里有 ${distInfo.usable.E || 0} 道题带 E 选项，其中答案选 E 的有 ${eCnt} 题：全填 E 的命中率只有 ${Math.round(eCnt / distInfo.counted * 1000) / 10}%，其余题根本没有 E，等于必错。`
        : '';
      var judgeGuess = distInfo.jCnt > 0
        ? `判断题 ${distInfo.jCnt} 题里答案是“错误”的 ${distInfo.jF} 题（${jFp}%）、是“正确”的 ${distInfo.jT} 题（${jTp}%）：全蒙“错误”命中约 ${jFp}%，全蒙“正确”约 ${jTp}%。`
        : '';

      html += `<div class="card"><div class="title">🎯 蒙题概率统计</div>
        <div class="stats" style="margin-bottom:10px;">
          <div class="stat-item"><div class="stat-num" style="font-size:1.05rem;">${randP}%</div><div class="stat-label">随机蒙一题</div></div>
          <div class="stat-item"><div class="stat-num" style="font-size:1.05rem;color:#0d47a1;">${pMax}%</div><div class="stat-label">蒙最多的 ${maxL}</div></div>
          <div class="stat-item"><div class="stat-num" style="font-size:1.05rem;color:#10b981;">${pMin}%</div><div class="stat-label">蒙最少的 ${minL}</div></div>
        </div>
        <div style="font-size:0.8rem;color:var(--text-sub);line-height:1.7;background:var(--input-bg);border:1px solid var(--border-color);border-radius:8px;padding:10px;">
          📌 本题库单选题平均 ${avgOptsTxt} 个选项，纯随机蒙每题命中率约 ${randP}%。<br>
          📌 答案<b>偏向 ${maxL}</b>（${distInfo.dist[maxL]} 题，${pMax}%），最少的是 <b>${minL}</b>（${distInfo.dist[minL]} 题，${pMin}%）。<br>
          → 完全不会的单选题，蒙 <b>${maxL}</b> 期望命中率约 <b>${pMax}%</b>，比随机蒙高；蒙最少的 ${minL} 只有 ${pMin}%。<br>
          → 但这是"整套题全填一个字"的期望值，实际每道题还是独立判断更划算；随机抽题组卷时各选项会趋近均匀，那时怎么蒙都一样。${eNote ? '<br>→ ' + eNote : ''}<br>
          ${judgeGuess ? '→ ' + judgeGuess + '<br>' : ''}
          → 多选题没有“蒙一个就全对”的可能，平均每题 ${mAvgTxt} 个正确项，蒙对的概率极低，不建议蒙。
        </div></div>`;
    } else if (distInfo.jCnt > 0) {
      html += `<div class="card"><div class="title">🎯 蒙题概率统计</div>
        <div style="font-size:0.8rem;color:var(--text-sub);line-height:1.7;background:var(--input-bg);border:1px solid var(--border-color);border-radius:8px;padding:10px;">
          本题库没有单选题，只有判断题：${distInfo.jCnt} 题里答案是“错误”的 ${distInfo.jF} 题（${jFp}%）、是“正确”的 ${distInfo.jT} 题（${jTp}%）。全蒙“错误”命中约 ${jFp}%，全蒙“正确”约 ${jTp}%。
        </div></div>`;
    }
  } else {
    html += `<div class="card"><div class="title">🎲 本题库答案分布</div><div style="font-size:0.82rem;color:var(--text-sub);">当前题库里没有可统计的选择、判断题。</div></div>`;
  }

  var memTips = buildMemoryTips(bankQs, typeRows);
  var tipHtml = memTips.map(function (t, i) {
    return `<div style="display:flex;gap:8px;margin-bottom:10px;font-size:0.82rem;line-height:1.7;">
      <div style="flex:0 0 20px;height:20px;border-radius:50%;background:#0d47a1;color:#fff;font-size:0.72rem;text-align:center;line-height:20px;font-weight:bold;">${i + 1}</div>
      <div style="flex:1;">${t}</div></div>`;
  }).join('');
  html += `<div class="card"><div class="title">🧠 本套题库的最优记忆方法</div>${tipHtml}
    <div style="font-size:0.72rem;color:var(--text-sub);margin-top:4px;line-height:1.6;">建议依据当前题库的题型构成与你已有的答题数据自动生成，换题库后会跟着变。</div></div>`;

  var chartHtml, recent = examHistory.slice(-10);
  if (examHistory.length === 0) {
    chartHtml = '<div style="font-size:0.82rem;color:var(--text-sub);">暂无模考成绩记录，完成一次模拟考试后自动生成曲线。</div>';
  } else {
    var W = 320, H = 150, pL = 34, pR = 14, pT = 16, pB = 26, n = recent.length;
    function X(i) { return pL + (n > 1 ? i * (W - pL - pR) / (n - 1) : (W - pL - pR) / 2); }
    function Y(a) { return pT + (100 - a) / 100 * (H - pT - pB); }
    var pts = recent.map(function (r, i) { return X(i) + ',' + Y(r.acc); }).join(' ');
    var grid = [0, 50, 100].map(function (g) { return `<line x1="${pL}" y1="${Y(g)}" x2="${W - pR}" y2="${Y(g)}" stroke="var(--border-color)" stroke-dasharray="3,3" stroke-width="1"/><text x="4" y="${Y(g) + 4}" font-size="9" fill="var(--text-sub)">${g}</text>`; }).join('');
    var dots = recent.map(function (r, i) { var d = new Date(r.date); var lb = (d.getMonth() + 1) + '/' + d.getDate(); return `<circle cx="${X(i)}" cy="${Y(r.acc)}" r="4" fill="#ef4444"/><text x="${X(i)}" y="${Y(r.acc) - 7}" font-size="9" fill="var(--text-main)" text-anchor="middle" font-weight="bold">${r.acc}</text><text x="${X(i)}" y="${H - 8}" font-size="8" fill="var(--text-sub)" text-anchor="middle">${lb}</text>`; }).join('');
    chartHtml = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${grid}<polyline points="${pts}" fill="none" stroke="#0d47a1" stroke-width="2"/>${dots}</svg>`;
  }
  var chartTitle = examHistory.length > 0 ? `📊 模考成绩曲线（近 ${recent.length} 次）` : '📊 模考成绩曲线';
  html += `<div class="card"><div class="title">${chartTitle}</div>${chartHtml}</div>`;

  html += `<div class="card"><div class="title">💡 数据说明</div><div style="font-size:0.82rem;color:var(--text-sub);line-height:1.7;">累计数据来自每日统计的自动汇总，无需手动记录。错题会同步计入「累计正确率」，坚持练习即可看到正确率稳步上升。</div></div>`;
  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;
}

function jumpToNumber() {
  var el = document.getElementById('jumpNumInput'); if (!el) return;
  var n = parseInt(el.value);
  var list = (currentMode === 'exam' || currentMode === 'examReview') ? examQuestions : practiceQuestions;
  if (isNaN(n) || n < 1 || n > list.length) { showToast('请输入 1-' + list.length + ' 的题号', true); return; }
  var idx = n - 1;
  if (currentMode === 'exam') { examIndex = idx; closeSheet({target:{id:'sheetModal'}}); renderExam(); }
  else { jumpPractice(idx); }
}

function startExamWrongPractice() {
