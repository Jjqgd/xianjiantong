<style>
  @import url('https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap'); /* 用于小篆质感 */

  :root {
    --primary: #b71c1c; --secondary: #0d47a1; --bg-color: #f0f4f8;
    --text-main: #1e293b; --text-sub: #64748b; --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(13,71,161,0.08);
    --shadow-lg: 0 12px 32px rgba(13,71,161,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body { 
    -webkit-touch-callout: none; 
    background-color: var(--bg-color); 
    background-image: linear-gradient(rgba(240, 244, 248, 0.92), rgba(240, 244, 248, 0.95)), linear-gradient(90deg, transparent 49%, rgba(13, 71, 161, 0.05) 50%, transparent 51%), linear-gradient(0deg, transparent 49%, rgba(13, 71, 161, 0.05) 50%, transparent 51%); 
    background-size: 100% 100%, 40px 40px, 40px 40px; 
    min-height: 100vh; 
    display: flex; flex-direction: column; 
    color: var(--text-main);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ====== 开场动画 ====== */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: #fcf9f2;
    background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s;
  }
  #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  
  .calligraphy-container { writing-mode: vertical-rl; text-align: center; letter-spacing: 15px; margin-bottom: 30px; }
  .calligraphy-text { font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', cursive; font-size: 3.5rem; color: #1a1a1a; line-height: 1.5; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); animation: inkReveal 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: scale(0.9); }
  .calligraphy-sub { font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', cursive; font-size: 2rem; color: var(--primary); margin-left: 30px; animation: inkReveal 2s 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: scale(0.9); }
  
  /* 全新设计的真·古风印章 */
  .seal {
    width: 80px; height: 80px;
    background: #b71c1c;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(183,28,28,0.4);
    animation: stamp 0.6s 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0; transform: scale(2) rotate(-15deg);
    position: relative; overflow: hidden;
    /* 使用字体模拟小篆，添加白色文字 */
    color: #fff;
    font-family: 'Ma Shan Zheng', 'STXingkai', cursive;
    font-size: 1.2rem;
    font-weight: bold;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
    padding: 8px;
    text-align: center;
    line-height: 1.2;
  }
  /* 模拟印章盖上去的斑驳印泥 */
  .seal::before {
    content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
    background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23n)" opacity="0.6"/%3E%3C/svg%3E');
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  @keyframes inkReveal { 0% { opacity: 0; transform: scale(0.9); filter: blur(10px); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }

  .main-container { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 20px 16px; }

  .login-box { background: #ffffff; padding: 40px 24px; border-radius: var(--radius); box-shadow: var(--shadow-lg); max-width: 400px; margin: 10vh auto 0; text-align: center; border-top: 4px solid var(--primary); }

  .login-input:focus { border-color: var(--secondary); }

  .card { background: #ffffff; border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.6); }
  .security-banner { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); color: #0369a1; padding: 14px 16px; border-radius: var(--radius); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-sm); }

  .section-header::before { content: ''; width: 6px; height: 16px; background: var(--primary); border-radius: 4px; }
  .bank-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #f8fafc; border: 2px solid transparent; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); }

  .bank-meta { font-size: 0.8rem; color: var(--text-sub); display: flex; gap: 10px; }

  @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }
  .menu-card { background: #ffffff; border-radius: 14px; padding: 20px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); border: 1px solid #f1f5f9; }
  .menu-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: #e2e8f0; }
  .menu-icon { font-size: 2rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f1f5f9; }
  .menu-card:nth-child(1) .menu-icon { background: #e0f2fe; }
  .menu-card:nth-child(2) .menu-icon { background: #fef2f2; }
  .menu-card:nth-child(3) .menu-icon { background: #fef08a; }
  .menu-card:nth-child(4) .menu-icon { background: #f3e8ff; }
  .menu-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
  .menu-desc { font-size: 0.75rem; color: var(--text-sub); text-align: center; line-height: 1.4; display: none; }
  @media (min-width: 600px) { .menu-desc { display: block; } }

  .btn { border-radius: 10px; padding: 12px 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; outline: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--secondary); color: #fff; box-shadow: 0 4px 12px rgba(13,71,161,0.2); }
  .btn-primary:hover { background: #0a367a; }
  .btn-danger { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(183,28,28,0.2); }
  .btn-danger:hover { background: #8e1616; }
  .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: var(--text-main); }
  .btn-outline:hover { background: #f8fafc; }
  .btn-block { width: 100%; }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .question-text { font-size: 1.1rem; font-weight: 700; line-height: 1.6; margin-bottom: 20px; color: var(--text-main); }
  .option-item { display: flex; align-items: flex-start; gap: 12px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.15s; font-size: 0.95rem; }
  .option-item:hover:not(.disabled) { border-color: #94a3b8; background: #f8fafc; }
  .option-item.selected { border-color: var(--secondary); background: #eff6ff; }
  .option-item.correct { border-color: #10b981; background: #ecfdf5; }
  .option-item.wrong { border-color: #ef4444; background: #fef2f2; }
  .option-item.disabled { cursor: not-allowed; }
  .opt-prefix { width: 24px; height: 24px; border-radius: 50%; background: #f1f5f9; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; color: var(--text-sub); }
  .option-item.selected .opt-prefix { background: var(--secondary); color: #fff; border-color: var(--secondary); }
  .option-item.correct .opt-prefix { background: #10b981; color: #fff; border-color: #10b981; }
  .option-item.wrong .opt-prefix { background: #ef4444; color: #fff; border-color: #ef4444; }

  .streak-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; background: #f1f5f9; color: var(--text-sub); border: 1px solid #e2e8f0; }
  .streak-badge.active { background: #ecfdf5; color: #10b981; border-color: #10b981; }

  .teacher-score { font-family: "Georgia", serif; color: #d32f2f; font-size: 5rem; font-weight: bold; line-height: 1; display: inline-block; position: relative; margin-bottom: 20px; }
  .teacher-score::after { content: ''; display: block; width: 100%; height: 12px; border-bottom: 4px solid #d32f2f; border-top: 4px solid #d32f2f; margin-top: 6px; transform: rotate(-3deg); }

  .form-row { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid #f1f5f9; }
  .form-row:last-child { border-bottom: none; }
  @media (min-width: 600px) { .form-row { flex-direction: row; justify-content: space-between; align-items: center; } }
  .form-label { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
  .form-input { width: 70px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 0.95rem; outline: none; transition: border 0.2s; }
  .form-input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(13,71,161,0.1); }
  
  .progress-wrap { margin-bottom: 20px; }
  .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--secondary); transition: width 0.3s; border-radius: 4px; }

  .tag { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: var(--secondary); color: #fff; }
  .tag.error { background: var(--danger); }
  .footer-info { text-align: center; margin-top: 30px; color: #94a3b8; font-size: 0.85rem; padding-bottom: 20px; }
  
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(30,41,59,0.9); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
  .toast.show { opacity: 1; }
  
  .timer-warning { color: #ef4444 !important; font-weight: bold; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.5; } }
  
  .custom-prompt-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
  .custom-prompt-box { background: #fff; padding: 24px; border-radius: 16px; width: 320px; max-width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
  .custom-prompt-box h3 { font-size: 1.1rem; margin-bottom: 16px; color: var(--text-main); font-weight: 700; }
  .custom-prompt-box input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; margin-bottom: 20px; outline: none; transition: border 0.2s; }
  .custom-prompt-box input:focus { border-color: var(--secondary); }
  .custom-prompt-actions { display: flex; justify-content: flex-end; gap: 10px; }
</style>
</head>
<body>

<!-- 开场书法动画 -->
<div id="splash-screen">
  <div class="calligraphy-container">
    <div class="calligraphy-text">铁道征途</div>
    <div class="calligraphy-sub">勤学练兵</div>
  </div>
  
  <!-- 优化后的小篆风格印章 -->
  <div class="seal">铁途学练</div>
</div>

<!-- 顶部导航 -->
<div class="top-nav">
  <div class="logo-area">
    <div class="logo-icon" title="中国铁路">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#b71c1c" stroke-width="8"/>
        <path d="M50 20 L75 35 L65 42 L50 32 L35 42 L25 35 Z" fill="#b71c1c"/>
        <path d="M20 80 L40 50 L50 55 L60 50 L80 80 L70 85 L58 65 L50 68 L42 65 L30 85 Z" fill="#b71c1c"/>
        <line x1="25" y1="55" x2="75" y2="55" stroke="#b71c1c" stroke-width="8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="logo-text">铁途学练</div>
  </div>
  <div class="nav-right">在线学习考核平台</div>
</div>

<div class="main-container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 全局配置与状态 ================= */
const AUTH_CODE = "QIN13"; 
let isAuthorized = localStorage.getItem('xjt_auth') === 'true';

let allBanks = {}; 
let activeBankId = null;
let wrongBook = [];
let currentMode = 'login';

let practiceQuestions = [];
let practiceIndex = 0;
let practiceSelections = [];
let isWrongPracticeMode = false;

let examQuestions = [];
let examIndex = 0;
let examSelections = [];
let examConfig = { single: 0, multiple: 0, judge: 0, scoreSingle: 2, scoreMultiple: 4, scoreJudge: 2, timeLimit: 60 };
let examScore = { got: 0, total: 0, usedTime: '0分0秒' };

let examTimer = null;
let examStartTime = 0;
let examRemainingSeconds = 0;

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

// 隐藏开场动画 (延时3秒)
setTimeout(() => {
  document.getElementById('splash-screen').classList.add('hidden');
}, 3000);

window.showToast = function(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.style.background = isError ? '#ef4444' : 'rgba(30,41,59,0.9)';
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

/* ================= 授权验证 ================= */
window.checkAuth = function() {
  if (isAuthorized) {
    currentMode = Object.keys(allBanks).length > 0 ? 'home' : 'import';
  } else {
    currentMode = 'login';
  }
}

/* ================= 本地缓存管理 ================= */
window.saveData = function() {
  try {
    localStorage.setItem('xianjiantong_all_banks', JSON.stringify(allBanks));
    localStorage.setItem('xianjiantong_active_id', activeBankId || '');
    localStorage.setItem('xianjiantong_wrong', JSON.stringify(wrongBook));
  } catch(e) { console.warn('保存缓存失败', e); }
}

window.loadData = function() {
  try {
    const b = localStorage.getItem('xianjiantong_all_banks');
    const a = localStorage.getItem('xianjiantong_active_id');
    const w = localStorage.getItem('xianjiantong_wrong');
    if (b) allBanks = JSON.parse(b);
    if (a) activeBankId = a;
    if (w) {
      wrongBook = JSON.parse(w);
      wrongBook.forEach(item => { if (item.streak === undefined) item.streak = 0; });
    }
    if (activeBankId && !allBanks[activeBankId]) activeBankId = null;
  } catch(e) { console.warn('读取缓存失败', e); }
}

window.getCurrentBankQuestions = function() {
  if (!activeBankId || !allBanks[activeBankId]) return [];
  return allBanks[activeBankId].questions;
}

/* ================= 自定义输入弹窗 ================= */
window.customPrompt = function(title, defaultValue, callback) {
  const mask = document.createElement('div');
  mask.className = 'custom-prompt-mask';
  mask.innerHTML = `
    <div class="custom-prompt-box">
      <h3>${title}</h3>
      <input type="text" id="promptInput" value="${defaultValue}">
      <div class="custom-prompt-actions">
        <button class="btn btn-outline btn-sm" id="promptCancel">取消</button>
        <button class="btn btn-primary btn-sm" id="promptOk">确定</button>
      </div>
    </div>
  `;
  document.body.appendChild(mask);
  const input = document.getElementById('promptInput');
  input.focus();
  const close = () => { document.body.removeChild(mask); };
  document.getElementById('promptCancel').onclick = close;
  document.getElementById('promptOk').onclick = () => {
    const val = input.value.trim();
    if (!val) { window.showToast('名称不能为空', true); return; }
    close();
    callback(val);
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('promptOk').click(); };
}

/* ================= 智能 Excel解析 ================= */
window.parseExcel = function(wb) {
  const allParsed = [];
  wb.SheetNames.forEach(sheetName => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: false });
    if (!rows || rows.length < 2) return;

    const header = rows[0].map(c => String(c ?? '').trim().toLowerCase());
    
    let colQ = -1, colAns = -1, colT = -1, colAna = -1;
    let optCols = []; 
    
    for (let i = 0; i < header.length; i++) {
      const h = header[i];
      if (colQ === -1 && (h.includes('题目') || h.includes('问题') || h.includes('question'))) colQ = i;
      else if (colAns === -1 && (h.includes('答案') || h.includes('answer') || h === '正确')) colAns = i;
      else if (colT === -1 && (h.includes('题型') || h.includes('类型') || h.includes('type'))) colT = i;
      else if (colAna === -1 && (h.includes('解析') || h.includes('分析') || h.includes('explanation'))) colAna = i;
      else if (h.match(/^(选项|option)?[a-g]$/i) || h.match(/^[a-g]选项$/i) || h.includes('选项')) {
        optCols.push(i);
      }
    }

    if (colQ === -1 || colAns === -1) return;

    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || !row[colQ]) continue;

      let typeStr = colT !== -1 ? String(row[colT] || '').trim() : '';
      let opts = [];
      optCols.forEach(c => {
        if (row[c] && String(row[c]).trim()) opts.push(String(row[c]).trim());
      });

      let type = 'single';
      let ansRaw = String(row[colAns] || '').trim().toUpperCase();
      
      const judgeTrue = ['正确','对','T','TRUE','Y','YES','√','V'];
      const judgeFalse = ['错误','错','不对','F','FALSE','N','NO','×','X'];

      if (typeStr.includes('多') || typeStr.toLowerCase() === 'multiple') type = 'multiple';
      else if (typeStr.includes('判') || typeStr.toLowerCase() === 'judge') type = 'judge';
      else {
        if ([...judgeTrue, ...judgeFalse].includes(ansRaw) && opts.length < 2) type = 'judge';
        else if (ansRaw.match(/[,，、#]/) || ansRaw.match(/[A-G]{2,}/)) type = 'multiple';
      }

      if (type === 'judge') opts = ['正确', '错误'];
      if (opts.length < 2) continue; 

      let ansIndices = [];
      if (type === 'judge') {
        if (judgeTrue.includes(ansRaw)) ansIndices = [0];
        else if (judgeFalse.includes(ansRaw)) ansIndices = [1];
      } else {
        const letters = ansRaw.match(/[A-G]/g) || [];
        [...new Set(letters)].forEach(l => {
          const idx = l.charCodeAt(0) - 65;
          if (idx < opts.length) ansIndices.push(idx);
        });
      }
      
      if (type === 'single' && ansIndices.length > 1) type = 'multiple';
      if (ansIndices.length === 0) continue; 
      
      ansIndices.sort((a,b)=>a-b);

      allParsed.push({
        id: 'q_' + sheetName + '_' + i + '_' + Date.now() + Math.random().toString(36).substring(2, 6),
        question: String(row[colQ]).trim(),
        type: type,
        options: opts,
        answer: ansIndices,
        analysis: colAna !== -1 ? String(row[colAna] || '').trim() : '',
        streak: 0
      });
    }
  });

  if (allParsed.length === 0) throw new Error('未能解析出有效题目，请检查是否有"题目"和"答案"列，且选项不能少于2个');
  return allParsed;
}

/* ---------- 练习模式 ---------- */
window.startPractice = function(type) {
  const currentQuestions = window.getCurrentBankQuestions();
  
  if (type === 'wrong') {
    if (wrongBook.length === 0) return window.showToast('错题本为空，先去练习吧', true);
    practiceQuestions = [...wrongBook];
    isWrongPracticeMode = true;
  } else {
    if (currentQuestions.length === 0) return window.showToast('当前题库为空', true);
    if (type === 'all') {
      practiceQuestions = [...currentQuestions];
    } else {
      practiceQuestions = currentQuestions.filter(q => q.type === type);
    }
    isWrongPracticeMode = false;
  }
  
  if (practiceQuestions.length === 0) return window.showToast('该分类下暂无题目', true);
  
  practiceIndex = 0;
  practiceSelections = [];
  practiceQuestions.forEach(q => {
    q.isAnswered = false;
    if (q.streak === undefined) q.streak = 0;
  });
  currentMode = 'practice';
  window.render();
}

window.renderPractice = function() {
  if (practiceIndex >= practiceQuestions.length) {
    app.innerHTML = `
      <div class="card" style="text-align:center; padding:40px 15px;">
        <div style="font-size:4rem; margin-bottom:15px;">🎉</div>
        <h2 style="color:var(--secondary); margin-bottom:10px;">练习完成</h2>
        <p style="color:var(--text-sub); margin-bottom:24px;">${isWrongPracticeMode ? '本轮错题集训已结束，继续保持！' : '你已完成本轮所有题目练习。'}</p>
        <button class="btn btn-primary btn-block" onclick="currentMode='home';window.render()">返回首页</button>
      </div>`;
    return;
  }

  const q = practiceQuestions[practiceIndex];
  const selections = practiceSelections[practiceIndex] || [];
  const showAnswer = q.isAnswered || false;
  const isCorrect = showAnswer && selections.length === q.answer.length && selections.every(v => q.answer.includes(v));

  let optsHtml = q.options.map((opt, i) => {
    let cls = 'option-item';
    if (showAnswer) {
      cls += ' disabled';
      if (q.answer.includes(i)) cls += ' correct';
      else if (selections.includes(i)) cls += ' wrong';
    } else if (selections.includes(i)) {
      cls += ' selected';
    }
    return `
      <div class="${cls}" onclick="window.selectOptionPractice(${i})">
        <div class="opt-prefix">${String.fromCharCode(65+i)}</div>
        <div style="flex:1; line-height:1.4;">${opt}</div>
      </div>`;
  }).join('');

  const progress = (practiceIndex / practiceQuestions.length) * 100;
  const typeName = q.type === 'single' ? '单选题' : q.type === 'multiple' ? '多选题' : '判断题';

  let streakHtml = '';
  if (isWrongPracticeMode) {
    const currentStreak = q.streak || 0;
    streakHtml = `<span class="streak-badge ${currentStreak > 0 ? 'active' : ''}">🔥 连对: ${currentStreak}/5</span>`;
  }

  app.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <button class="btn btn-outline btn-sm" onclick="currentMode='home';window.render()">⬅ 退出</button>
      <span style="font-size:0.9rem; color:var(--text-sub); font-weight:600;">第 ${practiceIndex + 1} / ${practiceQuestions.length} 题</span>
    </div>
    
    <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div></div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <span class="tag">${typeName}</span>
        ${streakHtml}
      </div>
      <div class="question-text">${q.question}</div>
      <div>${optsHtml}</div>

      <div style="margin-top:20px; padding:16px; background:#f8fafc; border-radius:12px; border-left:4px solid ${showAnswer ? (isCorrect ? '#10b981' : '#ef4444') : 'var(--secondary)'}; display:${showAnswer ? 'block' : 'none'};">
        <div style="font-weight:bold; margin-bottom:8px; font-size:0.9rem; color:var(--text-main);">解析：</div>
        <div style="color:var(--text-sub); line-height:1.6; font-size:0.85rem;">${q.analysis || '暂无解析'}</div>
        <div style="margin-top:12px; font-weight:bold; font-size:0.9rem; color:var(--text-main);">正确答案：<span style="color:#10b981;">${q.answer.map(i => String.fromCharCode(65+i)).join(', ')}</span></div>
        ${isWrongPracticeMode && isCorrect ? `<div style="margin-top:8px; font-size:0.85rem; color:#10b981; font-weight:bold;">✅ 连对次数 +1，加油！</div>` : ''}
        ${isWrongPracticeMode && !isCorrect ? `<div style="margin-top:8px; font-size:0.85rem; color:#ef4444; font-weight:bold;">❌ 答错了，连对次数重置。</div>` : ''}
      </div>

      <div style="margin-top:24px; display:flex; gap:12px;">
        ${!showAnswer && q.type === 'multiple' ? 
          `<button class="btn btn-primary btn-block" onclick="window.confirmMultiPractice()" ${selections.length===0?'disabled':''}>确认答案</button>` : 
          (showAnswer ? `<button class="btn btn-primary btn-block" onclick="window.nextPractice()">${practiceIndex === practiceQuestions.length-1 ? '完成练习' : '下一题 →'}</button>` : '')
        }
      </div>
    </div>
  `;
}

window.selectOptionPractice = function(idx) {
  const q = practiceQuestions[practiceIndex];
  if (q.isAnswered) return;
  let selections = practiceSelections[practiceIndex] || [];
  
  if (q.type === 'multiple') {
    const pos = selections.indexOf(idx);
    if (pos > -1) selections.splice(pos, 1);
    else selections.push(idx);
    practiceSelections[practiceIndex] = selections;
    window.renderPractice();
  } else {
    practiceSelections[practiceIndex] = [idx];
    q.isAnswered = true;
    const isCorrect = q.answer.length === 1 && q.answer[0] === idx;
    window.handlePracticeResult(q, isCorrect);
    window.renderPractice();
    
    if (isCorrect) {
      if (!isWrongPracticeMode) {
        setTimeout(() => { window.nextPractice(); }, 600);
      }
    }
  }
}

window.confirmMultiPractice = function() {
  const q = practiceQuestions[practiceIndex];
  q.isAnswered = true;
  const selections = practiceSelections[practiceIndex] || [];
  const isCorrect = selections.length === q.answer.length && selections.every(v => q.answer.includes(v));
  
  window.handlePracticeResult(q, isCorrect);
  window.renderPractice();
}

window.handlePracticeResult = function(q, isCorrect) {
  if (isWrongPracticeMode) {
    if (isCorrect) {
      q.streak = (q.streak || 0) + 1;
      if (q.streak >= 5) {
        wrongBook = wrongBook.filter(item => item.id !== q.id);
        window.showToast('🎉 连对5次，已移出错题本！');
        if (wrongBook.length === 0) {
           practiceIndex = practiceQuestions.length; 
        }
      }
    } else {
      q.streak = 0;
    }
    window.saveData();
  } else {
    if (!isCorrect) {
      const exist = wrongBook.find(item => item.id === q.id);
      if (!exist) {
        wrongBook.push({ ...q, streak: 0 });
        window.saveData();
      }
    }
  }
}

window.nextPractice = function() {
  practiceIndex++;
  window.renderPractice();
}

        <div class="form-label">单选题 (共${counts.single}题)</div>
        <div style="display:flex; gap:8px; align-items:center; font-size:0.85rem;">
          抽 <input type="number" id="cfgSingle" class="form-input" value="${examConfig.single}" min="0" max="${counts.single}"> 题，
          每题 <input type="number" id="cfgScoreSingle" class="form-input" value="${examConfig.scoreSingle}" min="1"> 分
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">多选题 (共${counts.multiple}题)</div>
        <div style="display:flex; gap:8px; align-items:center; font-size:0.85rem;">
          抽 <input type="number" id="cfgMultiple" class="form-input" value="${examConfig.multiple}" min="0" max="${counts.multiple}"> 题，
          每题 <input type="number" id="cfgScoreMultiple" class="form-input" value="${examConfig.scoreMultiple}" min="1"> 分
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">判断题 (共${counts.judge}题)</div>
        <div style="display:flex; gap:8px; align-items:center; font-size:0.85rem;">
          抽 <input type="number" id="cfgJudge" class="form-input" value="${examConfig.judge}" min="0" max="${counts.judge}"> 题，
          每题 <input type="number" id="cfgScoreJudge" class="form-input" value="${examConfig.scoreJudge}" min="1"> 分
        </div>
      </div>
      <div class="form-row" style="border-bottom:none;">
        <div class="form-label">考试时长</div>
        <div style="display:flex; gap:8px; align-items:center; font-size:0.85rem;">
          <input type="number" id="cfgTimeLimit" class="form-input" value="${examConfig.timeLimit}" min="1"> 分钟
        </div>
      </div>
    </div>
    
    <button class="btn btn-primary btn-block" style="padding:16px; font-size:1rem; margin-top:10px;" onclick="window.startExam()">生成试卷并开始考试</button>
    <div class="footer-info">技术支持：秦十三郎</div>
  `;
}

window.startExam = function() {
  const currentQuestions = window.getCurrentBankQuestions();
  const sCount = parseInt(document.getElementById('cfgSingle').value) || 0;
  const mCount = parseInt(document.getElementById('cfgMultiple').value) || 0;
  const jCount = parseInt(document.getElementById('cfgJudge').value) || 0;
  const tLimit = parseInt(document.getElementById('cfgTimeLimit').value) || 60;
  
  if (sCount + mCount + jCount === 0) return window.showToast('请至少选择一道题', true);

  const shuffle = arr => arr.sort(() => Math.random() - 0.5);
  examQuestions = [
    ...shuffle([...currentQuestions.filter(q => q.type === 'single')]).slice(0, sCount),
    ...shuffle([...currentQuestions.filter(q => q.type === 'multiple')]).slice(0, mCount),
    ...shuffle([...currentQuestions.filter(q => q.type === 'judge')]).slice(0, jCount)
  ];

  examConfig = {
    single: sCount, multiple: mCount, judge: jCount,
    scoreSingle: parseInt(document.getElementById('cfgScoreSingle').value) || 1,
    scoreMultiple: parseInt(document.getElementById('cfgScoreMultiple').value) || 1,
    scoreJudge: parseInt(document.getElementById('cfgScoreJudge').value) || 1,
    timeLimit: tLimit
  };

  examIndex = 0;
  examSelections = examQuestions.map(() => []);
  examStartTime = Date.now();
  examRemainingSeconds = examConfig.timeLimit * 60;
  
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(() => {
    examRemainingSeconds--;
    if (examRemainingSeconds <= 0) {
      clearInterval(examTimer);
      examTimer = null;
      window.showToast('考试时间到，自动交卷！', true);
      window.submitExam();
    } else {
      const timerEl = document.getElementById('examTimerDisplay');
      if (timerEl) {
        const m = Math.floor(examRemainingSeconds / 60);
        const s = examRemainingSeconds % 60;
        timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (examRemainingSeconds < 60) timerEl.classList.add('timer-warning');
        else timerEl.classList.remove('timer-warning');
      }
    }
  }, 1000);

  currentMode = 'exam';
  window.render();
}

/* ---------- 考试答题 ---------- */
window.renderExam = function() {
  if (examIndex >= examQuestions.length) return window.submitExam();

  const q = examQuestions[examIndex];
  const selections = examSelections[examIndex] || [];
  
  let optsHtml = q.options.map((opt, i) => {
    const isSel = selections.includes(i);
    return `
      <div class="option-item ${isSel ? 'selected' : ''}" onclick="window.selectOptionExam(${i})">
        <div class="opt-prefix">${String.fromCharCode(65+i)}</div>
        <div style="flex:1; line-height:1.4;">${opt}</div>
      </div>`;
  }).join('');

  const progress = (examIndex / examQuestions.length) * 100;
  const typeName = q.type === 'single' ? '单选题' : q.type === 'multiple' ? '多选题' : '判断题';
  let scorePer = q.type === 'single' ? examConfig.scoreSingle : q.type === 'multiple' ? examConfig.scoreMultiple : examConfig.scoreJudge;
  
  const m = Math.floor(examRemainingSeconds / 60);
  const s = examRemainingSeconds % 60;
  const timerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

  app.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div style="display:flex; gap:8px;">
        <button class="btn btn-danger btn-sm" onclick="if(confirm('确定交卷吗？'))window.submitExam()">交卷</button>
        <button class="btn btn-outline btn-sm" onclick="if(confirm('确定要退出考试吗？本次成绩将不保存。')){clearInterval(examTimer);examTimer=null;currentMode='home';window.render()}">退出</button>
      </div>
      <div style="display:flex; gap:12px; align-items:center;">
        <span id="examTimerDisplay" class="${examRemainingSeconds < 60 ? 'timer-warning' : ''}" style="font-family:monospace; font-size:1.1rem; font-weight:bold; color:var(--secondary);">${timerText}</span>
        <span class="tag error" style="margin-left:8px;">${scorePer}分</span>
        <span style="font-size:0.85rem; color:var(--text-sub); font-weight:600;">${examIndex + 1} / ${examQuestions.length}</span>
      </div>
    </div>
    
    <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div></div>

    <div class="card">
      <div style="margin-bottom:16px;"><span class="tag">${typeName}</span></div>
      <div class="question-text">${q.question}</div>
      <div>${optsHtml}</div>

      <div style="margin-top:24px; display:flex; gap:12px;">
        <button class="btn btn-outline" onclick="window.prevExam()" ${examIndex===0?'disabled':''} style="flex:1;">⬅ 上一题</button>
        <button class="btn btn-primary" onclick="window.nextExam()" style="flex:1;">${examIndex === examQuestions.length - 1 ? '交卷' : '下一题 →'}</button>
      </div>
    </div>
    <div class="footer-info">技术支持：秦十三郎</div>
  `;
}

window.selectOptionExam = function(idx) {
  const q = examQuestions[examIndex];
  let selections = examSelections[examIndex] || [];
  if (q.type === 'multiple') {
    const pos = selections.indexOf(idx);
    if (pos > -1) selections.splice(pos, 1);
    else selections.push(idx);
  } else {
    selections = [idx];
  }
  examSelections[examIndex] = selections;
  window.renderExam();
}

window.nextExam = function() {
  if (examIndex === examQuestions.length - 1) {
    if (confirm('确定要交卷吗？')) window.submitExam();
  } else {
    examIndex++;
    window.renderExam();
  }
}

window.prevExam = function() {
  if (examIndex > 0) { examIndex--; window.renderExam(); }
}

/* ---------- 考试成绩 ---------- */
window.submitExam = function() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  
  const usedSeconds = Math.floor((Date.now() - examStartTime) / 1000);
  const usedM = Math.floor(usedSeconds / 60);
  const usedS = usedSeconds % 60;
  const usedTimeStr = `${usedM}分${usedS}秒`;

  let gotScore = 0;
  let totalScore = 0;

  examQuestions.forEach((q, idx) => {
    const s = q.type === 'single' ? examConfig.scoreSingle : q.type === 'multiple' ? examConfig.scoreMultiple : examConfig.scoreJudge;
    totalScore += s;
    
    const sel = (examSelections[idx] || []).sort();
    const ans = q.answer.sort();
    const isCorrect = sel.length === ans.length && sel.every(v => ans.includes(v));
    
    if (isCorrect) gotScore += s;
    else {
      const exist = wrongBook.find(item => item.id === q.id);
      if (!exist) {
        wrongBook.push({ ...q, streak: 0 });
        window.saveData();
      }
    }
  });

  examScore = { got: gotScore, total: totalScore, usedTime: usedTimeStr };
  currentMode = 'result';
  window.render();
}

window.renderResult = function() {
  const isFull = examScore.got === examScore.total;
  const message = isFull ? '你真棒，继续加油！' : '不要气馁，再去多刷刷题，满分等着你！';

  app.innerHTML = `
    <div class="card" style="text-align:center; padding:40px 20px;">
      <h2 style="color:var(--text-main); margin-bottom:30px; font-size:1.2rem; font-weight:800;">📊 考试成绩</h2>
      
      <div class="teacher-score">${examScore.got}</div>
      <div style="font-size:1.1rem; color:var(--text-sub); margin-bottom:30px; font-weight:600;">总分：${examScore.total} 分</div>
      
      <div style="font-size:1.1rem; font-weight:bold; color:var(--secondary); margin-bottom:30px; padding:16px; background:#eff6ff; border-radius:12px; border:1px solid #bfdbfe;">${message}</div>
      
      <div style="color:var(--text-sub); font-size:0.9rem; margin-bottom:30px; font-weight:500;">
        本次用时：${examScore.usedTime}
      </div>
      
      <div style="display:flex; gap:12px; justify-content:center;">
        <button class="btn btn-primary" onclick="currentMode='home';window.render()">返回首页</button>
        <button class="btn btn-outline" onclick="currentMode='review';window.render()">查看错题</button>
      </div>
    </div>
    <div class="footer-info">技术支持：秦十三郎</div>
  `;
}

/* ================= 启动 ================= */
window.loadData();
window.render();
</script>
</body>
</html>
