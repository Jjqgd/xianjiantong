

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>铁途学练</title>
<link rel="icon" href="logo.png">
<script src="xlsx.full.min.js"></script>
<style>
  @font-face { font-family: 'MaoTi'; src: url('font.ttf') format('truetype'); font-weight: bold; font-style: normal; font-display: swap; }
  :root { --bg-color: #f0f4f8; --card-bg: #ffffff; --text-main: #1e293b; --text-sub: #64748b; --border-color: #e2e8f0; --input-bg: #f8fafc; }
  body.dark-mode { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-sub: #94a3b8; --border-color: #334155; --input-bg: #0f172a; }
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s; }

  /* 开屏动画 */
  #splash-screen { position: fixed; top:0; left:0; right:0; bottom:0; background: #fcf9f2; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s; }
  #splash-screen.hidden { opacity: 0; pointer-events: none; }
  .splash-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .calligraphy-group { display: flex; gap: 40px; position: absolute; transition: opacity 0.8s ease; align-items: center; justify-content: center; }
  .calligraphy-group.fade-out { opacity: 0; pointer-events: none; }
  .calligraphy-col { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 3.5rem; font-weight: bold; writing-mode: vertical-rl; color: #b71c1c; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); opacity: 0; transform: scale(1.1); animation: inkReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .col-1 { margin-top: 60px; } .col-2 { margin-bottom: 60px; animation-delay: 0.5s; }
  .second-splash { display: none; position: absolute; opacity: 0; width: 100%; height: 100%; }
  .second-splash.show { display: block; opacity: 1; }
  .main-text-group { display: flex; align-items: flex-start; justify-content: center; gap: 15px; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); }
  .second-col { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-weight: bold; writing-mode: vertical-rl; color: #b71c1c; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); animation: inkReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
  .second-col.s-col-1 { font-size: 3.2rem; margin-top: 30px; }
  .second-col.s-col-2 { font-size: 3.6rem; animation-delay: 0.5s; }
  .signature { font-family: 'MaoTi', 'STXingkai', cursive; font-size: 1.2rem; color: #b71c1c; writing-mode: vertical-rl; opacity: 0; animation: inkReveal 1.5s 1s forwards; margin-top: 150px; margin-left: 5px; }
  @keyframes inkReveal { 0% { opacity: 0; filter: blur(10px); transform: scale(1.1); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }

  /* 基础样式 */
  .nav { background: var(--card-bg); padding: 10px 15px; border-bottom: 2px solid #b71c1c; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; margin-bottom: 10px; }
  .nav-logo { font-size: 1.2rem; font-weight: bold; color: #b71c1c; display: flex; align-items: center; gap: 8px; }
  .nav-logo img { width: 30px; height: 30px; object-fit: contain; }
  .nav-right { font-size: 0.8rem; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; overflow: visible; }
  .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; border-left: 4px solid #b71c1c; padding-left: 8px; }
  .banner { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; line-height: 1.5; }

  .bank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; }
  .bank-item.active { border-color: #0d47a1; background: rgba(13,71,161,0.1); }
  .bank-title { font-weight: bold; font-size: 0.95rem; }
  .bank-meta { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
  .stat-item { flex: 1; min-width: 60px; background: var(--input-bg); padding: 10px; border-radius: 8px; text-align: center; }
  .stat-num { font-size: 1.2rem; font-weight: bold; color: #0d47a1; }
  .stat-label { font-size: 0.75rem; color: var(--text-sub); }

  /* 圆饼图 */
  .pie-chart-container { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  .pie-chart { width: 70px; height: 70px; border-radius: 50%; background: conic-gradient(#10b981 0%, #10b981 var(--percentage), var(--border-color) var(--percentage), var(--border-color) 100%); display: flex; align-items: center; justify-content: center; position: relative; }
  .pie-chart::after { content: ''; position: absolute; width: 50px; height: 50px; background: var(--card-bg); border-radius: 50%; }
  .pie-chart-text { position: absolute; z-index: 1; font-weight: bold; color: var(--text-main); font-size: 1rem; }
  .pie-info { flex: 1; padding-left: 20px; text-align: left; }
  .pie-info div { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
  .pie-info span { font-size: 1.1rem; font-weight: bold; color: #0d47a1; }

  .menu { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .menu-btn { flex: 1; min-width: 30%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px 2px; text-align: center; font-weight: bold; font-size: 0.82rem; cursor: pointer; color: var(--text-main); white-space: nowrap; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
  .menu-btn:active { background: var(--input-bg); }
  .sub-menu { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .sub-menu .btn { flex: 1; min-width: 18%; padding: 8px 0; font-size: 0.85rem; border-radius: 6px; }

  .btn { border: none; border-radius: 8px; padding: 12px 15px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; white-space: nowrap; }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: #0d47a1; color: #fff; }
  .btn-danger { background: #b71c1c; color: #fff; }
  .btn-outline { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); }
  .btn-block { width: 100%; margin-top: 10px; }
  .btn-green { background: #10b981; color: #fff; }
  .btn-small { padding: 6px 10px; font-size: 0.8rem; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 10px 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .timer { font-family: monospace; font-size: 1.1rem; font-weight: bold; color: #ef4444; }
  .q-progress { font-size: 0.85rem; color: var(--text-sub); font-weight: bold; }

  .sheet-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 999; display: flex; align-items: flex-end; transition: opacity 0.2s; }
  .sheet-content { background: var(--bg-color); width: 100%; max-height: 75vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
  .sheet-mask.show .sheet-content { transform: translateY(0); }
  .sheet-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  
  .acc-group { margin-bottom: 12px; background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
  .acc-header { padding: 12px 15px; background: var(--input-bg); font-weight: bold; font-size: 0.95rem; color: #0d47a1; display: flex; justify-content: space-between; cursor: pointer; }
  .acc-header span { font-size: 0.8rem; color: var(--text-sub); font-weight: normal; }
  .acc-body { padding: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; border-top: 1px solid var(--border-color); }
  .acc-body.hidden { display: none; }
  .num-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--input-bg); border-radius: 6px; font-weight: bold; color: var(--text-main); border: 1px solid var(--border-color); cursor: pointer; }
  .num-btn.done { background: #0d47a1; color: #fff; border-color: #0d47a1; }
  .num-btn.wrong { background: #ef4444; color: #fff; border-color: #ef4444; }

  .tag { display: inline-block; padding: 2px 8px; background: #0d47a1; color: #fff; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
  .q-text { font-size: 1.05rem; font-weight: bold; line-height: 1.5; margin-bottom: 15px; position: relative; padding-right: 65px; }
  
  /* 主观题答案区 */
  .subjective-answer { background: var(--input-bg); border: 2px solid #10b981; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
  .subjective-answer .sa-title { font-weight: bold; color: #10b981; margin-bottom: 8px; font-size: 0.9rem; }
  .subjective-answer .sa-content { line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; color: var(--text-main); }

  .opt { border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; position: relative; background: var(--card-bg); }
  .opt:hover:not(.disabled) { border-color: #94a3b8; }
  .opt.selected { border-color: #0d47a1; background: rgba(13,71,161,0.1); }
  .opt.correct { border-color: #10b981; background: rgba(16,185,129,0.1); }
  .opt.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }
  .opt.disabled { cursor: not-allowed; }
  .opt-prefix { width: 22px; height: 22px; border-radius: 50%; background: var(--input-bg); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; color: var(--text-sub); }
  .opt.selected .opt-prefix { background: #0d47a1; color: #fff; border-color: #0d47a1; }
  .opt.correct .opt-prefix { background: #10b981; color: #fff; border-color: #10b981; }
  .opt.wrong .opt-prefix { background: #ef4444; color: #fff; border-color: #ef4444; }

  .analysis { padding: 12px; background: var(--input-bg); border-radius: 8px; margin-top: 15px; font-size: 0.85rem; border-left: 4px solid #0d47a1; line-height: 1.5; color: var(--text-sub); display: none; }
  .analysis.show { display: block; }
  .analysis.error { border-left-color: #ef4444; }
  .analysis.success { border-left-color: #10b981; }

  .exam-review-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 0.85rem; line-height: 1.5; background: var(--input-bg); }
  .exam-review-box.err { border-left: 4px solid #ef4444; }
  .exam-review-box.ok { border-left: 4px solid #10b981; }

  /* 单选组样式 */
  .radio-group { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .radio-item { flex: 1; min-width: 30%; padding: 8px; text-align: center; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; cursor: pointer; background: var(--card-bg); }
  .radio-item.active { background: #0d47a1; color: #fff; border-color: #0d47a1; }

  /* 毛体分数 */
  .score-box { text-align: center; padding: 30px 0; }
  .score-num { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; color: #d32f2f; font-size: 6rem; font-weight: bold; display: inline-block; border-bottom: 4px double #d32f2f; line-height: 1; margin-bottom: 15px; padding: 0 10px; }
  .bottom-actions { display: flex; gap: 10px; margin-top: 20px; }
  .bottom-actions .btn { flex: 1; }
  
  .maoti-result { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 2.2rem; color: #0d47a1; text-align: center; margin: 20px 0; line-height: 1.4; }
  .maoti-result.full { color: #b71c1c; }
  .maoti-fail { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 2rem; color: #d32f2f; text-align: center; line-height: 1.5; }
  
  .toast { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 9999; display: none; }
  
  .app-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .app-box { background: var(--card-bg); padding: 25px; border-radius: 16px; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .app-box h3 { font-size: 1.2rem; color: #b71c1c; margin-bottom: 10px; font-weight: bold; }
  .app-box p { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.5; }
  .app-box .actions { display: flex; gap: 10px; }
  .app-box .btn { flex: 1; padding: 10px; font-size: 0.95rem; border-radius: 8px; }
  
  .footer { text-align: center; color: var(--text-sub); font-size: 0.8rem; margin-top: 20px; padding-bottom: 20px; }

  .search-tip { text-align: center; font-size: 0.75rem; color: #64748b; line-height: 1.5; margin: 2px 4px 14px; padding: 7px 10px; background: var(--input-bg); border: 1px dashed var(--border-color); border-radius: 8px; }
  .search-mask { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .search-box { background: var(--card-bg); border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
  .search-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
  .search-header h3 { font-size: 1.1rem; color: #0d47a1; margin: 0; }
  .search-input-group { padding: 15px; background: var(--input-bg); }
  .search-input-group input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; background: var(--card-bg); color: var(--text-main); }
  .search-input-group input:focus { border-color: #0d47a1; }
  .search-filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .search-filters button { flex: 1; min-width: 15%; padding: 6px; font-size: 0.85rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); cursor: pointer; }
  .search-filters button.active { background: #0d47a1; color: #fff; border-color: #0d47a1; }
  .search-results { flex: 1; overflow-y: auto; padding: 15px; }
  .search-item { border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px; background: var(--card-bg); cursor: pointer; }
  .search-item:active { background: var(--input-bg); }
  .search-item .s-title { font-weight: bold; font-size: 0.95rem; color: var(--text-main); margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .search-item .s-type { font-size: 0.75rem; color: var(--text-sub); }

  .feedback-badge { position: absolute; top: -30px; right: -35px; width: 90px; height: 90px; pointer-events: none; z-index: 40; opacity: 0; transform: rotate(-10deg) scale(0); animation: stampIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; align-items: center; justify-content: center; }
  .feedback-badge::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 42 8 C 15 12, 2 35, 8 60 C 12 85, 35 96, 60 92 C 82 88, 94 70, 90 45 C 88 28, 78 15, 62 10 C 50 6, 40 12, 35 25' fill='none' stroke='%23d32f2f' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' opacity='0.9' /%3E%3C/svg%3E"); background-size: contain; background-repeat: no-repeat; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
  .feedback-text { font-family: 'MaoTi', 'STXingkai', 'KaiTi', cursive; font-size: 3rem; font-weight: bold; color: #d32f2f; transform: rotate(-10deg); margin-top: -6px; margin-left: -4px; }
  @keyframes stampIn { 0% { transform: rotate(-30deg) scale(0); opacity: 0; } 80% { transform: rotate(-8deg) scale(1.1); opacity: 1; } 100% { transform: rotate(-10deg) scale(1); opacity: 1; } }
  
  #fireworks-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }

  /* ========== 新增：折叠面板 ========== */
  .fold-panel { margin-bottom: 12px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
  .fold-header {
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.95rem;
    color: var(--text-main);
    background: var(--input-bg);
  }
  .fold-header .fold-icon {
    transition: transform 0.25s;
    font-size: 0.8rem;
    color: var(--text-sub);
  }
  .fold-header.collapsed .fold-icon {
    transform: rotate(-90deg);
  }
  .panel-content {
    overflow: hidden;
    max-height: 600px;
    transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1), padding 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 10px 12px;
  }
  .panel-content.collapsed {
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
  }
  .rename-btn {
    padding: 3px 8px;
    font-size: 0.75rem;
    margin-right: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-main);
    border-radius: 4px;
    cursor: pointer;
  }
  .bank-fold-content {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .bank-fold-content .btn {
    padding: 6px 12px;
    font-size: 0.8rem;
  }

  /* ========== 新增：字号调节 ========== */
  .font-ctrl {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .font-ctrl button {
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 0.85rem;
    line-height: 1;
  }
  .q-text, .opt, .analysis, .subjective-answer {
    font-size: var(--q-font-size, 1rem);
  }
  .opt .opt-prefix {
    font-size: calc(var(--q-font-size, 1rem) * 0.8);
  }
  .fav-star { float:right; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-sub); border-radius:6px; padding:3px 8px; font-size:0.75rem; cursor:pointer; white-space:nowrap; }
  .fav-star.on { background:#fff7e6; color:#b45309; border-color:#fcd34d; }
  .fav-star:active { opacity:0.8; }
  body.dark-mode .fav-star.on { background:#3a2f0e; color:#fbbf24; border-color:#78350f; }
  body.dark-mode .tip-warn { background:#3a3413 !important; color:#fde68a !important; }
  body.dark-mode .tip-ok { background:#0f2f22 !important; color:#6ee7b7 !important; }
  body.dark-mode .tip-danger { background:#2a1416 !important; color:#fca5a5 !important; border-color:#7f1d1d !important; }
  body.dark-mode .stat-wrong { background:#2a1416 !important; }
  body.dark-mode .banner { background:#0c2a3a !important; color:#7dd3fc !important; }
</style>
</head>
<body>

<div id="splash-screen">
  <div class="splash-container">
    <div class="calligraphy-group" id="group-normal">
      <div class="calligraphy-col col-1">铁道征途</div>
      <div class="calligraphy-col col-2">勤学练兵</div>
    </div>
    <div class="second-splash" id="group-second">
      <div class="main-text-group">
        <div class="second-col s-col-1" id="second-text-1"></div>
        <div class="second-col s-col-2" id="second-text-2"></div>
        <div class="signature" id="second-sign"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav">
  <div class="nav-logo">
    <img src="logo.png" onerror="this.style.display='none'"> 铁途学练
  </div>
  <div class="nav-right" onclick="toggleDarkMode()" id="themeToggle">🌙 夜间</div>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ================= 夜间模式（支持系统自动跟随） =================
var manualThemeSet = false;

function toggleDarkMode() {
  manualThemeSet = true;
  var isDark = document.body.classList.contains('dark-mode');
  if (isDark) { 
    document.body.classList.remove('dark-mode'); 
    localStorage.setItem('xjt_dark_mode', 'false'); 
    document.getElementById('themeToggle').innerHTML = '🌙 夜间'; 
  } else { 
    document.body.classList.add('dark-mode'); 
    localStorage.setItem('xjt_dark_mode', 'true'); 
    document.getElementById('themeToggle').innerHTML = '☀️ 白天'; 
  }
}

function initDarkMode() {

      if (rec.fp !== authFp && rec.fpl !== authFpLoose) { authLock('device'); return; }
      if (rec.maxSeen && now < rec.maxSeen - 5 * 60000) { authLock('clock'); return; }   /* 时钟回拨 */
      rec.maxSeen = now; authSaveAll(rec);
      if (rec.act) { if (rec.exp <= now) { authLock('expired'); return; } authOk('activated', rec.exp); }
      else { if (rec.exp <= now) { authLock('trial'); return; } authOk('trial', rec.exp); }
    });
  });
}
function authRetry() {
  if (currentMode === 'login') { appContainer.innerHTML = '<div class="card" style="text-align:center;padding:40px 15px;">正在重新联网校验授权…</div>'; }

}
function authHeartbeat() {
  netTime().then(function (now) {
    if (now == null) { if (isAuthorized) authLock('offline'); return; }
    if (!isAuthorized) return;
    if (authExpire < AUTH_PERM && authExpire <= now) { authLock('expired'); return; }
    authReadAll().then(function (res) {
      if (res.tamper) { authLock('tamper'); return; }
      if (res.rec) { res.rec.maxSeen = now; authSaveAll(res.rec); }
    });
  });
}

  currentMode = 'login'; render();

function openStudyStats() { if (!guardGate()) return; currentMode = 'stats'; render(); }
function renderStudyStats() {
  var totalDone = 0, totalCorrect = 0;
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.indexOf('xjt_stats_') === 0) {
      var s = JSON.parse(localStorage.getItem(key) || '{"done":0,"correct":0}');
      totalDone += (s.done || 0); totalCorrect += (s.correct || 0);
    }
  }
  var totalAcc = totalDone > 0 ? Math.round(totalCorrect / totalDone * 100) : 0;
  var days = [];
  for (var d = 6; d >= 0; d--) {
    var dt = new Date(); dt.setDate(dt.getDate() - d);
    var label = (dt.getMonth() + 1) + '/' + dt.getDate();
    var st = JSON.parse(localStorage.getItem('xjt_stats_' + dt.toLocaleDateString()) || '{"done":0,"correct":0}');
    days.push({ label: label, done: st.done || 0, correct: st.correct || 0 });
  }
  var maxDone = 1; for (var m = 0; m < days.length; m++) { if (days[m].done > maxDone) maxDone = days[m].done; }
  var bars = '';
  for (var k = 0; k < days.length; k++) {
    var day = days[k]; var h = Math.round(day.done / maxDone * 70);
    var acc = day.done > 0 ? Math.round(day.correct / day.done * 100) : 0;
    bars += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:110px;">
      <div style="font-size:0.68rem;color:var(--text-main);font-weight:bold;margin-bottom:3px;">${day.done}</div>
      <div style="width:58%;background:${day.done===0 ? 'var(--border-color)' : 'linear-gradient(180deg,#0d47a1,#1e88e5)'};border-radius:4px 4px 0 0;height:${Math.max(3,h)}px;"></div>
      <div style="font-size:0.65rem;color:var(--text-sub);margin-top:4px;">${day.label}</div>
      <div style="font-size:0.62rem;color:#10b981;font-weight:bold;">${acc}%</div>
    </div>`;
  }
  var html = `<div style="margin-bottom:12px;"><button class="btn btn-outline" onclick="currentMode='home';render()">⬅ 返回</button></div>`;
  html += `<div class="card"><div class="title">📈 学习数据总览</div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">${totalDone}</div><div class="stat-label">累计做题</div></div>
      <div class="stat-item"><div class="stat-num" style="color:#10b981;">${totalCorrect}</div><div class="stat-label">累计正确</div></div>
      <div class="stat-item"><div class="stat-num" style="color:#b71c1c;">${totalAcc}%</div><div class="stat-label">累计正确率</div></div>
    </div></div>`;
  html += `<div class="card"><div class="title">近 7 天做题趋势</div>
    <div style="display:flex;gap:6px;align-items:flex-end;">${bars}</div>
    <div style="font-size:0.75rem;color:var(--text-sub);margin-top:12px;line-height:1.5;">柱高 = 当日做题数；柱顶数字 = 做题量；柱底百分比 = 当日正确率。数据每天 0 点起独立统计。</div></div>`;
  html += `<div class="card"><div class="title">💡 数据说明</div><div style="font-size:0.82rem;color:var(--text-sub);line-height:1.7;">累计数据来自每日统计的自动汇总，无需手动记录。错题会同步计入「累计正确率」，坚持练习即可看到正确率稳步上升。</div></div>`;
  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;
}

// ===== 搜题 =====
function openSearch() {
  searchKeyword = ''; searchType = 'all'; var mask = document.createElement('div'); mask.className = 'search-mask'; mask.id = 'searchModal';
  mask.innerHTML = `<div class="search-box"><div class="search-header"><h3>🔍 题库搜索</h3><button class="btn btn-outline" style="padding:4px 10px; font-size:0.85rem;" onclick="document.body.removeChild(document.getElementById('searchModal'))">关闭</button></div><div class="search-input-group"><input type="text" id="searchInput" placeholder="输入题目关键字..." oninput="doSearch()"><div class="search-filters"><button class="${searchType === 'all' ? 'active' : ''}" onclick="setSearchType('all')">全部</button><button class="${searchType === 'single' ? 'active' : ''}" onclick="setSearchType('single')">单选</button><button class="${searchType === 'multiple' ? 'active' : ''}" onclick="setSearchType('multiple')">多选</button><button class="${searchType === 'judge' ? 'active' : ''}" onclick="setSearchType('judge')">判断</button><button class="${searchType === 'fill' ? 'active' : ''}" onclick="setSearchType('fill')">填空</button><button class="${searchType === 'short' ? 'active' : ''}" onclick="setSearchType('short')">简答</button><button class="${searchType === 'essay' ? 'active' : ''}" onclick="setSearchType('essay')">论述</button></div></div><div class="search-results" id="searchResults"><div style="text-align:center; color:#94a3b8; margin-top:20px;">请输入关键字开始搜索...</div></div></div>`;
  document.body.appendChild(mask); setTimeout(function(){ document.getElementById('searchInput').focus(); }, 100);
}
function setSearchType(type) {
  searchType = type; var btns = document.querySelectorAll('.search-filters button'); btns.forEach(function(btn) { btn.classList.remove('active'); });
  var typeMap = { all:0, single:1, multiple:2, judge:3, fill:4, short:5, essay:6 };
  if (typeMap[type] !== undefined) btns[typeMap[type]].classList.add('active');
  doSearch();
}
function doSearch() {
  var keyword = document.getElementById('searchInput').value.trim(); var resDiv = document.getElementById('searchResults');
  if (!keyword) { resDiv.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:20px;">请输入关键字开始搜索...</div>'; return; }
  var results = []; for (var i = 0; i < practiceQuestions.length; i++) { var q = practiceQuestions[i]; if (searchType !== 'all' && q.type !== searchType) continue; if (q.question.indexOf(keyword) > -1) { results.push({ q: q, idx: i }); } }
  if (results.length === 0) { resDiv.innerHTML = '<div style="text-align:center; color:#ef4444; margin-top:20px;">没有找到相关题目...</div>'; return; }
  var html = ''; for (var j = 0; j < results.length; j++) { var r = results[j]; var tName = TYPE_NAMES[r.q.type] || '未知'; html += `<div class="search-item" onclick="jumpToSearchResult(${r.idx})"><div class="s-title">${r.q.question}</div><div class="s-type">题型：${tName}</div></div>`; }
  resDiv.innerHTML = html;
}
function jumpToSearchResult(idx) { practiceIndex = idx; savePracticeProgress(); document.body.removeChild(document.getElementById('searchModal')); renderRecite(); }

function buildSheetHtml(questions, currentIdx, selections, type) {
  var groups = { single: [], multiple: [], judge: [], fill: [], short: [], essay: [] };
  for (var k = 0; k < questions.length; k++) {
    if (groups[questions[k].type]) groups[questions[k].type].push({ idx: k, q: questions[k] });
  }
  var html = '';
  var types = ['single', 'multiple', 'judge', 'fill', 'short', 'essay'];
  var jumpFn = 'jumpPractice';
  if (type === 'exam') jumpFn = 'jumpExam';
  else if (type === 'examReview') jumpFn = 'jumpExamReview';
  else if (type === 'recite') jumpFn = 'jumpRecite';

  for (var t = 0; t < types.length; t++) {
    var tp = types[t]; var items = groups[tp]; if (items.length === 0) continue;
    html += `<div class="acc-group"><div class="acc-header" onclick="this.nextElementSibling.classList.toggle('hidden')"><span style="font-size:1.1rem;">${TYPE_NAMES[tp]}</span><span>共 ${items.length} 题</span></div><div class="acc-body">`;
    for (var i = 0; i < items.length; i++) {
      var item = items[i]; var isDone = false;
      if (type === 'practice' || type === 'recite') isDone = item.q.isAnswered;
      else if (type === 'exam' || type === 'examReview') isDone = (selections[item.idx] && selections[item.idx].length > 0) || isSubjective(item.q.type);
      var isWrong = false;
      if (type === 'examReview' && !isSubjective(item.q.type)) {
        var s = selections[item.idx] || [];
        isWrong = s.length > 0 && !(s.length === item.q.answer.length && s.every(function(v){ return item.q.answer.indexOf(v) > -1; }));
      }
      var cls = 'num-btn'; if (isWrong) cls += ' wrong'; else if (isDone) cls += ' done';
      html += `<div class="${cls}" onclick="${jumpFn}(${item.idx})">${item.idx+1}</div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function startPractice(type) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  if (type === 'wrong') {
    if (wrongBook.length === 0) return showToast('错题本为空', true);
    practiceQuestions = wrongBook.slice(); isWrongPracticeMode = true;
  } else if (type === 'fav') {
    if (favorites.length === 0) return showToast('收藏夹为空', true);
    practiceQuestions = qs.filter(function(q){ return favorites.indexOf(q.id) > -1; }); isWrongPracticeMode = false;
  } else {
    if (qs.length === 0) return showToast('题库为空', true);
    if (type === 'all') practiceQuestions = qs.slice();
    else if (type === 'random') { practiceQuestions = qs.slice().sort(function(){ return 0.5 - Math.random(); }); showToast('已为您打乱顺序'); }
    else practiceQuestions = qs.filter(function(q){ return q.type === type; });
    isWrongPracticeMode = false;
  }
  if (practiceQuestions.length === 0) return showToast('该分类下暂无题目', true);
  practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) {
    practiceQuestions[i].isAnswered = isSubjective(practiceQuestions[i].type);
    if (practiceQuestions[i].streak === undefined) practiceQuestions[i].streak = 0;
  }
  currentMode = 'practice'; savePracticeProgress(); render();
}

function startRecite(type) {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : []; if (qs.length === 0) return showToast('题库为空', true);
  reciteJudgeFilter = 'all';
  var allQs = type === 'all' ? qs.slice() : qs.filter(function(q){ return q.type === type; });
  if (allQs.length === 0) return showToast('该分类下暂无题目', true);
  practiceQuestions = allQs; practiceIndex = 0; practiceSelections = [];
  for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = true; }
  isWrongPracticeMode = false; currentMode = 'recite'; savePracticeProgress(); render();
}

function changeReciteFilter(filterType) {
  reciteJudgeFilter = filterType; var qs = activeBankId ? allBanks[activeBankId].questions : []; var baseQs = qs.filter(function(q){ return q.type === 'judge'; });
  if (filterType === 'true') { practiceQuestions = baseQs.filter(function(q){ return q.answer.indexOf(0) > -1; }); }
  else if (filterType === 'false') { practiceQuestions = baseQs.filter(function(q){ return q.answer.indexOf(1) > -1; }); }
  else { practiceQuestions = baseQs; }
  if (practiceQuestions.length === 0) { showToast('该过滤条件下暂无题目', true); practiceQuestions = baseQs; }
  else { practiceIndex = 0; practiceSelections = []; for (var i = 0; i < practiceQuestions.length; i++) { practiceQuestions[i].isAnswered = true; } render(); }
}

function buildQuestionHtml(q, sels, showAns, isReciteJudge) {
  if (q.type === 'judge' && (!q.options || q.options.length === 0)) {
    q.options = ['正确', '错误'];
  }

  if (isSubjective(q.type)) {
    var ansText = typeof q.answer === 'string' ? q.answer : (Array.isArray(q.answer) ? q.answer.join('；') : '');
    if (!showAns) return `<div class="subjective-answer" style="border-color:var(--border-color);"><div class="sa-title" style="color:var(--text-sub);">📝 本题为主观题，请自行作答</div></div>`;
    return `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansText}</div></div>`;
  }
  var optsHtml = '';
  for (var i = 0; i < q.options.length; i++) {
    var cls = 'opt';
    if (showAns) {
      if (q.answer.indexOf(i) > -1) cls += ' correct';
      else if (sels && sels.indexOf(i) > -1) cls += ' wrong';
    } else if (sels && sels.indexOf(i) > -1) { cls += ' selected'; }
    var clickAction = isReciteJudge ? `onclick="toggleReciteJudge(${i})"` : `onclick="selectPractice(${i})"`;
    optsHtml += `<div class="${cls}" ${clickAction}><div class="opt-prefix">${String.fromCharCode(65+i)}</div><div>${q.options[i]}</div></div>`;
  }
  return optsHtml;
}

function buildAnalysisHtml(q, sels, showAns) {
  if (!showAns) return '';
  var isCorrect = true;
  if (!isSubjective(q.type)) {
    isCorrect = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
  }
  var ansDisplay = isSubjective(q.type)
    ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；'))
    : q.answer.map(function(i){ return String.fromCharCode(65+i); }).join(', ');
  return `<div class="analysis show ${isCorrect ? 'success' : 'error'}"><div style="font-weight:bold;margin-bottom:5px;">正确答案：<span style="color:#10b981;">${ansDisplay}</span></div>${q.analysis ? `<div style="margin-top:8px; font-weight:bold; color:#0d47a1;">解析：</div><div style="color:var(--text-main); margin-top:4px;">${q.analysis}</div>` : ''}</div>`;
}

    <div class="toolbar">

        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem;" onclick="confirmExitPractice()">⬅ 退出</button>
        <div class="q-progress">${practiceIndex+1} / ${practiceQuestions.length}</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="font-ctrl">
          <button class="btn btn-outline btn-small" onclick="changeFontSize(-1)">A-</button>

      <span class="tag">${typeName}</span>${streakHtml}<button class="fav-star ${favorites.indexOf(q.id)>-1?'on':''}" style="float:right" onclick="toggleFavorite('${q.id}')">${favorites.indexOf(q.id)>-1?'⭐ 已收藏':'☆ 收藏'}</button>
      <div class="q-text">${q.question}${feedbackAnim}</div>
      ${optsHtml}
      ${buildAnalysisHtml(q, sels, showAns)}
      <div class="bottom-actions">
        <button class="btn btn-outline" onclick="prevPractice()" ${practiceIndex===0?'disabled style="opacity:0.5"':''}>⬅ 上一题</button>
        ${multiConfirmBtn}
        <button class="btn btn-primary" onclick="nextPractice()">${practiceIndex === practiceQuestions.length-1 ? '完成' : '下一题 ➡'}</button>
      </div>
    </div>
    <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
      <div class="sheet-content" onclick="event.stopPropagation()">

function jumpPractice(idx) { practiceIndex = idx; closeSheet({target:{id:'sheetModal'}}); savePracticeProgress(); render(); }
function jumpRecite(idx) { practiceIndex = idx; closeSheet({target:{id:'sheetModal'}}); savePracticeProgress(); render(); }
function prevPractice() { if(practiceIndex > 0) { practiceIndex--; savePracticeProgress(); render(); } }

function selectPractice(idx) {
  if (currentMode === 'recite') return;
  var q = practiceQuestions[practiceIndex];
  if (q.isAnswered || isSubjective(q.type)) return;
  var sels = practiceSelections[practiceIndex] || [];

  if (q.type === 'multiple') {
    var pos = sels.indexOf(idx);
    if (pos > -1) sels.splice(pos, 1); else sels.push(idx);
    practiceSelections[practiceIndex] = sels;
    savePracticeProgress(); renderPractice();
  } else {
    practiceSelections[practiceIndex] = [idx];
    q.isAnswered = true;
    addDoneQuestion(q.id);
    var isCorrect = q.answer.length === 1 && q.answer[0] === idx;
    handlePracticeResult(q, isCorrect);
    savePracticeProgress();
    renderPractice();
    if (autoShowAnswer && isCorrect && !isWrongPracticeMode && practiceIndex < practiceQuestions.length - 1) {
      setTimeout(function() { nextPractice(); }, 1000);
    }
  }
}

function confirmMultiPractice() {
  var q = practiceQuestions[practiceIndex];
  q.isAnswered = true;
  addDoneQuestion(q.id);
  var sels = practiceSelections[practiceIndex] || [];
  var isCorrect = sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; });
  handlePracticeResult(q, isCorrect);
  savePracticeProgress();
  renderPractice();
}

function handlePracticeResult(q, isCorrect) {
  var todayStr = new Date().toLocaleDateString();
  var stats = JSON.parse(localStorage.getItem('xjt_stats_'+todayStr) || '{"done":0,"correct":0}');
  stats.done++;
  if (isCorrect) stats.correct++;
  localStorage.setItem('xjt_stats_'+todayStr, JSON.stringify(stats));

  if (isWrongPracticeMode) {
    if (isCorrect) {
      q.streak = (q.streak || 0) + 1;
      if (q.streak >= 5) {
        wrongBook = wrongBook.filter(function(item){ return item.id !== q.id; });
        showToast('🎉 连对5次，已移出错题本');
        if (wrongBook.length === 0) practiceIndex = practiceQuestions.length;
      }
    } else { q.streak = 0; }
    saveData();
  } else {
    if (!isCorrect) {
      var exist = false;
      for (var i=0; i<wrongBook.length; i++) { if (wrongBook[i].id === q.id) exist = true; }
      if (!exist) {
        wrongBook.push({ id: q.id, question: q.question, type: q.type, options: q.options, answer: q.answer, analysis: q.analysis, streak: 0 });
        saveData();
      }
    }
  }
}

function nextPractice() {
  if(practiceIndex < practiceQuestions.length) { practiceIndex++; savePracticeProgress(); render(); }
}

function startExam() {
  if (!guardGate()) return;
  var qs = activeBankId ? allBanks[activeBankId].questions : [];
  var cS = parseInt(document.getElementById('cS').value) || 0;
  var cM = parseInt(document.getElementById('cM').value) || 0;
  var cJ = parseInt(document.getElementById('cJ').value) || 0;
  var cF = parseInt(document.getElementById('cF').value) || 0;
  var cT = parseInt(document.getElementById('cT').value) || 0;
  var cE = parseInt(document.getElementById('cE').value) || 0;
  var tLimit = parseInt(document.getElementById('tLimit').value) || 60;
  var pScoreRaw = document.getElementById('passScore').value;
  var pScore = parseInt(pScoreRaw);
  if (isNaN(pScore) || pScore <= 0) pScore = 0;

  if (cS + cM + cJ + cF + cT + cE === 0) return showToast('请至少选择一题', true);

  var doneIds = getDoneQuestions();
  var wrongIds = wrongBook.map(function(w){ return w.id; });

  function pickQuestions(type, count) {
    var allOfType = qs.filter(function(q){ return q.type === type; });
    if (allOfType.length <= count) return allOfType.slice();

    var pool = [];
    if (examPaperMode === 'wrong_first') {
      var wrongOfType = allOfType.filter(function(q){ return wrongIds.indexOf(q.id) > -1; });
      pool = wrongOfType.sort(function(){ return 0.5 - Math.random(); }).slice(0, count);
      if (pool.length < count) {
        var rest = allOfType.filter(function(q){ return wrongIds.indexOf(q.id) === -1; })
          .sort(function(){ return 0.5 - Math.random(); });
        pool = pool.concat(rest.slice(0, count - pool.length));
      }
    } else if (examPaperMode === 'new_first') {
      var newOfType = allOfType.filter(function(q){ return doneIds.indexOf(q.id) === -1; });
      pool = newOfType.sort(function(){ return 0.5 - Math.random(); }).slice(0, count);
      if (pool.length < count) {
        var rest = allOfType.filter(function(q){ return doneIds.indexOf(q.id) > -1; })
          .sort(function(){ return 0.5 - Math.random(); });
        pool = pool.concat(rest.slice(0, count - pool.length));
      }
    } else {
      pool = allOfType.sort(function(){ return 0.5 - Math.random(); }).slice(0, count);
    }
    return pool;
  }

  examQuestions = [].concat(
    pickQuestions('single', cS),
    pickQuestions('multiple', cM),
    pickQuestions('judge', cJ),
    pickQuestions('fill', cF),
    pickQuestions('short', cT),
    pickQuestions('essay', cE)
  );

  examConfig = {
    scoreSingle: parseInt(document.getElementById('pS').value) || 1,
    scoreMultiple: parseInt(document.getElementById('pM').value) || 1,
    scoreJudge: parseInt(document.getElementById('pJ').value) || 1,
    scoreFill: parseInt(document.getElementById('pF').value) || 1,
    scoreShort: parseInt(document.getElementById('pT').value) || 1,
    scoreEssay: parseInt(document.getElementById('pE').value) || 1,
    timeLimit: tLimit,
    passScore: pScore
  };

  examIndex = 0; examSelections = [];
  for (var i=0; i<examQuestions.length; i++) examSelections.push([]);
  examStartTime = Date.now();
  examRemainingSeconds = tLimit * 60;
  examAborted = false;
  window.__examLowScoreWarned = false;

  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(function() {
    examRemainingSeconds--;
    if (examRemainingSeconds <= 0) {
      clearInterval(examTimer); examTimer = null;
      showToast('时间到，自动交卷', true);
      submitExam(false);
    } else {
      var tEl = document.getElementById('timerDisplay');
      if (tEl) {
        var m = Math.floor(examRemainingSeconds / 60);
        var s = examRemainingSeconds % 60;
        tEl.innerText = (m<10?'0':'') + m + ':' + (s<10?'0':'') + s;
        if (examRemainingSeconds < 60) tEl.style.color = '#ef4444';
      }
    }
  }, 1000);

  currentMode = 'exam'; render();
}

      <button class="btn btn-outline" onclick="confirmExitExam()">退出</button>
    </div>
    <div id="sheetModal" class="sheet-mask" style="display:none;" onclick="closeSheet(event)">
      <div class="sheet-content" onclick="event.stopPropagation()">
        <div class="sheet-title">答题卡 <span style="font-size:0.85rem;color:var(--text-sub);font-weight:normal;">(点击题号跳转)</span></div>
        <div style="display:flex;gap:8px;margin-bottom:12px;"><input type="number" id="jumpNumInput" min="1" placeholder="输入题号直接跳转" style="flex:1;padding:9px;border:2px solid var(--border-color);border-radius:8px;font-size:1rem;background:var(--card-bg);color:var(--text-main);outline:none;"><button class="btn btn-primary" style="padding:9px 18px;" onclick="jumpToNumber()">跳转</button></div>
        ${sheetHtml}
      </div>
    </div>
  `;
}

  checkExamScoreWarning();
}
function nextExam() { if (examIndex === examQuestions.length - 1) { confirmSubmitExam(); } else { examIndex++; renderExam(); } }
function prevExam() { if (examIndex > 0) { examIndex--; renderExam(); } }

function checkExamScoreWarning() {
  if (currentMode !== 'exam') return;
  if (examRemainingSeconds <= 0) return;
  if (!examConfig.passScore || examConfig.passScore <= 0) return;
  if (window.__examLowScoreWarned) return;

  var got = 0; var remainingMax = 0;
  for (var i = 0; i < examQuestions.length; i++) {
    var q = examQuestions[i];
    var pts = 0;
    switch(q.type) {
      case 'single': pts = examConfig.scoreSingle; break;
      case 'multiple': pts = examConfig.scoreMultiple; break;
      case 'judge': pts = examConfig.scoreJudge; break;
      default: continue;
    }
    var sel = examSelections[i] || [];
    if (sel.length === 0) { remainingMax += pts; continue; }
    var ans = q.answer.slice().sort();
    var s = sel.slice().sort();
    var isCorrect = ans.length === s.length && ans.every(function(v, idx){ return v === s[idx]; });
    if (isCorrect) got += pts;
  }
  if (got + remainingMax < examConfig.passScore) {
    window.__examLowScoreWarned = true;
    showAppConfirm('考试终止', '<div class="maoti-fail">考试不合格，不要气馁，继续加油，多去练练吧！</div>', '查看成绩', '查看成绩', function() { submitExam(true); }, function() { submitExam(true); });
  }
}

function submitExam(aborted) {
  if (!aborted && !guardGate()) return;
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  examAborted = !!aborted;
  var usedSec = Math.floor((Date.now() - examStartTime) / 1000);
  var usedTimeStr = Math.floor(usedSec/60) + '分' + (usedSec%60) + '秒';
  examWrongList = [];
  var got = 0, total = 0;

  for (var i=0; i<examQuestions.length; i++) {
    var q = examQuestions[i];
    var pts = 0;
    switch(q.type) {
      case 'single': pts = examConfig.scoreSingle; break;
      case 'multiple': pts = examConfig.scoreMultiple; break;
      case 'judge': pts = examConfig.scoreJudge; break;
      case 'fill': pts = examConfig.scoreFill; break;
      case 'short': pts = examConfig.scoreShort; break;
      case 'essay': pts = examConfig.scoreEssay; break;
    }
    total += pts;

    if (!isSubjective(q.type)) {
      addDoneQuestion(q.id);
      var ans = q.answer.slice().sort();
      var sel = (examSelections[i] || []).slice().sort();
      var isCorrect = ans.length === sel.length && ans.every(function(v,idx){ return v === sel[idx]; });
      if (isCorrect) got += pts;
      else {
        examWrongList.push({ id: q.id, question: q.question, type: q.type, options: q.options, answer: q.answer, analysis: q.analysis, streak: 0 });
        var exist = false;
        for (var j=0; j<wrongBook.length; j++) { if (wrongBook[j].id === q.id) exist = true; }
        if (!exist) {
          wrongBook.push({ id: q.id, question: q.question, type: q.type, options: q.options, answer: q.answer, analysis: q.analysis, streak: 0 });
        }
      }
    }
  }
  saveData();
  examScore = { got: got, total: total, usedTime: usedTimeStr };
  var isFull = examScore.got >= examScore.total && examScore.total > 0;
  if (isFull) launchFireworks(3500);

  var tipHtml;
  if (examAborted) { tipHtml = '<div class="maoti-fail">考试不合格，不要气馁，继续加油，多去练练吧！</div>'; }
  else if (isFull) { tipHtml = '<div class="maoti-result full">你真棒，继续加油哦！</div>'; }
  else { tipHtml = '<div class="maoti-fail">别气馁，多去刷刷题，满分等着你！</div>'; }

  showAppConfirm(examAborted ? '考试已结束' : (isFull ? '恭喜满分' : '考试完成'),
    tipHtml + '<div style="font-size:0.8rem;color:var(--text-sub);margin-top:10px;">* 分数仅统计客观题，主观题请自行对照答案评分</div>',
    '查看结果', '返回首页',
    function() { currentMode = 'result'; render(); },
    function() { currentMode = 'home'; render(); });
}

function renderResult() {
  var isFull = examScore.got === examScore.total && examScore.total > 0;
  var hasPass = examConfig.passScore && examConfig.passScore > 0;
  var isPass = hasPass ? (examScore.got >= examConfig.passScore) : true;
  if (isFull) launchFireworks(3500);

  var msg = ''; var msgClass = 'maoti-result';
  if (isFull) { msg = '你真棒，继续加油哦！'; msgClass += ' full'; }
  else if (hasPass && !isPass) { msg = '考试不合格，不要气馁，继续加油，多去练练吧！'; msgClass = 'maoti-fail'; }
  else { msg = '考试合格，再接再厉！'; }

  appContainer.innerHTML = `
    <div class="card score-box">
      <h2 style="color:#0d47a1;margin-bottom:20px;">📊 考试成绩</h2>
      <div class="score-num">${examScore.got}</div>
      <div style="font-size:1.1rem;color:var(--text-sub);font-weight:bold;margin-bottom:20px;">
        总分：${examScore.total} 分 ${hasPass ? '｜ 合格线：' + examConfig.passScore + ' 分' : '｜ 未设合格线'}
      </div>
      <div class="${msgClass}">${msg}</div>
      <div style="color:var(--text-sub);font-size:0.9rem;margin-bottom:30px;">本次用时：${examScore.usedTime}</div>
      <div style="font-size:0.8rem;color:#94a3b8;margin-bottom:20px;">* 以上分数仅含客观题，主观题需自行评分</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" style="flex:1;min-width:30%;" onclick="currentMode='home';render()">返回首页</button>
        <button class="btn btn-green" style="flex:1;min-width:30%;" onclick="currentMode='examReview';render();">查看试卷</button>
        <button class="btn btn-outline" style="flex:1;min-width:30%;" onclick="currentMode='review';render()">查看错题</button>
      </div>
    </div>
  `;
}

function renderExamReview() {
  var html = `<div style="display:flex;justify-content:space-between;margin-bottom:15px; align-items:center;"><h3>📄 考试试卷回顾</h3><button class="btn btn-outline" onclick="currentMode='result';render()">返回</button></div>`;
  if (examWrongList && examWrongList.length > 0) {
    html += `<div class="card" style="border-left:4px solid #ef4444;">
      <div style="font-weight:bold;margin-bottom:8px;">🔥 本次错题 ${examWrongList.length} 题（已自动收录错题本）</div>
      <button class="btn btn-danger btn-block" style="margin-top:0;" onclick="startExamWrongPractice()">立即重练本次错题</button>
    </div>`;
  }
  for (var i=0; i<examQuestions.length; i++) {
    var q = examQuestions[i];
    var sels = examSelections[i] || [];
    var isSubj = isSubjective(q.type);
    var isCorrect = isSubj ? null : (sels.length === q.answer.length && sels.every(function(v){ return q.answer.indexOf(v) > -1; }));
    var typeName = TYPE_NAMES[q.type] || '未知';

    var optsHtml = '';
    if (isSubj) {
      var ansText = typeof q.answer === 'string' ? q.answer : (Array.isArray(q.answer) ? q.answer.join('；') : '');
      optsHtml = `<div class="subjective-answer"><div class="sa-title">📝 参考答案</div><div class="sa-content">${ansText}</div></div>`;
    } else {
      if (q.type === 'judge' && (!q.options || q.options.length === 0)) {
        q.options = ['正确', '错误'];
      }
      for (var k=0; k<q.options.length; k++) {
        var cls = 'opt disabled';
        if (q.answer.indexOf(k) > -1) cls += ' correct';
        else if (sels.indexOf(k) > -1) cls += ' wrong';
        optsHtml += `<div class="${cls}"><div class="opt-prefix">${String.fromCharCode(65+k)}</div><div>${q.options[k]}</div></div>`;
      }
    }

    var myAnsStr = isSubj ? '自行作答' : (sels.length > 0 ? sels.map(function(idx){ return String.fromCharCode(65+idx); }).join(', ') : '未作答');
    var trueAnsStr = isSubj
      ? (typeof q.answer === 'string' ? q.answer : q.answer.join('；'))
      : q.answer.map(function(idx){ return String.fromCharCode(65+idx); }).join(', ');

    var borderColor = isSubj ? '#0d47a1' : (isCorrect ? '#10b981' : '#ef4444');
    var statusText = isSubj ? '主观题' : (isCorrect ? '✅ 答对' : '❌ 答错');
    var statusColor = isSubj ? '#0d47a1' : (isCorrect ? '#10b981' : '#ef4444');
    var reviewClass = isSubj ? 'ok' : (isCorrect ? 'ok' : 'err');

    html += `<div class="card" style="border-left:4px solid ${borderColor}; margin-bottom:15px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span class="tag" style="background:${borderColor};">第 ${i+1} 题 · ${typeName}</span>
        <span style="font-weight:bold; color:${statusColor};">${statusText}</span>
      </div>
      <div class="q-text" style="padding-right:0;">${q.question}</div>
      ${optsHtml}
      <div class="exam-review-box ${reviewClass}">
        <div style="font-weight:bold; margin-bottom:5px;">标准答案：<span style="color:#10b981;">${trueAnsStr}</span></div>
        ${!isSubj ? `<div style="font-weight:bold; margin-bottom:5px;">你的答案：<span style="color:${isCorrect ? '#10b981' : '#ef4444'};">${myAnsStr}</span></div>` : ''}
        ${q.analysis ? `<div style="margin-top:8px; font-weight:bold; color:#0d47a1;">解析：</div><div style="color:var(--text-main); margin-top:4px;">${q.analysis}</div>` : ''}
      </div>
      ${!isCorrect && !isSubj ? `<button class="btn btn-outline" style="width:100%; margin-top:10px; color:#0d47a1; border-color:#0d47a1;" onclick="addToWrongBook('${q.id}')">➕ 加入错题本</button>` : ''}
    </div>`;
  }
  html += `<div style="display:flex;gap:10px;margin-bottom:20px;"><button class="btn btn-primary btn-block" onclick="currentMode='result';render()">返回成绩单</button></div>`;
  appContainer.innerHTML = html + `<div class="footer">技术支持：秦十三郎</div>`;
}

function addToWrongBook(qId) {
  var exist = false;
  for (var i=0; i<wrongBook.length; i++) { if (wrongBook[i].id === qId) exist = true; }
  if (exist) return showToast('该题目已在错题本中', true);
  for (var j=0; j<examQuestions.length; j++) {
    if (examQuestions[j].id === qId) {
      var q = examQuestions[j];
      wrongBook.push({ id: q.id, question: q.question, type: q.type, options: q.options, answer: q.answer, analysis: q.analysis, streak: 0 });
      saveData();
      showToast('已加入错题本');
      return;
    }
  }
}

function launchFireworks(duration) {
  var old = document.getElementById('fireworks-canvas'); if (old) old.remove();
  var canvas = document.createElement('canvas'); canvas.id = 'fireworks-canvas'; document.body.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var W = canvas.width = window.innerWidth;
  var H = canvas.height = window.innerHeight;
  var particles = [];
  var colors = ['#ff4757','#ffa502','#2ed573','#1e90ff','#e056fd','#ff6b81','#f9ca24'];

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function createBurst(x, y) {
    var color = colors[Math.floor(Math.random() * colors.length)];
    var count = 60 + Math.floor(Math.random() * 40);
    for (var i = 0; i < count; i++) {
      var angle = Math.PI * 2 * (i / count) + rand(-0.05, 0.05);
      var speed = rand(2, 6);
      particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, decay: rand(0.008, 0.02), color: color, size: rand(1.5, 3) });
    }
  }

  var startTime = Date.now(); var lastBurst = 0;
  function animate() {
    var elapsed = Date.now() - startTime;
    if (elapsed > duration) { canvas.remove(); return; }
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    if (elapsed - lastBurst > 350) { lastBurst = elapsed; createBurst(rand(W * 0.2, W * 0.8), rand(H * 0.15, H * 0.55)); }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.06; p.vx *= 0.99; p.vy *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(animate);
  }
  animate();
}

loadData();
checkNewImport();
checkAuth();
setTimeout(function() { if (currentMode === 'home') restorePracticeProgress(); }, splashDelay + 500);
</script>
